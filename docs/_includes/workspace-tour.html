<section class="workspace-tour" aria-labelledby="workspace-tour-title">
  <div class="workspace-tour__heading">
    <div>
      <p class="eyebrow">Workspace tour</p>
      <h2 id="workspace-tour-title">Three panels, one private workspace</h2>
    </div>
    <a href="{{ '/assets/readme-screenshot.png' | relative_url }}">Open the full-size screenshot</a>
  </div>

  <figure class="workspace-tour__overview">
    <a href="{{ '/assets/readme-screenshot.png' | relative_url }}">
      <img
        src="{{ '/assets/readme-screenshot.png' | relative_url }}"
        alt="Standard Red Notes desktop workspace showing navigation, a searchable notes list, and the Super note editor."
        width="1440"
        height="900"
        loading="lazy"
      />
    </a>
    <figcaption>
      The desktop workspace keeps navigation, discovery, and editing visible together. On smaller screens these panels
      collapse into a focused, touch-friendly flow.
    </figcaption>
  </figure>

  <div class="workspace-tour__snippets">
    <figure class="workspace-snippet">
      <a
        class="workspace-snippet__frame workspace-snippet__frame--navigation"
        href="{{ '/assets/readme-screenshot.png' | relative_url }}"
        aria-label="Open the full-size workspace screenshot, focused here on navigation"
      >
        <img
          src="{{ '/assets/readme-screenshot.png' | relative_url }}"
          alt=""
          width="1440"
          height="900"
          loading="lazy"
        />
      </a>
      <figcaption>
        <strong>Navigate and organize.</strong>
        Move between notes, tags, smart views, files, archive, and trash without leaving the workspace.
      </figcaption>
    </figure>

    <figure class="workspace-snippet">
      <a
        class="workspace-snippet__frame workspace-snippet__frame--notes"
        href="{{ '/assets/readme-screenshot.png' | relative_url }}"
        aria-label="Open the full-size workspace screenshot, focused here on the notes list"
      >
        <img
          src="{{ '/assets/readme-screenshot.png' | relative_url }}"
          alt=""
          width="1440"
          height="900"
          loading="lazy"
        />
      </a>
      <figcaption>
        <strong>Find the right note.</strong>
        Search, sort, pin, star, and filter large collections while keeping useful context in view.
      </figcaption>
    </figure>

    <figure class="workspace-snippet">
      <a
        class="workspace-snippet__frame workspace-snippet__frame--editor"
        href="{{ '/assets/readme-screenshot.png' | relative_url }}"
        aria-label="Open the full-size workspace screenshot, focused here on the editor"
      >
        <img
          src="{{ '/assets/readme-screenshot.png' | relative_url }}"
          alt=""
          width="1440"
          height="900"
          loading="lazy"
        />
      </a>
      <figcaption>
        <strong>Write your way.</strong>
        Use rich text, block, Markdown, code, spreadsheet, checklist, and Mermaid editors in the same encrypted vault.
      </figcaption>
    </figure>
  </div>
</section>
