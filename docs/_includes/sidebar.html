<aside class="docs-sidebar" aria-label="Documentation navigation">
  <a class="docs-brand" href="{{ '/' | relative_url }}">
    <img src="{{ '/assets/icon.svg' | relative_url }}" alt="" width="32" height="32" />
    <span>Standard Red Notes</span>
  </a>
  <nav>
    {% for group in site.data.navigation %}
      <section>
        <h2>{{ group.title }}</h2>
        <ul>
          {% for item in group.items %}
            <li>
              <a href="{{ item.url | relative_url }}">{{ item.title }}</a>
            </li>
          {% endfor %}
        </ul>
      </section>
    {% endfor %}
  </nav>
</aside>
