<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b090a" data-docs-theme-color />
    <title>
      {% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}
    </title>
    <meta
      name="description"
      content="{{ page.description | default: site.description }}"
    />
    <link
      rel="icon"
      href="{{ '/assets/icon.svg' | relative_url }}"
      type="image/svg+xml"
    />
    <script>
      try {
        const savedTheme = localStorage.getItem(
          "standard-red-notes-docs-theme",
        );
        if (savedTheme === "light")
          document.documentElement.dataset.theme = "light";
      } catch {}
    </script>
    <link rel="stylesheet" href="{{ '/assets/docs.css' | relative_url }}" />
    <link
      rel="stylesheet"
      href="{{ '/assets/docs-extras.css' | relative_url }}"
    />
    <link
      rel="stylesheet"
      href="{{ '/assets/safety-alerts.css' | relative_url }}"
    />
  </head>
  <body>
    <a class="docs-skip-link" href="#content">Skip to content</a>
    <div class="docs-shell">
      {% include sidebar.html %}
      <main class="docs-content" id="content">
        <article>{{ content }}</article>
      </main>
    </div>
    <script src="{{ '/assets/docs-search.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/docs-ui.js' | relative_url }}" defer></script>
  </body>
</html>
