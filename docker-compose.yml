name: standard-red-notes

x-server-env: &server-env
  # Set to true ONLY for local/dev to bypass the entrypoint's published-default-secret
  # guard. A real deployment must instead supply real AUTH_JWT_SECRET /
  # AUTH_SERVER_ENCRYPTION_SERVER_KEY / VALET_TOKEN_SECRET (the guard refuses to boot
  # while the published defaults are in use).
  ALLOW_INSECURE_DEFAULTS: ${ALLOW_INSECURE_DEFAULTS:-}
  DB_HOST: db
  DB_PORT: 3306
  DB_USERNAME: ${MYSQL_USER:-std_notes_user}
  DB_PASSWORD: ${MYSQL_PASSWORD:-changeme123}
  DB_DATABASE: ${MYSQL_DATABASE:-standard_notes_db}
  DB_TYPE: mysql
  CACHE_TYPE: redis
  REDIS_HOST: cache
  REDIS_PORT: 6379
  AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-dev-auth-jwt-secret-change-me}
  # Must be a 64-char hex string (32 bytes); auth's CrypterNode validates this. Override in prod.
  AUTH_SERVER_ENCRYPTION_SERVER_KEY: ${AUTH_SERVER_ENCRYPTION_SERVER_KEY:-deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef}
  VALET_TOKEN_SECRET: ${VALET_TOKEN_SECRET:-dev-valet-token-secret-change-me}
  # Auth session cookies. The auth service authenticates browser requests off the
  # access_token_<session> cookie, so these MUST suit the deployment or every
  # authed request 401s. Defaults below are for an http://localhost self-host:
  # empty domain -> host-only cookie (works on localhost / any bare host or IP);
  # SameSite=Lax + Secure=false so the cookie is stored/sent over plain http.
  # For an HTTPS deployment behind a domain, set COOKIE_DOMAIN, COOKIE_SECURE=true.
  COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
  COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Lax}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  COOKIE_PARTITIONED: ${COOKIE_PARTITIONED:-false}
  # Reverse-proxy support. When the stack runs behind a TLS-terminating proxy
  # (nginx/Traefik/Caddy), the server must trust the proxy's X-Forwarded-Proto /
  # X-Forwarded-For headers so req.secure / req.ip reflect the real client.
  # Default "loopback, linklocal, uniquelocal" trusts a proxy on loopback or a
  # private/Docker network (the usual compose setup) but NOT arbitrary public
  # clients, so direct access still works and forwarded headers can't be spoofed.
  # Set to "true" to trust any number of hops, a number N to trust N hops, or a
  # CSV of proxy IPs/subnets. See docs/self-hosting.md "Running behind a reverse
  # proxy". Pair with COOKIE_SECURE=true when TLS is terminated at the proxy.
  TRUST_PROXY: ${TRUST_PROXY:-loopback, linklocal, uniquelocal}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # Comma-separated emails granted the AdminUser (admin) role, which
  # unlocks the in-app Admin panel and the /admin user-management endpoints.
  ADMIN_EMAILS: ${ADMIN_EMAILS:-}
  STANDARD_RED_FEATURES_MODE: ${STANDARD_RED_FEATURES_MODE:-included}
  STANDARD_RED_ENTITLEMENT_MODE: ${STANDARD_RED_ENTITLEMENT_MODE:-included}
  STANDARD_RED_FULL_FEATURE_DURATION_DAYS: ${STANDARD_RED_FULL_FEATURE_DURATION_DAYS:-36500}
  STANDARD_RED_FULL_FEATURE_FILE_UPLOAD_BYTES_LIMIT: ${STANDARD_RED_FULL_FEATURE_FILE_UPLOAD_BYTES_LIMIT:--1}
  # Revision history retention. Both default to 0 = unlimited (no pruning),
  # preserving the upstream behavior. When set, the revisions service prunes a
  # note/file's history on each new revision: REVISIONS_RETENTION_DAYS deletes
  # revisions older than the window; REVISIONS_MAX_COUNT_PER_ITEM keeps only the
  # N most-recent revisions per item.
  REVISIONS_RETENTION_DAYS: ${REVISIONS_RETENTION_DAYS:-0}
  REVISIONS_MAX_COUNT_PER_ITEM: ${REVISIONS_MAX_COUNT_PER_ITEM:-0}
  # Public base URL clients use to reach the files service (chunk uploads /
  # downloads with valet tokens). The api-gateway advertises it to clients in
  # every response's meta.server.filesServerUrl — it is NEVER called
  # server-side, so it must be a URL the BROWSER can reach. It points at the
  # app front door's /files/ proxy (app/docker/nginx.conf), which strips the
  # /files prefix and forwards to the files service on the internal network —
  # the files service publishes no host port. Override for real deployments,
  # e.g. PUBLIC_FILES_SERVER_URL=https://notes.example.com/files.
  PUBLIC_FILES_SERVER_URL: ${PUBLIC_FILES_SERVER_URL:-http://localhost:${APP_PORT:-3001}/files}
  # Self-hosted realtime WebSocket gateway. It now runs IN-PROCESS inside the
  # api-gateway on the SAME port (:3000) — no separate listener/process. The
  # api-gateway POSTs to its own /sockets/tokens to mint connection tokens, so
  # this URL points at the api-gateway itself. It is CONTAINER-INTERNAL
  # (localhost inside the server container) — browsers never see it; they dial
  # the same-origin ws(s)://<app-host>/sockets path proxied by the app's nginx.
  WEB_SOCKET_SERVER_URL: ${WEB_SOCKET_SERVER_URL:-http://localhost:3000}
  WEBSOCKET_GATEWAY_INTERNAL_SECRET: ${WEBSOCKET_GATEWAY_INTERNAL_SECRET:-dev-ws-internal-secret-change-me}
  # Connection-token signing for the in-process WebSocket gateway. The api-gateway
  # reads these from its environment and passes them to attachWebSocketGateway.
  WEB_SOCKET_CONNECTION_TOKEN_SECRET: ${WEB_SOCKET_CONNECTION_TOKEN_SECRET:-dev-ws-conn-token-secret-change-me}
  WEB_SOCKET_CONNECTION_TOKEN_TTL: ${WEB_SOCKET_CONNECTION_TOKEN_TTL:-60s}
  # SNS/SQS event source for realtime push: the gateway consumes the syncing
  # server's WEB_SOCKET_MESSAGE_REQUESTED events from this queue. The `floci`
  # service below emulates SNS/SQS; credentials are dummies (floci has no auth).
  SQS_QUEUE_URL: ${SQS_QUEUE_URL:-http://floci:4566/000000000000/websocket-local-queue}
  SQS_ENDPOINT: ${SQS_ENDPOINT:-http://floci:4566}
  SQS_AWS_REGION: ${SQS_AWS_REGION:-us-east-1}
  SQS_ACCESS_KEY_ID: ${SQS_ACCESS_KEY_ID:-floci}
  SQS_SECRET_ACCESS_KEY: ${SQS_SECRET_ACCESS_KEY:-floci}
  AUTH_SERVER_U2F_RELYING_PARTY_ID: ${AUTH_SERVER_U2F_RELYING_PARTY_ID:-localhost}
  AUTH_SERVER_U2F_RELYING_PARTY_NAME: ${AUTH_SERVER_U2F_RELYING_PARTY_NAME:-Standard Red Notes}
  AUTH_SERVER_U2F_EXPECTED_ORIGIN: ${AUTH_SERVER_U2F_EXPECTED_ORIGIN:-http://localhost:3001,http://localhost}
  # Assistant LLM proxy. The "openai" provider is OpenAI-compatible and driven by
  # ASSISTANT_OPENAI_BASE_URL, so it also serves LM Studio, Ollama (OpenAI mode),
  # OpenRouter and any custom OpenAI-compatible server. Local servers usually need
  # no API key. ASSISTANT_OLLAMA_URL enables the native Ollama (/api/chat) provider.
  ASSISTANT_ANTHROPIC_API_KEY: ${ASSISTANT_ANTHROPIC_API_KEY:-}
  ASSISTANT_OPENAI_API_KEY: ${ASSISTANT_OPENAI_API_KEY:-}
  ASSISTANT_OPENAI_BASE_URL: ${ASSISTANT_OPENAI_BASE_URL:-}
  ASSISTANT_OPENAI_MODEL: ${ASSISTANT_OPENAI_MODEL:-}
  ASSISTANT_OLLAMA_URL: ${ASSISTANT_OLLAMA_URL:-}
  ASSISTANT_DEFAULT_PROVIDER: ${ASSISTANT_DEFAULT_PROVIDER:-}
  ASSISTANT_DEFAULT_MODEL: ${ASSISTANT_DEFAULT_MODEL:-}
  # Global per-user daily AI request ceiling enforced by the api-gateway. 0 = unlimited.
  ASSISTANT_DAILY_REQUEST_LIMIT: ${ASSISTANT_DAILY_REQUEST_LIMIT:-0}
  # OPT-IN server-side PDF OCR (tesseract-in-Node, /v1/ocr). PRIVACY: when enabled,
  # the client may upload DECRYPTED PDF page images here for recognition — that
  # content LEAVES end-to-end encryption (the server can read it), exactly like the
  # AI proxy. The DEFAULT OCR path stays in the browser (OCR_ENABLED, above), where
  # nothing leaves the device. Two gates apply: this operator master switch AND a
  # per-user, admin-managed OCR_SERVER_ALLOWED setting (default off) — so even with
  # this on, server OCR is offered only to users an admin has explicitly allowed.
  OCR_SERVER_ENABLED: ${OCR_SERVER_ENABLED:-false}
  OCR_SERVER_DEFAULT_LANGUAGE: ${OCR_SERVER_DEFAULT_LANGUAGE:-eng}
  # Per-request bounds so an OCR call cannot pin the box (CPU-heavy; one large page
  # can take seconds). Defaults: 50 pages, 12 MB per page image.
  OCR_SERVER_MAX_PAGES: ${OCR_SERVER_MAX_PAGES:-50}
  OCR_SERVER_MAX_IMAGE_BYTES: ${OCR_SERVER_MAX_IMAGE_BYTES:-12582912}
  # Self-hosted "Check for updates" (/v1/updates/status). UNSET BY DEFAULT — the
  # feature then reports "not configured" and the client shows that state
  # gracefully. Point it at a GitHub releases API URL (list or /releases/latest)
  # or any JSON endpoint returning { "version": "...", "url": "..." }. The
  # gateway fetches it SERVER-SIDE (no client CORS/privacy leak) with a short
  # timeout and caches the result in-memory (default 15 min); the manual
  # "Check for updates" button bypasses the cache.
  # UPDATE_CHECK_URL: https://api.github.com/repos/<owner>/<repo>/releases/latest
  # The version this deployment reports as "current" defaults to the api-gateway
  # package version; override when your release tags track the whole fork.
  # UPDATE_CHECK_CURRENT_VERSION: "1.0.0"
  # OPT-IN Workflows (n8n-backed automation engine, /v1/workflows + the embedded
  # editor at /workflows-ui). Two gates apply, both fail-closed: this operator
  # master switch AND a per-user, admin-managed WORKFLOWS_ENABLED setting
  # (default off) toggled from Preferences -> Admin — so even with this on, the
  # feature is offered only to users an admin has explicitly allowed, and only
  # after the user explicitly pairs ("Connect workflows"). The n8n engine itself
  # is the OPTIONAL `n8n` service below (compose profile `workflows`); the stack
  # runs fine without it — the gateway then reports the engine unreachable (502)
  # on editor access while everything else stays healthy.
  WORKFLOWS_ENABLED: ${WORKFLOWS_ENABLED:-false}
  # Internal (docker-network) URL of the n8n engine; the editor is only ever
  # reached through the api-gateway's authenticated /workflows-ui proxy.
  WORKFLOWS_N8N_URL: ${WORKFLOWS_N8N_URL:-http://n8n:5678}
  # Optional server-wide shared access key ("obfuscation gate"). OFF by default
  # (empty key => zero behavior change). This is OBFUSCATION / access-gating for a
  # self-hosted instance, NOT end-to-end security (that is the client-side E2E
  # encryption). When set, the api-gateway requires clients to present this key in
  # the X-Shared-Server-Key header. SHARED_SERVER_ACCESS_KEY_MODE selects what is
  # gated: "all" (every request, healthcheck exempt) or "registration" (only new
  # sign-ups). The container healthcheck path (/healthcheck) is always exempt.
  SHARED_SERVER_ACCESS_KEY: ${SHARED_SERVER_ACCESS_KEY:-}
  SHARED_SERVER_ACCESS_KEY_MODE: ${SHARED_SERVER_ACCESS_KEY_MODE:-all}
  # CORS. The gateway now defaults to STRICT (safe for self-host): it reflects
  # only known origins — the desktop app (file://), the Firefox/Chromium/Safari
  # clippers (…-extension://), a localhost self-host (http(s)://localhost[:port])
  # and anything listed in CORS_ALLOWED_ORIGINS. SAME-ORIGIN requests (the
  # standard nginx front-door setup) are unaffected. Set
  # CORS_ORIGIN_STRICT_MODE_ENABLED=false to restore the legacy permissive
  # "reflect ANY Origin" behavior; add extra cross-origin front-ends (comma-
  # separated) to CORS_ALLOWED_ORIGINS.
  CORS_ORIGIN_STRICT_MODE_ENABLED: ${CORS_ORIGIN_STRICT_MODE_ENABLED:-}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  # Rate limiting for the UNAUTHENTICATED auth-adjacent endpoints (login,
  # registration, MCP-token authenticate, magic-link request, recovery).
  # Redis-backed, keyed by client IP (honors TRUST_PROXY), and FAIL-OPEN if Redis
  # is unavailable so an outage never blocks legitimate sign-ins. Defaults:
  # 10 logins/min/IP and 5/min/IP for registration + mcp-authenticate + magic-link
  # (a shared window of RATE_LIMIT_WINDOW_SECONDS). Set RATE_LIMIT_ENABLED=false
  # to turn it off. The authenticated sync/proxy paths are never rate-limited.
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-}
  RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
  RATE_LIMIT_LOGIN_MAX: ${RATE_LIMIT_LOGIN_MAX:-10}
  RATE_LIMIT_REGISTRATION_MAX: ${RATE_LIMIT_REGISTRATION_MAX:-5}
  # OPT-IN, OFF-BY-DEFAULT admin container restart for the infra containers that
  # run OUTSIDE the server's supervisord (Redis `cache` + MariaDB `db`). The admin
  # panel restarts them through the locked-down `docker-socket-proxy` sidecar below
  # (Docker Engine API over HTTP) — the raw /var/run/docker.sock is NEVER mounted
  # into this server container, only into the proxy. DISABLED unless BOTH the flag
  # is set to `true` AND the proxy URL is provided AND the proxy is actually run
  # (`docker compose --profile ops up -d`). Left empty here so the base stack is
  # unchanged and the feature stays off. See docs/DEPLOYMENT.md "Opt-in container
  # restart". SERVICE_CONTROL_DOCKER_PROJECT is the compose project prefix used to
  # resolve <project>-<service>-1 container names (matches `name:` at the top).
  SERVICE_CONTROL_DOCKER_ENABLED: ${SERVICE_CONTROL_DOCKER_ENABLED:-}
  SERVICE_CONTROL_DOCKER_PROXY_URL: ${SERVICE_CONTROL_DOCKER_PROXY_URL:-}
  SERVICE_CONTROL_DOCKER_PROJECT: ${SERVICE_CONTROL_DOCKER_PROJECT:-standard-red-notes}

services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: standard-red-notes/app:local
    restart: unless-stopped
    # Hardening: the image already runs as the unprivileged `nginx` user (uid 101)
    # and listens on 8080, so it needs no Linux capabilities. Drop them all and
    # block privilege escalation.
    #
    # NOTE: read_only is intentionally NOT set here. The OCR runtime-config
    # entrypoint (docker/docker-entrypoint.sh) rewrites the window.* globals in
    # /usr/share/nginx/html/index.html at container start, so the served bundle
    # must stay writable. nginx's own scratch paths (/var/cache/nginx, /var/run,
    # /tmp) are mounted as tmpfs to keep writes off the image layer.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    # Resource ceilings: cap memory + process count so a runaway/compromised
    # container can't exhaust the host (pids_limit also blunts fork-bombs).
    # Tune via the *_MEM_LIMIT env vars.
    mem_limit: ${APP_MEM_LIMIT:-256m}
    pids_limit: 256
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    environment:
      # Client-side PDF OCR (tesseract.js). Files are end-to-end encrypted, so the
      # server NEVER sees decrypted PDFs and cannot run OCR — these flags only gate
      # whether the web client offers the "Extract text (OCR)" action and which
      # tesseract language it defaults to. The app's entrypoint templates these into
      # the static index.html at container start (no rebuild needed). OFF by default:
      # OCR downloads multi-MB language data at runtime, is slow, and accuracy varies.
      OCR_ENABLED: ${OCR_ENABLED:-false}
      OCR_DEFAULT_LANGUAGE: ${OCR_DEFAULT_LANGUAGE:-eng}
      # Default sync server the app loads with. Unset => the app's own origin
      # (this deployment syncs to ITSELF — never api.standardnotes.com). Set to
      # front the API on a different host, e.g. SYNC_SERVER=https://sync.example.com.
      SYNC_SERVER: ${SYNC_SERVER:-}
    depends_on:
      server:
        condition: service_healthy
    # When fronting with a reverse proxy you can drop the published port and let
    # the proxy reach this container over the shared `proxy` network (see the
    # `networks` block at the bottom). To keep direct access, leave `ports` as-is.
    ports:
      - "${APP_PORT:-3001}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - standard-red-notes
      # - proxy
    # Example Traefik labels (uncomment with the `proxy` network). This nginx
    # is the SINGLE front door: it serves the web UI and proxies the /v1 API,
    # /files/, the realtime websocket (/sockets) and /workflows-ui/ same-origin,
    # so ONE router to this service covers the whole stack. Adjust the host
    # rule and TLS resolver, and set PUBLIC_FILES_SERVER_URL to
    # https://<your-host>/files.
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.docker.network=proxy"
    #   # Web UI (catch-all for the host)
    #   - "traefik.http.routers.srn-web.rule=Host(`notes.example.com`)"
    #   - "traefik.http.routers.srn-web.entrypoints=websecure"
    #   - "traefik.http.routers.srn-web.tls.certresolver=le"
    #   - "traefik.http.services.srn-web.loadbalancer.server.port=8080"

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: standard-red-notes/server:local
    restart: unless-stopped
    # Hardening: the image runs supervisord + every node service as the
    # unprivileged `srn` user (uid 10001). Drop all Linux capabilities and block
    # privilege escalation. NOTE: this multi-service container WRITES at runtime
    # (per-package .env files under /opt/server/packages, supervisord/service logs,
    # file uploads), so it must keep a writable rootfs — do NOT set read_only here.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    # Proper PID 1 (reap zombies, forward signals) + resource ceilings. The
    # server runs ~6 node services via supervisord, so it gets a larger memory
    # budget; raise SERVER_MEM_LIMIT if you see OOM kills under load.
    init: true
    mem_limit: ${SERVER_MEM_LIMIT:-2g}
    pids_limit: 2048
    environment:
      <<: *server-env
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      floci:
        condition: service_healthy
    # Internal-only: NO host ports. ALL client traffic (API /v1|/v2|/auth,
    # files /files/, realtime /sockets, workflows /workflows-ui/) enters
    # through the app front door (nginx on APP_PORT, default 3001), which
    # reaches this container by service name on the compose network
    # (server:3000 for the gateway + in-process websocket gateway, server:3104
    # for files). To temporarily expose the gateway for debugging, add e.g.
    #   ports: ["127.0.0.1:3000:3000"]
    # here — but nothing in the stack needs it.
    volumes:
      - server-logs:/var/lib/server/logs
      - uploads:/opt/shared/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/healthcheck >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - standard-red-notes
      # - proxy
    # NOTE: an external reverse proxy (Traefik/nginx/Caddy) does NOT need to
    # route to this container at all. The app front door above already proxies
    # every backend path (/v1, /v2, /auth, /subscription, /healthcheck,
    # /files/, /sockets, /workflows-ui/) same-origin, so a single router to the
    # `app` service covers the whole stack (see the labels example on `app`).

  mcp:
    profiles:
      - mcp
    build:
      context: .
      dockerfile: mcp/Dockerfile
    image: standard-red-notes/mcp:local
    restart: unless-stopped
    # Hardening: no privilege escalation, no capabilities. Internal-only — this
    # service is NEVER published to the host (reachable only by other containers
    # on the standard-red-notes network at mcp:3010). Keep it on the `mcp` profile
    # so it only runs when explicitly requested (`--profile mcp`).
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    init: true
    mem_limit: ${MCP_MEM_LIMIT:-512m}
    pids_limit: 512
    environment:
      STANDARD_RED_NOTES_SERVER_URL: http://server:3000
      STANDARD_RED_NOTES_DATA_DIR: /var/lib/standard-red-notes-mcp
      # Autonomous HTTP mode: run the MCP server as a long-lived HTTP service
      # (instead of stdio) so other containers/agents can reach it over the
      # network. MCP_HTTP_TOKEN is a REQUIRED bearer token that authenticates
      # callers — set it in your .env; with it empty the server has no auth, so
      # provide one before relying on this service.
      MCP_TRANSPORT: http
      MCP_HTTP_PORT: "3010"
      MCP_HTTP_TOKEN: ${MCP_HTTP_TOKEN:-}
      # Provide account credentials to enable note tools (read-only by default).
      STANDARD_RED_NOTES_EMAIL: ${STANDARD_RED_NOTES_EMAIL:-}
      STANDARD_RED_NOTES_PASSWORD: ${STANDARD_RED_NOTES_PASSWORD:-}
      STANDARD_RED_NOTES_MFA_CODE: ${STANDARD_RED_NOTES_MFA_CODE:-}
      STANDARD_RED_NOTES_ALLOW_WRITES: ${STANDARD_RED_NOTES_ALLOW_WRITES:-0}
      STANDARD_RED_NOTES_ALLOW_REGISTER: ${STANDARD_RED_NOTES_ALLOW_REGISTER:-0}
      # Continuous background sync so the agent picks up collaborators' changes.
      STANDARD_RED_NOTES_SYNC_INTERVAL_MS: ${STANDARD_RED_NOTES_SYNC_INTERVAL_MS:-10000}
    volumes:
      - mcp-data:/var/lib/standard-red-notes-mcp
    depends_on:
      server:
        condition: service_healthy
    networks:
      - standard-red-notes

  # ---------------------------------------------------------------------------
  # OPTIONAL workflows engine (n8n) backing the Workflows feature. Runs ONLY
  # with the `workflows` compose profile (`docker compose --profile workflows
  # up -d`), so the stack stays healthy when the image was never pulled and the
  # `server` service intentionally does NOT depend_on it (the gateway answers
  # 502 on editor access while the engine is down; everything else is unaffected).
  #
  # SECURITY: internal network ONLY — no host port. The editor UI and REST API
  # are reachable exclusively through the api-gateway's authenticated
  # /workflows-ui proxy, which admits only sessions that are BOTH admin-entitled
  # (per-user WORKFLOWS_ENABLED setting) AND explicitly paired. n8n runs in
  # shared single-owner mode (community edition; see docs/WORKFLOWS_PLAN.md
  # §6.2) — per-user access enforcement lives at the SRN proxy boundary.
  #
  # Required env when enabling for real use:
  #   WORKFLOWS_ENABLED=true      (master switch, x-server-env above)
  #   N8N_ENCRYPTION_KEY=<random> (STABLE key for n8n's credential store; without
  #                                it n8n generates one into its volume — fine,
  #                                but set it explicitly for backup/restore)
  n8n:
    profiles:
      - workflows
    # Pin to a specific version tag (e.g. n8nio/n8n:1.x.y) for reproducible
    # deployments; `latest` tracks n8n's current stable release.
    image: n8nio/n8n:latest
    restart: unless-stopped
    # Hardening: the image runs as the unprivileged `node` user (uid 1000) and
    # only serves HTTP on 5678 internally — no capabilities needed.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    mem_limit: ${N8N_MEM_LIMIT:-1g}
    pids_limit: 512
    environment:
      # Serve the whole app under the SAME base path as the gateway proxy
      # (/workflows-ui/), so the proxy forwards paths verbatim — no rewriting.
      N8N_PATH: /workflows-ui/
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      # Public host n8n uses when composing its own URLs (webhook display etc.).
      # Point it at the host the web app is served from when exposing for real.
      N8N_HOST: ${WORKFLOWS_PUBLIC_HOST:-localhost}
      # The gateway proxy is a plain HTTP streaming pipe (no WebSocket upgrade
      # handling), so run n8n's editor push channel over Server-Sent Events.
      N8N_PUSH_BACKEND: sse
      # The editor is reached over plain http inside the compose network (TLS —
      # if any — terminates at the outer proxy); without this n8n 1.x refuses
      # its auth cookie on non-https origins. Set true behind real HTTPS.
      N8N_SECURE_COOKIE: "false"
      # Stable encryption key for n8n's credential store (see comment above).
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-}
      N8N_DIAGNOSTICS_ENABLED: "false"
      GENERIC_TIMEZONE: ${TZ:-UTC}
    volumes:
      - n8n-data:/home/node/.n8n
    healthcheck:
      # /healthz sits under N8N_PATH when a base path is configured; probe both
      # forms so the check is robust across n8n versions.
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:5678/workflows-ui/healthz >/dev/null 2>&1 || wget -qO- http://127.0.0.1:5678/healthz >/dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - standard-red-notes

  db:
    image: mariadb:lts
    restart: unless-stopped
    # Hardening: internal-only (no host port published). Block privilege
    # escalation and drop all caps, then add back only what the official mariadb
    # entrypoint needs: it starts as root to fix data-dir ownership (CHOWN,
    # DAC_OVERRIDE, FOWNER) and then drops to the `mysql` user via setpriv
    # (SETGID, SETUID).
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    mem_limit: ${DB_MEM_LIMIT:-1g}
    pids_limit: 1024
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-standard_notes_db}
      MYSQL_USER: ${MYSQL_USER:-std_notes_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme123}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme123}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - standard-red-notes

  cache:
    image: redis:8-alpine
    restart: unless-stopped
    # Hardening: internal-only (no host port published). Block privilege
    # escalation and drop all caps, adding back only SETGID/SETUID, which the
    # redis entrypoint uses to drop from root to the `redis` user.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    mem_limit: ${CACHE_MEM_LIMIT:-256m}
    pids_limit: 256
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - standard-red-notes

  floci:
    # Local AWS SNS/SQS emulator (https://floci.io, MIT). Replaces LocalStack:
    # floci needs no auth token, is LocalStack wire- and layout-compatible
    # (port 4566, account 000000000000 queue URLs, /etc/localstack/init/ready.d
    # init hooks, /_localstack/health endpoint), and is far lighter (a single
    # native binary, ~13 MiB-class at rest vs LocalStack's ~500 MiB Python
    # runtime). History: we previously pinned localstack/localstack:4.4.0 — the
    # last release before LocalStack 2026.3.0+ merged community+pro into one
    # image that requires a LOCALSTACK_AUTH_TOKEN even for SNS/SQS.
    #
    # ESCAPE HATCH — to switch back to LocalStack, replace `image` below with
    #   image: localstack/localstack:4.4.0
    # add `SERVICES: sns,sqs` + `LS_LOG: warn` under `environment:`, change the
    # healthcheck to `awslocal sqs list-queues`, and raise the mem limit to
    # 512m. The bootstrap script and every URL keep working unchanged (the
    # service keeps the `localstack` network alias below).
    #
    # The -compat image variant ships the AWS CLI + awslocal, which the
    # bootstrap init script (and the old LocalStack tooling muscle memory,
    # e.g. `docker compose exec floci awslocal sqs list-queues`) relies on.
    image: floci/floci:1.5.29-compat
    restart: unless-stopped
    # Hardening: internal-only (no host port published) and no privilege
    # escalation. Note floci's SNS/SQS state is in-memory: the ready.d bootstrap
    # recreates all topics/queues/subscriptions on every container start (the
    # create/subscribe calls are idempotent), so no data volume is needed.
    security_opt:
      - "no-new-privileges:true"
    mem_limit: ${FLOCI_MEM_LIMIT:-256m}
    pids_limit: 512
    volumes:
      - ./server/docker/localstack_bootstrap.sh:/etc/localstack/init/ready.d/localstack_bootstrap.sh:ro
    healthcheck:
      # floci serves a LocalStack-compatible health endpoint; the sqs service
      # reports "running" once the emulator is up (init hooks run right after).
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health | grep -q '\"sqs\":\"running\"' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks:
      standard-red-notes:
        # Keep the old hostname answering too: server images built before the
        # floci swap (and any user .env overriding SQS_ENDPOINT/queue URLs with
        # the old hostname) still resolve `localstack` to this container.
        aliases:
          - localstack

  # ---------------------------------------------------------------------------
  # OPTIONAL, OPT-IN docker-socket-proxy for the admin "restart Redis/MariaDB"
  # controls. Runs ONLY with the `ops` compose profile
  # (`docker compose --profile ops up -d`), so the base stack is UNCHANGED and
  # this never starts unless explicitly requested.
  #
  # SECURITY — least privilege, defense in depth:
  #   - The RAW /var/run/docker.sock is mounted ONLY here (read-only), NEVER into
  #     the server container. The server talks to this proxy over HTTP.
  #   - Everything is DENIED by default; only ALLOW_RESTARTS=1 is turned on, which
  #     grants access to just the container restart/stop/kill endpoints. No image
  #     pull, no container create/exec, no volume/network/secret access, no info.
  #     Even a bug in the server can do nothing but restart a container.
  #   - Internal network ONLY — no host port. Reachable only as
  #     `docker-socket-proxy:2375` on the compose network.
  #
  # To ENABLE the feature, run this profile AND set on the server:
  #   SERVICE_CONTROL_DOCKER_ENABLED=true
  #   SERVICE_CONTROL_DOCKER_PROXY_URL=http://docker-socket-proxy:2375
  # See docs/DEPLOYMENT.md "Opt-in container restart".
  docker-socket-proxy:
    profiles:
      - ops
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    # HAProxy needs to bind :2375 and drop to its unprivileged user.
    cap_add:
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    mem_limit: ${DOCKER_PROXY_MEM_LIMIT:-64m}
    pids_limit: 128
    environment:
      # DENY-ALL baseline, then permit ONLY the restart endpoints.
      ALLOW_RESTARTS: 1
      # Everything below is explicitly denied (these are the proxy defaults, set
      # here for an auditable, self-documenting locked-down surface).
      CONTAINERS: 0
      IMAGES: 0
      NETWORKS: 0
      VOLUMES: 0
      SERVICES: 0
      TASKS: 0
      SECRETS: 0
      CONFIGS: 0
      SWARM: 0
      NODES: 0
      PLUGINS: 0
      SYSTEM: 0
      INFO: 0
      VERSION: 0
      AUTH: 0
      BUILD: 0
      COMMIT: 0
      DISTRIBUTION: 0
      EXEC: 0
      SESSION: 0
      POST: 0
    volumes:
      # READ-ONLY mount of the docker socket — this is the ONLY container that
      # ever sees it. The proxy still performs API calls over it; :ro only blocks
      # modifying the socket file itself.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - standard-red-notes

networks:
  standard-red-notes:
    driver: bridge
  # ---------------------------------------------------------------------------
  # Optional: attach the proxy-facing services to an EXISTING reverse-proxy
  # network (e.g. one your Traefik/nginx container already uses) so the proxy can
  # reach them by service name without publishing host ports. Uncomment this and
  # the `proxy` entries under the `app` and `server` services, then create the
  # network once: `docker network create proxy`.
  # proxy:
  #   external: true

volumes:
  mysql-data:
  mariadb-data:
  redis-data:
  server-logs:
  uploads:
  mcp-data:
  n8n-data:
