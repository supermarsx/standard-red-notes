name: standard-red-notes

x-server-env: &server-env
  # Set to true ONLY for local/dev to bypass the entrypoint's published-default-secret
  # guard. A real deployment must instead supply real AUTH_JWT_SECRET /
  # AUTH_SERVER_ENCRYPTION_SERVER_KEY / VALET_TOKEN_SECRET (the guard refuses to boot
  # while the published defaults are in use).
  ALLOW_INSECURE_DEFAULTS: ${ALLOW_INSECURE_DEFAULTS:-}
  DB_HOST: db
  DB_PORT: 3306
  DB_USERNAME: ${MYSQL_USER:-std_notes_user}
  DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required; run the repository setup script}
  DB_DATABASE: ${MYSQL_DATABASE:-standard_notes_db}
  DB_TYPE: mysql
  # Database client safety knobs. DB_CONNECTION_LIMIT is the per-process TypeORM
  # pool ceiling; keep DB_MAX_CONNECTIONS on the MariaDB service above the sum of
  # active server pools. DB_MAX_QUERY_EXECUTION_TIME only logs slow queries.
  DB_CONNECTION_LIMIT: ${DB_CONNECTION_LIMIT:-20}
  DB_MAX_QUERY_EXECUTION_TIME: ${DB_MAX_QUERY_EXECUTION_TIME:-45000}
  CACHE_TYPE: redis
  REDIS_HOST: cache
  REDIS_PORT: 6379
  AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-dev-auth-jwt-secret-change-me}
  # Must be a 64-char hex string (32 bytes); auth's CrypterNode validates this. Override in prod.
  AUTH_SERVER_ENCRYPTION_SERVER_KEY: ${AUTH_SERVER_ENCRYPTION_SERVER_KEY:-deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef}
  VALET_TOKEN_SECRET: ${VALET_TOKEN_SECRET:-dev-valet-token-secret-change-me}
  # Current SRN clients can provide password (v2) and TOTP (v3) step-up proof.
  # Operators may raise these thresholds for a deliberate staged rollout.
  APPLICATION_VERSION_THRESHOLD_FOR_TOKEN_VERSION_2: ${APPLICATION_VERSION_THRESHOLD_FOR_TOKEN_VERSION_2:-0.0.0}
  APPLICATION_VERSION_THRESHOLD_FOR_TOKEN_VERSION_3: ${APPLICATION_VERSION_THRESHOLD_FOR_TOKEN_VERSION_3:-0.0.0}
  # Auth session cookies. The auth service authenticates browser requests off the
  # access_token_<session> cookie, so these MUST suit the deployment or every
  # authed request 401s. Defaults below are for an http://localhost self-host:
  # empty domain -> host-only cookie (works on localhost / any bare host or IP);
  # SameSite=Lax + Secure=false so the cookie is stored/sent over plain http.
  # For an HTTPS deployment behind a domain, set COOKIE_DOMAIN, COOKIE_SECURE=true.
  COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
  COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Lax}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  COOKIE_PARTITIONED: ${COOKIE_PARTITIONED:-false}
  # Reverse-proxy support. When the stack runs behind a TLS-terminating proxy
  # (nginx/Traefik/Caddy), the server must trust the proxy's X-Forwarded-Proto /
  # X-Forwarded-For headers so req.secure / req.ip reflect the real client.
  # Default "loopback, linklocal, uniquelocal" trusts a proxy on loopback or a
  # private/Docker network (the usual compose setup) but NOT arbitrary public
  # clients, so direct access still works and forwarded headers can't be spoofed.
  # Set to "true" to trust any number of hops, a number N to trust N hops, or a
  # CSV of proxy IPs/subnets. See docs/self-hosting.md "Running behind a reverse
  # proxy". Pair with COOKIE_SECURE=true when TLS is terminated at the proxy.
  TRUST_PROXY: ${TRUST_PROXY:-loopback, linklocal, uniquelocal}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # Shared persisted admin overlay read by every supervisord process. A custom
  # in-container path also needs a matching persistent volume mount.
  SERVER_SETTINGS_PATH: ${SERVER_SETTINGS_PATH:-/opt/server/packages/api-gateway/data/server-settings.json}
  # Optional analytics report recipients. This does not grant authorization;
  # administrator access is a persisted ADMIN_USER role managed with srn-admin.
  ADMIN_EMAILS: ${ADMIN_EMAILS:-}
  STANDARD_RED_FEATURES_MODE: ${STANDARD_RED_FEATURES_MODE:-included}
  STANDARD_RED_ENTITLEMENT_MODE: ${STANDARD_RED_ENTITLEMENT_MODE:-included}
  STANDARD_RED_FULL_FEATURE_DURATION_DAYS: ${STANDARD_RED_FULL_FEATURE_DURATION_DAYS:-36500}
  STANDARD_RED_FULL_FEATURE_FILE_UPLOAD_BYTES_LIMIT: ${STANDARD_RED_FULL_FEATURE_FILE_UPLOAD_BYTES_LIMIT:--1}
  # Absolute upload/request bounds. HTTP_REQUEST_PAYLOAD_LIMIT_MEGABYTES protects
  # the gateway JSON/body parser; MAX_CHUNK_BYTES/MAX_ATTACHMENT_BYTE_SIZE protect
  # the files service even for otherwise unlimited accounts.
  HTTP_REQUEST_PAYLOAD_LIMIT_MEGABYTES: ${HTTP_REQUEST_PAYLOAD_LIMIT_MEGABYTES:-50}
  MAX_CHUNK_BYTES: ${MAX_CHUNK_BYTES:-100000000}
  MAX_ATTACHMENT_BYTE_SIZE: ${MAX_ATTACHMENT_BYTE_SIZE:-5368709120}
  # Revision history retention. Both default to 0 = unlimited (no pruning),
  # preserving the upstream behavior. When set, the revisions service prunes a
  # note/file's history on each new revision: REVISIONS_RETENTION_DAYS deletes
  # revisions older than the window; REVISIONS_MAX_COUNT_PER_ITEM keeps only the
  # N most-recent revisions per item.
  REVISIONS_RETENTION_DAYS: ${REVISIONS_RETENTION_DAYS:-0}
  REVISIONS_MAX_COUNT_PER_ITEM: ${REVISIONS_MAX_COUNT_PER_ITEM:-0}
  # Public base URL clients use to reach the files service (chunk uploads /
  # downloads with valet tokens). The api-gateway advertises it to clients in
  # every response's meta.server.filesServerUrl — it is NEVER called
  # server-side, so it must be a URL the BROWSER can reach. It points at the
  # app front door's /files/ proxy (app/docker/nginx.conf), which strips the
  # /files prefix and forwards to the files service on the internal network —
  # the files service publishes no host port. Override for real deployments,
  # e.g. PUBLIC_FILES_SERVER_URL=https://notes.example.com/files.
  PUBLIC_FILES_SERVER_URL: ${PUBLIC_FILES_SERVER_URL:-http://localhost:${APP_PORT:-3001}/files}
  # Canonical browser-facing Standard Red Notes origin. Security-sensitive
  # external-link validation uses this configured value and never trusts Host.
  # Intentionally has NO Compose default: set it explicitly before enabling
  # workflows or subscription pairing. The setup scripts generate it for local
  # and production installs; a hand-written raw Compose deploy fails closed.
  PUBLIC_URL: ${PUBLIC_URL:-}
  # Self-hosted realtime WebSocket gateway. It now runs IN-PROCESS inside the
  # api-gateway on the SAME port (:3000) — no separate listener/process. The
  # api-gateway POSTs to its own /sockets/tokens to mint connection tokens, so
  # this URL points at the api-gateway itself. It is CONTAINER-INTERNAL
  # (localhost inside the server container) — browsers never see it; they dial
  # the same-origin ws(s)://<app-host>/sockets path proxied by the app's nginx.
  WEB_SOCKET_SERVER_URL: ${WEB_SOCKET_SERVER_URL:-http://localhost:3000}
  WEBSOCKET_GATEWAY_INTERNAL_SECRET: ${WEBSOCKET_GATEWAY_INTERNAL_SECRET:-dev-ws-internal-secret-change-me}
  # Connection-token signing for the in-process WebSocket gateway. The api-gateway
  # reads these from its environment and passes them to attachWebSocketGateway.
  WEB_SOCKET_CONNECTION_TOKEN_SECRET: ${WEB_SOCKET_CONNECTION_TOKEN_SECRET:-dev-ws-conn-token-secret-change-me}
  WEB_SOCKET_CONNECTION_TOKEN_TTL: ${WEB_SOCKET_CONNECTION_TOKEN_TTL:-60s}
  # Exact-note collaboration capabilities are deliberately short lived. The
  # api-gateway rejects values outside the safe whole-second range 30..900.
  COLLABORATION_CAPABILITY_TTL_SECONDS: ${COLLABORATION_CAPABILITY_TTL_SECONDS:-300}
  WEBSOCKET_MAX_CONNECTIONS_PER_USER: ${WEBSOCKET_MAX_CONNECTIONS_PER_USER:-16}
  # SNS/SQS event source for realtime push: the gateway consumes the syncing
  # server's WEB_SOCKET_MESSAGE_REQUESTED events from this queue. The `floci`
  # service below emulates SNS/SQS; credentials are dummies (floci has no auth).
  SQS_QUEUE_URL: ${SQS_QUEUE_URL:-http://floci:4566/000000000000/websocket-local-queue}
  SQS_ENDPOINT: ${SQS_ENDPOINT:-http://floci:4566}
  SQS_AWS_REGION: ${SQS_AWS_REGION:-us-east-1}
  SQS_ACCESS_KEY_ID: ${SQS_ACCESS_KEY_ID:-floci}
  SQS_SECRET_ACCESS_KEY: ${SQS_SECRET_ACCESS_KEY:-floci}
  # SMTP is consumed by the auth worker. Email backups are generated by the
  # syncing worker and handed back to auth as owned attachment references.
  AUTH_SERVER_SMTP_HOST: ${SMTP_HOST:-}
  AUTH_SERVER_SMTP_PORT: ${SMTP_PORT:-587}
  AUTH_SERVER_SMTP_USER: ${SMTP_USER:-}
  AUTH_SERVER_SMTP_PASS: ${SMTP_PASS:-}
  AUTH_SERVER_SMTP_FROM: ${SMTP_FROM:-}
  AUTH_SERVER_EMAIL_BACKUPS_ENABLED: ${EMAIL_BACKUPS_ENABLED:-false}
  # Both services must agree on the attachment cap and local backup directory.
  AUTH_SERVER_EMAIL_ATTACHMENT_MAX_BYTE_SIZE: ${EMAIL_ATTACHMENT_MAX_BYTE_SIZE:-10485760}
  SYNCING_SERVER_EMAIL_ATTACHMENT_MAX_BYTE_SIZE: ${EMAIL_ATTACHMENT_MAX_BYTE_SIZE:-10485760}
  AUTH_SERVER_FILE_UPLOAD_PATH: /opt/shared/uploads
  SYNCING_SERVER_FILE_UPLOAD_PATH: /opt/shared/uploads
  # Optional S3 backing for generated email backups. Auth and syncing must use
  # the same bucket, endpoint, region, and credentials.
  AUTH_SERVER_S3_AWS_REGION: ${S3_AWS_REGION:-}
  AUTH_SERVER_S3_ENDPOINT: ${S3_ENDPOINT:-}
  AUTH_SERVER_S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  AUTH_SERVER_S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  AUTH_SERVER_S3_BACKUP_BUCKET_NAME: ${S3_BACKUP_BUCKET_NAME:-}
  SYNCING_SERVER_S3_AWS_REGION: ${S3_AWS_REGION:-}
  SYNCING_SERVER_S3_ENDPOINT: ${S3_ENDPOINT:-}
  SYNCING_SERVER_S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  SYNCING_SERVER_S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  SYNCING_SERVER_S3_BACKUP_BUCKET_NAME: ${S3_BACKUP_BUCKET_NAME:-}
  AUTH_SERVER_U2F_RELYING_PARTY_ID: ${AUTH_SERVER_U2F_RELYING_PARTY_ID:-localhost}
  AUTH_SERVER_U2F_RELYING_PARTY_NAME: ${AUTH_SERVER_U2F_RELYING_PARTY_NAME:-Standard Red Notes}
  AUTH_SERVER_U2F_EXPECTED_ORIGIN: ${AUTH_SERVER_U2F_EXPECTED_ORIGIN:-http://localhost:3001,http://localhost}
  # Assistant LLM proxy. The "openai" provider is OpenAI-compatible and driven by
  # ASSISTANT_OPENAI_BASE_URL, so it also serves LM Studio, Ollama (OpenAI mode),
  # OpenRouter and any custom OpenAI-compatible server. Local servers usually need
  # no API key. ASSISTANT_OLLAMA_URL enables the native Ollama (/api/chat) provider.
  ASSISTANT_ANTHROPIC_API_KEY: ${ASSISTANT_ANTHROPIC_API_KEY:-}
  ASSISTANT_OPENAI_API_KEY: ${ASSISTANT_OPENAI_API_KEY:-}
  ASSISTANT_OPENAI_BASE_URL: ${ASSISTANT_OPENAI_BASE_URL:-}
  ASSISTANT_OPENAI_MODEL: ${ASSISTANT_OPENAI_MODEL:-}
  ASSISTANT_OLLAMA_URL: ${ASSISTANT_OLLAMA_URL:-}
  ASSISTANT_DEFAULT_PROVIDER: ${ASSISTANT_DEFAULT_PROVIDER:-}
  ASSISTANT_DEFAULT_MODEL: ${ASSISTANT_DEFAULT_MODEL:-}
  # Guided ChatGPT/Codex pairing. The key is intentionally unset by default;
  # generate 32 random bytes as 64 hex characters to enable it. Pairing state
  # and credentials live on the server-data volume, not the container layer.
  ASSISTANT_SUBSCRIPTION_ENCRYPTION_KEY: ${ASSISTANT_SUBSCRIPTION_ENCRYPTION_KEY:-}
  ASSISTANT_SUBSCRIPTION_TOKEN_PATH: ${ASSISTANT_SUBSCRIPTION_TOKEN_PATH:-/opt/server/packages/api-gateway/data/assistant-subscription.json}
  ASSISTANT_CHATGPT_OAUTH_AUTHORIZE_URL: ${ASSISTANT_CHATGPT_OAUTH_AUTHORIZE_URL:-}
  ASSISTANT_CHATGPT_OAUTH_TOKEN_URL: ${ASSISTANT_CHATGPT_OAUTH_TOKEN_URL:-}
  ASSISTANT_CHATGPT_OAUTH_CLIENT_ID: ${ASSISTANT_CHATGPT_OAUTH_CLIENT_ID:-}
  ASSISTANT_CHATGPT_OAUTH_REDIRECT_URI: ${ASSISTANT_CHATGPT_OAUTH_REDIRECT_URI:-}
  ASSISTANT_CHATGPT_OAUTH_SCOPES: ${ASSISTANT_CHATGPT_OAUTH_SCOPES:-}
  ASSISTANT_CHATGPT_OAUTH_ACCOUNT_ID_CLAIM: ${ASSISTANT_CHATGPT_OAUTH_ACCOUNT_ID_CLAIM:-}
  # Legacy direct subscription-bearer mode. Once guided pairing is configured,
  # its default slot is authoritative and these values cannot bypass unpair.
  ASSISTANT_OPENAI_AUTH_MODE: ${ASSISTANT_OPENAI_AUTH_MODE:-}
  ASSISTANT_OPENAI_SUBSCRIPTION_TOKEN: ${ASSISTANT_OPENAI_SUBSCRIPTION_TOKEN:-}
  ASSISTANT_OPENAI_SUBSCRIPTION_BASE_URL: ${ASSISTANT_OPENAI_SUBSCRIPTION_BASE_URL:-}
  ASSISTANT_OPENAI_ACCOUNT_ID: ${ASSISTANT_OPENAI_ACCOUNT_ID:-}
  ASSISTANT_OPENAI_BETA: ${ASSISTANT_OPENAI_BETA:-}
  ASSISTANT_OPENAI_EXTRA_HEADERS: ${ASSISTANT_OPENAI_EXTRA_HEADERS:-}
  # Global per-user daily AI request ceiling enforced by the api-gateway. 0 = unlimited.
  ASSISTANT_DAILY_REQUEST_LIMIT: ${ASSISTANT_DAILY_REQUEST_LIMIT:-0}
  # OPT-IN server-side PDF OCR (tesseract-in-Node, /v1/ocr). PRIVACY: when enabled,
  # the client may upload DECRYPTED PDF page images here for recognition — that
  # content LEAVES end-to-end encryption (the server can read it), exactly like the
  # AI proxy. The DEFAULT OCR path stays in the browser (OCR_ENABLED, above), where
  # nothing leaves the device. Two gates apply: this operator master switch AND a
  # per-user, admin-managed OCR_SERVER_ALLOWED setting (default off) — so even with
  # this on, server OCR is offered only to users an admin has explicitly allowed.
  OCR_SERVER_ENABLED: ${OCR_SERVER_ENABLED:-false}
  OCR_SERVER_DEFAULT_LANGUAGE: ${OCR_SERVER_DEFAULT_LANGUAGE:-eng}
  # Per-request bounds so an OCR call cannot pin the box (CPU-heavy; one large page
  # can take seconds). Defaults: 50 pages, 12 MB per page image.
  OCR_SERVER_MAX_PAGES: ${OCR_SERVER_MAX_PAGES:-50}
  OCR_SERVER_MAX_IMAGE_BYTES: ${OCR_SERVER_MAX_IMAGE_BYTES:-12582912}
  # Self-hosted "Check for updates" (/v1/updates/status). UNSET BY DEFAULT — the
  # feature then reports "not configured" and the client shows that state
  # gracefully. Point it at a GitHub releases API URL (list or /releases/latest)
  # or any JSON endpoint returning { "version": "...", "url": "..." }. The
  # gateway fetches it SERVER-SIDE (no client CORS/privacy leak) with a short
  # timeout and caches the result in-memory (default 15 min); the manual
  # "Check for updates" button bypasses the cache.
  # UPDATE_CHECK_URL: https://api.github.com/repos/<owner>/<repo>/releases/latest
  # The version this deployment reports as "current" defaults to the api-gateway
  # package version; override when your release tags track the whole fork.
  # UPDATE_CHECK_CURRENT_VERSION: "1.0.0"
  # OPT-IN Workflows discovery. Two gates apply: this operator switch and the
  # per-user WORKFLOWS_ENABLED setting. They control link visibility only; n8n
  # owns authentication, authorization, projects, credentials, and sessions.
  WORKFLOWS_ENABLED: ${WORKFLOWS_ENABLED:-false}
  # Browser-facing n8n editor origin. Production must use a distinct HTTPS
  # hostname outside COOKIE_DOMAIN. HTTP is accepted only for localhost/127/::1
  # development. Never put credentials, query strings, or fragments here.
  WORKFLOWS_PUBLIC_URL: ${WORKFLOWS_PUBLIC_URL:-}
  # Optional server-wide shared access key ("obfuscation gate"). OFF by default
  # (empty key => zero behavior change). This is OBFUSCATION / access-gating for a
  # self-hosted instance, NOT end-to-end security (that is the client-side E2E
  # encryption). When set, the api-gateway requires clients to present this key in
  # the X-Shared-Server-Key header. SHARED_SERVER_ACCESS_KEY_MODE selects what is
  # gated: "all" (every request, healthcheck exempt) or "registration" (only new
  # sign-ups). The container readiness path (/healthcheck/readiness) is always exempt.
  SHARED_SERVER_ACCESS_KEY: ${SHARED_SERVER_ACCESS_KEY:-}
  SHARED_SERVER_ACCESS_KEY_MODE: ${SHARED_SERVER_ACCESS_KEY_MODE:-all}
  # CORS. The gateway now defaults to STRICT (safe for self-host): it reflects
  # only known origins — the desktop app (file://), the Firefox/Chromium/Safari
  # clippers (…-extension://), a localhost self-host (http(s)://localhost[:port])
  # and anything listed in CORS_ALLOWED_ORIGINS. SAME-ORIGIN requests (the
  # standard nginx front-door setup) are unaffected. Set
  # CORS_ORIGIN_STRICT_MODE_ENABLED=false to restore the legacy permissive
  # "reflect ANY Origin" behavior; add extra cross-origin front-ends (comma-
  # separated) to CORS_ALLOWED_ORIGINS.
  CORS_ORIGIN_STRICT_MODE_ENABLED: ${CORS_ORIGIN_STRICT_MODE_ENABLED:-}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  # Rate limiting for the UNAUTHENTICATED auth-adjacent endpoints (login,
  # registration, MCP-token authenticate, magic-link request, recovery).
  # Redis-backed, keyed by client IP (honors TRUST_PROXY), and FAIL-OPEN if Redis
  # is unavailable so an outage never blocks legitimate sign-ins. Defaults:
  # 10 logins/min/IP and 5/min/IP for registration + mcp-authenticate + magic-link
  # (a shared window of RATE_LIMIT_WINDOW_SECONDS). Set RATE_LIMIT_ENABLED=false
  # to turn it off. The authenticated sync/proxy paths are never rate-limited.
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-}
  RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
  RATE_LIMIT_LOGIN_MAX: ${RATE_LIMIT_LOGIN_MAX:-10}
  RATE_LIMIT_REGISTRATION_MAX: ${RATE_LIMIT_REGISTRATION_MAX:-5}
  # Authenticated per-user operation tier. Default is off (0) to preserve stock
  # behavior; set a positive max to rate-limit expensive authenticated endpoints
  # such as the assistant stream proxy.
  RATE_LIMIT_USER_WINDOW_SECONDS: ${RATE_LIMIT_USER_WINDOW_SECONDS:-60}
  RATE_LIMIT_USER_MAX: ${RATE_LIMIT_USER_MAX:-0}
  RATE_LIMIT_ADAPTIVE_ESCALATION: ${RATE_LIMIT_ADAPTIVE_ESCALATION:-false}
  # Signup safety caps. Defaults preserve an open self-host; set positive caps
  # or REGISTRATION_INVITE_ONLY=true / REGISTRATION_APPROVAL_REQUIRED=true for
  # public instances where account creation needs an operational backstop.
  REGISTRATION_SIGNUPS_PER_IP_MAX: ${REGISTRATION_SIGNUPS_PER_IP_MAX:-0}
  REGISTRATION_SIGNUPS_PER_IP_WINDOW_HOURS: ${REGISTRATION_SIGNUPS_PER_IP_WINDOW_HOURS:-24}
  REGISTRATION_SIGNUPS_PER_WEEK_MAX: ${REGISTRATION_SIGNUPS_PER_WEEK_MAX:-0}
  REGISTRATION_SIGNUPS_PER_DEVICE_MAX: ${REGISTRATION_SIGNUPS_PER_DEVICE_MAX:-0}
  REGISTRATION_SIGNUPS_PER_DEVICE_WINDOW_HOURS: ${REGISTRATION_SIGNUPS_PER_DEVICE_WINDOW_HOURS:-24}
  REGISTRATION_MAX_TOTAL_ACCOUNTS: ${REGISTRATION_MAX_TOTAL_ACCOUNTS:-0}
  REGISTRATION_INVITE_ONLY: ${REGISTRATION_INVITE_ONLY:-false}
  REGISTRATION_APPROVAL_REQUIRED: ${REGISTRATION_APPROVAL_REQUIRED:-false}
  # OPT-IN, OFF-BY-DEFAULT admin container restart for the infra containers that
  # run OUTSIDE the server's supervisord (Redis `cache` + MariaDB `db`). The admin
  # panel restarts them through the locked-down `docker-socket-proxy` sidecar below
  # (Docker Engine API over HTTP) — the raw /var/run/docker.sock is NEVER mounted
  # into this server container, only into the proxy. DISABLED unless BOTH the flag
  # is set to `true` AND the proxy URL is provided AND the proxy is actually run
  # (`docker compose --profile ops up -d`). Left empty here so the base stack is
  # unchanged and the feature stays off. See docs/DEPLOYMENT.md "Opt-in container
  # restart". SERVICE_CONTROL_DOCKER_PROJECT is the compose project prefix used to
  # resolve <project>-<service>-1 container names (matches `name:` at the top).
  SERVICE_CONTROL_DOCKER_ENABLED: ${SERVICE_CONTROL_DOCKER_ENABLED:-}
  SERVICE_CONTROL_DOCKER_PROXY_URL: ${SERVICE_CONTROL_DOCKER_PROXY_URL:-}
  SERVICE_CONTROL_DOCKER_PROJECT: ${SERVICE_CONTROL_DOCKER_PROJECT:-standard-red-notes}

services:
  # Fail closed before MariaDB starts. Compose interpolation rejects missing or
  # empty values while this networkless one-shot rejects published placeholders
  # (and app/root credential reuse) without ever writing secret values to logs.
  # The setup scripts generate independent 32-byte random values automatically.
  db-credential-preflight:
    image: ${MARIADB_IMAGE:-mariadb:12.3.2}
    restart: "no"
    user: "65534:65534"
    read_only: true
    network_mode: none
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    mem_limit: 32m
    pids_limit: 32
    environment:
      SRN_DB_APP_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required; run the repository setup script}
      SRN_DB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required; run the repository setup script}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        reject_credential() {
          printf '%s\n' "Database credential preflight failed: $${1} is unset or uses a published placeholder." >&2
          exit 1
        }
        validate_credential() {
          credential_name="$${1}"
          credential_value="$${2}"
          normalized="$$(printf '%s' "$${credential_value}" | tr '[:upper:]' '[:lower:]')"
          case "$${normalized}" in
            ""|changeme123|change-me-random-hex-32)
              reject_credential "$${credential_name}"
              ;;
          esac
        }
        validate_credential MYSQL_PASSWORD "$${SRN_DB_APP_PASSWORD}"
        validate_credential MYSQL_ROOT_PASSWORD "$${SRN_DB_ROOT_PASSWORD}"
        if [ "$${SRN_DB_APP_PASSWORD}" = "$${SRN_DB_ROOT_PASSWORD}" ]; then
          printf '%s\n' 'Database credential preflight failed: MYSQL_PASSWORD and MYSQL_ROOT_PASSWORD must be distinct.' >&2
          exit 1
        fi
        printf '%s\n' 'Database credential preflight passed.'

  # A previous release used mysql:8.4 with the mysql-data volume. Starting
  # MariaDB against a new mariadb-data volume would otherwise look like a
  # successful clean install while leaving every existing account behind in
  # the legacy volume. Detect that state before db starts and fail closed.
  # Both volumes are read-only here: MySQL and MariaDB datadirs must be moved
  # with a documented logical dump/restore, never copied between engines.
  db-volume-preflight:
    image: ${MARIADB_IMAGE:-mariadb:12.3.2}
    restart: "no"
    user: "999:999"
    read_only: true
    network_mode: none
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    mem_limit: 32m
    pids_limit: 32
    volumes:
      - mysql-data:/legacy-mysql:ro
      - mariadb-data:/current-mariadb:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        legacy_initialized=false
        current_initialized=false
        [ -d /legacy-mysql/mysql ] && legacy_initialized=true
        [ -d /current-mariadb/mysql ] && current_initialized=true

        if "$${legacy_initialized}" && ! "$${current_initialized}"; then
          printf '%s\n' 'Database volume preflight failed: a legacy MySQL 8.4 database exists in mysql-data, but mariadb-data is not initialized. Deployment stopped to prevent an empty-database startup. Follow the documented logical dump/restore migration; never copy the raw database directory between engines.' >&2
          exit 1
        fi

        if "$${legacy_initialized}" && "$${current_initialized}"; then
          printf '%s\n' 'Database volume preflight notice: both legacy mysql-data and current mariadb-data are initialized; MariaDB will use mariadb-data.' >&2
        fi
        printf '%s\n' 'Database volume preflight passed.'

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: standard-red-notes/app:local
    restart: unless-stopped
    # Hardening: the image already runs as the unprivileged `nginx` user (uid 101)
    # and listens on 8080, so it needs no Linux capabilities. Drop them all and
    # block privilege escalation.
    #
    # NOTE: read_only is intentionally NOT set here. The OCR runtime-config
    # entrypoint (docker/docker-entrypoint.sh) rewrites the window.* globals in
    # /usr/share/nginx/html/index.html at container start, so the served bundle
    # must stay writable. nginx's own scratch paths (/var/cache/nginx, /var/run,
    # /tmp) are mounted as tmpfs to keep writes off the image layer.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    # Resource ceilings: cap memory + process count so a runaway/compromised
    # container can't exhaust the host (pids_limit also blunts fork-bombs).
    # Tune via the *_MEM_LIMIT env vars.
    mem_limit: ${APP_MEM_LIMIT:-256m}
    pids_limit: 256
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    environment:
      # Client-side PDF OCR (tesseract.js). Files are end-to-end encrypted, so the
      # server NEVER sees decrypted PDFs and cannot run OCR — these flags only gate
      # whether the web client offers the "Extract text (OCR)" action and which
      # tesseract language it defaults to. The app's entrypoint templates these into
      # the static index.html at container start (no rebuild needed). OFF by default:
      # OCR downloads multi-MB language data at runtime, is slow, and accuracy varies.
      OCR_ENABLED: ${OCR_ENABLED:-false}
      OCR_DEFAULT_LANGUAGE: ${OCR_DEFAULT_LANGUAGE:-eng}
      # Default sync server the app loads with. Unset => the app's own origin
      # (this deployment syncs to ITSELF — never api.standardnotes.com). Set to
      # front the API on a different host, e.g. SYNC_SERVER=https://sync.example.com.
      SYNC_SERVER: ${SYNC_SERVER:-}
      # Raw forwarded headers are ignored unless this explicit proxy-trust gate
      # is enabled with a canonical HTTPS PUBLIC_URL. New HTTPS setup-script
      # installs set both; direct/local installs remain plain HTTP compatible.
      ENFORCE_HTTPS_FROM_PROXY: ${ENFORCE_HTTPS_FROM_PROXY:-false}
      PUBLIC_URL: ${PUBLIC_URL:-}
      APP_BIND_ADDRESS: ${APP_BIND_ADDRESS:-0.0.0.0}
    depends_on:
      server:
        condition: service_healthy
    # When fronting with a reverse proxy you can drop the published port and let
    # the proxy reach this container over the shared `proxy` network (see the
    # `networks` block at the bottom). To keep direct access, leave `ports` as-is.
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-3001}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - standard-red-notes
      # - proxy
    # Example Traefik labels (uncomment with the `proxy` network). This nginx
    # is the SINGLE Standard Red Notes front door: it serves the web UI and
    # proxies the /v1 API, /files/, and realtime websocket (/sockets). n8n must
    # use its own hostname/router. Adjust the host
    # rule and TLS resolver, and set PUBLIC_FILES_SERVER_URL to
    # https://<your-host>/files.
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.docker.network=proxy"
    #   # Web UI (catch-all for the host)
    #   - "traefik.http.routers.srn-web.rule=Host(`notes.example.com`)"
    #   - "traefik.http.routers.srn-web.entrypoints=websecure"
    #   - "traefik.http.routers.srn-web.tls.certresolver=le"
    #   - "traefik.http.services.srn-web.loadbalancer.server.port=8080"

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: standard-red-notes/server:local
    restart: unless-stopped
    # Hardening: the image runs supervisord + every node service as the
    # unprivileged `srn` user (uid 10001). Drop all Linux capabilities and block
    # privilege escalation. NOTE: this multi-service container WRITES at runtime
    # (per-package .env files under /opt/server/packages, supervisord/service logs,
    # file uploads), so it must keep a writable rootfs — do NOT set read_only here.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    # Proper PID 1 (reap zombies, forward signals) + resource ceilings. The
    # server runs ~6 node services via supervisord, so it gets a larger memory
    # budget; raise SERVER_MEM_LIMIT if you see OOM kills under load.
    init: true
    mem_limit: ${SERVER_MEM_LIMIT:-2g}
    pids_limit: 2048
    environment:
      <<: *server-env
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      floci:
        condition: service_healthy
    # Internal-only: NO host ports. ALL client traffic (API /v1|/v2|/auth,
    # files /files/ and realtime /sockets) enters
    # through the app front door (nginx on APP_PORT, default 3001), which
    # reaches this container by service name on the compose network
    # (server:3000 for the gateway + in-process websocket gateway, server:3104
    # for files). To temporarily expose the gateway for debugging, add e.g.
    #   ports: ["127.0.0.1:3000:3000"]
    # here — but nothing in the stack needs it.
    volumes:
      - server-logs:/var/lib/server/logs
      - uploads:/opt/shared/uploads
      # Owned/chowned in the image before USER srn and copied into this named
      # volume on first use. Persists pairing, server settings, and gateway JSON.
      - server-data:/opt/server/packages/api-gateway/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/healthcheck/readiness >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - standard-red-notes
      # - proxy
    # NOTE: an external reverse proxy (Traefik/nginx/Caddy) does NOT need to
    # route to this container at all. The app front door above already proxies
    # every backend path (/v1, /v2, /auth, /subscription, /healthcheck,
    # /files/, /sockets) same-origin, so a single router to the
    # `app` service covers the whole stack (see the labels example on `app`).

  mcp:
    profiles:
      - mcp
    build:
      context: .
      dockerfile: mcp/Dockerfile
    image: standard-red-notes/mcp:local
    restart: unless-stopped
    # Hardening: no privilege escalation, no capabilities. Internal-only — this
    # service is NEVER published to the host. It is deliberately dual-homed:
    # `standard-red-notes` reaches the API, while `workflows-mcp` exposes only
    # this authenticated bridge to n8n at mcp:3010. Keep it on the `mcp` profile
    # so it only runs when explicitly requested (`--profile mcp`).
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    init: true
    mem_limit: ${MCP_MEM_LIMIT:-512m}
    pids_limit: 512
    environment:
      STANDARD_RED_NOTES_SERVER_URL: http://server:3000
      STANDARD_RED_NOTES_DATA_DIR: /var/lib/standard-red-notes-mcp
      # Autonomous HTTP mode: run the MCP server as a long-lived HTTP service
      # (instead of stdio) so other containers/agents can reach it over the
      # network. Binding beyond loopback is an explicit opt-in and is safe here
      # only because the port is NOT published to the host. MCP_HTTP_TOKEN is a
      # REQUIRED bearer token; when it is empty or shorter than 32 bytes the
      # process fails closed instead of starting an unauthenticated endpoint.
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: "0.0.0.0"
      MCP_HTTP_PORT: "3010"
      MCP_HTTP_ALLOW_REMOTE: "1"
      MCP_HTTP_TOKEN: ${MCP_HTTP_TOKEN:-}
      MCP_HTTP_MAX_BODY_BYTES: ${MCP_HTTP_MAX_BODY_BYTES:-1048576}
      MCP_HTTP_MAX_SESSIONS: ${MCP_HTTP_MAX_SESSIONS:-32}
      MCP_HTTP_SESSION_IDLE_MS: ${MCP_HTTP_SESSION_IDLE_MS:-300000}
      MCP_HTTP_BODY_TIMEOUT_MS: ${MCP_HTTP_BODY_TIMEOUT_MS:-10000}
      MCP_HTTP_REQUEST_TIMEOUT_MS: ${MCP_HTTP_REQUEST_TIMEOUT_MS:-60000}
      # Prefer a server-issued, scoped MCP token. Email/password remains a
      # compatibility fallback; never reuse MCP_HTTP_TOKEN for account auth.
      STANDARD_RED_NOTES_MCP_TOKEN: ${STANDARD_RED_NOTES_MCP_TOKEN:-}
      STANDARD_RED_NOTES_EMAIL: ${STANDARD_RED_NOTES_EMAIL:-}
      STANDARD_RED_NOTES_PASSWORD: ${STANDARD_RED_NOTES_PASSWORD:-}
      STANDARD_RED_NOTES_MFA_CODE: ${STANDARD_RED_NOTES_MFA_CODE:-}
      STANDARD_RED_NOTES_ALLOW_WRITES: ${STANDARD_RED_NOTES_ALLOW_WRITES:-0}
      STANDARD_RED_NOTES_ALLOW_REGISTER: ${STANDARD_RED_NOTES_ALLOW_REGISTER:-0}
      # Empty roots disable local attachment/export tools. Values are
      # colon-delimited absolute paths INSIDE this Linux container and need
      # matching read/write volume mounts supplied by an operator override.
      STANDARD_RED_NOTES_FILE_ROOTS: ${STANDARD_RED_NOTES_FILE_ROOTS:-}
      STANDARD_RED_NOTES_EXPORT_ROOTS: ${STANDARD_RED_NOTES_EXPORT_ROOTS:-}
      STANDARD_RED_NOTES_MAX_ATTACHMENT_BYTES: ${STANDARD_RED_NOTES_MAX_ATTACHMENT_BYTES:-16777216}
      STANDARD_RED_NOTES_MAX_EXPORT_BYTES: ${STANDARD_RED_NOTES_MAX_EXPORT_BYTES:-134217728}
      # Continuous background sync so the agent picks up collaborators' changes.
      STANDARD_RED_NOTES_SYNC_INTERVAL_MS: ${STANDARD_RED_NOTES_SYNC_INTERVAL_MS:-10000}
    volumes:
      - mcp-data:/var/lib/standard-red-notes-mcp
    depends_on:
      server:
        condition: service_healthy
    networks:
      - standard-red-notes
      - workflows-mcp

  # ---------------------------------------------------------------------------
  # OPTIONAL operator-managed n8n service. Runs ONLY
  # with the `workflows` compose profile (`docker compose --profile workflows
  # up -d`), so the stack stays healthy when the image was never pulled and the
  # `server` service intentionally does NOT depend_on it.
  #
  # SECURITY: workflow and Code nodes are arbitrary code, so n8n is a separate
  # security domain. It joins ONLY `workflows-mcp`, where it can reach the
  # authenticated MCP bridge. It has no direct service-network route and cannot
  # address the core server, MariaDB, Redis, or floci by Compose DNS. Like any
  # external client, it can still call endpoints deliberately published on the
  # host/public network. The default published port is loopback-only for local
  # setup. In production, remove that port mapping and attach n8n to a deliberate
  # reverse-proxy network/router on a DISTINCT HTTPS hostname. Complete n8n's
  # owner setup before exposing it. SRN never forwards its cookies, bearer
  # tokens, or identity to n8n.
  #
  # Required env when enabling for real use:
  #   PUBLIC_URL=https://notes.example.com
  #   WORKFLOWS_ENABLED=true
  #   WORKFLOWS_PUBLIC_URL=https://automation.example.net
  #   N8N_PUBLIC_URL=https://automation.example.net
  #   N8N_HOST=automation.example.net
  #   N8N_PROTOCOL=https
  #   N8N_PROXY_HOPS=1
  #   N8N_SECURE_COOKIE=true
  #   N8N_LISTEN_ADDRESS=0.0.0.0
  #   N8N_ENCRYPTION_KEY=<stable random secret>
  n8n:
    profiles:
      - workflows
    image: ${N8N_IMAGE:-n8nio/n8n:2.32.6}
    restart: unless-stopped
    # Hardening: the image runs as the unprivileged `node` user (uid 1000) and
    # only serves HTTP on 5678 internally — no capabilities needed.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    mem_limit: ${N8N_MEM_LIMIT:-1g}
    pids_limit: 512
    # Local development only. Production should remove this mapping and route a
    # dedicated TLS hostname to n8n:5678 over a private proxy network.
    ports:
      - "${N8N_BIND_ADDRESS:-127.0.0.1}:${N8N_PORT:-5678}:5678"
    environment:
      N8N_PORT: "5678"
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_HOST: ${N8N_HOST:-127.0.0.1}
      N8N_EDITOR_BASE_URL: ${N8N_PUBLIC_URL:-http://127.0.0.1:5678}
      WEBHOOK_URL: ${N8N_PUBLIC_URL:-http://127.0.0.1:5678}
      # Required behind one reverse proxy so n8n trusts the forwarded origin.
      N8N_PROXY_HOPS: ${N8N_PROXY_HOPS:-0}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      # Listen on the container network. The host publication remains bound to
      # N8N_BIND_ADDRESS (loopback by default).
      N8N_LISTEN_ADDRESS: ${N8N_LISTEN_ADDRESS:-0.0.0.0}
      # An empty value makes n8n generate a key in the persistent settings file
      # on first launch. Production must set and back up a stable value.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-}
      # n8n 2.x hardening. These controls do not disable the built-in MCP
      # Client/MCP Client Tool used by the documented bridge integration.
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: ${N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS:-true}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: ${N8N_BLOCK_ENV_ACCESS_IN_NODE:-true}
      N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES: ${N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES:-true}
      N8N_RESTRICT_FILE_ACCESS_TO: ${N8N_RESTRICT_FILE_ACCESS_TO:-/home/node/.n8n-files}
      N8N_DIAGNOSTICS_ENABLED: ${N8N_DIAGNOSTICS_ENABLED:-false}
      N8N_PERSONALIZATION_ENABLED: ${N8N_PERSONALIZATION_ENABLED:-false}
      N8N_COMMUNITY_PACKAGES_ENABLED: ${N8N_COMMUNITY_PACKAGES_ENABLED:-false}
      N8N_UNVERIFIED_PACKAGES_ENABLED: ${N8N_UNVERIFIED_PACKAGES_ENABLED:-false}
      N8N_PUBLIC_API_DISABLED: ${N8N_PUBLIC_API_DISABLED:-true}
      N8N_PUBLIC_API_SWAGGERUI_DISABLED: ${N8N_PUBLIC_API_SWAGGERUI_DISABLED:-true}
      GENERIC_TIMEZONE: ${TZ:-UTC}
    volumes:
      - n8n-data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - workflows-mcp
      # - proxy
    # Production Traefik example (retain `workflows-mcp`, add the external
    # `proxy` network, and remove the loopback `ports` mapping):
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.docker.network=proxy"
    #   - "traefik.http.routers.n8n.rule=Host(`automation.example.net`)"
    #   - "traefik.http.routers.n8n.entrypoints=websecure"
    #   - "traefik.http.routers.n8n.tls.certresolver=le"
    #   - "traefik.http.services.n8n.loadbalancer.server.port=5678"

  db:
    image: ${MARIADB_IMAGE:-mariadb:12.3.2}
    restart: unless-stopped
    # Hardening: internal-only (no host port published). Block privilege
    # escalation and drop all caps, then add back only what the official mariadb
    # entrypoint needs: it starts as root to fix data-dir ownership (CHOWN,
    # DAC_OVERRIDE, FOWNER) and then drops to the `mysql` user via setpriv
    # (SETGID, SETUID).
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    mem_limit: ${DB_MEM_LIMIT:-1g}
    pids_limit: 1024
    stop_grace_period: 1m
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-standard_notes_db}
      MYSQL_USER: ${MYSQL_USER:-std_notes_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required; run the repository setup script}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required; run the repository setup script}
    depends_on:
      db-credential-preflight:
        condition: service_completed_successfully
      db-volume-preflight:
        condition: service_completed_successfully
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=${DB_MAX_CONNECTIONS:-150}
      - --max-allowed-packet=${DB_MAX_ALLOWED_PACKET:-128M}
      - --innodb-buffer-pool-size=${DB_INNODB_BUFFER_POOL_SIZE:-512M}
      - --innodb-flush-log-at-trx-commit=${DB_INNODB_FLUSH_LOG_AT_TRX_COMMIT:-1}
      - --local-infile=0
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb -h 127.0.0.1 -u\"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\" \"$${MYSQL_DATABASE}\" --batch --raw --skip-column-names -e 'SELECT 1' | grep -q '^1$'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - standard-red-notes

  cache:
    image: ${REDIS_IMAGE:-redis:8.8.0-alpine}
    restart: unless-stopped
    # Hardening: internal-only (no host port published). Block privilege
    # escalation and drop all caps, adding back only SETGID/SETUID, which the
    # redis entrypoint uses to drop from root to the `redis` user.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    mem_limit: ${CACHE_MEM_LIMIT:-256m}
    pids_limit: 256
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "${CACHE_MAXMEMORY:-192mb}",
        "--maxmemory-policy",
        "${CACHE_MAXMEMORY_POLICY:-noeviction}",
      ]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - standard-red-notes

  floci:
    # Local AWS SNS/SQS emulator (https://floci.io, MIT). Replaces LocalStack:
    # floci needs no auth token, is LocalStack wire- and layout-compatible
    # (port 4566, account 000000000000 queue URLs, /etc/localstack/init/ready.d
    # init hooks, /_localstack/health endpoint), and is far lighter (a single
    # native binary, ~13 MiB-class at rest vs LocalStack's ~500 MiB Python
    # runtime). History: we previously pinned localstack/localstack:4.4.0, the
    # last release before LocalStack 2026.3.0+ merged community+pro into one
    # image that requires a LOCALSTACK_AUTH_TOKEN even for SNS/SQS.
    #
    # ESCAPE HATCH — to switch back to current LocalStack, replace `image` below
    # with `localstack/localstack:2026.06.3`; add `LOCALSTACK_AUTH_TOKEN`,
    # `SERVICES: sns,sqs`, and `LS_LOG: warn` under `environment:`; change the
    # healthcheck to `awslocal sqs list-queues`; and raise the mem limit to 512m.
    # The bootstrap script and URLs remain compatible (the service keeps the
    # `localstack` network alias below).
    #
    # The -compat image variant ships the AWS CLI + awslocal, which the
    # bootstrap init script (and the old LocalStack tooling muscle memory,
    # e.g. `docker compose exec floci awslocal sqs list-queues`) relies on.
    image: ${FLOCI_IMAGE:-floci/floci:1.5.33-compat}
    restart: unless-stopped
    # Hardening: internal-only (no host port published) and no privilege
    # escalation. Note floci's SNS/SQS state is in-memory: the ready.d bootstrap
    # recreates all topics/queues/subscriptions on every container start (the
    # create/subscribe calls are idempotent), so no data volume is needed.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    mem_limit: ${FLOCI_MEM_LIMIT:-256m}
    pids_limit: 512
    volumes:
      - ./server/docker/localstack_bootstrap.sh:/etc/localstack/init/ready.d/localstack_bootstrap.sh:ro
    healthcheck:
      # floci serves a LocalStack-compatible health endpoint; the sqs service
      # reports "running" once the emulator is up (init hooks run right after).
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health | grep -q '\"sqs\":\"running\"' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks:
      standard-red-notes:
        # Keep the old hostname answering too: server images built before the
        # floci swap (and any user .env overriding SQS_ENDPOINT/queue URLs with
        # the old hostname) still resolve `localstack` to this container.
        aliases:
          - localstack

  # ---------------------------------------------------------------------------
  # OPTIONAL, OPT-IN docker-socket-proxy for the admin "restart Redis/MariaDB"
  # controls. Runs ONLY with the `ops` compose profile
  # (`docker compose --profile ops up -d`), so the base stack is UNCHANGED and
  # this never starts unless explicitly requested.
  #
  # SECURITY — least privilege, defense in depth:
  #   - The RAW /var/run/docker.sock is mounted ONLY here (read-only), NEVER into
  #     the server container. The server talks to this proxy over HTTP.
  #   - Everything is DENIED by default; only ALLOW_RESTARTS=1 is turned on, which
  #     grants access to just the container restart/stop/kill endpoints. No image
  #     pull, no container create/exec, no volume/network/secret access, no info.
  #     Even a bug in the server can do nothing but restart a container.
  #   - Internal network ONLY — no host port. Reachable only as
  #     `docker-socket-proxy:2375` on the compose network.
  #
  # To ENABLE the feature, run this profile AND set on the server:
  #   SERVICE_CONTROL_DOCKER_ENABLED=true
  #   SERVICE_CONTROL_DOCKER_PROXY_URL=http://docker-socket-proxy:2375
  # See docs/DEPLOYMENT.md "Opt-in container restart".
  docker-socket-proxy:
    profiles:
      - ops
    image: ${DOCKER_SOCKET_PROXY_IMAGE:-tecnativa/docker-socket-proxy:v0.4.2}
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    # HAProxy needs to bind :2375 and drop to its unprivileged user.
    cap_add:
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    mem_limit: ${DOCKER_PROXY_MEM_LIMIT:-64m}
    pids_limit: 128
    environment:
      # DENY-ALL baseline, then permit ONLY the restart endpoints.
      ALLOW_RESTARTS: 1
      # Everything below is explicitly denied (these are the proxy defaults, set
      # here for an auditable, self-documenting locked-down surface).
      CONTAINERS: 0
      IMAGES: 0
      NETWORKS: 0
      VOLUMES: 0
      SERVICES: 0
      TASKS: 0
      SECRETS: 0
      CONFIGS: 0
      SWARM: 0
      NODES: 0
      PLUGINS: 0
      SYSTEM: 0
      INFO: 0
      VERSION: 0
      AUTH: 0
      BUILD: 0
      COMMIT: 0
      DISTRIBUTION: 0
      EXEC: 0
      SESSION: 0
      POST: 0
    volumes:
      # READ-ONLY mount of the docker socket — this is the ONLY container that
      # ever sees it. The proxy still performs API calls over it; :ro only blocks
      # modifying the socket file itself.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - standard-red-notes

networks:
  standard-red-notes:
    driver: bridge
  # Narrow trust bridge: n8n joins only this network; the dual-homed MCP bridge
  # is its sole path to Standard Red Notes. Never attach core data/services.
  workflows-mcp:
    driver: bridge
  # ---------------------------------------------------------------------------
  # Optional: attach the proxy-facing services to an EXISTING reverse-proxy
  # network (e.g. one your Traefik/nginx container already uses) so the proxy can
  # reach them by service name without publishing host ports. Uncomment this and
  # the `proxy` entries under the `app` and `server` services, then create the
  # network once: `docker network create proxy`.
  # proxy:
  #   external: true

volumes:
  mysql-data:
  mariadb-data:
  redis-data:
  server-logs:
  server-data:
  uploads:
  mcp-data:
  n8n-data:
