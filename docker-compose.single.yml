# =============================================================================
# Standard Red Notes — ALL-IN-ONE single container (local / small self-hosting).
#
# ONE container, ZERO external services: the home-server (single-process backend)
# with embedded sqlite + in-memory cache + in-process events, plus nginx serving
# the web app. No MySQL, no Redis, no SNS/SQS emulator.
#
#   docker compose -f docker-compose.single.yml up -d --build
#   open http://localhost:3001
#
# This is SEPARATE from the full multi-container docker-compose.yml (which stays
# the default for production-grade, horizontally-scalable deploys). See
# docs/DEPLOYMENT.md for when to use which.
#
# Secrets: with NONE supplied, the container generates strong per-instance secrets
# on first boot and PERSISTS them to the data volume (so sessions/encryption stay
# valid across restarts). Set them explicitly in .env for backup/restore control —
# copy .env.single.example to .env and fill in `openssl rand -hex 32` values.
# =============================================================================
name: standard-red-notes-single

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.single
    image: standard-red-notes/single:local
    restart: unless-stopped

    # Hardening: unprivileged user (uid 10001) inside; drop all caps + block
    # privilege escalation. Proper PID 1 to reap zombies + forward signals.
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    init: true
    mem_limit: ${SINGLE_MEM_LIMIT:-2g}
    pids_limit: 2048
    stop_grace_period: 1m
    tmpfs:
      - /tmp

    environment:
      # --- Secrets (optional) --------------------------------------------------
      # Leave unset to auto-generate + persist per-instance secrets on first boot.
      # Set them (openssl rand -hex 32; ENCRYPTION_SERVER_KEY must be 64 hex chars)
      # to control them for backup/restore or a reproducible deploy.
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      JWT_SECRET: ${JWT_SECRET:-}
      ENCRYPTION_SERVER_KEY: ${ENCRYPTION_SERVER_KEY:-}
      PSEUDO_KEY_PARAMS_KEY: ${PSEUDO_KEY_PARAMS_KEY:-}
      VALET_TOKEN_SECRET: ${VALET_TOKEN_SECRET:-}

      # --- Core -----------------------------------------------------------------
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Shared admin overlay for all named loggers in the home-server process.
      # A custom in-container path also needs a matching persistent mount.
      SERVER_SETTINGS_PATH: ${SERVER_SETTINGS_PATH:-/data/server-settings.json}
      # Current SRN clients can provide password (v2) and TOTP (v3) step-up proof.
      APPLICATION_VERSION_THRESHOLD_FOR_TOKEN_VERSION_2: ${APPLICATION_VERSION_THRESHOLD_FOR_TOKEN_VERSION_2:-0.0.0}
      APPLICATION_VERSION_THRESHOLD_FOR_TOKEN_VERSION_3: ${APPLICATION_VERSION_THRESHOLD_FOR_TOKEN_VERSION_3:-0.0.0}

      # Public URL the browser uses for file up/downloads, served same-origin via
      # nginx /files. Defaults to this container's published origin; override for a
      # real domain, e.g. https://notes.example.com/files.
      PUBLIC_FILES_SERVER_URL: ${PUBLIC_FILES_SERVER_URL:-http://localhost:${APP_PORT:-3001}/files}
      # No implicit localhost fallback: set this canonical origin explicitly
      # before enabling workflows or subscription pairing. The setup scripts
      # generate a correct local or production value.
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Optional discovery link to an independently deployed/authenticated n8n.
      # The single container never proxies n8n.
      WORKFLOWS_ENABLED: ${WORKFLOWS_ENABLED:-false}
      WORKFLOWS_PUBLIC_URL: ${WORKFLOWS_PUBLIC_URL:-}

      # Cookies. Defaults suit an http://localhost self-host. Behind HTTPS on a
      # domain, set COOKIE_DOMAIN and COOKIE_SECURE=true.
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Lax}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Trust a reverse proxy on loopback/private nets (see docker-compose.yml).
      TRUST_PROXY: ${TRUST_PROXY:-loopback, linklocal, uniquelocal}

      # Full-feature entitlement, same defaults as the multi-container stack.
      STANDARD_RED_FEATURES_MODE: ${STANDARD_RED_FEATURES_MODE:-included}
      STANDARD_RED_ENTITLEMENT_MODE: ${STANDARD_RED_ENTITLEMENT_MODE:-included}
      STANDARD_RED_FULL_FEATURE_DURATION_DAYS: ${STANDARD_RED_FULL_FEATURE_DURATION_DAYS:-36500}
      STANDARD_RED_FULL_FEATURE_FILE_UPLOAD_BYTES_LIMIT: ${STANDARD_RED_FULL_FEATURE_FILE_UPLOAD_BYTES_LIMIT:--1}

      # --- Web app runtime flags (templated into the served index.html) --------
      # Client-side PDF OCR (off by default). SYNC_SERVER unset => the app syncs to
      # its own origin (this container).
      OCR_ENABLED: ${OCR_ENABLED:-false}
      OCR_DEFAULT_LANGUAGE: ${OCR_DEFAULT_LANGUAGE:-eng}
      SYNC_SERVER: ${SYNC_SERVER:-}
      # Enables trusted X-Forwarded-Proto redirect/HSTS handling in the nginx
      # front door only when PUBLIC_URL is a validated canonical HTTPS origin.
      ENFORCE_HTTPS_FROM_PROXY: ${ENFORCE_HTTPS_FROM_PROXY:-false}
      APP_BIND_ADDRESS: ${APP_BIND_ADDRESS:-0.0.0.0}

      # --- Optional access gating / rate limiting ------------------------------
      CORS_ORIGIN_STRICT_MODE_ENABLED: ${CORS_ORIGIN_STRICT_MODE_ENABLED:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      SHARED_SERVER_ACCESS_KEY: ${SHARED_SERVER_ACCESS_KEY:-}
      SHARED_SERVER_ACCESS_KEY_MODE: ${SHARED_SERVER_ACCESS_KEY_MODE:-all}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_LOGIN_MAX: ${RATE_LIMIT_LOGIN_MAX:-10}
      RATE_LIMIT_REGISTRATION_MAX: ${RATE_LIMIT_REGISTRATION_MAX:-5}
      RATE_LIMIT_USER_WINDOW_SECONDS: ${RATE_LIMIT_USER_WINDOW_SECONDS:-60}
      RATE_LIMIT_USER_MAX: ${RATE_LIMIT_USER_MAX:-0}
      RATE_LIMIT_ADAPTIVE_ESCALATION: ${RATE_LIMIT_ADAPTIVE_ESCALATION:-false}
      REGISTRATION_SIGNUPS_PER_IP_MAX: ${REGISTRATION_SIGNUPS_PER_IP_MAX:-0}
      REGISTRATION_SIGNUPS_PER_IP_WINDOW_HOURS: ${REGISTRATION_SIGNUPS_PER_IP_WINDOW_HOURS:-24}
      REGISTRATION_SIGNUPS_PER_WEEK_MAX: ${REGISTRATION_SIGNUPS_PER_WEEK_MAX:-0}
      REGISTRATION_SIGNUPS_PER_DEVICE_MAX: ${REGISTRATION_SIGNUPS_PER_DEVICE_MAX:-0}
      REGISTRATION_SIGNUPS_PER_DEVICE_WINDOW_HOURS: ${REGISTRATION_SIGNUPS_PER_DEVICE_WINDOW_HOURS:-24}
      REGISTRATION_MAX_TOTAL_ACCOUNTS: ${REGISTRATION_MAX_TOTAL_ACCOUNTS:-0}
      REGISTRATION_INVITE_ONLY: ${REGISTRATION_INVITE_ONLY:-false}
      REGISTRATION_APPROVAL_REQUIRED: ${REGISTRATION_APPROVAL_REQUIRED:-false}
      HTTP_REQUEST_PAYLOAD_LIMIT_MEGABYTES: ${HTTP_REQUEST_PAYLOAD_LIMIT_MEGABYTES:-50}
      MAX_CHUNK_BYTES: ${MAX_CHUNK_BYTES:-100000000}
      MAX_ATTACHMENT_BYTE_SIZE: ${MAX_ATTACHMENT_BYTE_SIZE:-5368709120}

      # --- Optional outbound email and encrypted backup delivery --------------
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      EMAIL_BACKUPS_ENABLED: ${EMAIL_BACKUPS_ENABLED:-false}
      EMAIL_ATTACHMENT_MAX_BYTE_SIZE: ${EMAIL_ATTACHMENT_MAX_BYTE_SIZE:-10485760}

      # --- Optional AI assistant proxy -----------------------------------------
      ASSISTANT_ANTHROPIC_API_KEY: ${ASSISTANT_ANTHROPIC_API_KEY:-}
      ASSISTANT_OPENAI_API_KEY: ${ASSISTANT_OPENAI_API_KEY:-}
      ASSISTANT_OPENAI_BASE_URL: ${ASSISTANT_OPENAI_BASE_URL:-}
      ASSISTANT_OPENAI_MODEL: ${ASSISTANT_OPENAI_MODEL:-}
      ASSISTANT_OLLAMA_URL: ${ASSISTANT_OLLAMA_URL:-}
      ASSISTANT_DEFAULT_PROVIDER: ${ASSISTANT_DEFAULT_PROVIDER:-}
      ASSISTANT_DEFAULT_MODEL: ${ASSISTANT_DEFAULT_MODEL:-}
      ASSISTANT_DAILY_REQUEST_LIMIT: ${ASSISTANT_DAILY_REQUEST_LIMIT:-0}
      # Guided ChatGPT/Codex pairing. /data is the named persistent volume.
      # Leave the key empty to keep pairing disabled, or set 64 hex characters.
      ASSISTANT_SUBSCRIPTION_ENCRYPTION_KEY: ${ASSISTANT_SUBSCRIPTION_ENCRYPTION_KEY:-}
      ASSISTANT_SUBSCRIPTION_TOKEN_PATH: ${ASSISTANT_SUBSCRIPTION_TOKEN_PATH:-/data/assistant-subscription.json}
      ASSISTANT_CHATGPT_OAUTH_AUTHORIZE_URL: ${ASSISTANT_CHATGPT_OAUTH_AUTHORIZE_URL:-}
      ASSISTANT_CHATGPT_OAUTH_TOKEN_URL: ${ASSISTANT_CHATGPT_OAUTH_TOKEN_URL:-}
      ASSISTANT_CHATGPT_OAUTH_CLIENT_ID: ${ASSISTANT_CHATGPT_OAUTH_CLIENT_ID:-}
      ASSISTANT_CHATGPT_OAUTH_REDIRECT_URI: ${ASSISTANT_CHATGPT_OAUTH_REDIRECT_URI:-}
      ASSISTANT_CHATGPT_OAUTH_SCOPES: ${ASSISTANT_CHATGPT_OAUTH_SCOPES:-}
      ASSISTANT_CHATGPT_OAUTH_ACCOUNT_ID_CLAIM: ${ASSISTANT_CHATGPT_OAUTH_ACCOUNT_ID_CLAIM:-}
      ASSISTANT_OPENAI_AUTH_MODE: ${ASSISTANT_OPENAI_AUTH_MODE:-}
      ASSISTANT_OPENAI_SUBSCRIPTION_TOKEN: ${ASSISTANT_OPENAI_SUBSCRIPTION_TOKEN:-}
      ASSISTANT_OPENAI_SUBSCRIPTION_BASE_URL: ${ASSISTANT_OPENAI_SUBSCRIPTION_BASE_URL:-}
      ASSISTANT_OPENAI_ACCOUNT_ID: ${ASSISTANT_OPENAI_ACCOUNT_ID:-}
      ASSISTANT_OPENAI_BETA: ${ASSISTANT_OPENAI_BETA:-}
      ASSISTANT_OPENAI_EXTRA_HEADERS: ${ASSISTANT_OPENAI_EXTRA_HEADERS:-}

    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-3001}:8080"

    # Persistent state: sqlite DB, uploaded files, generated secrets, admin
    # overrides + feature JSON stores all live under /data.
    volumes:
      - single-data:/data

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthcheck/readiness >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 120s

volumes:
  single-data:
