# Standard Red Notes - keep a loopback host port while behind a proxy
#
# docker-compose.proxy.yml (and docker-compose.single.proxy.yml, for the
# all-in-one stack) removes the published port entirely, because the proxy
# reaches the app container over the shared network. Add this file after it
# when you also want a host port for local debugging:
#
#   ./deploy.sh --publish-ports      # on a deployment already behind a proxy
#
# The deploy script remembers that like the proxy network itself, until
# `./deploy.sh --no-publish-ports`. By hand it is one more file to repeat on
# every command:
#
#   SRN_PROXY_NETWORK=npm_default docker compose \
#     -f docker-compose.yml -f docker-compose.proxy.yml \
#     -f docker-compose.proxy-publish.yml up -d
#
# The bind address is hard-coded to 127.0.0.1 rather than ${APP_BIND_ADDRESS},
# which defaults to 0.0.0.0. Behind a proxy, a port on every host interface is
# a second front door that bypasses it - no TLS, no proxy auth, no access log -
# and `ENFORCE_HTTPS_FROM_PROXY=true` refuses to start with any non-loopback
# declared bind anyway.

services:
  app:
    ports: !override
      - "127.0.0.1:${APP_PORT:-3001}:8080"
