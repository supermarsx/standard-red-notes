; Standard Red Notes — supervisord for the ALL-IN-ONE single container.
;
; Runs exactly TWO processes: the home-server (the single-process backend that
; mounts auth + syncing + files + revisions + api-gateway on one port) and nginx
; (serves the SPA + reverse-proxies the API same-origin). Both log to the
; container's stdout/stderr so `docker logs` shows everything. Everything runs as
; the unprivileged `srn` user (set in the Dockerfile).

[supervisord]
nodaemon=true
; /tmp is the only guaranteed-writable path for the non-root srn user.
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[program:home-server]
directory=/opt/server/packages/home-server
command=/usr/local/bin/home-server-run.sh
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
