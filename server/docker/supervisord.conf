# The realtime WebSocket gateway is no longer a separate process: it runs
# IN-PROCESS inside the api-gateway (same :3000 listener). See
# packages/api-gateway/bin/server.ts -> attachWebSocketGateway. The
# websocket-gateway package is retained (standalone entry + library), but its
# supervisord program was removed.
