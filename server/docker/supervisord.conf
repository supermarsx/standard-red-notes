[supervisord]
nodaemon=true
logfile=/var/lib/server/logs/supervisord.log

# Standard Red Notes: internal control interface so `supervisorctl` can talk to
# this supervisord instance (drives the admin panel's Service lifecycle
# controls). Without these three sections supervisorctl fails with ".ini file
# does not include supervisorctl section" and cannot restart/stop/start
# programs. The socket lives in /tmp — world-writable, and this container runs as
# the unprivileged `srn` user (see server/Dockerfile), so /var/run is not
# writable while /tmp always is. chmod=0700 keeps the socket owner-only. This is
# a UNIX socket (no TCP port), so nothing is exposed on the network.
[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:syncing-server]
directory=/opt/server/packages/syncing-server
command=/opt/server/packages/syncing-server/supervisor/supervisor-server.sh
autostart=true
autorestart=true
stdout_logfile=/var/lib/server/logs/syncing-server.log
stderr_logfile=/var/lib/server/logs/syncing-server.err

[program:syncing-server-worker]
directory=/opt/server/packages/syncing-server
command=/opt/server/packages/syncing-server/supervisor/supervisor-worker.sh
autostart=true
autorestart=true
stdout_logfile=/var/lib/server/logs/syncing-server-worker.log
