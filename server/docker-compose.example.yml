services:
  server:
    image: standardnotes/server
    env_file: .env
    container_name: server_self_hosted
    restart: unless-stopped
    ports:
      - 3000:3000
      - 3125:3104
    volumes:
      - ./logs:/var/lib/server/logs
      - ./uploads:/opt/server/packages/files/dist/uploads
    networks:
      - standardnotes_self_hosted

  # SNS/SQS emulator (LocalStack replacement — no auth token, LocalStack
  # wire-compatible: port 4566, init/ready.d hooks; -compat variant ships
  # awslocal for the bootstrap script). Escape hatch: localstack/localstack:4.4.0.
  floci:
    image: floci/floci:1.5.33-compat
    container_name: floci_self_hosted
    expose:
      - 4566
    restart: unless-stopped
    volumes:
      - ./localstack_bootstrap.sh:/etc/localstack/init/ready.d/localstack_bootstrap.sh
    networks:
      standardnotes_self_hosted:
        # Old hostname kept answering for anything still pointing at `localstack`.
        aliases:
          - localstack

  db:
    image: mysql:9.7.1
    container_name: db_self_hosted
    environment:
      - MYSQL_DATABASE=standard_notes_db
      - MYSQL_USER=std_notes_user
      - MYSQL_ROOT_PASSWORD=changeme123
      - MYSQL_PASSWORD=changeme123
    expose:
      - 3306
    restart: unless-stopped
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./data/import:/docker-entrypoint-initdb.d
    networks:
      - standardnotes_self_hosted

  cache:
    image: redis:8.8.0-alpine
    container_name: cache_self_hosted
    volumes:
      - ./data/redis/:/data
    expose:
      - 6379
    restart: unless-stopped
    networks:
      - standardnotes_self_hosted

networks:
  standardnotes_self_hosted:
    name: standardnotes_self_hosted
