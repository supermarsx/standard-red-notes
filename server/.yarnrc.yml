approvedGitRepositories:
  - "**"

compressionLevel: mixed

enableGlobalCache: false

enableScripts: true

nodeLinker: pnp

npmMinimalAgeGate: 0

packageExtensions:
  # These meta-packages do not forward their children's required peers. Strict
  # PnP exposes the incomplete manifests, so bridge the real dependencies rather
  # than marking the peer requirements optional.
  "@commitlint/load@*":
    dependencies:
      "@types/node": "^26.1.1"
      typescript: "6.0.3"
  "@inversifyjs/core@*":
    dependencies:
      reflect-metadata: "~0.2.2"
  "@inversifyjs/framework-core@*":
    dependencies:
      reflect-metadata: "~0.2.2"
  "@inversifyjs/http-core@*":
    dependencies:
      reflect-metadata: "~0.2.2"
      winston: "^3.19.0"
  inversify-express-utils@*:
    peerDependencies:
      inversify: "*"
  inversify@*:
    dependencies:
      reflect-metadata: "~0.2.2"

yarnPath: .yarn/releases/yarn-4.17.1.cjs
