services:
  mock-event-publisher:
    image: standardnotes/mock-event-publisher
    ports:
    - 3124:3000
    environment:
      LOG_LEVEL: debug
      NODE_ENV: production
      VERSION: snjs-test
      SNS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:payments-local-topic
      SNS_ENDPOINT: http://floci:4566
      SNS_DISABLE_SSL: true
      SNS_SECRET_ACCESS_KEY: x
      SNS_ACCESS_KEY_ID: x
      SNS_AWS_REGION: us-east-1
    networks:
      - standardnotes_self_hosted

  server:
    build: .
    env_file: .github/ci.env
    environment:
      DB_TYPE: "${DB_TYPE}"
      CACHE_TYPE: "${CACHE_TYPE}"
      SERVICE_PROXY_TYPE: "${SERVICE_PROXY_TYPE}"
    container_name: server-ci
    ports:
      - 3123:3000
      - 3125:3104
    volumes:
      - ./logs:/var/lib/server/logs
    networks:
      - standardnotes_self_hosted

  # SNS/SQS emulator (LocalStack replacement — no auth token, LocalStack
  # wire-compatible: port 4566, init/ready.d hooks; -compat variant ships
  # awslocal for the bootstrap script). Escape hatch: localstack/localstack:4.4.0.
  floci:
    image: floci/floci:1.5.29-compat
    container_name: floci-ci
    expose:
      - 4566
    restart: unless-stopped
    volumes:
      - ./docker/localstack_bootstrap.sh:/etc/localstack/init/ready.d/localstack_bootstrap.sh
    networks:
      standardnotes_self_hosted:
        # Old hostname kept answering for anything still pointing at `localstack`.
        aliases:
          - localstack

  db:
    image: mysql:8
    container_name: db-ci
    env_file: .github/ci.env
    ports:
      - 3306
    restart: unless-stopped
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./data/import:/docker-entrypoint-initdb.d
    networks:
      - standardnotes_self_hosted

  cache:
    image: redis:6.0-alpine
    container_name: cache-ci
    volumes:
      - ./data/redis/:/data
    ports:
      - 6379
    restart: unless-stopped
    networks:
      - standardnotes_self_hosted

networks:
  standardnotes_self_hosted:
    name: standardnotes_self_hosted
