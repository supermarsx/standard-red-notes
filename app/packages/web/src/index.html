<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta content="IE=edge" http-equiv="X-UA-Compatible" />
    <meta content="viewport-fit=cover, width=device-width, initial-scale=1" name="viewport" />

    <link rel="canonical" href="https://standard-red-notes.local" />

    <link href="favicon/apple-touch-icon.png" rel="apple-touch-icon" sizes="180x180" />
    <link href="favicon/favicon-32x32.png" rel="icon" sizes="32x32" type="image/png" />
    <link href="favicon/favicon-16x16.png" rel="icon" sizes="16x16" type="image/png" />
    <link href="manifest.webmanifest" rel="manifest" />

    <link color="#be1f2d" href="favicon/safari-pinned-tab.svg" rel="mask-icon" />
    <meta name="theme-color" content="#16090f" />

    <meta content="Standard Red Notes" name="apple-mobile-web-app-title" />
    <meta content="Standard Red Notes" name="application-name" />
    <base href="/" />

    <title>Notes - Standard Red Notes</title>
    <meta
      name="description"
      content="Standard Red Notes is a self-hosted-first encrypted note-taking app for private notes, documents, and files."
    />

    <meta name="twitter:title" content="Standard Red Notes, an end-to-end encrypted notes app." />
    <meta
      name="twitter:description"
      content="Standard Red Notes is a self-hosted-first encrypted note-taking app for private notes, documents, and files."
    />
    <meta name="twitter:site" content="@standardrednotes" />
    <meta name="twitter:card" content="summary" />

    <meta name="og:title" content="Standard Red Notes, an end-to-end encrypted notes app." />
    <meta
      name="og:description"
      content="Standard Red Notes is a self-hosted-first encrypted note-taking app for private notes, documents, and files."
    />

    <!-- The production entrypoint computes the SHA-256 of this bootstrap after
         runtime templating and pins those exact served bytes in the response CSP. -->
    <script>
      // Standard Red Notes: default to SAME-ORIGIN so the browser never makes a
      // cross-origin request to the API. nginx (app/docker/nginx.conf) proxies
      // /v1, /v2, /auth, /subscription and /sockets to the backend on this same
      // origin. Cross-origin (app on :3001, API on :3000) is blocked by CORS +
      // browser "Local Network Access" gating and silently breaks sync.
      // Operators fronting the API on a different host can still override these
      // by editing this block (or via a reverse proxy that routes by path).
      window.defaultSyncServer = window.location.origin
      window.defaultFilesHost = window.location.origin
      window.enabledUnfinishedFeatures = false
      // Client-side PDF OCR (tesseract.js). Files are end-to-end encrypted, so OCR
      // runs in the browser, not on the server — these globals only gate whether
      // the client offers the "Extract text (OCR)" action and which language it
      // defaults to. Operators set them via OCR_ENABLED / OCR_DEFAULT_LANGUAGE
      // (see the app Docker entrypoint, which templates this file at startup).
      window.ocrEnabled = false
      window.ocrDefaultLanguage = 'eng'
      // Same-origin websocket (proxied by nginx to the websocket-gateway). Uses
      // wss:// when the page is served over https. See the /sockets proxy block.
      window.websocketUrl =
        (window.location.protocol === 'https:' ? 'wss://' : 'ws://') + window.location.host + '/sockets'
      // Serve Excalidraw fonts from our own origin (no CDN) — see webpack copy.
      window.EXCALIDRAW_ASSET_PATH = '/excalidraw/'
      window.purchaseUrl = 'about:blank'
      window.plansUrl = 'about:blank'
      window.dashboardUrl = 'about:blank'

      // The blank-page recovery that used to live here now ships in app.js
      // (javascripts/recoverFromBlankShell.ts). It was the only mechanism that
      // can evict a poisoned app shell from inside the page, and it lived in
      // the one script this app's CSP pins by sha256 — so a pin that no longer
      // authorises the served document blocked the recovery along with the
      // bootstrap. `<script src="./app.js">` needs no hash: `script-src 'self'`
      // authorises it whether or not the inline pin matches.
    </script>

    <!-- Stylesheet BEFORE the script: a render-blocking <script> placed after a
         stylesheet link waits for that CSS to finish loading before executing,
         so the app never measures layout (mounts React, sizes the panes) while
         the stylesheet is still loading. Loading the script first caused a
         forced layout / flash of unstyled content and a broken initial render. -->
    <link rel="stylesheet" media="all" href="./app.css" debug="false" />
    <script src="./app.js" debug="false"></script>
  </head>
  <body></body>
</html>
