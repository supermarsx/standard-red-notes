name: Web Deploy

concurrency:
  group: prod_environment
  cancel-in-progress: true

on:
  push:
    tags:
      - '*standardnotes/*web*'
      - '!*standardnotes/*web*beta*'
      - '!*standardnotes/*web*alpha*'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0
      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          registry-url: 'https://registry.npmjs.org'
          node-version-file: '.nvmrc'
      - name: Enable Corepack
        run: |
          npm install --global corepack@0.35.0
          corepack enable
          yarn --version
      - name: Cache Yarn
        uses: actions/cache@v6.1.0
        with:
          path: .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build
        run: yarn build:web
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Deploy static site to S3 bucket
        run: aws s3 sync packages/web/dist/ s3://app.standardnotes.com --delete
      - name: Invalidate CloudFront Cache
        uses: chetan/invalidate-cloudfront-action@v2.4.2
        env:
          DISTRIBUTION: ${{ secrets.WEBAPP_CLOUDFRONT_COM_DISTRIBUTION_ID }}
          PATHS: '/*'
          AWS_REGION: 'us-east-1'
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  notify_discord:
    needs: deploy

    runs-on: ubuntu-latest

    steps:
    - name: Run Discord Webhook
      uses: johnnyhuy/actions-discord-git-webhook@v1.0.4
      with:
        webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
