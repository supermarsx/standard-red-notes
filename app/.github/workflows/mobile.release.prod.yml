            absent:true)
              jq -e '.reconcilable == true and
                .reconciliationOperations == ["public-group-membership", "beta-review-submission"]' \
                "$RUNNER_TEMP/testflight-distribution-preflight.json"
              echo 'create_marker=false' >> "$GITHUB_OUTPUT"; echo 'mutation_required=true' >> "$GITHUB_OUTPUT" ;;
            pending:true)
              jq -e '.reconcilable == true and
                (.reconciliationOperations == ["public-group-membership"] or
                 .reconciliationOperations == ["beta-review-submission"])' \
                "$RUNNER_TEMP/testflight-distribution-preflight.json"
              echo 'create_marker=false' >> "$GITHUB_OUTPUT"; echo 'mutation_required=true' >> "$GITHUB_OUTPUT" ;;
            valid:true)
              jq -e '.reconcilable == true and .reconciliationOperations == []' \
                "$RUNNER_TEMP/testflight-distribution-preflight.json"
              echo 'create_marker=false' >> "$GITHUB_OUTPUT"; echo 'mutation_required=false' >> "$GITHUB_OUTPUT" ;;
            pending:false|valid:false) echo 'TestFlight stage exists without this recovery stage intent.' >&2; exit 1 ;;
            *) cat "$RUNNER_TEMP/testflight-distribution-preflight.json" >&2; exit 1 ;;
          esac

      - name: Persist TestFlight recovery distribution intent before external mutation
        if: steps.distribution_preflight.outputs.create_marker == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: srn-mobile-testflight-distribution-intent-${{ github.run_id }}
          path: ${{ runner.temp }}/testflight-distribution-intent/marker.json
          retention-days: 30
          if-no-files-found: error

      - name: Distribute once or reconcile exact TestFlight recovery state
        env:
          APPLE_APP_ID: ${{ secrets.APP_APPLE_ID }}
          APPSTORE_CONNECT_KEY: ${{ secrets.APPSTORE_CONNECT_KEY }}
          APPSTORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          APPSTORE_CONNECT_KEY_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ISSUER_ID }}
          RELEASE_VERSION: ${{ needs.context.outputs.version }}
          RECOVERY_REASON_SHA256: ${{ needs.context.outputs.recovery_reason_sha256 }}
          MUTATION_REQUIRED: ${{ steps.distribution_preflight.outputs.mutation_required }}
        run: |
          set -euo pipefail
          umask 077
          payload="$GITHUB_WORKSPACE/validated"; identity="$payload/standard-red-notes-mobile-identity.json"
          app_version="$(jq -r '.ios.appVersion' "$identity")"; build_number="$(jq -r '.ios.buildNumber' "$identity")"
          jq -e --arg run "$GITHUB_RUN_ID" --arg current_attempt "$GITHUB_RUN_ATTEMPT" --arg sha "$GITHUB_SHA" --arg reason "$RECOVERY_REASON_SHA256" \
            --arg version "$app_version" --arg build "$build_number" \
            '.stage == "testflight-external-distribution" and .runId == $run and
             (.originatingRunAttempt | test("^[1-9][0-9]*$")) and ((.originatingRunAttempt | tonumber) <= ($current_attempt | tonumber)) and
             .headSha == $sha and .recoveryReasonSha256 == $reason and .appVersion == $version and .buildNumber == $build' \
            "$RUNNER_TEMP/testflight-distribution-intent/marker.json"
          test -n "$APPSTORE_CONNECT_KEY"; printf '%s' "$APPSTORE_CONNECT_KEY" > ios/Authkey.p8
          trap 'rm -f -- ios/Authkey.p8' EXIT
          jq -e --arg version "$RELEASE_VERSION" --arg build "$build_number" \
            '.ios.bundleId == "com.standardnotes.standardnotes" and .ios.appVersion == $version and .ios.buildNumber == $build' "$identity"
          if [ "$MUTATION_REQUIRED" = true ]; then
            (cd "$payload" && shasum -a 256 -c SHA256SUMS.txt)
            APP_VERSION="$app_version" BUILD_NUMBER="$build_number" bundle exec fastlane ios distribute_prod
          else
            (cd "$payload" && shasum -a 256 -c SHA256SUMS.txt)
          fi
          APP_VERSION="$app_version" BUILD_NUMBER="$build_number" PROVIDER_WAIT_SECONDS=1800 \
            PROVIDER_EVIDENCE_PATH="$RUNNER_TEMP/testflight-distribution-final.json" bundle exec fastlane ios inspect_distribution
          jq -e '.status == "valid" and .valid == true and .matchingPublicGroupCount == 1 and
            .matchingBuildMembershipCount == 1 and .matchingBetaReviewSubmissionCount == 1 and
            .reconcilable == true and .reconciliationOperations == [] and
            (.betaReviewState == "WAITING_FOR_REVIEW" or .betaReviewState == "IN_REVIEW" or .betaReviewState == "APPROVED")' \
            "$RUNNER_TEMP/testflight-distribution-final.json"

