          fingerprint="$(tr -d '[:space:]' < "$payload/srn-mobile.fingerprint")"
          jq -e --arg run "$GITHUB_RUN_ID" --arg current_attempt "$GITHUB_RUN_ATTEMPT" --arg sha "$GITHUB_SHA" --arg reason "$RECOVERY_REASON_SHA256" \
            --arg fp "$fingerprint" --arg artifact_sha "$ipa_sha" --arg artifact_md5 "$ipa_md5" --argjson artifact_size "$ipa_size" \
            '.runId == $run and (.originatingRunAttempt | test("^[1-9][0-9]*$")) and
             ((.originatingRunAttempt | tonumber) <= ($current_attempt | tonumber)) and
             .headSha == $sha and .recoveryReasonSha256 == $reason and .fingerprint == $fp and
             .artifact.sha256 == $artifact_sha and .artifact.md5 == $artifact_md5 and .artifact.size == $artifact_size' \
            "$RUNNER_TEMP/app-store-intent/marker.json"
          test -n "$APPSTORE_CONNECT_KEY"; printf '%s' "$APPSTORE_CONNECT_KEY" > ios/Authkey.p8
          trap 'rm -f -- ios/Authkey.p8' EXIT
          IOS_IPA_PATH="$ipa" APP_VERSION="$app_version" BUILD_NUMBER="$build_number" \
          PROVIDER_EVIDENCE_PATH="$RUNNER_TEMP/app-store-submit.json" PROVIDER_WAIT_SECONDS=1800 bundle exec fastlane ios inspect_upload
          jq -e '.status == "valid" and .valid == true' "$RUNNER_TEMP/app-store-submit.json"
          build_id="$(jq -r '.buildId' "$RUNNER_TEMP/app-store-submit.json")"; test -n "$build_id"; test "$build_id" != null
          distribution_name="srn-mobile-testflight-distribution-intent-${GITHUB_RUN_ID}"
          distribution_artifacts="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=${distribution_name}&per_page=100")"
          [ "$(jq '[.artifacts[] | select(.expired == false)] | length' <<< "$distribution_artifacts")" -eq 1 ]
          distribution_id="$(jq -r '[.artifacts[] | select(.expired == false)][0].id' <<< "$distribution_artifacts")"
          distribution_dir="$RUNNER_TEMP/testflight-distribution-intent"; mkdir -p "$distribution_dir"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${distribution_id}/zip" > "$RUNNER_TEMP/testflight-distribution-intent.zip"
          unzip -q "$RUNNER_TEMP/testflight-distribution-intent.zip" -d "$distribution_dir"
          distribution_marker="$distribution_dir/marker.json"
          upload_marker="$RUNNER_TEMP/app-store-intent/marker.json"
          manifest_sha="$(shasum -a 256 "$payload/SHA256SUMS.txt" | awk '{print $1}')"; upload_intent_sha="$(shasum -a 256 "$upload_marker" | awk '{print $1}')"
          jq -e --arg run "$GITHUB_RUN_ID" --arg current_attempt "$GITHUB_RUN_ATTEMPT" --arg sha "$GITHUB_SHA" --arg reason "$RECOVERY_REASON_SHA256" \
            --arg version "$app_version" --arg build "$build_number" --arg build_id "$build_id" --arg fp "$fingerprint" \
            --arg upload_sha "$upload_intent_sha" --arg artifact_sha "$ipa_sha" --arg artifact_md5 "$ipa_md5" \
            --argjson artifact_size "$ipa_size" --arg manifest_sha "$manifest_sha" \
            '.stage == "testflight-external-distribution" and .runId == $run and
             (.originatingRunAttempt | test("^[1-9][0-9]*$")) and ((.originatingRunAttempt | tonumber) <= ($current_attempt | tonumber)) and
             .headSha == $sha and .recoveryReasonSha256 == $reason and .appVersion == $version and .buildNumber == $build and
             .buildId == $build_id and .fingerprint == $fp and .uploadIntentSha256 == $upload_sha and
             .checksumManifestSha256 == $manifest_sha and .artifact.sha256 == $artifact_sha and
             .artifact.md5 == $artifact_md5 and .artifact.size == $artifact_size' "$distribution_marker"
          APP_VERSION="$app_version" BUILD_NUMBER="$build_number" \
            PROVIDER_EVIDENCE_PATH="$RUNNER_TEMP/testflight-before-submission.json" bundle exec fastlane ios inspect_distribution
          jq -e '.status == "valid" and .valid == true' "$RUNNER_TEMP/testflight-before-submission.json"
          distribution_intent_sha="$(shasum -a 256 "$distribution_marker" | awk '{print $1}')"
          stage_name="srn-mobile-app-store-submission-intent-${GITHUB_RUN_ID}"
          stage_dir="$RUNNER_TEMP/app-store-submission-intent"; stage_marker="$stage_dir/marker.json"
          stage_artifacts="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=${stage_name}&per_page=100")"
          stage_count="$(jq '[.artifacts[] | select(.expired == false)] | length' <<< "$stage_artifacts")"; [ "$stage_count" -le 1 ]
          stage_present=false
          if [ "$stage_count" -eq 1 ]; then
            stage_present=true; mkdir -p "$stage_dir"
            stage_id="$(jq -r '[.artifacts[] | select(.expired == false)][0].id' <<< "$stage_artifacts")"
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${stage_id}/zip" > "$RUNNER_TEMP/app-store-submission-intent.zip"
            unzip -q "$RUNNER_TEMP/app-store-submission-intent.zip" -d "$stage_dir"
            jq -e --arg run "$GITHUB_RUN_ID" --arg current_attempt "$GITHUB_RUN_ATTEMPT" --arg sha "$GITHUB_SHA" --arg reason "$RECOVERY_REASON_SHA256" \
              --arg version "$app_version" --arg build "$build_number" --arg build_id "$build_id" --arg fp "$fingerprint" \
              --arg distribution_sha "$distribution_intent_sha" --arg artifact_sha "$ipa_sha" --arg artifact_md5 "$ipa_md5" \
              --argjson artifact_size "$ipa_size" --arg manifest_sha "$manifest_sha" \
              '.schema == 1 and .stage == "app-store-review-submission" and .runId == $run and
               (.originatingRunAttempt | test("^[1-9][0-9]*$")) and ((.originatingRunAttempt | tonumber) <= ($current_attempt | tonumber)) and
               .headSha == $sha and .recoveryReasonSha256 == $reason and .appVersion == $version and .buildNumber == $build and
               .buildId == $build_id and .fingerprint == $fp and .distributionIntentSha256 == $distribution_sha and
               .checksumManifestSha256 == $manifest_sha and .artifact.sha256 == $artifact_sha and
               .artifact.md5 == $artifact_md5 and .artifact.size == $artifact_size' "$stage_marker"
          fi
          APP_VERSION="$app_version" BUILD_NUMBER="$build_number" \
            PROVIDER_EVIDENCE_PATH="$RUNNER_TEMP/app-store-submission-preflight.json" bundle exec fastlane ios inspect_submission
          stage_status="$(jq -r '.status' "$RUNNER_TEMP/app-store-submission-preflight.json")"
          case "$stage_status:$stage_present" in
            absent:false|ready:false)
              mkdir -p "$stage_dir"
              jq -n --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" --arg sha "$GITHUB_SHA" --arg reason "$RECOVERY_REASON_SHA256" \
                --arg version "$app_version" --arg build "$build_number" --arg build_id "$build_id" --arg fp "$fingerprint" \
                --arg distribution_sha "$distribution_intent_sha" --arg artifact_sha "$ipa_sha" --arg artifact_md5 "$ipa_md5" \
                --argjson artifact_size "$ipa_size" --arg manifest_sha "$manifest_sha" \
                '{schema: 1, provider: "app-store-connect", stage: "app-store-review-submission", runId: $run,
                  originatingRunAttempt: $attempt, headSha: $sha, recoveryReasonSha256: $reason,
                  bundleId: "com.standardnotes.standardnotes", appVersion: $version, buildNumber: $build,
                  buildId: $build_id, fingerprint: $fp, distributionIntentSha256: $distribution_sha,
                  checksumManifestSha256: $manifest_sha, artifact: {sha256: $artifact_sha, md5: $artifact_md5, size: $artifact_size}}' > "$stage_marker"
              echo 'create_marker=true' >> "$GITHUB_OUTPUT"; echo 'mutation_required=true' >> "$GITHUB_OUTPUT" ;;
            absent:true|ready:true) echo 'create_marker=false' >> "$GITHUB_OUTPUT"; echo 'mutation_required=true' >> "$GITHUB_OUTPUT" ;;
            valid:true) echo 'create_marker=false' >> "$GITHUB_OUTPUT"; echo 'mutation_required=false' >> "$GITHUB_OUTPUT" ;;
            valid:false) echo 'App Store review stage exists without this recovery stage intent.' >&2; exit 1 ;;
            *) cat "$RUNNER_TEMP/app-store-submission-preflight.json" >&2; exit 1 ;;
          esac

      - name: Persist App Store recovery submission intent before external mutation
        if: steps.submission_preflight.outputs.create_marker == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: srn-mobile-app-store-submission-intent-${{ github.run_id }}
          path: ${{ runner.temp }}/app-store-submission-intent/marker.json
          retention-days: 30
          if-no-files-found: error

      - name: Submit once or reconcile exact App Store recovery state
        env:
          APPLE_APP_ID: ${{ secrets.APP_APPLE_ID }}
          APPSTORE_CONNECT_KEY: ${{ secrets.APPSTORE_CONNECT_KEY }}
          APPSTORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          APPSTORE_CONNECT_KEY_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ISSUER_ID }}
          RELEASE_VERSION: ${{ needs.context.outputs.version }}
          RECOVERY_REASON_SHA256: ${{ needs.context.outputs.recovery_reason_sha256 }}
          MUTATION_REQUIRED: ${{ steps.submission_preflight.outputs.mutation_required }}
        run: |
          set -euo pipefail
          umask 077
          payload="$GITHUB_WORKSPACE/validated"; identity="$payload/standard-red-notes-mobile-identity.json"
          app_version="$(jq -r '.ios.appVersion' "$identity")"; build_number="$(jq -r '.ios.buildNumber' "$identity")"
          jq -e --arg run "$GITHUB_RUN_ID" --arg current_attempt "$GITHUB_RUN_ATTEMPT" --arg sha "$GITHUB_SHA" --arg reason "$RECOVERY_REASON_SHA256" \
            --arg version "$app_version" --arg build "$build_number" \
            '.stage == "app-store-review-submission" and .runId == $run and
             (.originatingRunAttempt | test("^[1-9][0-9]*$")) and ((.originatingRunAttempt | tonumber) <= ($current_attempt | tonumber)) and
             .headSha == $sha and .recoveryReasonSha256 == $reason and .appVersion == $version and .buildNumber == $build' \
            "$RUNNER_TEMP/app-store-submission-intent/marker.json"
          test -n "$APPSTORE_CONNECT_KEY"; printf '%s' "$APPSTORE_CONNECT_KEY" > ios/Authkey.p8
          trap 'rm -f -- ios/Authkey.p8' EXIT
          jq -e --arg version "$RELEASE_VERSION" --arg build "$build_number" \
            '.ios.bundleId == "com.standardnotes.standardnotes" and .ios.appVersion == $version and .ios.buildNumber == $build' "$identity"
          if [ "$MUTATION_REQUIRED" = true ]; then
            (cd "$payload" && shasum -a 256 -c SHA256SUMS.txt)
            APP_VERSION="$app_version" BUILD_NUMBER="$build_number" bundle exec fastlane ios submit_prod
          else
            (cd "$payload" && shasum -a 256 -c SHA256SUMS.txt)
          fi
          APP_VERSION="$app_version" BUILD_NUMBER="$build_number" PROVIDER_WAIT_SECONDS=1800 \
            PROVIDER_EVIDENCE_PATH="$RUNNER_TEMP/app-store-submission-final.json" bundle exec fastlane ios inspect_submission
          jq -e '.status == "valid" and .valid == true and .matchingAppStoreVersionCount == 1 and .remoteBuildId == .buildId' \
            "$RUNNER_TEMP/app-store-submission-final.json"

  release:
    name: Publish or verify the exact GitHub recovery prerelease
    needs: [context, validated, publish_android, submit_ios]
    runs-on: ubuntu-latest
    environment: mobile-production
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: srn-mobile-validated-release
          path: validated

      - name: Adopt only the same-run draft, attest exact assets, and publish last
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.context.outputs.version }}
          RELEASE_TAG: ${{ needs.context.outputs.tag }}
          RECOVERY_REASON_SHA256: ${{ needs.context.outputs.recovery_reason_sha256 }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/validated"
          test -s "standard-red-notes-android-universal-${VERSION}.apk"
          test -s "standard-red-notes-android-${VERSION}.aab"
          test -s "standard-red-notes-ios-arm64-${VERSION}.ipa"
          test -s standard-red-notes-mobile-identity.json
          test -s srn-mobile.fingerprint
          test -s SHA256SUMS.txt
          mapfile -d '' release_files < <(find . -maxdepth 1 -type f -print0 | sort -z)
          test "${#release_files[@]}" -eq 6
          sha256sum --check SHA256SUMS.txt
          fingerprint="$(tr -d '[:space:]' < srn-mobile.fingerprint)"
          [[ "$fingerprint" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RECOVERY_REASON_SHA256" =~ ^[0-9a-f]{64}$ ]]
          jq -e --arg version "$VERSION" \
            '.schema == 1 and .android.applicationId == "com.standardnotes" and .android.versionName == $version and
             .ios.bundleId == "com.standardnotes.standardnotes" and .ios.teamId == "HKF9BXSN95" and
             .ios.extensionBundleId == "com.standardnotes.standardnotes.Share-To-SN" and
             .ios.appVersion == $version and .ios.extensionAppVersion == $version and
             .ios.appGroup == "group.com.standardnotes.standardnotes" and
             (.ios.usesNonExemptEncryption | type) == "boolean"' standard-red-notes-mobile-identity.json

          : > "$RUNNER_TEMP/mobile-expected-assets.jsonl"
          for file in "${release_files[@]}"; do
            name="${file#./}"; size="$(stat -c '%s' "$file")"; digest="$(sha256sum "$file" | cut -d' ' -f1)"
            jq -nc --arg name "$name" --arg digest "sha256:$digest" --argjson size "$size" \
              '{name: $name, size: $size, digest: $digest}' >> "$RUNNER_TEMP/mobile-expected-assets.jsonl"
          done
          jq -s 'sort_by(.name)' "$RUNNER_TEMP/mobile-expected-assets.jsonl" > "$RUNNER_TEMP/mobile-expected-assets.json"
          asset_manifest_sha="$(jq -cS . "$RUNNER_TEMP/mobile-expected-assets.json" | sha256sum | cut -d' ' -f1)"
          intent_marker="<!-- srn-mobile-recovery-release-intent:run=${GITHUB_RUN_ID};sha=${GITHUB_SHA};version=${VERSION};reason=${RECOVERY_REASON_SHA256}; -->"
          fingerprint_marker="<!-- srn-mobile-release-fingerprint-sha256:${fingerprint} -->"
          asset_marker="<!-- srn-mobile-release-assets-sha256:${asset_manifest_sha} -->"
          api_tag="$(jq -rn --arg value "$RELEASE_TAG" '$value | @uri')"; release_json="$RUNNER_TEMP/mobile-github-release.json"
          query_release() {
            curl --silent --show-error --output "$release_json" --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${api_tag}"
          }
          verify_release_identity() {
            jq -e --arg tag "$RELEASE_TAG" --arg sha "$GITHUB_SHA" --arg marker "$intent_marker" \
              '.tag_name == $tag and .target_commitish == $sha and (.body // "" | contains($marker))' "$release_json" >/dev/null
          }
          verify_remote_assets() {
            jq -e --slurpfile expected "$RUNNER_TEMP/mobile-expected-assets.json" \
              '([.assets[] | {name, size, digest}] | sort_by(.name)) == $expected[0]' "$release_json" >/dev/null
          }
          verify_not_latest() {
            latest_status="$(curl --silent --show-error --output "$RUNNER_TEMP/mobile-latest-release.json" --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest")"
            case "$latest_status" in
              200) jq -e --arg tag "$RELEASE_TAG" '.tag_name != $tag' "$RUNNER_TEMP/mobile-latest-release.json" >/dev/null ;;
              404) ;;
              *) cat "$RUNNER_TEMP/mobile-latest-release.json" >&2; return 1 ;;
            esac
          }
          status="$(query_release)"
          [ "$status" = 200 ] || { cat "$release_json" >&2; echo 'The pre-mutation recovery draft is missing.' >&2; exit 1; }
          verify_release_identity || { echo 'Existing recovery release is not owned by this exact run and audit intent.' >&2; exit 1; }
          if jq -e '.draft == false' "$release_json" >/dev/null; then
            jq -e --arg marker "$asset_marker" --arg fingerprint_marker "$fingerprint_marker" \
              '.prerelease == true and (.body // "" | contains($marker)) and (.body // "" | contains($fingerprint_marker))' "$release_json" >/dev/null
            verify_remote_assets
            verify_not_latest
            exit 0
          fi
          jq -r '.assets[] | [.id, .name] | @tsv' "$release_json" | while IFS=$'\t' read -r asset_id asset_name; do
            if ! jq -e --arg name "$asset_name" 'any(.[]; .name == $name)' "$RUNNER_TEMP/mobile-expected-assets.json" >/dev/null; then
              gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            fi
          done
          sha256sum --check SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" "${release_files[@]}" --clobber
          status="$(query_release)"; [ "$status" = 200 ]; verify_release_identity; verify_remote_assets
          current_body="$(jq -r '.body // ""' "$release_json" | sed '/<!-- srn-mobile-release-assets-sha256:/d;/<!-- srn-mobile-release-fingerprint-sha256:/d')"
          final_body="${current_body}"$'\n'"${fingerprint_marker}"$'\n'"${asset_marker}"; release_id="$(jq -r '.id' "$release_json")"
          verify_remote_assets
          gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/releases/${release_id}" -F draft=false -F prerelease=true \
            -f make_latest=false -f name="Mobile $VERSION" -f body="$final_body" > "$RUNNER_TEMP/mobile-published-release.json"
          mv "$RUNNER_TEMP/mobile-published-release.json" "$release_json"
          jq -e --arg marker "$asset_marker" --arg fingerprint_marker "$fingerprint_marker" \
            '.draft == false and .prerelease == true and (.body // "" | contains($marker)) and (.body // "" | contains($fingerprint_marker))' "$release_json" >/dev/null
          verify_release_identity
          verify_remote_assets
          verify_not_latest
