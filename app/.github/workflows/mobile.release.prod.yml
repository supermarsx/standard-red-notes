name: Mobile Release Production

on:
  push:
    tags:
      - '*standardnotes/web*'
  workflow_dispatch:

jobs:
  android:
    defaults:
      run:
        working-directory: packages/mobile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0
      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          registry-url: 'https://registry.npmjs.org'
          node-version-file: '.nvmrc'
      - name: Enable Corepack
        run: |
          npm install --global corepack@0.35.0
          corepack enable
          yarn --version
      - name: Cache Yarn
        uses: actions/cache@v6.1.0
        with:
          path: .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: Setup Java version
        uses: actions/setup-java@v5.5.0
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Export version from package.json
        run:
          echo "PACKAGE_VERSION=$(grep '"version"' ../web/package.json | cut -d '"' -f 4 | cut -d "-" -f 1)" >> $GITHUB_ENV
      - name: Setup react-native kernel and increase watchers
        run: echo fs.inotify.max_user_watches=524288 | sudo tee -a /etc/sysctl.conf && sudo sysctl -p
      - name: Decode Production Android keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE }}" > keystore.keystore.asc
          gpg -d --passphrase "${{ secrets.KEYSTORE_PASSPHRASE }}" --batch keystore.keystore.asc > android/app/keystore.keystore
      - name: Install dependencies
        run: yarn install --immutable
      - run: yarn build:mobile
      - name: Ruby Setup for Fastlane
        uses: ruby/setup-ruby@v1.318.0
        with:
          working-directory: 'packages/mobile'
      - name: fastlane
        uses: maierj/fastlane-action@v3.2.0
        env:
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}
          BUILD_NUMBER: ${{ github.run_number }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GOOGLE_PLAY_JSON_KEY_DATA: ${{ secrets.GOOGLE_PLAY_JSON_KEY_DATA }}
        with:
          lane: 'android prod'
          subdirectory: 'packages/mobile'

      - name: Verify universal Android release architectures
        run: |
          set -euo pipefail
          apk='android/app/build/outputs/apk/prod/release/app-prod-release.apk'
          aab='android/app/build/outputs/bundle/prodRelease/app-prod-release.aab'
          test -s "$apk"
          test -s "$aab"

          configured="$(sed -n 's/^reactNativeArchitectures=//p' android/gradle.properties)"
          unzip -Z1 "$apk" > "$RUNNER_TEMP/android-apk-entries.txt"
          unzip -Z1 "$aab" > "$RUNNER_TEMP/android-aab-entries.txt"

          for arch in arm64-v8a x86_64; do
            case ",$configured," in
              *",$arch,"*) ;;
              *) echo "reactNativeArchitectures is missing $arch" >&2; exit 1 ;;
            esac
            grep -Eq "^lib/$arch/.+\\.so$" "$RUNNER_TEMP/android-apk-entries.txt" || {
              echo "Universal APK is missing native $arch payloads" >&2
              exit 1
            }
            grep -Eq "^base/lib/$arch/.+\\.so$" "$RUNNER_TEMP/android-aab-entries.txt" || {
              echo "App Bundle is missing native $arch payloads" >&2
              exit 1
            }
          done

      - name: Generate Release Notes
        uses: ./actions/release-notes
        with:
          package: mobile
        id: release-notes
        continue-on-error: true

      - name: Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          token: ${{ secrets.CI_PAT_TOKEN }}
          tag_name: "@standardnotes/mobile@${{ env.PACKAGE_VERSION }}"
          name: "Mobile ${{ env.PACKAGE_VERSION }}"
          body: ${{ steps.release-notes.outputs.result }}
          prerelease: true
          draft: false
          files: |
            packages/mobile/android/app/build/outputs/bundle/prodRelease/app-prod-release.aab
            packages/mobile/android/app/build/outputs/apk/prod/release/app-prod-release.apk

  ios:
    defaults:
      run:
        working-directory: packages/mobile
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0
      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          registry-url: 'https://registry.npmjs.org'
          node-version-file: '.nvmrc'
      - name: Enable Corepack
        run: |
          npm install --global corepack@0.35.0
          corepack enable
          yarn --version
      - name: Cache Yarn
        uses: actions/cache@v6.1.0
        with:
          path: .yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: "26"
      - name: Export version from package.json
        run:
          echo "PACKAGE_VERSION=$(grep '"version"' ../web/package.json | cut -d '"' -f 4 | cut -d "-" -f 1)" >> $GITHUB_ENV
      - name: Ruby Setup for Fastlane
        uses: ruby/setup-ruby@v1.318.0
        with:
          working-directory: 'packages/mobile'
      - name: Install dependencies
        run: yarn install --immutable 
      - name: Bundle install
        run: bundle install
      - name: Install pods
        run: yarn install:pods
      - run: yarn build:mobile
      - name: Set ssh connection to Github
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Export Apple AppStore Connect API key
        run: echo "${{ secrets.APPSTORE_CONNECT_KEY }}" > ios/Authkey.p8
      - name: Setup fastlane
        uses: maierj/fastlane-action@v3.2.0
        env:
          FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        with:
          lane: 'ios setup'
          subdirectory: 'packages/mobile'
      - name: fastlane
        uses: maierj/fastlane-action@v3.2.0
        env:
          APPLE_APP_ID: ${{ secrets.APP_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPSTORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          APPSTORE_CONNECT_KEY_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ISSUER_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_PASSWORD: ${{ secrets.FASTLANE_PASSWORD }}
          FASTLANE_SESSION: ${{ secrets.FASTLANE_SESSION }}
          FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
          MATCH_CERTIFICATES_URL: ${{ secrets.MATCH_CERTIFICATES_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}
        with:
          lane: 'ios prod'
          subdirectory: 'packages/mobile'

      - name: Verify iOS device arm64 artifact
        run: |
          set -euo pipefail
          ipa="$(find . -type f -name 'StandardNotes.ipa' -print -quit)"
          test -n "$ipa"
          test -s "$ipa"

          extract_dir="$RUNNER_TEMP/standard-notes-ios-release"
          rm -rf "$extract_dir"
          unzip -q "$ipa" -d "$extract_dir"
          app_bundle="$(find "$extract_dir/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app_bundle"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_bundle/Info.plist")"
          archs="$(lipo -archs "$app_bundle/$executable")"
          echo "iOS device architectures: $archs"

          case " $archs " in
            *' arm64 '*) ;;
            *) echo 'iOS device artifact is missing arm64' >&2; exit 1 ;;
          esac
          case " $archs " in
            *' x86_64 '*|*' i386 '*) echo 'Simulator architecture found in iOS device artifact' >&2; exit 1 ;;
          esac

