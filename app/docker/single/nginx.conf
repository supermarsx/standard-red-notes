# Standard Red Notes — SINGLE-CONTAINER server block.
#
# Derived from app/docker/nginx.conf (the multi-container front door). The ONLY
# functional difference: every backend upstream points at the home-server running
# IN THE SAME CONTAINER on 127.0.0.1:3000 instead of the separate `server`
# containers (server:3000 / server:3104). The home-server is a SINGLE Node
# process that mounts ALL backend routes (auth, syncing, files, revisions,
# api-gateway) on one port, so /v1, /auth, /files and /sockets all resolve to
# 127.0.0.1:3000 here. No docker DNS `resolver` is needed for a loopback literal.
#
# The `location /` Content-Security-Policy block (and its `__CSP_INLINE_SCRIPT_HASH__`
# placeholder) is kept BYTE-FOR-BYTE identical to app/docker/nginx.conf so the
# reused app/docker/docker-entrypoint.sh self-heals the inline-script hash exactly
# the same way.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Rewritten by the shared runtime entrypoint only after explicit trusted-proxy
# opt-in plus strict canonical HTTPS PUBLIC_URL validation. Default is untrusted.
map "disabled" $srn_proxy_https_mode { default disabled; }
map "https://invalid.invalid" $srn_https_public_origin { default "https://invalid.invalid"; }

map "$srn_proxy_https_mode:$http_x_forwarded_proto" $srn_proxy_transport {
  default             direct;
  ~^enabled:http$     forwarded_http;
  ~^enabled:https$    forwarded_https;
}
map $srn_proxy_transport $srn_forwarded_proto {
  default             $scheme;
  forwarded_http      http;
  forwarded_https     https;
}
map "$srn_proxy_transport:$uri" $srn_redirect_to_https {
  default                              0;
  ~^forwarded_http:/health$            0;
  ~^forwarded_http:/healthcheck(/|$)   0;
  ~^forwarded_http:                    1;
}
map $srn_proxy_transport $srn_hsts_header {
  default             "";
  forwarded_https     "max-age=31536000";
}

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  add_header Strict-Transport-Security $srn_hsts_header always;

  if ($srn_redirect_to_https) {
    return 308 $srn_https_public_origin$request_uri;
  }

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    add_header Strict-Transport-Security $srn_hsts_header always;
    return 200 "ok\n";
  }

  # Realtime websocket gateway + its /sockets/tokens HTTP route. In-process on
  # the home-server's :3000 listener (same as the multi-container api-gateway).
  location /sockets {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $srn_forwarded_proto;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }

  # HTTP API: sync, auth, subscriptions, files metadata, healthcheck.
  # The OAuth callback carries a one-time code and state in its query string.
  # Preserve the normal API proxy behavior but suppress the built-in nginx
  # access log for this exact path. Outer proxies/CDNs/WAFs need their own rule.
  location = /v1/assistant/subscription/callback {
    access_log off;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $srn_forwarded_proto;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
  }

  location ~ ^/(v1|v2|auth|subscription|healthcheck)(/|$) {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $srn_forwarded_proto;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
  }

  # Files service (valet-token authed uploads/downloads), SAME-ORIGIN under
  # /files/. The home-server advertises FILES_SERVER_URL (default
  # http://localhost:<port>/files) to clients; requests arrive here as
  # /files/v1/files/... . The home-server serves the bare /v1/files... routes on
  # the SAME :3000 listener (unlike the multi-container split where files runs on
  # :3104), so strip the /files prefix and forward to :3000. Chunks are large and
  # downloads stream Content-Range bodies: no body cap, no buffering, long timeouts.
  location /files/ {
    rewrite ^/files(/.*)$ $1 break;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $srn_forwarded_proto;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Third-party editor/component assets — permissive CORS for sandboxed iframes.
  location /components/ {
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Range" always;
    add_header Strict-Transport-Security $srn_hsts_header always;

    location ~* \.ttf$  { add_header Access-Control-Allow-Origin "*" always; add_header Strict-Transport-Security $srn_hsts_header always; default_type font/ttf; }
    location ~* \.otf$  { add_header Access-Control-Allow-Origin "*" always; add_header Strict-Transport-Security $srn_hsts_header always; default_type font/otf; }

    try_files $uri $uri/ =404;
  }

  location / {
    # Content-Security-Policy for the SPA shell. IDENTICAL to app/docker/nginx.conf:
    # the `__CSP_INLINE_SCRIPT_HASH__` placeholder is replaced at container start by
    # app/docker/docker-entrypoint.sh (reused here) with the sha256 of the ACTUAL
    # served inline bootstrap <script>, AFTER any OCR/SYNC_SERVER templating — so the
    # served CSP hash always matches the served script (self-healing). See that
    # script and app/docker/nginx.conf for the full rationale.
    # script-src-attr: permit the single runtime-injected inline event-handler
    # attribute (hash below) and nothing else. Byte-identical to app/docker/nginx.conf
    # so the reused docker-entrypoint.sh self-heal (which targets only the parent
    # script-src after its unique self/wasm prefix) is unaffected. See that file
    # for the full rationale.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-__CSP_INLINE_SCRIPT_HASH__'; script-src-attr 'self' 'unsafe-hashes' 'sha256-nIvOnptGOkcUoTPVOYWoDnWbMyGMgUTK8pMzXf87azw='; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob: data:; connect-src 'self' https: http://localhost:* http://127.0.0.1:* ws: wss:; frame-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Strict-Transport-Security $srn_hsts_header always;

    try_files $uri $uri/ /index.html;
  }

  # Dedicated opaque-origin runner for user-authored sandbox code. Keep its
  # narrowly scoped CSP byte-identical to app/docker/nginx.conf.
  location = /sandbox.html {
    add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-eval' 'sha256-lNmpADSkK6aNI3Zb1YLDMZfnTJywc53UKGRf0B3evz4='; worker-src blob:; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; media-src data: blob:; connect-src 'none'; frame-src 'none'; frame-ancestors 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; sandbox allow-scripts" always;
    add_header Strict-Transport-Security $srn_hsts_header always;
    try_files /sandbox.html =404;
  }
}
