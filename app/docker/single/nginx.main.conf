# Standard Red Notes — main nginx config for the ALL-IN-ONE single container.
#
# The multi-container `app` image is built FROM nginxinc/nginx-unprivileged,
# which ships its own hardened main nginx.conf. This single-container image is
# built FROM node:24-alpine with nginx added via apk, so it needs its own main
# config. This mirrors the unprivileged image: it runs fully as the non-root
# `srn` user (uid 10001), writes its pid + scratch/temp dirs under /tmp (the only
# guaranteed-writable path for a non-root process), logs to stdout/stderr for
# `docker logs`, and includes the SAME server block + CSP self-heal the app image
# uses (dropped into /etc/nginx/conf.d/default.conf below).

# No `user` directive: nginx started by a non-root user runs all workers as that
# user and ignores `user` (emitting only a warning), so we omit it entirely.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Non-root: all writable scratch paths live under /tmp (see pid above).
  client_body_temp_path /tmp/nginx-client-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  access_log /dev/stdout;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  # The server block + the same CSP self-heal the app image uses. Kept at this
  # path (conf.d) so app/docker/docker-entrypoint.sh — reused VERBATIM — finds
  # and rewrites it at container start.
  include /etc/nginx/conf.d/*.conf;
}
