# Standard Red Notes: WebSocket upgrade plumbing. `map` must live at http scope,
# so it sits OUTSIDE the server block (conf.d/*.conf is included within http{}).
# Sends "Connection: upgrade" only for actual upgrade requests, "close" otherwise.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  # Hardening: listen on 8080 (>1024) so nginx runs fully as the unprivileged
  # `nginx` user without CAP_NET_BIND_SERVICE. Compose maps the host port here.
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # ---------------------------------------------------------------------------
  # Standard Red Notes: same-origin API + realtime proxy.
  #
  # The web UI, the /v1 API gateway and the realtime websocket are served under
  # ONE origin (this nginx) so the browser never issues a CROSS-origin request.
  # Publishing the app and API on separate ports (e.g. :3001 vs :3000) makes
  # every sync call cross-origin, which modern browsers block via CORS preflight
  # AND "Local Network Access" gating (Firefox/Chrome refuse localhost->localhost
  # fetches) — silently breaking sync. Proxying here matches the intended
  # single-host design (see the Traefik example in docker-compose.yml).
  #
  # Hostnames are the compose service names on the shared docker network.
  # ---------------------------------------------------------------------------

  # Resolve upstreams at REQUEST time via docker's embedded DNS, not at config
  # load. Using literal hostnames in proxy_pass makes nginx resolve them eagerly
  # at startup and abort ("host not found in upstream") if a backend container is
  # momentarily unresolvable (e.g. started with --no-deps / different boot order).
  # A `resolver` + a variable in proxy_pass defers resolution to each request.
  resolver 127.0.0.11 ipv6=off valid=30s;

  # Realtime websocket gateway (live-sync push) + its /sockets/tokens HTTP route.
  # The gateway now runs IN-PROCESS inside the api-gateway on the SAME port (3000):
  # it accepts the ws upgrade on any /sockets path and reads ?authToken, and its
  # token endpoint is literally /sockets/tokens — so the full URI is preserved.
  # This block stays separate from the /v1 regex below because it (and only it)
  # carries the Upgrade/Connection headers the websocket handshake needs.
  location /sockets {
    set $srn_ws server:3000;
    proxy_pass http://$srn_ws$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }

  # HTTP API gateway: sync, auth, subscriptions, files. Files stream Content-Range
  # bodies and can be large, so disable request buffering and lift the body cap.
  # Regex location takes priority over the `location /` SPA fallback below.
  #
  # OAuth callback query parameters contain a one-time authorization code and
  # state value. Route that exact path through the same API proxy contract but
  # suppress nginx access logging so the query string is not written locally.
  # Operators must configure the same redaction at every outer proxy/CDN/WAF.
  location = /v1/assistant/subscription/callback {
    access_log off;
    set $srn_api server:3000;
    proxy_pass http://$srn_api$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
  }

  location ~ ^/(v1|v2|auth|subscription|healthcheck)(/|$) {
    set $srn_api server:3000;
    proxy_pass http://$srn_api$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
  }

  # Files service (valet-token authed uploads/downloads), SAME-ORIGIN under
  # /files/. The api-gateway advertises PUBLIC_FILES_SERVER_URL (default
  # http://localhost:3001/files) in every response's meta.server.filesServerUrl;
  # the client joins its /v1/files... paths onto that base, so requests arrive
  # here as /files/v1/files/... . The files service itself serves bare
  # /v1/files... routes on container port 3104, so strip the /files prefix
  # before proxying (rewrite is required because proxy_pass uses a variable
  # for deferred DNS resolution, which disables the usual URI-replacement
  # prefix-strip). Chunks are large (express payload limit 50 MB, chunk cap
  # 100 MB) and downloads stream Content-Range bodies, so: no body cap, no
  # request/response buffering, generous timeouts.
  location /files/ {
    set $srn_files server:3104;
    rewrite ^/files(/.*)$ $1 break;
    proxy_pass http://$srn_files;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Third-party editor/component assets (e.g. org.standardnotes.standard-sheets)
  # are loaded by sandboxed component iframes that may run on a different origin
  # than the main app. Fonts and other subresources require CORS headers or the
  # browser blocks them ("Access-Control-Allow-Origin missing"). Serve these
  # static assets with a permissive CORS header so @font-face and asset fetches
  # succeed regardless of the iframe origin.
  # Component assets just need permissive CORS (sandboxed iframes fetch fonts/assets
  # cross-origin). Do NOT add a `types {}` block here or at server scope — it would
  # REPLACE the global mime.types map (not extend it), making .css/.js fall back to
  # application/octet-stream, which breaks stylesheets and makes editors download
  # instead of render. The base image's global mime.types handles css/js/woff/woff2.
  location /components/ {
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Range" always;

    # Map the few font extensions the stock mime.types may miss, scoped to single
    # file extensions so the global type map still applies to everything else.
    location ~* \.ttf$  { add_header Access-Control-Allow-Origin "*" always; default_type font/ttf; }
    location ~* \.otf$  { add_header Access-Control-Allow-Origin "*" always; default_type font/otf; }

    try_files $uri $uri/ =404;
  }

  location / {
    # -------------------------------------------------------------------------
    # Content-Security-Policy for the SPA document (and its static assets).
    #
    # Scoped to `location /` ONLY: the API (/v1|/v2|/auth...), files (/files/),
    # realtime (/sockets) and component iframes (/components/) are OTHER
    # location blocks and set (or forward) their own
    # headers — so this CSP governs exactly the app shell we control.
    #
    # Per-directive rationale:
    #   default-src 'self'            fallback: nothing off-origin unless listed.
    #   script-src  'self'            only same-origin bundles (app.js) load...
    #     'wasm-unsafe-eval'          ...libsodium (sncrypto) compiles WASM; Chrome
    #                                 blocks WebAssembly under a restrictive
    #                                 script-src without this (asm.js would still
    #                                 need it too). It does NOT enable eval().
    #     'sha256-__CSP_..._HASH__'   pins the single inline bootstrap <script> in
    #                                 index.html by hash so no OTHER inline script
    #                                 can run. This is a PLACEHOLDER token: the app
    #                                 entrypoint (docker-entrypoint.sh) computes the
    #                                 sha256 of the ACTUAL served inline script at
    #                                 container start and substitutes it here, so the
    #                                 hash SELF-HEALS across any runtime templating
    #                                 (OCR_ENABLED / OCR_DEFAULT_LANGUAGE / SYNC_-
    #                                 SERVER). See the SELF-HEAL note below.
    #   worker-src  'self' blob:      web/decryption/search workers are same-origin
    #                                 files, but worker-loader `inline:'fallback'`
    #                                 falls back to a Blob worker -> needs blob:.
    #   style-src   'self' 'unsafe-inline'  Tailwind + React inline style=""
    #                                 attributes + libs injecting <style> tags;
    #                                 inline style attributes cannot be hashed, so
    #                                 'unsafe-inline' here is unavoidable.
    #   img-src     'self' data: blob:   avatars/previews render from Blob URLs and
    #                                 data: URIs (decrypted-in-browser images).
    #   font-src    'self' data:      bundled fonts + a few data: embedded fonts.
    #   media-src   'self' blob: data:   recorded audio/video + TTS narration play
    #                                 back from Blob/data URLs.
    #   connect-src 'self' https: loopback-http ws: wss:   app/API traffic stays
    #                                 same-origin; direct assistant providers may
    #                                 use hosted HTTPS or local Ollama/LM Studio on
    #                                 localhost/127.0.0.1. Arbitrary cleartext HTTP
    #                                 remains blocked. ws:/wss: admits realtime.
    #   frame-src   'self' blob:      sandboxed component/preview iframes
    #                                 (some use blob: documents).
    #   frame-ancestors 'self'        clickjacking protection: only THIS origin may
    #                                 frame the app.
    #   base-uri 'self'; form-action 'self'; object-src 'none'   standard lock-down.
    #
    # SELF-HEAL (why the hash above is a placeholder, not a literal): the script
    # hash pins the CURRENT bytes of the inline bootstrap in the SERVED index.html.
    # That inline script is RUNTIME-TEMPLATED: the app entrypoint
    # (app/docker/docker-entrypoint.sh) rewrites window.ocrEnabled /
    # window.ocrDefaultLanguage / window.defaultSyncServer inside it via sed from
    # OCR_ENABLED / OCR_DEFAULT_LANGUAGE / SYNC_SERVER. Any such change alters the
    # bytes and would break a hardcoded hash -> WHITE-SCREEN. To make the hash
    # ROBUST, the same entrypoint (after those rewrites) recomputes the sha256 of
    # the served inline script body and substitutes `__CSP_INLINE_SCRIPT_HASH__`
    # above with `sha256-<computed>` in THIS file at container start, so the served
    # CSP hash always matches the served script. No manual regeneration is needed
    # when editing the inline <script> either — it re-hashes on the next start.
    # If hashing ever fails, the entrypoint falls back to 'unsafe-inline' for
    # script-src (app still boots; only the inline-script pin is dropped) and logs
    # loudly, rather than white-screening.
    # Rich lazy-loaded feature blocks (browser OCR downloads tesseract wasm+data
    # from a CDN; mermaid/spreadsheet may use eval) can also trip connect-src/
    # script-src — verify those specific features if you rely on them.
    # -------------------------------------------------------------------------
    # script-src-attr: permit exactly ONE inline DOM event-handler attribute that
    # app.js injects at runtime (hashes to the value below), and NOTHING else.
    # Without this directive, script-src-attr falls back to script-src (which has no
    # 'unsafe-hashes'), so ALL inline on*= handlers are blocked -> console reports a
    # script-src-attr violation for this handler. This is a STATIC hash (the handler
    # is runtime-built and could not be cleanly removed at source; it lives in an
    # in-flight feature file), so it is added literally here rather than via the
    # inline-SCRIPT self-heal (which owns only this parent script-src after its
    # unique self/wasm prefix, including hashes left by earlier starts).
    # 'unsafe-hashes' scopes the relaxation to hashed EVENT HANDLERS only; it does NOT
    # loosen script-src for scripts. Keep this line byte-identical to single/nginx.conf.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-__CSP_INLINE_SCRIPT_HASH__'; script-src-attr 'self' 'unsafe-hashes' 'sha256-nIvOnptGOkcUoTPVOYWoDnWbMyGMgUTK8pMzXf87azw='; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob: data:; connect-src 'self' https: http://localhost:* http://127.0.0.1:* ws: wss:; frame-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    try_files $uri $uri/ /index.html;
  }

  # User-authored sandbox code executes only in this opaque-origin frame. Its
  # fixed bootstrap is hash-pinned; unsafe-eval is scoped here because the
  # bootstrap receives user JavaScript as postMessage data and evaluates it.
  # The response sandbox directive backs up the iframe sandbox attribute even
  # if this URL is opened directly. Connections and remote subresources remain
  # disabled.
  location = /sandbox.html {
    add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-eval' 'sha256-xvRgiwPvsuzmKsrLtNr6JgssmYZDeeQ3B3pfnR4yZa8='; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; media-src data: blob:; connect-src 'none'; frame-src 'none'; frame-ancestors 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; sandbox allow-scripts" always;
    try_files /sandbox.html =404;
  }
}
