approvedGitRepositories:
  - "https://github.com/standardnotes/react-native-fingerprint-scanner.git"
  - "https://github.com/standardnotes/react-native-flag-secure-android.git"
  - "https://github.com/standardnotes/react-native-keychain.git"
  - "https://github.com/standardnotes/react-native-privacy-snapshot.git"

checksumBehavior: throw

compressionLevel: mixed

enableGlobalCache: false

enableImmutableInstalls: true

nodeLinker: node-modules

npmMinimalAgeGate: 0

supportedArchitectures:
  cpu:
    - current
    - x64
    - arm64
  libc:
    - current
    - glibc
    - musl
  os:
    - current
    - darwin
    - linux
    - win32

yarnPath: .yarn/releases/yarn-4.17.1.cjs
