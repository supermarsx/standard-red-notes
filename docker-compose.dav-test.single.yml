# =============================================================================
# TEST-ONLY overlay: an all-in-one Standard Red Notes container, joined to the
# DAV bridge test network (docker-compose.dav-test.yml), with the bridge on.
#
# It is an OVERLAY for docker-compose.single.yml, never used by itself:
#
#   docker compose -f docker-compose.dav-test.yml up -d --wait
#   docker compose -p srn-davtest-single \
#     -f docker-compose.single.yml -f docker-compose.dav-test.single.yml \
#     up -d --build --wait
#
# scripts/verify-dav-bridge.mjs does both, from a clean export of one commit.
#
# What it changes, and nothing else:
#   - the front door moves to 127.0.0.1:3991 so it cannot collide with a real
#     instance on this machine;
#   - the container also joins the test network, so it reaches the CalDAV
#     servers by name (`radicale`, `nextcloud`, `baikal`) over plain http;
#   - the bridge is switched on, and those three origins are on the operator's
#     list. They HAVE to be: they are private addresses over plain http, which
#     the bridge refuses unless the operator listed them. The verify script
#     empties the list first and checks that the same addresses are refused.
# =============================================================================
services:
  app:
    image: ${DAVTEST_SINGLE_IMAGE:-srn-davtest/single:local}
    ports: !override
      - "127.0.0.1:${DAVTEST_SINGLE_PORT:-3991}:8080"
    environment:
      DAV_BRIDGE_ENABLED: "true"
      # The read-only CalDAV feed too: the verify script proves that a feed
      # token stops working when the account it belongs to is deleted.
      CALDAV_ENABLED: "true"
      DAV_BRIDGE_ALLOWED_PRIVATE_ORIGINS: "http://radicale:5232,http://nextcloud,http://baikal"
    networks:
      - default
      - davtest

networks:
  davtest:
    external: true
    name: srn-davtest-net
