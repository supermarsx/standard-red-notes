name: docs-pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: coverage (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: app-core
            workspace_root: app
          - shard: app-web
            workspace_root: app
          - shard: server
            workspace_root: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          package-manager-cache: false
      - name: Install Corepack
        run: npm install --global corepack@0.35.0 && corepack enable
      - name: Install coverage tooling
        run: yarn install --immutable
      - name: Install ${{ matrix.workspace_root }} dependencies
        working-directory: ${{ matrix.workspace_root }}
        run: yarn install --immutable
      - name: Build server workspace packages
        if: matrix.shard == 'server'
        working-directory: server
        run: yarn build
      - name: Build app workspace packages
        if: startsWith(matrix.shard, 'app')
        working-directory: app
        run: yarn workspaces foreach -pt --topological-dev --verbose -R --from @standardnotes/web --exclude @standardnotes/web run build
      - name: Collect ${{ matrix.shard }} Jest coverage
        run: yarn coverage:collect:${{ matrix.shard }}
      - name: Upload raw ${{ matrix.shard }} coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.shard }}
          path: |
            coverage/raw/${{ matrix.shard }}/manifest.json
            coverage/raw/${{ matrix.shard }}/**/coverage-final.json
          if-no-files-found: error
          retention-days: 1

  build:
    needs: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          package-manager-cache: false
      - name: Install Corepack
        run: npm install --global corepack@0.35.0 && corepack enable
      - name: Install coverage tooling
        run: yarn install --immutable
      - name: Download raw coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          path: coverage/raw
      - name: Test coverage tooling
        run: yarn test:coverage-tools
      - name: Generate coverage badge
        run: yarn coverage:report
      - name: Verify app documentation mirror
        run: node scripts/export-app-docs-to-pages.mjs --check
      - name: Verify documentation search index
        run: node scripts/generate-docs-search-index.mjs --check
      - name: Validate documentation links and navigation
        run: yarn docs:links
      - name: Validate Mermaid diagrams
        run: yarn docs:mermaid
      - name: Test documentation theme and browser controls
        run: yarn docs:ui:test
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./docs
          destination: ./_site
      - name: Verify coverage badge in site
        run: test -s _site/assets/coverage.svg
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: ./_site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
