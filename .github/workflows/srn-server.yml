# Rolling release pipeline for the `srn-server` CLI tool.
#
# Gated stages (each only runs if the previous succeeded, via `needs:`):
#   (lint, test, format) -> build -> decide -> package -> release
# The three check jobs run in parallel; build fans in on all three.
#
# Trigger: push to `main` that touches the tool (or manual dispatch). A new
# rolling release `srn-server <YY.N>` is cut ONLY when the freshly built bundle
# differs from the last released one (content fingerprint gate); no-op pushes
# do not create a release.
name: srn-server

on:
  push:
    branches: [main]
    paths:
      - 'cli/srn-server/**'
      - 'cli/.prettierrc'
      - '.github/workflows/srn-server.yml'
  workflow_dispatch:
    inputs:
      force_release:
        description: Publish even when source and bundle fingerprints are unchanged
        required: false
        default: false
        type: boolean
      force_reason:
        description: Required audit reason when force_release is true
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: srn-server-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  TOOL: srn-server
  TOOL_DIR: cli/srn-server
  NODE_VERSION: '26'
  PKG_NODE: node24
  PKG_VERSION: '6.21.0'

jobs:
  impact:
    name: analyze release impact
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.impact.outputs.changed }}
      forced: ${{ steps.impact.outputs.forced }}
      base_ref: ${{ steps.impact.outputs.base_ref }}
      reason_codes: ${{ steps.impact.outputs.reason_codes }}
      result_json: ${{ steps.impact.outputs.result_json }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - id: impact
        name: Compare srn-server publishable surface with its latest release
        env:
          FORCE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_release || false }}
          FORCE_REASON: ${{ github.event_name == 'workflow_dispatch' && inputs.force_reason || '' }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          node scripts/analyze-release-impact.mjs \
            --target srn-server \
            --head HEAD \
            --force "${FORCE_RELEASE}" \
            --force-reason "${FORCE_REASON}" \
            --output release-impact.json \
            --github-output "$GITHUB_OUTPUT"
          {
            echo '### srn-server release impact'
            echo '```json'
            cat release-impact.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # 1) CHECK — lint, format and test run as three INDEPENDENT parallel jobs;
  # `build` fans in on all three (needs: [lint, test, format]). srn-server is a
  # standalone, zero-runtime-dependency npm package (Node built-ins only); it is
  # not part of any yarn workspace root, so each job installs its own deps from
  # the committed package-lock.json via `npm ci` (reproducible, no upstream drift).

  # 1a) LINT — strict typecheck (tsc --noEmit) is this TS CLI's lint gate, plus
  # a package-shape assertion so a missing/renamed entry point fails loudly.
  lint:
    name: lint
    needs: impact
    if: needs.impact.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.TOOL_DIR }}/package-lock.json

      - name: Install tool dependencies
        working-directory: ${{ env.TOOL_DIR }}
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: ${{ env.TOOL_DIR }}
        run: npm run typecheck

      - name: Verify package shape
        working-directory: ${{ env.TOOL_DIR }}
        run: |
          node -e "const p=require('./package.json'); if(!p.bin||!p.bin['srn-server']) {console.error('missing bin'); process.exit(1)}"
          test -f esbuild.config.mjs
          test -f src/index.ts

  # 1b) FORMAT — Prettier check against the shared cli/.prettierrc style. No
  # install needed; prettier runs via npx and auto-discovers cli/.prettierrc.
  format:
    name: format
    needs: impact
    if: needs.impact.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          # This job runs only `npx prettier` (no install), so skip setup-node's
          # auto package-manager cache — it would otherwise detect the repo
          # root's `packageManager: yarn@4` and fail under the runner's yarn 1.x.
          package-manager-cache: false

      - name: Check formatting
        working-directory: ${{ env.TOOL_DIR }}
        run: npx --yes prettier@3.9.5 --check "src/**/*.ts" "test/**/*.ts" "*.mjs"

  # 1c) TEST — the `node --test` unit suite over the pure core (arg parsing,
  # docker compose argv construction, endpoint resolution, .env secret
  # validation), then the functional gate: build the esbuild bundle, assert it is
  # non-empty, then smoke-run --help (tolerant of a non-zero help exit code).
  test:
    name: test
    needs: impact
    if: needs.impact.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.TOOL_DIR }}/package-lock.json

      - name: Install tool dependencies
        working-directory: ${{ env.TOOL_DIR }}
        run: npm ci --no-audit --no-fund

      - name: Build single-file bundle
        working-directory: ${{ env.TOOL_DIR }}
        run: npm run build:bundle

      - name: Run unit tests
        working-directory: ${{ env.TOOL_DIR }}
        run: npm test

      - name: Smoke-test bundle
        working-directory: ${{ env.TOOL_DIR }}
        run: |
          test -s dist/index.cjs
          node dist/index.cjs --help || true

  # 2) BUILD — tsc build (the canonical npm-installable output) plus the esbuild
  # bundle (dist/index.cjs) that the packaging step wraps into executables, and a
  # deterministic content fingerprint (sha256 of that bundle). esbuild output is
  # byte-reproducible, so the fingerprint is a stable identity for the shippable
  # content. The pkg binaries are NOT fingerprinted (pkg bakes in non-reproducible
  # node-version/timestamps).
  build:
    name: build
    needs: [impact, lint, test, format]
    if: needs.impact.outputs.changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      fingerprint: ${{ steps.fp.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.TOOL_DIR }}/package-lock.json

      - name: Install tool dependencies
        working-directory: ${{ env.TOOL_DIR }}
        run: npm ci --no-audit --no-fund

      - name: Build (tsc)
        working-directory: ${{ env.TOOL_DIR }}
        run: npm run build

      - name: Build single-file bundle
        working-directory: ${{ env.TOOL_DIR }}
        run: npm run build:bundle

      - name: Smoke-test bundle
        working-directory: ${{ env.TOOL_DIR }}
        run: node dist/index.cjs --help || true

      - name: Compute content fingerprint
        id: fp
        working-directory: ${{ env.TOOL_DIR }}
        run: |
          set -euo pipefail
          fp="$(sha256sum dist/index.cjs | awk '{print $1}')"
          echo "fingerprint=${fp}" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$fp" > "dist/${TOOL}.fingerprint"
          echo "Bundle fingerprint: ${fp}"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: srn-server-bundle
          path: |
            ${{ env.TOOL_DIR }}/dist/index.cjs
            ${{ env.TOOL_DIR }}/dist/srn-server.fingerprint
          retention-days: 1
          if-no-files-found: error

  # 3) DECIDE — compare the new bundle fingerprint against the one stored on the
  # most recent release for THIS tool. Output changed=true to proceed, or
  # changed=false to skip packaging + release entirely (a successful no-op).
  decide:
    name: decide
    needs: [impact, build]
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.cmp.outputs.changed }}
    steps:
      - uses: actions/checkout@v7

      - name: Compare against last released fingerprint
        id: cmp
        env:
          BASE_REF: ${{ needs.impact.outputs.base_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_FP: ${{ needs.build.outputs.fingerprint }}
          FORCED: ${{ needs.impact.outputs.forced }}
        run: |
          set -euo pipefail
          if [ "$FORCED" = "true" ]; then
            echo "Audited force request bypasses the bundle fingerprint comparison."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BASE_REF" ]; then
            echo "No prior ${TOOL} release found -> treat as changed."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Last ${TOOL} release: ${BASE_REF}"
          old_fp=""
          if gh release download "$BASE_REF" --pattern "${TOOL}.fingerprint" --output old.fingerprint --clobber 2>/dev/null; then
            old_fp="$(tr -d '[:space:]' < old.fingerprint)"
          else
            echo "Last release has no fingerprint asset -> treat as changed."
          fi
          echo "old=${old_fp}"
          echo "new=${NEW_FP}"
          if [ -n "$old_fp" ] && [ "$old_fp" = "$NEW_FP" ]; then
            echo "No changes since ${BASE_REF}, skipping release."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Bundle changed since ${BASE_REF} -> release."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # 4) PACKAGE — cross-compile native executables for every OS x arch from the
  # single bundled CJS entry, using @yao-pkg/pkg on one Linux runner. Skipped
  # when the bundle is unchanged.
  package:
    name: package
    needs: [build, decide]
    if: needs.decide.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Packaging only runs `npx @yao-pkg/pkg` against the prebuilt bundle
          # artifact (no install), so skip the auto package-manager cache that
          # would detect the repo root's `packageManager: yarn@4` and fail.
          package-manager-cache: false

      - name: Download bundle artifact
        uses: actions/download-artifact@v8
        with:
          name: srn-server-bundle
          path: ${{ env.TOOL_DIR }}/dist

      - name: Package native executables
        working-directory: ${{ env.TOOL_DIR }}
        run: |
          set -euo pipefail
          mkdir -p out
          declare -A TARGETS=(
            ["${TOOL}-windows-x64.exe"]="${PKG_NODE}-win-x64"
            ["${TOOL}-windows-arm64.exe"]="${PKG_NODE}-win-arm64"
            ["${TOOL}-macos-x64"]="${PKG_NODE}-macos-x64"
            ["${TOOL}-macos-arm64"]="${PKG_NODE}-macos-arm64"
            ["${TOOL}-linux-x64"]="${PKG_NODE}-linux-x64"
            ["${TOOL}-linux-arm64"]="${PKG_NODE}-linux-arm64"
          )
          for out_name in "${!TARGETS[@]}"; do
            target="${TARGETS[$out_name]}"
            echo "::group::pkg $target -> $out_name"
            npx --yes "@yao-pkg/pkg@${PKG_VERSION}" \
              --no-signature \
              --targets "$target" \
              --output "out/${out_name}" \
              dist/index.cjs
            echo "::endgroup::"
          done
          cp "dist/${TOOL}.fingerprint" "out/${TOOL}.fingerprint"
          echo "Produced:"
          ls -la out

      - name: Generate checksums
        working-directory: ${{ env.TOOL_DIR }}/out
        run: |
          sha256sum "${TOOL}"-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Upload packaged binaries
        uses: actions/upload-artifact@v7
        with:
          name: srn-server-binaries
          path: ${{ env.TOOL_DIR }}/out/*
          retention-days: 1
          if-no-files-found: error

  # 5) RELEASE — compute a rolling YY.N version for THIS tool, create a
  # namespaced tag, and publish a GitHub Release with the 6 binaries, the
  # checksums, and the fingerprint asset (read back by the next run's decide).
  release:
    name: release
    needs: [decide, package]
    if: needs.decide.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download packaged binaries
        uses: actions/download-artifact@v8
        with:
          name: srn-server-binaries
          path: out

      - name: Compute rolling version
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          YY="$(date -u +%y)"
          prefix="${TOOL}-v${YY}."
          max=0
          while read -r tag; do
            [ -z "$tag" ] && continue
            n="${tag#"$prefix"}"
            if [[ "$n" =~ ^[0-9]+$ ]] && [ "$n" -gt "$max" ]; then
              max="$n"
            fi
          done < <(git tag --list "${prefix}*")
          next=$((max + 1))
          version="${YY}.${next}"
          tag="${TOOL}-v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Next ${TOOL} release: ${tag} (version ${version})"

      # Use the preinstalled `gh` CLI rather than a third-party action so the
      # release step has no Node-runtime dependency to keep current.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(out/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No release assets found in out/ (mirrors fail_on_unmatched_files)" >&2
            exit 1
          fi
          # Do not claim the repo-global Latest pointer: electron-updater
          # resolves the desktop channel file through /releases/latest, so only
          # srn-desktop may hold it.
          gh release create "${{ steps.ver.outputs.tag }}" \
            --title "${{ env.TOOL }} ${{ steps.ver.outputs.version }}" \
            --target "${{ github.sha }}" \
            --latest=false \
            --generate-notes \
            "${files[@]}"
