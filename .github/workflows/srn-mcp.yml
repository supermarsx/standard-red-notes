# Rolling release pipeline for the `srn-mcp` server (the MCP bridge).
#
# Gated stages (each only runs if the previous succeeded, via `needs:`):
#   audit -> (lint, test, format) -> build -> decide -> identity -> package -> release
# The three check jobs run in parallel after the exact-SHA dependency audit;
# build fans in on all four gates.
#
# Trigger: push to `main` that touches the tool (or manual dispatch). A new
# rolling release `srn-mcp <YY.N>` is cut ONLY when the freshly built bundle
# differs from the last released one (content fingerprint gate); no-op pushes
# do not create a release.
#
# Unlike srn-server, the MCP bridge has real runtime dependencies (snjs,
# @modelcontextprotocol/sdk, libsodium); the `build` script esbuild-bundles them
# into a single self-contained dist/index.cjs (libsodium WASM is inlined), so the
# bundle is still pkg-able into native executables exactly like srn-server.
name: srn-mcp

on:
  push:
    branches: [main]
    paths:
      - "mcp/**"
      - "package.json"
      - "yarn.lock"
      - ".yarnrc.yml"
      - ".yarn/releases/**"
      - "scripts/native-cli-release.mjs"
      - "scripts/package.json"
      - "scripts/package-lock.json"
      - "scripts/release-packaging-contract.mjs"
      - ".github/workflows/srn-mcp.yml"
  workflow_dispatch:
    inputs:
      force_release:
        description: Publish even when source and bundle fingerprints are unchanged
        required: false
        default: false
        type: boolean
      force_reason:
        description: Required audit reason when force_release is true
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: srn-mcp-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  TOOL: srn-mcp
  TOOL_DIR: mcp
  NODE_VERSION: "26"
  COREPACK_VERSION: "0.35.0"
  YARN_VERSION: "4.17.1"

jobs:
  impact:
    name: analyze release impact
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.impact.outputs.changed }}
      forced: ${{ steps.impact.outputs.forced }}
      base_ref: ${{ steps.impact.outputs.base_ref }}
      baseline_status: ${{ steps.impact.outputs.baseline_status }}
      publication_gate: ${{ steps.impact.outputs.publication_gate }}
      reason_codes: ${{ steps.impact.outputs.reason_codes }}
      result_json: ${{ steps.impact.outputs.result_json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Authorize exact protected release source
        run: |
          set -euo pipefail
          git fetch --no-tags --force origin refs/heads/main:refs/remotes/origin/main
          protected_sha="$(git rev-parse "refs/remotes/origin/main^{commit}")"
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$protected_sha"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install release policy dependencies
        run: npm ci --prefix scripts --ignore-scripts --no-audit --no-fund

      - name: Validate release packaging contract
        run: node scripts/validate-release-contract.mjs

      - id: impact
        name: Compare srn-mcp publishable surface with its latest release
        env:
          FORCE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_release || false }}
          FORCE_REASON: ${{ github.event_name == 'workflow_dispatch' && inputs.force_reason || '' }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          node scripts/analyze-release-impact.mjs \
            --target srn-mcp \
            --head HEAD \
            --force "${FORCE_RELEASE}" \
            --force-reason "${FORCE_REASON}" \
            --output release-impact.json \
            --github-output "$GITHUB_OUTPUT"
          {
            echo '### srn-mcp release impact'
            echo '```json'
            cat release-impact.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # 1) AUDIT + CHECK — every dependency-consuming job installs the repository's
  # immutable Yarn graph. The audit binds that graph to this exact workflow SHA;
  # the parallel typecheck, format and runtime checks verify the same lock digest.

  audit:
    name: production dependency audit
    needs: impact
    if: needs.impact.outputs.changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      audited_sha: ${{ steps.source.outputs.audited_sha }}
      lock_sha256: ${{ steps.source.outputs.lock_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable pinned Corepack and Yarn
        run: |
          set -euo pipefail
          npm install --global "corepack@${COREPACK_VERSION}"
          corepack enable
          test "$(yarn --version)" = "$YARN_VERSION"

      - name: Install immutable root dependency graph
        run: yarn install --immutable

      - id: source
        name: Bind audit to exact source and lock
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          lock_sha256="$(sha256sum yarn.lock | cut -d ' ' -f 1)"
          [[ "$lock_sha256" =~ ^[0-9a-f]{64}$ ]]
          {
            echo "audited_sha=${GITHUB_SHA}"
            echo "lock_sha256=${lock_sha256}"
          } >> "$GITHUB_OUTPUT"

      - name: Audit every production lock graph
        run: yarn deps:security:production

  # 1a) LINT — strict typecheck (tsc --noEmit) is this TS bridge's lint gate, plus
  # a package-shape assertion so a missing/renamed entry point or bin fails loudly.
  lint:
    name: lint
    needs: [impact, audit]
    if: needs.impact.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable pinned Corepack and Yarn
        run: |
          set -euo pipefail
          npm install --global "corepack@${COREPACK_VERSION}"
          corepack enable
          test "$(yarn --version)" = "$YARN_VERSION"

      - name: Install exact audited dependency graph
        env:
          AUDITED_SHA: ${{ needs.audit.outputs.audited_sha }}
          AUDITED_LOCK_SHA256: ${{ needs.audit.outputs.lock_sha256 }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUDITED_SHA"
          test "$(sha256sum yarn.lock | cut -d ' ' -f 1)" = "$AUDITED_LOCK_SHA256"
          yarn install --immutable

      - name: Typecheck
        run: yarn workspace @standard-red-notes/mcp typecheck

      - name: Verify package shape
        working-directory: ${{ env.TOOL_DIR }}
        run: |
          node -e "const p=require('./package.json'); if(!p.bin||!p.bin['standard-red-notes-mcp']) {console.error('missing bin'); process.exit(1)}"
          test -f esbuild.config.mjs
          test -f src/index.ts

  # 1b) FORMAT — Prettier check via the package's pinned prettier (format:check
  # script) so the config/version match exactly how the source was formatted.
  format:
    name: format
    needs: [impact, audit]
    if: needs.impact.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable pinned Corepack and Yarn
        run: |
          set -euo pipefail
          npm install --global "corepack@${COREPACK_VERSION}"
          corepack enable
          test "$(yarn --version)" = "$YARN_VERSION"

      - name: Install exact audited dependency graph
        env:
          AUDITED_SHA: ${{ needs.audit.outputs.audited_sha }}
          AUDITED_LOCK_SHA256: ${{ needs.audit.outputs.lock_sha256 }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUDITED_SHA"
          test "$(sha256sum yarn.lock | cut -d ' ' -f 1)" = "$AUDITED_LOCK_SHA256"
          yarn install --immutable

      - name: Check formatting
        run: yarn workspace @standard-red-notes/mcp format:check

  # 1c) TEST — no unit suite (the e2e harness needs a live stack, so it can't run
  # here). The functional gate is "the bundle builds and the produced server
  # loads + runs its fail-closed guard": build the esbuild bundle, assert it is
  # non-empty, then run it in http mode with NO token — it must print the
  # MCP_HTTP_TOKEN fatal and exit, proving every dependency (snjs/sdk/libsodium
  # WASM + the global polyfill banner) evaluates without throwing. This avoids the
  # stdio default, which would block forever waiting on stdin.
  test:
    name: test
    needs: [impact, audit]
    if: needs.impact.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable pinned Corepack and Yarn
        run: |
          set -euo pipefail
          npm install --global "corepack@${COREPACK_VERSION}"
          corepack enable
          test "$(yarn --version)" = "$YARN_VERSION"

      - name: Install exact audited dependency graph
        env:
          AUDITED_SHA: ${{ needs.audit.outputs.audited_sha }}
          AUDITED_LOCK_SHA256: ${{ needs.audit.outputs.lock_sha256 }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUDITED_SHA"
          test "$(sha256sum yarn.lock | cut -d ' ' -f 1)" = "$AUDITED_LOCK_SHA256"
          yarn install --immutable

      - name: Build single-file bundle
        run: yarn workspace @standard-red-notes/mcp build

      - name: Smoke-test bundle (fail-closed http guard)
        working-directory: ${{ env.TOOL_DIR }}
        run: |
          set -euo pipefail
          test -s dist/index.cjs
          set +e
          out="$(MCP_TRANSPORT=http node dist/index.cjs 2>&1)"
          status=$?
          set -e
          test "$status" -ne 0
          printf '%s\n' "$out"
          echo "$out" | grep -q "requires MCP_HTTP_TOKEN"
          test "$(node dist/index.cjs --srn-release-self-test)" = "srn-native-self-test-v1 linux x64"

  # 2) BUILD — the esbuild bundle (dist/index.cjs) that the packaging step wraps
  # into executables, plus a deterministic content fingerprint (sha256 of that
  # bundle). esbuild output is byte-reproducible, so the fingerprint is a stable
  # identity for the shippable content. The pkg binaries are NOT fingerprinted
  # (pkg bakes in non-reproducible node-version/timestamps).
  build:
    name: build
    needs: [impact, audit, lint, test, format]
    if: needs.impact.outputs.changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      fingerprint: ${{ steps.fp.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable pinned Corepack and Yarn
        run: |
          set -euo pipefail
          npm install --global "corepack@${COREPACK_VERSION}"
          corepack enable
          test "$(yarn --version)" = "$YARN_VERSION"

      - name: Install exact audited dependency graph
        env:
          AUDITED_SHA: ${{ needs.audit.outputs.audited_sha }}
          AUDITED_LOCK_SHA256: ${{ needs.audit.outputs.lock_sha256 }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUDITED_SHA"
          test "$(sha256sum yarn.lock | cut -d ' ' -f 1)" = "$AUDITED_LOCK_SHA256"
          yarn install --immutable

      - name: Build single-file bundle
        run: yarn workspace @standard-red-notes/mcp build

      - name: Smoke-test bundle (fail-closed http guard)
        working-directory: ${{ env.TOOL_DIR }}
        run: |
          set -euo pipefail
          set +e
          out="$(MCP_TRANSPORT=http node dist/index.cjs 2>&1)"
          status=$?
          set -e
          test "$status" -ne 0
          printf '%s\n' "$out"
          echo "$out" | grep -q "requires MCP_HTTP_TOKEN"
          test "$(node dist/index.cjs --srn-release-self-test)" = "srn-native-self-test-v1 linux x64"

      - name: Install release policy dependencies
        run: npm ci --prefix scripts --ignore-scripts --no-audit --no-fund

      - name: Compute payload and native-packaging contract fingerprint
        id: fp
        working-directory: ${{ env.TOOL_DIR }}
        run: |
          set -euo pipefail
          node ../scripts/native-cli-release.mjs fingerprint \
            --tool "$TOOL" \
            --bundle dist/index.cjs \
            --out-dir out \
            --root .. \
            --path mcp/dist/index.cjs \
            --path yarn.lock \
            --output "dist/${TOOL}.fingerprint" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: srn-mcp-bundle
          path: |
            ${{ env.TOOL_DIR }}/dist/index.cjs
            ${{ env.TOOL_DIR }}/dist/srn-mcp.fingerprint
          retention-days: 30
          if-no-files-found: error

  # 3) DECIDE — compare the new bundle fingerprint against the one stored on the
  # most recent release for THIS tool. Output changed=true to proceed, or
  # changed=false to skip packaging + release entirely (a successful no-op).
  decide:
    name: decide
    needs: [impact, build]
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.cmp.outputs.changed }}
      decision: ${{ steps.cmp.outputs.decision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare against last released fingerprint
        id: cmp
        env:
          BASE_REF: ${{ needs.impact.outputs.base_ref }}
          BASELINE_STATUS: ${{ needs.impact.outputs.baseline_status }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_FP: ${{ needs.build.outputs.fingerprint }}
          FORCED: ${{ needs.impact.outputs.forced }}
        run: |
          set -euo pipefail
          if ! node scripts/compare-release-fingerprints.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --base-ref "$BASE_REF" \
            --baseline-status "$BASELINE_STATUS" \
            --forced "$FORCED" \
            --fingerprint "${TOOL}.fingerprint=${NEW_FP}" \
            --output release-fingerprint-comparison.json \
            --github-output "$GITHUB_OUTPUT"; then
            cat release-fingerprint-comparison.json >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cat release-fingerprint-comparison.json >> "$GITHUB_STEP_SUMMARY"

  # Reserve one commit-bound draft before packaging. A rerun reuses this exact
  # reservation instead of consuming another rolling version.
  identity:
    name: reserve release identity
    needs: [build, decide, impact]
    if: needs.decide.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment: release-production
    permissions:
      contents: write
    outputs:
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
      release_id: ${{ steps.identity.outputs.release_id }}
      reused: ${{ steps.identity.outputs.reused }}
      published: ${{ steps.identity.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Reserve or reuse exact draft release
        id: identity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_FINGERPRINT: ${{ needs.build.outputs.fingerprint }}
          FORCED: ${{ needs.impact.outputs.forced }}
          IMPACT_RESULT: ${{ needs.impact.outputs.result_json }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$EXPECTED_FINGERPRINT" =~ ^[0-9a-f]{64}$ ]]
          [[ "$FORCED" == "true" || "$FORCED" == "false" ]]
          jq -e --arg sha "$GITHUB_SHA" --argjson forced "$FORCED" '
            .headSha == $sha
            and .forced == $forced
            and (
              ($forced and (.forceReason | type == "string") and ((.forceReason | gsub("^\\s+|\\s+$"; "")) | length > 0))
              or (($forced | not) and .forceReason == null)
            )
          ' <<< "$IMPACT_RESULT" >/dev/null
          if [ "$FORCED" = "true" ]; then
            [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
            intent="forced-${GITHUB_RUN_ID}"
          else
            intent="automatic"
          fi
          git fetch --force --tags origin

          yy="$(date -u +%y)"
          prefix="${TOOL}-v${yy}."
          marker="<!-- srn-release-reservation tool=${TOOL} commit=${GITHUB_SHA} fingerprint=${EXPECTED_FINGERPRINT} intent=${intent} -->"
          releases_file="$(mktemp)"
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate --slurp |
            jq 'flatten' > "$releases_file"

          mapfile -t reservations < <(
            jq -r --arg marker "$marker" --arg sha "$GITHUB_SHA" --arg tool_prefix "${TOOL}-v" '
              .[]
              | select(.target_commitish == $sha)
              | select((.body // "") | contains($marker))
              | select(.tag_name | startswith($tool_prefix))
              | .id
            ' "$releases_file"
          )
          marker_prefix="<!-- srn-release-reservation tool=${TOOL} "
          mapfile -t stale_reservations < <(
            jq -r --arg marker "$marker" --arg marker_prefix "$marker_prefix" --arg sha "$GITHUB_SHA" --arg tool_prefix "${TOOL}-v" '
              .[]
              | select(.draft == true)
              | select((.body // "") | contains($marker_prefix))
              | select((
                  (.target_commitish == $sha)
                  and (.tag_name | startswith($tool_prefix))
                  and ((.body // "") | contains($marker))
                ) | not)
              | "\(.id)\t\(.tag_name)\t\(.target_commitish)"
            ' "$releases_file"
          )
          if [ "${#stale_reservations[@]}" -gt 0 ]; then
            echo "Refusing to allocate past stale ${TOOL} draft reservations:" >&2
            printf '  %s\n' "${stale_reservations[@]}" >&2
            echo "Reconcile or delete the stale drafts explicitly, then rerun." >&2
            exit 1
          fi
          if [ "${#reservations[@]}" -gt 1 ]; then
            echo "Multiple reservations match ${TOOL}, ${GITHUB_SHA}, ${EXPECTED_FINGERPRINT}, and ${intent}" >&2
            exit 1
          fi

          reused=false
          if [ "${#reservations[@]}" -eq 1 ]; then
            release_id="${reservations[0]}"
            release="$(jq -c --argjson id "$release_id" '.[] | select(.id == $id)' "$releases_file")"
            tag="$(jq -r '.tag_name' <<< "$release")"
            version="${tag#"${TOOL}-v"}"
            name="${TOOL} ${version}"
            [[ "$version" =~ ^[0-9]{2}\.[1-9][0-9]*$ ]]
            jq -e --arg tag "$tag" --arg name "$name" --arg sha "$GITHUB_SHA" --arg marker "$marker" '
              .tag_name == $tag
              and .name == $name
              and .target_commitish == $sha
              and (.draft == true or .draft == false)
              and .prerelease == false
              and ((.body // "") | contains($marker))
            ' <<< "$release" >/dev/null
            tag_count="$(jq --arg tag "$tag" '[.[] | select(.tag_name == $tag)] | length' "$releases_file")"
            test "$tag_count" -eq 1
            published="$(jq -r '.draft | not' <<< "$release")"
            if [ "$published" = "true" ]; then
              git show-ref --verify --quiet "refs/tags/${tag}"
              test "$(git rev-list -n 1 "$tag")" = "$GITHUB_SHA"
            elif git show-ref --verify --quiet "refs/tags/${tag}"; then
              echo "Draft reservation ${tag} collides with an existing Git tag" >&2
              exit 1
            fi
            reused=true
          else
            max=0
            while read -r candidate; do
              [ -z "$candidate" ] && continue
              n="${candidate#"$prefix"}"
              if [[ "$n" =~ ^[1-9][0-9]*$ ]] && [ "$n" -gt "$max" ]; then
                max="$n"
              fi
            done < <(
              {
                git tag --list "${prefix}*"
                jq -r --arg prefix "$prefix" '.[] | select(.tag_name | startswith($prefix)) | .tag_name' "$releases_file"
              } | LC_ALL=C sort -u
            )
            version="${yy}.$((max + 1))"
            tag="${TOOL}-v${version}"
            name="${TOOL} ${version}"
            if git show-ref --verify --quiet "refs/tags/${tag}"; then
              echo "Refusing to reserve existing tag ${tag}" >&2
              exit 1
            fi
            tag_count="$(jq --arg tag "$tag" '[.[] | select(.tag_name == $tag)] | length' "$releases_file")"
            test "$tag_count" -eq 0
            created="$(
              gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
                -f tag_name="$tag" \
                -f target_commitish="$GITHUB_SHA" \
                -f name="$name" \
                -f body="$marker" \
                -F draft=true \
                -F prerelease=false \
                -F generate_release_notes=true
            )"
            release_id="$(jq -r '.id' <<< "$created")"
            published=false
            jq -e --arg tag "$tag" --arg name "$name" --arg sha "$GITHUB_SHA" --arg marker "$marker" '
              (.id | type == "number")
              and .tag_name == $tag
              and .name == $name
              and .target_commitish == $sha
              and .draft == true
              and .prerelease == false
              and ((.body // "") | contains($marker))
            ' <<< "$created" >/dev/null
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "release_id=$release_id"
            echo "reused=$reused"
            echo "published=$published"
          } >> "$GITHUB_OUTPUT"
          echo "Reserved ${tag} for ${GITHUB_SHA} at ${EXPECTED_FINGERPRINT} with intent ${intent} (release id ${release_id}; reused=${reused}; published=${published})" >> "$GITHUB_STEP_SUMMARY"

  # 4) PACKAGE — cross-compile native executables for every OS x arch from the
  # single bundled CJS entry, using @yao-pkg/pkg on one Linux runner. Skipped
  # when the bundle is unchanged.
  package:
    name: package
    needs: [audit, build, decide, identity]
    if: needs.decide.outputs.changed == 'true' && needs.identity.outputs.published != 'true'
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.identity.outputs.version }}
      RELEASE_TAG: ${{ needs.identity.outputs.tag }}
      RELEASE_ID: ${{ needs.identity.outputs.release_id }}
      RELEASE_COMMIT: ${{ github.sha }}
      AUDITED_SHA: ${{ needs.audit.outputs.audited_sha }}
      AUDITED_LOCK_SHA256: ${{ needs.audit.outputs.lock_sha256 }}
    steps:
      - name: Verify reserved release identity
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "${TOOL}-v${RELEASE_VERSION}"
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
          test "$RELEASE_COMMIT" = "$GITHUB_SHA"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify exact audited source and lock
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUDITED_SHA"
          test "$AUDITED_SHA" = "$GITHUB_SHA"
          test "$(sha256sum yarn.lock | cut -d ' ' -f 1)" = "$AUDITED_LOCK_SHA256"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Packaging only runs `npx @yao-pkg/pkg` against the prebuilt bundle
          # artifact (no install), so skip the auto package-manager cache.
          package-manager-cache: false

      - name: Download bundle artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: srn-mcp-bundle
          path: ${{ env.TOOL_DIR }}/dist

      - name: Package native executables
        working-directory: ${{ env.TOOL_DIR }}
        run: |
          set -euo pipefail
          node ../scripts/native-cli-release.mjs package \
            --tool "$TOOL" \
            --bundle dist/index.cjs \
            --out-dir out
          cp "dist/${TOOL}.fingerprint" "out/${TOOL}.fingerprint"
          echo "Produced:"
          ls -la out

      - name: Generate checksums
        working-directory: ${{ env.TOOL_DIR }}/out
        run: |
          sha256sum "${TOOL}"-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Upload packaged binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: srn-mcp-binaries
          path: ${{ env.TOOL_DIR }}/out/*
          retention-days: 30
          if-no-files-found: error

  smoke:
    name: native smoke (${{ matrix.asset }})
    needs: [decide, identity, package]
    if: needs.decide.outputs.changed == 'true' && needs.identity.outputs.published != 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              runner: windows-2025,
              asset: windows-x64.exe,
              platform: win32,
              node_arch: x64,
              file_pattern: 'PE32\+.*x86-64',
            }
          - {
              runner: windows-11-arm,
              asset: windows-arm64.exe,
              platform: win32,
              node_arch: arm64,
              file_pattern: 'PE32\+.*(Aarch64|ARM64|aarch64)',
            }
          - {
              runner: ubuntu-24.04,
              asset: linux-x64,
              platform: linux,
              node_arch: x64,
              file_pattern: "ELF 64-bit.*x86-64",
            }
          - {
              runner: ubuntu-24.04-arm,
              asset: linux-arm64,
              platform: linux,
              node_arch: arm64,
              file_pattern: "ELF 64-bit.*(aarch64|ARM64)",
            }
          - {
              runner: macos-15-intel,
              asset: macos-x64,
              platform: darwin,
              node_arch: x64,
              file_pattern: "Mach-O 64-bit.*x86_64",
            }
          - {
              runner: macos-15,
              asset: macos-arm64,
              platform: darwin,
              node_arch: arm64,
              file_pattern: "Mach-O 64-bit.*arm64",
            }
    steps:
      - name: Download exact packaged payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: srn-mcp-binaries
          path: out

      - name: Verify checksum, architecture, and offline executable self-test
        env:
          ASSET: ${{ matrix.asset }}
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_NODE_ARCH: ${{ matrix.node_arch }}
          FILE_PATTERN: ${{ matrix.file_pattern }}
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: ""
        run: |
          set -euo pipefail
          cd out
          sha256sum --check SHA256SUMS.txt
          executable="${TOOL}-${ASSET}"
          test -s "$executable"
          file "$executable" | grep -E "$FILE_PATTERN"
          chmod +x "$executable"
          output="$(./"$executable" --srn-release-self-test)"
          test "$output" = "srn-native-self-test-v1 ${EXPECTED_PLATFORM} ${EXPECTED_NODE_ARCH}"

  # Publish only the previously reserved identity. Asset upload and verification
  # are retry-safe; publishing is deliberately the final command.
  release:
    name: release
    needs: [impact, audit, build, decide, identity, package, smoke]
    if: always() && needs.impact.result == 'success' && needs.audit.result == 'success' && needs.decide.outputs.changed == 'true' && needs.identity.result == 'success' && ((needs.package.result == 'success' && needs.smoke.result == 'success') || (needs.identity.outputs.published == 'true' && needs.package.result == 'skipped' && needs.smoke.result == 'skipped'))
    runs-on: ubuntu-latest
    environment: release-production
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.identity.outputs.version }}
      RELEASE_TAG: ${{ needs.identity.outputs.tag }}
      RELEASE_ID: ${{ needs.identity.outputs.release_id }}
      IDENTITY_PUBLISHED: ${{ needs.identity.outputs.published }}
      EXPECTED_FINGERPRINT: ${{ needs.build.outputs.fingerprint }}
      FORCED: ${{ needs.impact.outputs.forced }}
      IMPACT_RESULT: ${{ needs.impact.outputs.result_json }}
      AUDITED_SHA: ${{ needs.audit.outputs.audited_sha }}
      AUDITED_LOCK_SHA256: ${{ needs.audit.outputs.lock_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download packaged binaries
        if: needs.identity.outputs.published != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: srn-mcp-binaries
          path: out

      - name: Validate, upload, and publish exact release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUDITED_SHA"
          test "$AUDITED_SHA" = "$GITHUB_SHA"
          test "$(sha256sum yarn.lock | cut -d ' ' -f 1)" = "$AUDITED_LOCK_SHA256"
          test "$RELEASE_TAG" = "${TOOL}-v${RELEASE_VERSION}"
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_FINGERPRINT" =~ ^[0-9a-f]{64}$ ]]
          [[ "$FORCED" == "true" || "$FORCED" == "false" ]]
          jq -e --arg sha "$GITHUB_SHA" --argjson forced "$FORCED" '
            .headSha == $sha
            and .forced == $forced
            and (
              ($forced and (.forceReason | type == "string") and ((.forceReason | gsub("^\\s+|\\s+$"; "")) | length > 0))
              or (($forced | not) and .forceReason == null)
            )
          ' <<< "$IMPACT_RESULT" >/dev/null
          if [ "$FORCED" = "true" ]; then
            [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
            intent="forced-${GITHUB_RUN_ID}"
          else
            intent="automatic"
          fi
          marker="<!-- srn-release-reservation tool=${TOOL} commit=${GITHUB_SHA} fingerprint=${EXPECTED_FINGERPRINT} intent=${intent} -->"
          expected_name="${TOOL} ${RELEASE_VERSION}"

          expected_assets="$(mktemp)"
          {
            echo SHA256SUMS.txt
            echo "${TOOL}.fingerprint"
            echo "${TOOL}-windows-x64.exe"
            echo "${TOOL}-windows-arm64.exe"
            echo "${TOOL}-macos-x64"
            echo "${TOOL}-macos-arm64"
            echo "${TOOL}-linux-x64"
            echo "${TOOL}-linux-arm64"
            if [ "$TOOL" = "srn-home-server" ]; then
              echo "${TOOL}-migrations.zip"
            fi
          } | LC_ALL=C sort > "$expected_assets"

          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
          jq -e --arg tag "$RELEASE_TAG" --arg name "$expected_name" --arg sha "$GITHUB_SHA" --arg marker "$marker" '
            .tag_name == $tag
            and .name == $name
            and .target_commitish == $sha
            and (.draft == true or .draft == false)
            and .prerelease == false
            and ((.body // "") | contains($marker))
          ' <<< "$release" >/dev/null
          draft="$(jq -r '.draft' <<< "$release")"
          if [ "$IDENTITY_PUBLISHED" = "true" ]; then test "$draft" = "false"; fi

          git fetch --force --tags origin
          if [ "$draft" = "true" ]; then
            if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
              echo "Draft ${RELEASE_TAG} collides with an existing Git tag" >&2
              exit 1
            fi
          else
            git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"
          fi

          load_remote_assets() {
            assets_file="$(mktemp)"
            gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" --paginate --slurp |
              jq 'flatten' > "$assets_file"
            jq -e '
              all(.[];
                .state == "uploaded"
                and .size > 0
                and (.digest | type == "string")
                and (.digest | test("^sha256:[0-9a-f]{64}$"))
              )
            ' "$assets_file" >/dev/null
            remote_assets="$(mktemp)"
            jq -r '.[].name' "$assets_file" | LC_ALL=C sort > "$remote_assets"
            diff -u "$expected_assets" "$remote_assets"
          }

          bind_asset_manifest() {
            directory="$1"
            manifest_file="$(mktemp)"
            while IFS= read -r asset_name; do
              digest="$(sha256sum -- "${directory}/${asset_name}" | cut -d ' ' -f 1)"
              size="$(stat -c '%s' -- "${directory}/${asset_name}")"
              jq -n --arg name "$asset_name" --arg digest "sha256:${digest}" --argjson size "$size" \
                '{name: $name, digest: $digest, size: $size}'
            done < "$expected_assets" | jq -s 'sort_by(.name)' > "$manifest_file"
            asset_manifest_sha="$(jq -cS . "$manifest_file" | sha256sum | cut -d ' ' -f 1)"
            asset_marker="<!-- srn-release-assets-sha256:${asset_manifest_sha} -->"
            release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
            existing_asset_markers="$(jq '[.body // "" | scan("<!-- srn-release-assets-sha256:[0-9a-f]{64} -->")] | length' <<< "$release")"
            if [ "$existing_asset_markers" -eq 0 ]; then
              test "$(jq -r '.draft' <<< "$release")" = true
              current_body="$(jq -r '.body // ""' <<< "$release")"
              next_body="${current_body}"$'\n'"${asset_marker}"
              release="$(gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -f tag_name="$RELEASE_TAG" -f body="$next_body")"
            elif [ "$existing_asset_markers" -ne 1 ]; then
              echo "Reserved native draft asset manifest drifted from the exact local payload." >&2
              exit 1
            fi
            jq -e --arg marker "$asset_marker" '
              ((.body // "") | contains($marker))
              and (((.body // "") | [scan("<!-- srn-release-assets-sha256:[0-9a-f]{64} -->")] | length) == 1)
            ' <<< "$release" >/dev/null || {
              echo "Reserved native draft asset manifest drifted from the exact local payload." >&2
              exit 1
            }
          }

          verify_directory() {
            directory="$1"
            local_assets="$(mktemp)"
            find "$directory" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > "$local_assets"
            diff -u "$expected_assets" "$local_assets"
            (cd "$directory" && sha256sum --check SHA256SUMS.txt)
            test "$(tr -d '\r\n' < "${directory}/${TOOL}.fingerprint")" = "$EXPECTED_FINGERPRINT"
            bind_asset_manifest "$directory"
            load_remote_assets
            while IFS=$'\t' read -r asset_name digest; do
              actual="$(sha256sum -- "${directory}/${asset_name}" | cut -d ' ' -f 1)"
              test "$digest" = "sha256:${actual}"
            done < <(jq -r '.[] | [.name, .digest] | @tsv' "$assets_file")
          }

          if [ "$draft" = "false" ]; then
            if [ -d out ]; then
              verify_directory out
            else
              downloaded="$(mktemp -d)"
              gh release download "$RELEASE_TAG" --dir "$downloaded" --repo "$GITHUB_REPOSITORY"
              verify_directory "$downloaded"
            fi
            echo "${RELEASE_TAG} was already published by this workflow run; verified exact assets." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          test -d out
          local_assets="$(mktemp)"
          find out -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > "$local_assets"
          diff -u "$expected_assets" "$local_assets"
          (cd out && sha256sum --check SHA256SUMS.txt)
          test "$(tr -d '\r\n' < "out/${TOOL}.fingerprint")" = "$EXPECTED_FINGERPRINT"
          bind_asset_manifest out

          # Only this already validated, marker-bound draft may be cleaned.
          assets_file="$(mktemp)"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" --paginate --slurp |
            jq 'flatten' > "$assets_file"
          while IFS=$'\t' read -r asset_id asset_name; do
            if ! grep -Fqx -- "$asset_name" "$expected_assets"; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            fi
          done < <(jq -r '.[] | [.id, .name] | @tsv' "$assets_file")

          shopt -s nullglob
          files=(out/*)
          test "${#files[@]}" -eq "$(wc -l < "$expected_assets")"
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          verify_directory out

          # No fallible command follows publication. If the response is lost
          # after GitHub publishes, a rerun recognizes and verifies this run's
          # marker-bound published release instead of allocating a new version.
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false \
            -f make_latest=false >/dev/null
