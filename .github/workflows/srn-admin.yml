# Rolling release pipeline for the in-container admin CLI as a standalone binary.
#
# Packages @standardnotes/auth-server's `srn-admin` CLI (server/packages/auth/
# bin/srn_admin.ts) into native single-file executables (no Node/yarn install
# needed to run them).
#
# RUNTIME CAVEAT: srn-admin is NOT a standalone offline tool. It reuses the auth
# package's own DI container / DataSource and talks to a live SRN stack + its
# database (today: `docker compose exec server srn-admin <command>`). Shipping a
# native binary just removes the Node/yarn-install requirement to invoke it; the
# binary still needs a reachable database/stack to do anything.
#
# How: srn-admin lives in the server Yarn-PnP workspace (unlike the standalone
# srn-client/srn-server/srn-mcp packages), so the BUILD stage mirrors
# srn-home-server.yml — Corepack -> Yarn 4 -> `yarn install --immutable` in
# server/ -> `yarn build` (tsc, all server packages) -> esbuild-bundle the built
# CLI entry (dist/bin/srn_admin.js) into one CJS, reusing home-server's proven
# native-SQLite/CBOR externals. The PACKAGE/DECIDE/RELEASE stages mirror
# srn-client.yml: the 6-target @yao-pkg/pkg matrix, a content-fingerprint gate,
# SHA256SUMS.txt, a rolling `srn-admin-v<YY>.<N>` tag and `gh release create`.
#
# Unlike home-server there is NO migrations.zip — srn-admin never runs
# migrations (it starts the container in the lean 'cli' mode); it targets an
# already-migrated database.
#
# Stages (gated): build -> decide -> package -> release. A new rolling release is
# cut only when the bundle's content fingerprint changes.
name: srn-admin

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/srn-admin.yml'
  workflow_dispatch:
    inputs:
      force_release:
        description: Publish even when source and bundle fingerprints are unchanged
        required: false
        default: false
        type: boolean
      force_reason:
        description: Required audit reason when force_release is true
        required: false
        default: ''
        type: string

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  TOOL: srn-admin
  SERVER_DIR: server
  AUTH_DIR: server/packages/auth
  PKG_NODE: node24
  PKG_VERSION: '6.21.0'

jobs:
  impact:
    name: analyze release impact
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.impact.outputs.changed }}
      forced: ${{ steps.impact.outputs.forced }}
      base_ref: ${{ steps.impact.outputs.base_ref }}
      reason_codes: ${{ steps.impact.outputs.reason_codes }}
      result_json: ${{ steps.impact.outputs.result_json }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false

      - id: impact
        name: Compare srn-admin publishable surface with its latest release
        env:
          FORCE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_release || false }}
          FORCE_REASON: ${{ github.event_name == 'workflow_dispatch' && inputs.force_reason || '' }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          node scripts/analyze-release-impact.mjs \
            --target srn-admin \
            --head HEAD \
            --force "${FORCE_RELEASE}" \
            --force-reason "${FORCE_REASON}" \
            --output release-impact.json \
            --github-output "$GITHUB_OUTPUT"
          {
            echo '### srn-admin release impact'
            echo '```json'
            cat release-impact.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # 1) BUILD — install the PnP workspace, tsc-build every server package, then
  # esbuild-bundle the srn-admin CLI into a single CJS + a content fingerprint.
  build:
    name: build
    needs: impact
    if: needs.impact.outputs.changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      fingerprint: ${{ steps.fp.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          # The repo root declares packageManager: yarn@4. setup-node's default
          # cache probing runs before Corepack is enabled and sees global Yarn 1.x.
          package-manager-cache: false

      - name: Install Corepack (Yarn 4.17.1)
        run: npm install --global corepack@0.35.0 && corepack enable

      # better-sqlite3 is still a dependency (SQLite support in source) and is
      # built/unplugged during install even though the binary doesn't use it.
      - name: Install native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y python3 make g++

      - name: Install workspace (PnP)
        working-directory: ${{ env.SERVER_DIR }}
        run: yarn install --immutable

      - name: Build all server packages (tsc)
        working-directory: ${{ env.SERVER_DIR }}
        run: yarn build

      - name: Bundle srn-admin (esbuild)
        working-directory: ${{ env.SERVER_DIR }}
        run: yarn workspace @standardnotes/auth-server build:bundle

      - name: Compute content fingerprint
        id: fp
        working-directory: ${{ env.AUTH_DIR }}
        run: |
          set -euo pipefail
          fp="$(sha256sum dist/bundle/srn-admin.cjs | awk '{print $1}')"
          echo "fingerprint=${fp}" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$fp" > "dist/bundle/${TOOL}.fingerprint"
          echo "Bundle fingerprint: ${fp}"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: srn-admin-bundle
          path: |
            ${{ env.AUTH_DIR }}/dist/bundle/srn-admin.cjs
            ${{ env.AUTH_DIR }}/dist/bundle/srn-admin.fingerprint
          retention-days: 1
          if-no-files-found: error

  # 2) DECIDE — release only if the bundle changed since the last release.
  decide:
    name: decide
    needs: [impact, build]
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.cmp.outputs.changed }}
    steps:
      - name: Compare against last released fingerprint
        id: cmp
        env:
          BASE_REF: ${{ needs.impact.outputs.base_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_FP: ${{ needs.build.outputs.fingerprint }}
          FORCED: ${{ needs.impact.outputs.forced }}
        run: |
          set -euo pipefail
          if [ "$FORCED" = "true" ]; then
            echo "Audited force request bypasses the bundle fingerprint comparison."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BASE_REF" ]; then
            echo "No prior ${TOOL} release -> changed."
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          old_fp=""
          if gh release download "$BASE_REF" --repo "$GITHUB_REPOSITORY" --pattern "${TOOL}.fingerprint" --output old.fp --clobber 2>/dev/null; then
            old_fp="$(tr -d '[:space:]' < old.fp)"
          fi
          if [ -n "$old_fp" ] && [ "$old_fp" = "$NEW_FP" ]; then
            echo "Unchanged since ${BASE_REF} -> skip."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changed since ${BASE_REF} -> release."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # 3) PACKAGE — cross-compile the 6 native executables from the single bundle.
  package:
    name: package
    needs: [build, decide]
    if: needs.decide.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          # This job only runs npx against a downloaded artifact; avoid setup-node
          # auto-detecting the repo's Yarn 4 packageManager field.
          package-manager-cache: false

      - name: Download bundle artifact
        uses: actions/download-artifact@v8
        with:
          name: srn-admin-bundle
          path: bundle

      - name: Package native executables
        run: |
          set -euo pipefail
          mkdir -p out
          # OS/arch matrix -> deterministic output names. pkg names a target as
          # "<node>-<os>-<arch>"; Windows binaries get a .exe suffix.
          declare -A TARGETS=(
            ["${TOOL}-windows-x64.exe"]="${PKG_NODE}-win-x64"
            ["${TOOL}-windows-arm64.exe"]="${PKG_NODE}-win-arm64"
            ["${TOOL}-macos-x64"]="${PKG_NODE}-macos-x64"
            ["${TOOL}-macos-arm64"]="${PKG_NODE}-macos-arm64"
            ["${TOOL}-linux-x64"]="${PKG_NODE}-linux-x64"
            ["${TOOL}-linux-arm64"]="${PKG_NODE}-linux-arm64"
          )
          for out_name in "${!TARGETS[@]}"; do
            echo "::group::pkg ${TARGETS[$out_name]} -> $out_name"
            npx --yes "@yao-pkg/pkg@${PKG_VERSION}" \
              --no-signature \
              --targets "${TARGETS[$out_name]}" \
              --output "out/${out_name}" \
              bundle/srn-admin.cjs
            echo "::endgroup::"
          done
          # Carry the fingerprint forward so it gets attached to the release.
          cp "bundle/${TOOL}.fingerprint" "out/${TOOL}.fingerprint"
          echo "Produced:"
          ls -la out

      - name: Generate checksums
        working-directory: out
        run: |
          # Checksum only the executables (exclude the fingerprint helper file).
          sha256sum "${TOOL}"-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Upload packaged binaries
        uses: actions/upload-artifact@v7
        with:
          name: srn-admin-binaries
          path: out/*
          retention-days: 1
          if-no-files-found: error

  # 4) RELEASE — rolling YY.N version, namespaced tag, GitHub Release with the 6
  # binaries + checksums + fingerprint.
  release:
    name: release
    needs: [decide, package]
    if: needs.decide.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@v8
        with:
          name: srn-admin-binaries
          path: out

      # Rolling version: YY.N, resetting N each calendar year, namespaced per
      # tool. List existing releases for THIS tool's "srn-admin-v<YY>." tag
      # prefix, take the max N, and add 1 (default 1 if none yet).
      - name: Compute rolling version
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          YY="$(date -u +%y)"
          prefix="${TOOL}-v${YY}."
          max=0
          while read -r tag; do
            [ -z "$tag" ] && continue
            n="${tag#"$prefix"}"
            if [[ "$n" =~ ^[0-9]+$ ]] && [ "$n" -gt "$max" ]; then
              max="$n"
            fi
          done < <(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' | grep -F "${prefix}" || true)
          next=$((max + 1))
          version="${YY}.${next}"
          tag="${TOOL}-v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Next ${TOOL} release: ${tag} (version ${version})"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ env.TOOL }} ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          # /releases/latest is repo-global and electron-updater resolves the
          # desktop channel file through it; only srn-desktop may claim it.
          make_latest: 'false'
          fail_on_unmatched_files: true
          files: |
            out/*
