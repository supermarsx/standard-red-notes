# Rolling release pipeline for the `srn-client` CLI tool.
#
# Gated stages (each only runs if the previous succeeded, via `needs:`):
#   (lint, test, format) -> build -> decide -> package -> release
# The three check jobs run in parallel; build fans in on all three.
#
# Trigger: push to `main` that touches the tool (or manual dispatch). A new
# rolling release `srn-client <YY.N>` is cut ONLY when the freshly built bundle
# differs from the last released one (content fingerprint gate); no-op pushes
# do not create a release.
name: srn-client

on:
  push:
    branches: [main]
    paths:
      - 'cli/srn-client/**'
      - 'cli/.prettierrc'
      - 'scripts/native-cli-release.mjs'
      - 'scripts/release-packaging-contract.mjs'
      - '.github/workflows/srn-client.yml'
  workflow_dispatch:
    inputs:
      force_release:
        description: Publish even when source and bundle fingerprints are unchanged
        required: false
        default: false
        type: boolean
      force_reason:
        description: Required audit reason when force_release is true
        required: false
        default: ''
        type: string

# The release job creates a tag + GitHub Release, so it needs write access to
# repository contents. All other jobs inherit the default read-only token.
permissions:
  contents: read

concurrency:
  group: srn-client-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  TOOL: srn-client
  TOOL_DIR: cli/srn-client
  NODE_VERSION: '26'

jobs:
  impact:
    name: analyze release impact
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.impact.outputs.changed }}
      forced: ${{ steps.impact.outputs.forced }}
      base_ref: ${{ steps.impact.outputs.base_ref }}
      baseline_status: ${{ steps.impact.outputs.baseline_status }}
      publication_gate: ${{ steps.impact.outputs.publication_gate }}
      reason_codes: ${{ steps.impact.outputs.reason_codes }}
      result_json: ${{ steps.impact.outputs.result_json }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Validate release packaging contract
        run: node scripts/validate-release-contract.mjs

      - id: impact
        name: Compare srn-client publishable surface with its latest release
        env:
          FORCE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_release || false }}
          FORCE_REASON: ${{ github.event_name == 'workflow_dispatch' && inputs.force_reason || '' }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          node scripts/analyze-release-impact.mjs \
            --target srn-client \
            --head HEAD \
            --force "${FORCE_RELEASE}" \
            --force-reason "${FORCE_REASON}" \
            --output release-impact.json \
            --github-output "$GITHUB_OUTPUT"
          {
            echo '### srn-client release impact'
            echo '```json'
            cat release-impact.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # 1) CHECK — lint, format and test run as three INDEPENDENT parallel jobs;
  # `build` fans in on all three (needs: [lint, test, format]).
  #
  # srn-client is a standalone npm package (its own committed package-lock.json,
  # not part of any yarn workspace root). It has its own deps, so each job
  # installs its own — via `npm ci`, so the tree is reproducible and cannot drift
  # with upstream publishes.
  # The shared monorepo workspaces (root / app / server) are NOT needed to
  # check or build this CLI, so we keep these jobs lean.

  # 1a) LINT — strict typecheck (tsc --noEmit) is this TS CLI's lint gate, plus
  # a package-shape assertion so a missing/renamed entry point fails loudly.
  lint:
    name: lint
    needs: impact
    if: needs.impact.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.TOOL_DIR }}/package-lock.json

      - name: Install tool dependencies
        working-directory: ${{ env.TOOL_DIR }}
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: ${{ env.TOOL_DIR }}
        run: npm run typecheck

      - name: Verify package shape
        working-directory: ${{ env.TOOL_DIR }}
        run: |
          node -e "const p=require('./package.json'); if(!p.bin||!p.bin['srn-client']) {console.error('missing bin'); process.exit(1)}"
          test -f esbuild.config.mjs
          test -f src/index.ts

  # 1b) FORMAT — Prettier check against the shared cli/.prettierrc style. No
  # install needed; prettier runs via npx and auto-discovers cli/.prettierrc.
  format:
    name: format
    needs: impact
    if: needs.impact.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          # This job runs only `npx prettier` (no install), so skip setup-node's
          # auto package-manager cache — it would otherwise detect the repo
          # root's `packageManager: yarn@4` and fail under the runner's yarn 1.x.
          package-manager-cache: false

      - name: Check formatting
        working-directory: ${{ env.TOOL_DIR }}
        run: npx --yes prettier@3.9.5 --check "src/**/*.ts" "test/**/*.ts" "*.mjs"

  # 1c) TEST — the `node --test` unit suite over the pure core (arg parsing,
  # local session/keychain config, import/export shaping), then the functional
  # gate: build via esbuild, assert a non-empty bundle, then smoke-run --help
  # (tolerant of a non-zero help exit code).
  test:
    name: test
    needs: impact
    if: needs.impact.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.TOOL_DIR }}/package-lock.json

      - name: Install tool dependencies
        working-directory: ${{ env.TOOL_DIR }}
        run: npm ci --no-audit --no-fund

      - name: Build bundle
        working-directory: ${{ env.TOOL_DIR }}
        run: npm run build

      - name: Run unit tests
        working-directory: ${{ env.TOOL_DIR }}
        run: npm test

      - name: Smoke-test bundle
        working-directory: ${{ env.TOOL_DIR }}
        run: |
          test -s dist/index.cjs
          node dist/index.cjs --help || true

  # 2) BUILD — produce the bundled CJS entry (dist/index.cjs) via esbuild and a
  # deterministic content fingerprint (sha256 of that bundle). The esbuild
  # output is byte-reproducible (no timestamps), so this fingerprint is a stable
  # identity for "what would we ship". We do NOT fingerprint the pkg binaries —
  # pkg embeds the Node version/timestamps, so those are not reproducible.
  build:
    name: build
    needs: [impact, lint, test, format]
    if: needs.impact.outputs.changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      fingerprint: ${{ steps.fp.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.TOOL_DIR }}/package-lock.json

      - name: Install tool dependencies
        working-directory: ${{ env.TOOL_DIR }}
        run: npm ci --no-audit --no-fund

      - name: Build bundle
        working-directory: ${{ env.TOOL_DIR }}
        run: npm run build

      - name: Smoke-test bundle
        working-directory: ${{ env.TOOL_DIR }}
        run: node dist/index.cjs --help || true

      - name: Compute payload and native-packaging contract fingerprint
        id: fp
        working-directory: ${{ env.TOOL_DIR }}
        run: |
          set -euo pipefail
          node ../../scripts/native-cli-release.mjs fingerprint \
            --tool "$TOOL" \
            --bundle dist/index.cjs \
            --out-dir out \
            --root . \
            --path dist/index.cjs \
            --output "dist/${TOOL}.fingerprint" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: srn-client-bundle
          path: |
            ${{ env.TOOL_DIR }}/dist/index.cjs
            ${{ env.TOOL_DIR }}/dist/srn-client.fingerprint
          retention-days: 1
          if-no-files-found: error

  # 3) DECIDE — compare the new bundle fingerprint against the one stored on the
  # most recent release for THIS tool. Output changed=true to proceed, or
  # changed=false to skip packaging + release entirely (a successful no-op).
  decide:
    name: decide
    needs: [impact, build]
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.cmp.outputs.changed }}
      decision: ${{ steps.cmp.outputs.decision }}
    steps:
      - uses: actions/checkout@v7

      - name: Compare against last released fingerprint
        id: cmp
        env:
          BASE_REF: ${{ needs.impact.outputs.base_ref }}
          BASELINE_STATUS: ${{ needs.impact.outputs.baseline_status }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_FP: ${{ needs.build.outputs.fingerprint }}
          FORCED: ${{ needs.impact.outputs.forced }}
        run: |
          set -euo pipefail
          if ! node scripts/compare-release-fingerprints.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --base-ref "$BASE_REF" \
            --baseline-status "$BASELINE_STATUS" \
            --forced "$FORCED" \
            --fingerprint "${TOOL}.fingerprint=${NEW_FP}" \
            --output release-fingerprint-comparison.json \
            --github-output "$GITHUB_OUTPUT"; then
            cat release-fingerprint-comparison.json >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cat release-fingerprint-comparison.json >> "$GITHUB_STEP_SUMMARY"

  # 4) PACKAGE — cross-compile native executables for every OS x arch from the
  # single bundled CJS entry, using @yao-pkg/pkg on one Linux runner. Skipped
  # when the bundle is unchanged.
  package:
    name: package
    needs: [build, decide]
    if: needs.decide.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Packaging only runs `npx @yao-pkg/pkg` against the prebuilt bundle
          # artifact (no install), so skip the auto package-manager cache that
          # would detect the repo root's `packageManager: yarn@4` and fail.
          package-manager-cache: false

      - name: Download bundle artifact
        uses: actions/download-artifact@v8
        with:
          name: srn-client-bundle
          path: ${{ env.TOOL_DIR }}/dist

      - name: Package native executables
        working-directory: ${{ env.TOOL_DIR }}
        run: |
          set -euo pipefail
          node ../../scripts/native-cli-release.mjs package \
            --tool "$TOOL" \
            --bundle dist/index.cjs \
            --out-dir out
          # Carry the fingerprint forward so it gets attached to the release.
          cp "dist/${TOOL}.fingerprint" "out/${TOOL}.fingerprint"
          echo "Produced:"
          ls -la out

      - name: Generate checksums
        working-directory: ${{ env.TOOL_DIR }}/out
        run: |
          # Checksum only the executables (exclude the fingerprint helper file).
          sha256sum "${TOOL}"-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Upload packaged binaries
        uses: actions/upload-artifact@v7
        with:
          name: srn-client-binaries
          path: ${{ env.TOOL_DIR }}/out/*
          retention-days: 1
          if-no-files-found: error

  # 5) RELEASE — compute a rolling YY.N version for THIS tool, create a
  # namespaced tag, and publish a GitHub Release with the 6 binaries, the
  # checksums, and the fingerprint asset (read back by the next run's decide).
  release:
    name: release
    needs: [decide, package]
    if: needs.decide.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download packaged binaries
        uses: actions/download-artifact@v8
        with:
          name: srn-client-binaries
          path: out

      # Rolling version: YY.N, resetting N each calendar year, namespaced per
      # tool. List existing releases for THIS tool's "srn-client-v<YY>." tag
      # prefix, take the max N, and add 1 (default 1 if none yet).
      - name: Compute rolling version
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          YY="$(date -u +%y)"
          prefix="${TOOL}-v${YY}."
          max=0
          while read -r tag; do
            [ -z "$tag" ] && continue
            n="${tag#"$prefix"}"
            if [[ "$n" =~ ^[0-9]+$ ]] && [ "$n" -gt "$max" ]; then
              max="$n"
            fi
          done < <(git tag --list "${prefix}*")
          next=$((max + 1))
          version="${YY}.${next}"
          tag="${TOOL}-v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Next ${TOOL} release: ${tag} (version ${version})"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ env.TOOL }} ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          # /releases/latest is repo-global and electron-updater resolves the
          # desktop channel file through it; only srn-desktop may claim it.
          make_latest: 'false'
          fail_on_unmatched_files: true
          files: |
            out/*
