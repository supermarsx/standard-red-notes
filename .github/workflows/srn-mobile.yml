                "$RUNNER_TEMP/testflight-distribution-preflight.json"
              mkdir -p "$stage_dir"
              jq -n --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" --arg sha "$GITHUB_SHA" \
                --arg version "$app_version" --arg build "$build_number" --arg build_id "$build_id" --arg fp "$fingerprint" \
                --arg upload_sha "$upload_intent_sha" --arg artifact_sha "$ipa_sha" --arg artifact_md5 "$ipa_md5" \
                --argjson artifact_size "$ipa_size" --arg manifest_sha "$manifest_sha" \
                '{schema: 1, provider: "app-store-connect", stage: "testflight-external-distribution", runId: $run,
                  originatingRunAttempt: $attempt, headSha: $sha, bundleId: "com.standardnotes.standardnotes",
                  appVersion: $version, buildNumber: $build, buildId: $build_id, fingerprint: $fp,
