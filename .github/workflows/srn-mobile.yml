                "$RUNNER_TEMP/testflight-distribution-preflight.json"
              echo 'create_marker=false' >> "$GITHUB_OUTPUT"; echo 'mutation_required=true' >> "$GITHUB_OUTPUT" ;;
            valid:true)
              jq -e '.reconcilable == true and .reconciliationOperations == []' \
                "$RUNNER_TEMP/testflight-distribution-preflight.json"
              echo 'create_marker=false' >> "$GITHUB_OUTPUT"; echo 'mutation_required=false' >> "$GITHUB_OUTPUT" ;;
