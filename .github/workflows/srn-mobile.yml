# Production mobile release pipeline for the Standard Red Notes Android and iOS apps.
#
# GitHub only discovers workflows in the repository-root .github/workflows directory.
# This root workflow mirrors the release intent of app/.github/workflows while using
# paths that are valid for this monorepo checkout.
name: srn-mobile

on:
  push:
    tags:
      - '@standardnotes/web@*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: srn-mobile-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - id: version
        name: Resolve mobile release version
        run: |
          set -euo pipefail
          version="$(node -p "require('./app/packages/web/package.json').version.split('-')[0]")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid mobile release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=@standardnotes/mobile@$version" >> "$GITHUB_OUTPUT"

  android:
    name: android (arm64-v8a + x86_64)
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: app/packages/mobile
    env:
      PACKAGE_VERSION: ${{ needs.version.outputs.version }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.nvmrc
          package-manager-cache: false

      - name: Enable Corepack
        working-directory: app
        run: npm install --global corepack@0.35.0 && corepack enable

      - name: Cache Yarn
        uses: actions/cache@v6.1.0
        with:
          path: app/.yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('app/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Set up Java
        uses: actions/setup-java@v5.5.0
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@v1.319.0
        with:
          ruby-version: '3.4.7'
          bundler-cache: true
          working-directory: app/packages/mobile

      - name: Increase file watcher limit
        run: echo fs.inotify.max_user_watches=524288 | sudo tee /etc/sysctl.d/99-standard-red-notes.conf && sudo sysctl --system

      - name: Decode production Android keystore
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSPHRASE: ${{ secrets.KEYSTORE_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE"
          test -n "$KEYSTORE_PASSPHRASE"
          printf '%s' "$ANDROID_KEYSTORE" > keystore.keystore.asc
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$KEYSTORE_PASSPHRASE" \
            --decrypt keystore.keystore.asc > android/app/keystore.keystore
          test -s android/app/keystore.keystore

      - name: Install workspace dependencies
        working-directory: app
        run: yarn install --immutable

      - name: Build web UI
        working-directory: app
        run: yarn build:web

      - name: Prepare embedded mobile web bundle
        run: yarn bundle:web

      - name: Build and publish Android production release
        env:
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GOOGLE_PLAY_JSON_KEY_DATA: ${{ secrets.GOOGLE_PLAY_JSON_KEY_DATA }}
        run: bundle exec fastlane android prod

      - name: Verify universal Android release architectures
        run: |
          set -euo pipefail
          apk='android/app/build/outputs/apk/prod/release/app-prod-release.apk'
          aab='android/app/build/outputs/bundle/prodRelease/app-prod-release.aab'
          test -s "$apk"
          test -s "$aab"

          configured="$(sed -n 's/^reactNativeArchitectures=//p' android/gradle.properties)"
          unzip -Z1 "$apk" > "$RUNNER_TEMP/android-apk-entries.txt"
          unzip -Z1 "$aab" > "$RUNNER_TEMP/android-aab-entries.txt"

          for arch in arm64-v8a x86_64; do
            case ",$configured," in
              *",$arch,"*) ;;
              *) echo "reactNativeArchitectures is missing $arch" >&2; exit 1 ;;
            esac
            grep -Eq "^lib/$arch/.+\\.so$" "$RUNNER_TEMP/android-apk-entries.txt" || {
              echo "Universal APK is missing native $arch payloads" >&2
              exit 1
            }
            grep -Eq "^base/lib/$arch/.+\\.so$" "$RUNNER_TEMP/android-aab-entries.txt" || {
              echo "App Bundle is missing native $arch payloads" >&2
              exit 1
            }
          done

          stage="$RUNNER_TEMP/srn-mobile-android"
          mkdir -p "$stage"
          cp "$apk" "$stage/standard-red-notes-android-universal-${PACKAGE_VERSION}.apk"
          cp "$aab" "$stage/standard-red-notes-android-${PACKAGE_VERSION}.aab"

      - name: Upload validated Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: srn-mobile-android
          path: ${{ runner.temp }}/srn-mobile-android/*
          retention-days: 2
          if-no-files-found: error

  ios:
    name: ios (device arm64)
    needs: version
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: app/packages/mobile
    env:
      PACKAGE_VERSION: ${{ needs.version.outputs.version }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.nvmrc
          package-manager-cache: false

      - name: Enable Corepack
        working-directory: app
        run: npm install --global corepack@0.35.0 && corepack enable

      - name: Cache Yarn
        uses: actions/cache@v6.1.0
        with:
          path: app/.yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('app/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: '26'

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@v1.319.0
        with:
          ruby-version: '3.4.7'
          bundler-cache: true
          working-directory: app/packages/mobile

      - name: Install workspace dependencies
        working-directory: app
        run: yarn install --immutable

      - name: Build web UI
        working-directory: app
        run: yarn build:web

      - name: Prepare embedded mobile web bundle
        run: yarn bundle:web

      - name: Install iOS pods
        run: yarn install:pods

      - name: Configure certificate repository access
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Export App Store Connect API key
        env:
          APPSTORE_CONNECT_KEY: ${{ secrets.APPSTORE_CONNECT_KEY }}
        run: |
          set -euo pipefail
          test -n "$APPSTORE_CONNECT_KEY"
          printf '%s' "$APPSTORE_CONNECT_KEY" > ios/Authkey.p8
          test -s ios/Authkey.p8

      - name: Set up iOS signing keychain
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: bundle exec fastlane ios setup

      - name: Build and publish iOS production release
        env:
          APPLE_APP_ID: ${{ secrets.APP_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPSTORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          APPSTORE_CONNECT_KEY_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ISSUER_ID }}
          FASTLANE_PASSWORD: ${{ secrets.FASTLANE_PASSWORD }}
          FASTLANE_SESSION: ${{ secrets.FASTLANE_SESSION }}
          FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
          MATCH_CERTIFICATES_URL: ${{ secrets.MATCH_CERTIFICATES_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: bundle exec fastlane ios prod

      - name: Verify iOS device arm64 artifact
        run: |
          set -euo pipefail
          ipa="$(find . -type f -name 'StandardNotes.ipa' -print -quit)"
          test -n "$ipa"
          test -s "$ipa"

          extract_dir="$RUNNER_TEMP/standard-red-notes-ios-release"
          rm -rf "$extract_dir"
          unzip -q "$ipa" -d "$extract_dir"
          app_bundle="$(find "$extract_dir/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app_bundle"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_bundle/Info.plist")"
          archs="$(lipo -archs "$app_bundle/$executable")"
          echo "iOS device architectures: $archs"

          case " $archs " in
            *' arm64 '*) ;;
            *) echo 'iOS device artifact is missing arm64' >&2; exit 1 ;;
          esac
          case " $archs " in
            *' x86_64 '*|*' i386 '*) echo 'Simulator architecture found in iOS device artifact' >&2; exit 1 ;;
          esac

          stage="$RUNNER_TEMP/srn-mobile-ios"
          mkdir -p "$stage"
          cp "$ipa" "$stage/standard-red-notes-ios-arm64-${PACKAGE_VERSION}.ipa"

      - name: Upload validated iOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: srn-mobile-ios
          path: ${{ runner.temp }}/srn-mobile-ios/*
          retention-days: 2
          if-no-files-found: error

  release:
    name: release
    needs: [version, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated mobile artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: srn-mobile-*
          path: artifacts
          merge-multiple: true

      - name: Verify release payload and generate checksums
        working-directory: artifacts
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          test -s "standard-red-notes-android-universal-${VERSION}.apk"
          test -s "standard-red-notes-android-${VERSION}.aab"
          test -s "standard-red-notes-ios-arm64-${VERSION}.ipa"
          mapfile -d '' files < <(find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z)
          test "${#files[@]}" -eq 3
          sha256sum "${files[@]}" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Standard Red Notes Mobile ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: true
          draft: false
          files: |
            artifacts/*
