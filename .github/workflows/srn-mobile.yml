          PROVIDER_EVIDENCE_PATH="$RUNNER_TEMP/app-store-distribute.json" PROVIDER_WAIT_SECONDS=1800 \
            bundle exec fastlane ios inspect_upload
          jq -e '.status == "valid" and .valid == true' "$RUNNER_TEMP/app-store-distribute.json"
          build_id="$(jq -r '.buildId' "$RUNNER_TEMP/app-store-distribute.json")"
          test -n "$build_id"; test "$build_id" != null
          manifest_sha="$(shasum -a 256 "$payload/SHA256SUMS.txt" | awk '{print $1}')"
          upload_intent_sha="$(shasum -a 256 "$marker" | awk '{print $1}')"
          stage_name="srn-mobile-testflight-distribution-intent-${GITHUB_RUN_ID}"
          stage_dir="$RUNNER_TEMP/testflight-distribution-intent"; stage_marker="$stage_dir/marker.json"
          stage_artifacts="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=${stage_name}&per_page=100")"
          stage_count="$(jq '[.artifacts[] | select(.expired == false)] | length' <<< "$stage_artifacts")"
          [ "$stage_count" -le 1 ]
