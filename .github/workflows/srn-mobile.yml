              jq -e '.reconcilable == true and
                .reconciliationOperations == ["public-group-membership", "beta-review-submission"]' \
                "$RUNNER_TEMP/testflight-distribution-preflight.json"
              echo 'create_marker=false' >> "$GITHUB_OUTPUT"; echo 'mutation_required=true' >> "$GITHUB_OUTPUT" ;;
