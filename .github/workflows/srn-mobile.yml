# Production mobile release pipeline for the Standard Red Notes Android and iOS apps.
#
# GitHub only discovers workflows in the repository-root .github/workflows directory.
# This root workflow mirrors the release intent of app/.github/workflows while using
# paths that are valid for this monorepo checkout.
name: srn-mobile

on:
  push:
    branches: [main]
    # Branch pushes only run impact analysis. This exact list covers the mobile
    # package's computed app-workspace dependency closure; the release-contract
    # validator fails if a future dependency edge outgrows it.
    paths:
      - "app/packages/api/**"
      - "app/packages/encryption/**"
      - "app/packages/features/**"
      - "app/packages/filepicker/**"
      - "app/packages/files/**"
      - "app/packages/icons/**"
      - "app/packages/mobile/**"
      - "app/packages/models/**"
      - "app/packages/responses/**"
      - "app/packages/services/**"
      - "app/packages/sncrypto-common/**"
      - "app/packages/sncrypto-web/**"
      - "app/packages/snjs/**"
      - "app/packages/styles/**"
      - "app/packages/toast/**"
      - "app/packages/ui-services/**"
      - "app/packages/utils/**"
      - "app/packages/web/**"
      - "app/.github/workflows/mobile.release.prod.yml"
      - "app/.nvmrc"
      - "app/.yarnrc.yml"
      - "app/.yarn/patches/**"
      - "app/.yarn/releases/**"
      - "app/babel.config.js"
      - "app/package.json"
      - "app/tsconfig.base.json"
      - "app/yarn.lock"
      - "scripts/package.json"
      - "scripts/package-lock.json"
      - "scripts/release-packaging-contract.mjs"
      - ".github/workflows/srn-mobile.yml"
    tags:
      - "@standardnotes/web@*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: Explicitly request app-store and GitHub publication after impact/fingerprint checks
        required: false
        default: false
        type: boolean
      force_release:
        description: Publish even when the mobile surface is unchanged
        required: false
        default: false
        type: boolean
      force_reason:
        description: Required audit reason when force_release is true
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: srn-mobile-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  impact:
    name: analyze release impact
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.impact.outputs.changed }}
      forced: ${{ steps.impact.outputs.forced }}
      base_ref: ${{ steps.impact.outputs.base_ref }}
      baseline_status: ${{ steps.impact.outputs.baseline_status }}
      publication_gate: ${{ steps.impact.outputs.publication_gate }}
      reason_codes: ${{ steps.impact.outputs.reason_codes }}
      result_json: ${{ steps.impact.outputs.result_json }}
      publish_requested: ${{ steps.request.outputs.publish_requested }}
      publication_source: ${{ steps.request.outputs.publication_source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Prove publication source is protected main or its exact release tag
        run: |
          set -euo pipefail
          git fetch --no-tags --force origin refs/heads/main:refs/remotes/origin/main
          protected_sha="$(git rev-parse "refs/remotes/origin/main^{commit}")"
          case "$GITHUB_EVENT_NAME:$GITHUB_REF_TYPE" in
            workflow_dispatch:branch)
              if [ "$GITHUB_REF" != refs/heads/main ] || [ "$GITHUB_SHA" != "$protected_sha" ]; then
                echo "Manual mobile publication must run from the fetched protected main head ($protected_sha)." >&2
                exit 1
              fi
              ;;
            push:tag)
              tagged_commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
              [ "$tagged_commit" = "$GITHUB_SHA" ] || {
                echo "Tag resolves to $tagged_commit instead of event commit $GITHUB_SHA." >&2
                exit 1
              }
              git merge-base --is-ancestor "$tagged_commit" "$protected_sha" || {
                echo "Release tag commit $tagged_commit is not contained in protected origin/main at $protected_sha." >&2
                exit 1
              }
              ;;
            push:branch)
              [ "$GITHUB_REF" = refs/heads/main ] && [ "$GITHUB_SHA" = "$protected_sha" ] || {
                echo "Mobile impact analysis branch event is not the fetched main head." >&2
                exit 1
              }
              ;;
            *) echo "Unsupported mobile workflow source: $GITHUB_EVENT_NAME $GITHUB_REF" >&2; exit 1 ;;
          esac

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          package-manager-cache: false

      - name: Install release policy dependencies
        run: npm ci --prefix scripts --ignore-scripts --no-audit --no-fund

      - name: Validate release packaging contract
        run: node scripts/validate-release-contract.mjs

      - id: request
        name: Resolve analysis-only versus explicit publication intent
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          MANUAL_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release || false }}
          FORCE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_release || false }}
        run: |
          set -euo pipefail
          publish_requested=false
          publication_source=analysis-only
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            case "$REF_NAME" in
              @standardnotes/web@*)
                publish_requested=true
                publication_source=web-release-tag
                ;;
              *)
                echo "Unexpected mobile publication tag: $REF_NAME" >&2
                exit 1
                ;;
            esac
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$FORCE_RELEASE" = "true" ] && [ "$MANUAL_PUBLISH" != "true" ]; then
              echo "force_release requires publish_release=true; an analysis-only dispatch cannot force publication." >&2
              exit 1
            fi
            if [ "$MANUAL_PUBLISH" = "true" ]; then
              publish_requested=true
              publication_source=manual-explicit
            fi
          fi
          echo "publish_requested=$publish_requested" >> "$GITHUB_OUTPUT"
          echo "publication_source=$publication_source" >> "$GITHUB_OUTPUT"

      - id: impact
        name: Compare mobile publishable surface with its latest release
        env:
          FORCE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_release || false }}
          FORCE_REASON: ${{ github.event_name == 'workflow_dispatch' && inputs.force_reason || '' }}
        run: |
          set -euo pipefail
          node scripts/analyze-release-impact.mjs \
            --target srn-mobile \
            --head HEAD \
            --force "${FORCE_RELEASE}" \
            --force-reason "${FORCE_REASON}" \
            --output release-impact.json \
            --github-output "$GITHUB_OUTPUT"
          {
            echo '### Mobile release impact'
            echo '```json'
            cat release-impact.json
            echo '```'
            echo
            echo "Publication requested: ${{ steps.request.outputs.publish_requested }} (${{ steps.request.outputs.publication_source }})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mobile impact evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: srn-mobile-impact-${{ github.run_id }}
          path: release-impact.json
          retention-days: 30
          if-no-files-found: error

  version:
    name: version
    needs: impact
    if: needs.impact.outputs.changed == 'true' && needs.impact.outputs.publish_requested == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - id: version
        name: Resolve mobile release version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./app/packages/web/package.json').version")"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid mobile release version: $version" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/@standardnotes/web@* ]]; then
            requested="${GITHUB_REF_NAME#@standardnotes/web@}"
            [[ "$requested" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            if [ "$GITHUB_REF_NAME" != "@standardnotes/web@$version" ]; then
              echo "Web release tag version '$requested' does not match app/packages/web/package.json '$version'." >&2
              exit 1
            fi
          fi
          tag="@standardnotes/mobile@$version"
          tag_exists=false
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            tag_exists=true
          fi
          api_tag="$(node -p "encodeURIComponent(process.argv[1])" "$tag")"
          status="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/mobile-release.json" \
            --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${api_tag}")"
          case "$status" in
            404)
              if [ "$tag_exists" = true ]; then
                echo "Mobile tag exists without a recoverable release record: $tag" >&2
                exit 1
              fi
              ;;
            200)
              jq -e --arg tag "$tag" --arg sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" --arg version "$version" \
                '.tag_name == $tag and (.body // "" | contains("<!-- srn-mobile-release-intent:run=" + $run + ";sha=" + $sha + ";version=" + $version + ";"))' \
                "$RUNNER_TEMP/mobile-release.json" >/dev/null || {
                  echo "Mobile release identity is owned by another run or commit: $tag" >&2
                  exit 1
                }
              ;;
            *) cat "$RUNNER_TEMP/mobile-release.json" >&2; echo "Unable to reserve mobile release identity (HTTP $status)" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # Build deterministic Android/iOS JavaScript bundles plus the embedded web
  # payload before either Fastlane lane can publish externally. Native
  # installers are signed/version-stamped and therefore not reproducible, but
  # these executable inputs are. A shared lockfile-only change can now prove it
  # did not alter the mobile product and stop before Google Play/App Store.
  fingerprint:
    name: fingerprint release inputs
    needs: version
    runs-on: ubuntu-latest
    outputs:
      fingerprint: ${{ steps.fingerprint.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: app/.nvmrc
          package-manager-cache: false

      - name: Enable Corepack
        working-directory: app
        run: npm install --global corepack@0.35.0 && corepack enable

      - name: Install workspace dependencies
        working-directory: app
        run: yarn install --immutable

      - name: Build embedded web UI
        working-directory: app
        run: yarn build:web

      - name: Build deterministic mobile JavaScript payloads
        working-directory: app/packages/mobile
        run: |
          set -euo pipefail
          rm -rf html/Web.bundle/src/web-src .release-impact
          mkdir -p .release-impact/android-assets .release-impact/ios-assets
          yarn bundle:web
          yarn react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output .release-impact/index.android.bundle \
            --assets-dest .release-impact/android-assets \
            --reset-cache
          yarn react-native bundle \
            --platform ios \
            --dev false \
            --entry-file index.js \
            --bundle-output .release-impact/index.ios.bundle \
            --assets-dest .release-impact/ios-assets \
            --reset-cache

      - id: fingerprint
        name: Fingerprint executable mobile release inputs
        run: |
          set -euo pipefail
          mkdir -p release-fingerprint
          node scripts/release-packaging-contract.mjs \
            --contract mobile \
            --root . \
            --path app/packages/mobile/.release-impact \
            --path app/packages/mobile/html/Web.bundle \
            --path app/packages/mobile/package.json \
            --normalize-package-version app/packages/mobile/package.json \
            --path app/packages/mobile/Gemfile \
            --path app/packages/mobile/Gemfile.lock \
            --path app/packages/mobile/.java-version \
            --path app/packages/mobile/.ruby-version \
            --path app/packages/mobile/app.json \
            --path app/packages/mobile/babel.config.js \
            --path app/packages/mobile/metro.config.js \
            --path app/packages/mobile/react-native.config.js \
            --path app/packages/mobile/fastlane/Appfile \
            --path app/packages/mobile/fastlane/Fastfile \
            --path app/packages/mobile/fastlane/Matchfile \
            --path app/packages/mobile/fastlane/Pluginfile \
            --path app/packages/mobile/android \
            --exclude app/packages/mobile/android/app/debug.keystore \
            --exclude app/packages/mobile/android/app/src/androidTest \
            --exclude app/packages/mobile/android/app/src/debug \
            --exclude app/packages/mobile/android/app/src/dev \
            --path app/packages/mobile/ios \
            --exclude app/packages/mobile/ios/Dev.xcassets \
            --exclude app/packages/mobile/ios/StandardNotesTests \
            --exclude app/packages/mobile/ios/StandardNotesDev-Info.plist \
            --path app/package.json \
            --path app/yarn.lock \
            --path app/.nvmrc \
            --path app/.yarnrc.yml \
            --path app/.yarn/patches \
            --path app/.yarn/releases \
            --path app/babel.config.js \
            --path app/tsconfig.base.json \
            --output "release-fingerprint/srn-mobile.fingerprint" \
            --github-output "$GITHUB_OUTPUT"
          grep -Eq '^[0-9a-f]{64}$' release-fingerprint/srn-mobile.fingerprint

      - name: Upload mobile release fingerprint
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: srn-mobile-platform-fingerprint
          path: release-fingerprint/srn-mobile.fingerprint
          retention-days: 30
          if-no-files-found: error

  decide:
    name: decide
    needs: [impact, fingerprint]
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      decision: ${{ steps.compare.outputs.decision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: compare
        name: Compare mobile release fingerprint
        env:
          BASE_REF: ${{ needs.impact.outputs.base_ref }}
          BASELINE_STATUS: ${{ needs.impact.outputs.baseline_status }}
          FORCED: ${{ needs.impact.outputs.forced }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_FP: ${{ needs.fingerprint.outputs.fingerprint }}
        run: |
          set -euo pipefail
          if ! node scripts/compare-release-fingerprints.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --base-ref "$BASE_REF" \
            --baseline-status "$BASELINE_STATUS" \
            --forced "$FORCED" \
            --fingerprint "srn-mobile.fingerprint=${NEW_FP}" \
            --output release-fingerprint-comparison.json \
            --github-output "$GITHUB_OUTPUT"; then
            cat release-fingerprint-comparison.json >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cat release-fingerprint-comparison.json >> "$GITHUB_STEP_SUMMARY"

  reserve_release:
    name: reserve marker-bound GitHub draft before production mutation
    needs: [version, fingerprint, decide]
    if: needs.decide.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment: mobile-production
    permissions:
      contents: write
    steps:
      - name: Create or adopt only this run's exact draft identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          FINGERPRINT: ${{ needs.fingerprint.outputs.fingerprint }}
        run: |
          set -euo pipefail
          [[ "$FINGERPRINT" =~ ^[0-9a-f]{64}$ ]]
          intent_marker="<!-- srn-mobile-release-intent:run=${GITHUB_RUN_ID};sha=${GITHUB_SHA};version=${VERSION};fingerprint=${FINGERPRINT}; -->"
          api_tag="$(jq -rn --arg value "$RELEASE_TAG" '$value | @uri')"
          release_json="$RUNNER_TEMP/mobile-github-reservation.json"
          query_release() {
            curl --silent --show-error --output "$release_json" --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${api_tag}"
          }
          status="$(query_release)"
          if [ "$status" = 404 ]; then
            gh release create "$RELEASE_TAG" --draft --prerelease --latest=false --title "Mobile $VERSION" \
              --target "$GITHUB_SHA" --generate-notes --notes "$intent_marker"
            status="$(query_release)"
          fi
          [ "$status" = 200 ] || { cat "$release_json" >&2; exit 1; }
          jq -e --arg tag "$RELEASE_TAG" --arg sha "$GITHUB_SHA" --arg marker "$intent_marker" \
            '.tag_name == $tag and .target_commitish == $sha and .prerelease == true and (.body // "" | contains($marker))' \
            "$release_json" >/dev/null || {
              echo 'The mobile release identity is owned by another run, commit, or fingerprint.' >&2
              exit 1
            }

  android:
    name: android (armeabi-v7a + arm64-v8a + x86 + x86_64)
    needs: [version, decide, reserve_release]
    if: needs.decide.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment: mobile-production
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: app/packages/mobile
    env:
      PACKAGE_VERSION: ${{ needs.version.outputs.version }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: app/.nvmrc
          package-manager-cache: false

      - name: Enable Corepack
        working-directory: app
        run: npm install --global corepack@0.35.0 && corepack enable

      - name: Cache Yarn
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/.yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('app/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Set up Java
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1.319.0
        with:
          ruby-version: "3.4.7"
          bundler-cache: true
          working-directory: app/packages/mobile

      - name: Increase file watcher limit
        run: echo fs.inotify.max_user_watches=524288 | sudo tee /etc/sysctl.d/99-standard-red-notes.conf && sudo sysctl --system

      - name: Install workspace dependencies
        working-directory: app
        run: yarn install --immutable

      - name: Build web UI
        working-directory: app
        run: yarn build:web

      - name: Prepare embedded mobile web bundle
        run: rm -rf html/Web.bundle/src/web-src && yarn bundle:web

      - name: Decode production Android keystore
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSPHRASE: ${{ secrets.KEYSTORE_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$ANDROID_KEYSTORE"
          test -n "$KEYSTORE_PASSPHRASE"
          printf '%s' "$ANDROID_KEYSTORE" > keystore.keystore.asc
          printf '%s' "$KEYSTORE_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 \
            --decrypt keystore.keystore.asc > android/app/keystore.keystore
          test -s android/app/keystore.keystore

      - name: Build signed Android production artifacts without publishing
        env:
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: bundle exec fastlane android build_prod

      - name: Remove Android signing material
        if: always()
        run: rm -f -- keystore.keystore.asc android/app/keystore.keystore

      - name: Verify Android package, signer, version, and four-ABI symmetry
        env:
          EXPECTED_ANDROID_UPLOAD_CERT_SHA256: ${{ secrets.EXPECTED_ANDROID_UPLOAD_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk='android/app/build/outputs/apk/prod/release/app-prod-release.apk'
          aab='android/app/build/outputs/bundle/prodRelease/app-prod-release.aab'
          expected_application_id='com.standardnotes'
          test -s "$apk"
          test -s "$aab"

          configured="$(sed -n 's/^reactNativeArchitectures=//p' android/gradle.properties)"
          built_application_id="$(apkanalyzer manifest application-id "$apk")"
          built_version_name="$(apkanalyzer manifest version-name "$apk")"
          built_version_code="$(apkanalyzer manifest version-code "$apk")"
          expected_version_code="$((3004000 + BUILD_NUMBER))"
          if [ "$built_application_id" != "$expected_application_id" ]; then
            echo "Android APK application ID '$built_application_id' does not match '$expected_application_id'" >&2
            exit 1
          fi
          if [ "$built_version_name" != "$PACKAGE_VERSION" ]; then
            echo "Android APK versionName '$built_version_name' does not match release '$PACKAGE_VERSION'" >&2
            exit 1
          fi
          if [ "$built_version_code" != "$expected_version_code" ]; then
            echo "Android APK versionCode '$built_version_code' does not match expected '$expected_version_code'" >&2
            exit 1
          fi

          apksigner_bin="$(find "${ANDROID_HOME:?}/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$apksigner_bin"
          test -x "$apksigner_bin"
          expected_signer="$(printf '%s' "$EXPECTED_ANDROID_UPLOAD_CERT_SHA256" | tr -d '[:space:]:-' | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$expected_signer" =~ ^[0-9a-f]{64}$ ]]; then
            echo 'EXPECTED_ANDROID_UPLOAD_CERT_SHA256 must be the protected 64-hex production upload-certificate fingerprint.' >&2
            exit 1
          fi

          apksigner_output="$("$apksigner_bin" verify --Werr --verbose --print-certs "$apk" 2>&1)"
          printf '%s\n' "$apksigner_output"
          mapfile -t apk_signers < <(
            sed -n 's/^Signer #[0-9][0-9]* certificate SHA-256 digest: //p' <<< "$apksigner_output" |
              tr -d '[:space:]:-' | tr '[:upper:]' '[:lower:]' | sort -u
          )
          if [ "${#apk_signers[@]}" -ne 1 ]; then
            echo "Android APK must have exactly one certificate signer, found ${#apk_signers[@]}." >&2
            exit 1
          fi
          apk_signer="${apk_signers[0]}"

          mapfile -t aab_signature_blocks < <(unzip -Z1 "$aab" | grep -Ei '^META-INF/[^/]+\.(RSA|DSA|EC)$' | sort -u)
          if [ "${#aab_signature_blocks[@]}" -ne 1 ]; then
            echo "Android AAB must have exactly one JAR signature block, found ${#aab_signature_blocks[@]}." >&2
            exit 1
          fi
          jarsigner_output="$(LC_ALL=C jarsigner -verify -strict -verbose -certs "$aab" 2>&1)"
          printf '%s\n' "$jarsigner_output"
          grep -Fq 'jar verified.' <<< "$jarsigner_output"
          mapfile -t aab_signers < <(
            LC_ALL=C keytool -printcert -jarfile "$aab" |
              sed -n 's/^[[:space:]]*SHA256: //p' |
              tr -d '[:space:]:-' | tr '[:upper:]' '[:lower:]' | sort -u
          )
          if [ "${#aab_signers[@]}" -ne 1 ]; then
            echo "Android AAB must expose exactly one leaf certificate fingerprint, found ${#aab_signers[@]}." >&2
            exit 1
          fi
          aab_signer="${aab_signers[0]}"
          if [ "$apk_signer" != "$aab_signer" ] || [ "$apk_signer" != "$expected_signer" ]; then
            echo 'APK/AAB signing certificates do not both match the protected production fingerprint.' >&2
            exit 1
          fi

          unzip -Z1 "$apk" > "$RUNNER_TEMP/android-apk-entries.txt"
          unzip -Z1 "$aab" > "$RUNNER_TEMP/android-aab-entries.txt"

          required_arches=(armeabi-v7a arm64-v8a x86 x86_64)
          for arch in "${required_arches[@]}"; do
            case ",$configured," in
              *",$arch,"*) ;;
              *) echo "reactNativeArchitectures is missing $arch" >&2; exit 1 ;;
            esac
          done

          configured_set="$(tr ',' '\n' <<< "$configured" | sed '/^$/d' | LC_ALL=C sort -u)"
          expected_set="$(printf '%s\n' "${required_arches[@]}" | LC_ALL=C sort -u)"
          if [ "$configured_set" != "$expected_set" ]; then
            echo "reactNativeArchitectures must contain exactly armeabi-v7a, arm64-v8a, x86, and x86_64" >&2
            exit 1
          fi

          printf '%s\n' "${required_arches[@]}" | LC_ALL=C sort -u > "$RUNNER_TEMP/android-expected-abis.txt"
          grep -E '^lib/[^/]+/.+\.so$' "$RUNNER_TEMP/android-apk-entries.txt" | cut -d/ -f2 | LC_ALL=C sort -u > "$RUNNER_TEMP/android-apk-abis.txt"
          grep -E '^base/lib/[^/]+/.+\.so$' "$RUNNER_TEMP/android-aab-entries.txt" | cut -d/ -f3 | LC_ALL=C sort -u > "$RUNNER_TEMP/android-aab-abis.txt"
          diff -u "$RUNNER_TEMP/android-expected-abis.txt" "$RUNNER_TEMP/android-apk-abis.txt"
          diff -u "$RUNNER_TEMP/android-expected-abis.txt" "$RUNNER_TEMP/android-aab-abis.txt"

          for arch in "${required_arches[@]}"; do
            grep -E "^lib/$arch/.+\\.so$" "$RUNNER_TEMP/android-apk-entries.txt" | sed "s#^lib/$arch/##" | LC_ALL=C sort -u > "$RUNNER_TEMP/android-apk-$arch-libs.txt"
            grep -E "^base/lib/$arch/.+\\.so$" "$RUNNER_TEMP/android-aab-entries.txt" | sed "s#^base/lib/$arch/##" | LC_ALL=C sort -u > "$RUNNER_TEMP/android-aab-$arch-libs.txt"
            test -s "$RUNNER_TEMP/android-apk-$arch-libs.txt"
            test -s "$RUNNER_TEMP/android-aab-$arch-libs.txt"
          done
          for arch in armeabi-v7a x86 x86_64; do
            diff -u "$RUNNER_TEMP/android-apk-arm64-v8a-libs.txt" "$RUNNER_TEMP/android-apk-$arch-libs.txt"
            diff -u "$RUNNER_TEMP/android-aab-arm64-v8a-libs.txt" "$RUNNER_TEMP/android-aab-$arch-libs.txt"
          done

          stage="$RUNNER_TEMP/srn-mobile-android"
          mkdir -p "$stage"
          staged_apk="$stage/standard-red-notes-android-universal-${PACKAGE_VERSION}.apk"
          staged_aab="$stage/standard-red-notes-android-${PACKAGE_VERSION}.aab"
          cp "$apk" "$staged_apk"
          cp "$aab" "$staged_aab"
          jq -n \
            --arg applicationId "$built_application_id" \
            --arg versionName "$built_version_name" \
            --arg versionCode "$built_version_code" \
            --arg signerSha256 "$apk_signer" \
            --arg apkFile "$(basename "$staged_apk")" \
            --arg apkSha256 "$(sha256sum "$staged_apk" | cut -d' ' -f1)" \
            --argjson apkSize "$(stat -c '%s' "$staged_apk")" \
            --arg aabFile "$(basename "$staged_aab")" \
            --arg aabSha256 "$(sha256sum "$staged_aab" | cut -d' ' -f1)" \
            --argjson aabSize "$(stat -c '%s' "$staged_aab")" \
            '{schema: 1, platform: "android", applicationId: $applicationId, versionName: $versionName,
              versionCode: $versionCode, signerSha256: $signerSha256,
              abis: ["armeabi-v7a", "arm64-v8a", "x86", "x86_64"],
              artifacts: {apk: {file: $apkFile, sha256: $apkSha256, size: $apkSize},
                          aab: {file: $aabFile, sha256: $aabSha256, size: $aabSize}}}' \
            > "$stage/standard-red-notes-android-identity.json"

      - name: Upload validated Android artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: srn-mobile-platform-android
          path: ${{ runner.temp }}/srn-mobile-android/*
          retention-days: 30
          if-no-files-found: error

  ios:
    name: ios (device arm64)
    needs: [version, decide, reserve_release]
    if: needs.decide.outputs.changed == 'true'
    runs-on: macos-15
    environment: mobile-production
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: app/packages/mobile
    env:
      PACKAGE_VERSION: ${{ needs.version.outputs.version }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: app/.nvmrc
          package-manager-cache: false

      - name: Enable Corepack
        working-directory: app
        run: npm install --global corepack@0.35.0 && corepack enable

      - name: Cache Yarn
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/.yarn/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('app/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26"

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1.319.0
        with:
          ruby-version: "3.4.7"
          bundler-cache: true
          working-directory: app/packages/mobile

      - name: Install workspace dependencies
        working-directory: app
        run: yarn install --immutable

      - name: Build web UI
        working-directory: app
        run: yarn build:web

      - name: Prepare embedded mobile web bundle
        run: rm -rf html/Web.bundle/src/web-src && yarn bundle:web

      - name: Install iOS pods
        run: yarn install:pods

      - name: Configure certificate repository access
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          trap 'status=$?; if [ "$status" -ne 0 ] && [ -n "${SSH_AGENT_PID:-}" ]; then ssh-agent -k >/dev/null 2>&1 || true; fi; exit "$status"' EXIT
          eval "$(ssh-agent -a "$RUNNER_TEMP/srn-mobile-ssh-agent.sock" -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
          trap - EXIT

      - name: Set up iOS signing keychain
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: bundle exec fastlane ios setup

      - name: Build signed iOS production artifact without publishing
        env:
          IOS_USES_NON_EXEMPT_ENCRYPTION: ${{ vars.IOS_USES_NON_EXEMPT_ENCRYPTION }}
          IOS_EXPORT_COMPLIANCE_CODE: ${{ secrets.IOS_EXPORT_COMPLIANCE_CODE }}
          MATCH_CERTIFICATES_URL: ${{ secrets.MATCH_CERTIFICATES_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: bundle exec fastlane ios build_prod

      - name: Clean up iOS signing access
        if: always()
        run: |
          set -euo pipefail
          cleanup_status=0
          if [ -n "${SSH_AGENT_PID:-}" ]; then
            ssh-agent -k || cleanup_status=$?
          fi
          keychain_list="$(security list-keychains -d user)" || cleanup_status=$?
          signing_keychain="$(printf '%s\n' "$keychain_list" | tr -d ' \"' | awk '/\/snkeychain(-db)?$/ { print; exit }')"
          if [ -n "$signing_keychain" ]; then
            security lock-keychain "$signing_keychain" || cleanup_status=$?
            security delete-keychain "$signing_keychain" || cleanup_status=$?
          fi
          exit "$cleanup_status"

      - name: Verify iOS application, extension, provisioning, signature, and device architecture
        env:
          IOS_USES_NON_EXEMPT_ENCRYPTION: ${{ vars.IOS_USES_NON_EXEMPT_ENCRYPTION }}
          IOS_EXPORT_COMPLIANCE_CODE: ${{ secrets.IOS_EXPORT_COMPLIANCE_CODE }}
        run: |
          set -euo pipefail
          expected_bundle_id='com.standardnotes.standardnotes'
          expected_extension_id='com.standardnotes.standardnotes.Share-To-SN'
          expected_team_id='HKF9BXSN95'
          expected_app_group='group.com.standardnotes.standardnotes'
          ipa="$(find . -type f -name 'StandardNotes.ipa' -print -quit)"
          test -n "$ipa"
          test -s "$ipa"

          extract_dir="$RUNNER_TEMP/standard-red-notes-ios-release"
          rm -rf "$extract_dir"
          unzip -q "$ipa" -d "$extract_dir"
          app_bundle="$(find "$extract_dir/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app_bundle"
          codesign --verify --deep --strict --verbose=2 "$app_bundle"

          mapfile -d '' extensions < <(find "$app_bundle/PlugIns" -maxdepth 1 -type d -name '*.appex' -print0 2>/dev/null | sort -z)
          if [ "${#extensions[@]}" -ne 1 ]; then
            echo "Expected exactly one signed iOS app extension, found ${#extensions[@]}." >&2
            exit 1
          fi
          extension_bundle="${extensions[0]}"

          verify_signed_bundle() {
            local bundle="$1"
            local expected_id="$2"
            local role="$3"
            local actual_id team_id requirement entitlements profile cert_dir leaf_der leaf_sha
            actual_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$bundle/Info.plist")"
            [ "$actual_id" = "$expected_id" ] || {
              echo "$role bundle ID '$actual_id' does not match '$expected_id'." >&2
              return 1
            }
            codesign --verify --strict --verbose=2 "$bundle"
            team_id="$(codesign -dv --verbose=4 "$bundle" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
            [ "$team_id" = "$expected_team_id" ] || {
              echo "$role TeamIdentifier '$team_id' does not match '$expected_team_id'." >&2
              return 1
            }
            codesign --verify --strict \
              -R="identifier \"$expected_id\" and certificate leaf[subject.OU] = \"$expected_team_id\"" \
              "$bundle"
            requirement="$(codesign -d -r- "$bundle" 2>&1 | sed -n 's/^designated => //p')"
            test -n "$requirement"
            grep -Fq "identifier \"$expected_id\"" <<< "$requirement"

            cert_dir="$RUNNER_TEMP/${role}-signing-certificates"
            rm -rf "$cert_dir"
            mkdir -p "$cert_dir"
            (cd "$cert_dir" && codesign -d --extract-certificates "$bundle")
            leaf_der="$cert_dir/codesign0"
            test -s "$leaf_der"
            openssl x509 -inform DER -in "$leaf_der" -noout
            leaf_sha="$(shasum -a 256 "$leaf_der" | awk '{print $1}')"
            [[ "$leaf_sha" =~ ^[0-9a-f]{64}$ ]]
            printf '%s\n' "$leaf_sha" > "$RUNNER_TEMP/${role}-leaf-cert-sha256"

            entitlements="$RUNNER_TEMP/${role}-entitlements.plist"
            codesign -d --entitlements :- "$bundle" > "$entitlements" 2>/dev/null
            /usr/libexec/PlistBuddy -c 'Print :application-identifier' "$entitlements" |
              grep -Fx "${expected_team_id}.${expected_id}" >/dev/null
            /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.team-identifier' "$entitlements" |
              grep -Fx "$expected_team_id" >/dev/null
            if /usr/libexec/PlistBuddy -c 'Print :get-task-allow' "$entitlements" 2>/dev/null | grep -Fxq true; then
              echo "$role production entitlement unexpectedly permits debugging." >&2
              return 1
            fi

            profile="$RUNNER_TEMP/${role}-provisioning.plist"
            test -s "$bundle/embedded.mobileprovision"
            security cms -D -i "$bundle/embedded.mobileprovision" > "$profile"
            python3 - "$profile" "$entitlements" "$leaf_der" "$expected_team_id" "$expected_id" "$expected_app_group" <<'PY'
          import datetime
          import hashlib
          import plistlib
          import sys

          profile_path, signed_path, leaf_path, team, bundle_id, app_group = sys.argv[1:]
          with open(profile_path, 'rb') as handle:
              profile = plistlib.load(handle)
          with open(signed_path, 'rb') as handle:
              signed = plistlib.load(handle)
          with open(leaf_path, 'rb') as handle:
              leaf_der = handle.read()
          assert profile.get('TeamIdentifier') == [team], profile.get('TeamIdentifier')
          entitlements = profile.get('Entitlements', {})
          assert entitlements.get('application-identifier') == f'{team}.{bundle_id}'
          assert entitlements.get('com.apple.developer.team-identifier') == team
          assert entitlements.get('get-task-allow') is not True
          assert signed.get('application-identifier') == f'{team}.{bundle_id}'
          assert signed.get('com.apple.developer.team-identifier') == team
          assert signed.get('get-task-allow') is not True
          assert sorted(signed.get('com.apple.security.application-groups', [])) == [app_group]
          assert sorted(entitlements.get('com.apple.security.application-groups', [])) == [app_group]
          assert signed.get('com.apple.security.application-groups') == entitlements.get('com.apple.security.application-groups')
          assert 'ProvisionedDevices' not in profile
          assert profile.get('ProvisionsAllDevices') is not True
          developer_certificates = profile.get('DeveloperCertificates', [])
          assert isinstance(developer_certificates, list) and developer_certificates
          leaf_sha256 = hashlib.sha256(leaf_der).digest()
          assert any(hashlib.sha256(bytes(certificate)).digest() == leaf_sha256 for certificate in developer_certificates)
          assert profile.get('UUID')
          expiration = profile.get('ExpirationDate')
          assert isinstance(expiration, datetime.datetime)
          now = datetime.datetime.now(expiration.tzinfo) if expiration.tzinfo else datetime.datetime.utcnow()
          assert expiration > now
          PY
            printf '%s\n' "$requirement"
          }

          main_requirement="$(verify_signed_bundle "$app_bundle" "$expected_bundle_id" main)"
          extension_requirement="$(verify_signed_bundle "$extension_bundle" "$expected_extension_id" extension)"

          mach_o_count=0
          while IFS= read -r -d '' candidate; do
            if file -b "$candidate" | grep -q 'Mach-O'; then
              mach_o_count=$((mach_o_count + 1))
              candidate_archs="$(lipo -archs "$candidate")"
              relative_candidate="${candidate#"$app_bundle"/}"
              echo "iOS Mach-O architectures ($relative_candidate): $candidate_archs"
              case " $candidate_archs " in
                *' arm64 '*) ;;
                *) echo "iOS Mach-O '$relative_candidate' is missing arm64" >&2; exit 1 ;;
              esac
              case " $candidate_archs " in
                *' x86_64 '*|*' i386 '*) echo "Simulator architecture found in iOS Mach-O '$relative_candidate'" >&2; exit 1 ;;
              esac
              if [ "$candidate_archs" != 'arm64' ]; then
                echo "iOS Mach-O '$relative_candidate' must contain exactly arm64, found '$candidate_archs'" >&2
                exit 1
              fi
            fi
          done < <(find "$app_bundle" -type f -print0)
          test "$mach_o_count" -gt 0

          built_app_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_bundle/Info.plist")"
          built_number="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_bundle/Info.plist")"
          extension_app_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$extension_bundle/Info.plist")"
          extension_build_number="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$extension_bundle/Info.plist")"

          if [ "$built_app_version" != "$PACKAGE_VERSION" ]; then
            echo "iOS IPA app version '$built_app_version' does not match release '$PACKAGE_VERSION'" >&2
            exit 1
          fi
          if [ "$built_number" != "$BUILD_NUMBER" ]; then
            echo "iOS IPA build number '$built_number' does not match requested '$BUILD_NUMBER'" >&2
            exit 1
          fi
          [ "$extension_app_version" = "$built_app_version" ] && [ "$extension_app_version" = "$PACKAGE_VERSION" ] || {
            echo "Share extension app version '$extension_app_version' does not match host/release '$built_app_version'." >&2
            exit 1
          }
          [ "$extension_build_number" = "$built_number" ] && [ "$extension_build_number" = "$BUILD_NUMBER" ] || {
            echo "Share extension build '$extension_build_number' does not match host/release '$built_number'." >&2
            exit 1
          }
          case "$IOS_USES_NON_EXEMPT_ENCRYPTION" in
            true)
              test -n "$IOS_EXPORT_COMPLIANCE_CODE"
              [ "$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$app_bundle/Info.plist")" = true ]
              [ "$(/usr/libexec/PlistBuddy -c 'Print :ITSEncryptionExportComplianceCode' "$app_bundle/Info.plist")" = "$IOS_EXPORT_COMPLIANCE_CODE" ]
              ;;
            false)
              test -z "$IOS_EXPORT_COMPLIANCE_CODE"
              [ "$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$app_bundle/Info.plist")" = false ]
              if /usr/libexec/PlistBuddy -c 'Print :ITSEncryptionExportComplianceCode' "$app_bundle/Info.plist" >/dev/null 2>&1; then
                echo 'Exempt iOS build unexpectedly embeds an export compliance code.' >&2
                exit 1
              fi
              ;;
            *) echo 'Protected IOS_USES_NON_EXEMPT_ENCRYPTION must be exactly true or false.' >&2; exit 1 ;;
          esac

          stage="$RUNNER_TEMP/srn-mobile-ios"
          mkdir -p "$stage"
          staged_ipa="$stage/standard-red-notes-ios-arm64-${PACKAGE_VERSION}.ipa"
          cp "$ipa" "$staged_ipa"
          main_profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/main-provisioning.plist")"
          extension_profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/extension-provisioning.plist")"
          main_leaf_sha256="$(tr -d '[:space:]' < "$RUNNER_TEMP/main-leaf-cert-sha256")"
          extension_leaf_sha256="$(tr -d '[:space:]' < "$RUNNER_TEMP/extension-leaf-cert-sha256")"
          jq -n \
            --arg bundleId "$expected_bundle_id" \
            --arg extensionBundleId "$expected_extension_id" \
            --arg teamId "$expected_team_id" \
            --arg appVersion "$built_app_version" \
            --arg buildNumber "$built_number" \
            --arg extensionAppVersion "$extension_app_version" \
            --arg extensionBuildNumber "$extension_build_number" \
            --arg appGroup "$expected_app_group" \
            --arg mainLeafCertificateSha256 "$main_leaf_sha256" \
            --arg extensionLeafCertificateSha256 "$extension_leaf_sha256" \
            --argjson usesNonExemptEncryption "$IOS_USES_NON_EXEMPT_ENCRYPTION" \
            --arg mainRequirement "$main_requirement" \
            --arg extensionRequirement "$extension_requirement" \
            --arg mainProvisioningUuid "$main_profile_uuid" \
            --arg extensionProvisioningUuid "$extension_profile_uuid" \
            --arg ipaFile "$(basename "$staged_ipa")" \
            --arg ipaSha256 "$(shasum -a 256 "$staged_ipa" | awk '{print $1}')" \
            --arg ipaMd5 "$(md5 -q "$staged_ipa")" \
            --argjson ipaSize "$(stat -f '%z' "$staged_ipa")" \
            '{schema: 1, platform: "ios", bundleId: $bundleId, extensionBundleId: $extensionBundleId,
              teamId: $teamId, appVersion: $appVersion, buildNumber: $buildNumber,
              extensionAppVersion: $extensionAppVersion, extensionBuildNumber: $extensionBuildNumber,
              appGroup: $appGroup, usesNonExemptEncryption: $usesNonExemptEncryption,
              architectures: ["arm64"], designatedRequirements: {app: $mainRequirement, extension: $extensionRequirement},
              provisioningProfiles: {app: $mainProvisioningUuid, extension: $extensionProvisioningUuid},
              signingCertificateSha256: {app: $mainLeafCertificateSha256, extension: $extensionLeafCertificateSha256},
              artifact: {file: $ipaFile, sha256: $ipaSha256, md5: $ipaMd5, size: $ipaSize}}' \
            > "$stage/standard-red-notes-ios-identity.json"

      - name: Upload validated iOS artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: srn-mobile-platform-ios
          path: ${{ runner.temp }}/srn-mobile-ios/*
          retention-days: 30
          if-no-files-found: error

  validated:
    name: fan in validated mobile artifacts
    needs: [version, decide, fingerprint, android, ios]
    if: needs.decide.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download both validated platform artifacts and fingerprint
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: srn-mobile-platform-*
          path: validated
          merge-multiple: true

      - name: Verify complete validated payload and generate checksums
        working-directory: validated
        env:
          VERSION: ${{ needs.version.outputs.version }}
          EXPECTED_FINGERPRINT: ${{ needs.fingerprint.outputs.fingerprint }}
          EXPECTED_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          test -s "standard-red-notes-android-universal-${VERSION}.apk"
          test -s "standard-red-notes-android-${VERSION}.aab"
          test -s "standard-red-notes-ios-arm64-${VERSION}.ipa"
          test -s standard-red-notes-android-identity.json
          test -s standard-red-notes-ios-identity.json
          test -s srn-mobile.fingerprint
          grep -Eq '^[0-9a-f]{64}$' srn-mobile.fingerprint
          grep -Fx "$EXPECTED_FINGERPRINT" srn-mobile.fingerprint
          jq -e \
            --arg version "$VERSION" \
            --arg build "$EXPECTED_BUILD_NUMBER" \
            '.schema == 1 and .applicationId == "com.standardnotes" and .versionName == $version and
             .versionCode == ((3004000 + ($build | tonumber)) | tostring) and
             (.signerSha256 | test("^[0-9a-f]{64}$")) and
             .abis == ["armeabi-v7a", "arm64-v8a", "x86", "x86_64"]' \
            standard-red-notes-android-identity.json
          jq -e \
            --arg version "$VERSION" \
            --arg build "$EXPECTED_BUILD_NUMBER" \
            '.schema == 1 and .bundleId == "com.standardnotes.standardnotes" and
             .extensionBundleId == "com.standardnotes.standardnotes.Share-To-SN" and
             .teamId == "HKF9BXSN95" and .appVersion == $version and .buildNumber == $build and
             .extensionAppVersion == $version and .extensionBuildNumber == $build and
             .appGroup == "group.com.standardnotes.standardnotes" and (.usesNonExemptEncryption | type) == "boolean" and
             (.signingCertificateSha256.app | test("^[0-9a-f]{64}$")) and
             (.signingCertificateSha256.extension | test("^[0-9a-f]{64}$")) and
             .architectures == ["arm64"]' \
            standard-red-notes-ios-identity.json
          apk_sha="$(sha256sum "standard-red-notes-android-universal-${VERSION}.apk" | cut -d' ' -f1)"
          aab_sha="$(sha256sum "standard-red-notes-android-${VERSION}.aab" | cut -d' ' -f1)"
          ipa_sha="$(sha256sum "standard-red-notes-ios-arm64-${VERSION}.ipa" | cut -d' ' -f1)"
          jq -e --arg sha "$apk_sha" '.artifacts.apk.sha256 == $sha' standard-red-notes-android-identity.json
          jq -e --arg sha "$aab_sha" '.artifacts.aab.sha256 == $sha' standard-red-notes-android-identity.json
          jq -e --arg sha "$ipa_sha" '.artifact.sha256 == $sha' standard-red-notes-ios-identity.json
          jq -n \
            --slurpfile android standard-red-notes-android-identity.json \
            --slurpfile ios standard-red-notes-ios-identity.json \
            '{schema: 1, android: $android[0], ios: $ios[0]}' \
            > standard-red-notes-mobile-identity.json
          rm -f -- standard-red-notes-android-identity.json standard-red-notes-ios-identity.json
          mapfile -d '' files < <(find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z)
          test "${#files[@]}" -eq 5
          sha256sum "${files[@]}" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Upload complete pre-publication payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: srn-mobile-validated-release
          path: validated/*
          retention-days: 30
          if-no-files-found: error

  publish_android:
    name: publish or reconcile the validated Android AAB
    needs: [version, decide, validated]
    if: needs.decide.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment: mobile-production
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: app/packages/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1.319.0
        with:
          ruby-version: "3.4.7"
          bundler-cache: true
          working-directory: app/packages/mobile

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: srn-mobile-validated-release
          path: validated

      - id: play_preflight
        name: Reserve or reconcile exact Google Play publication intent
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_PLAY_JSON_KEY_DATA: ${{ secrets.GOOGLE_PLAY_JSON_KEY_DATA }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          EXPECTED_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          payload="$GITHUB_WORKSPACE/validated"
          (cd "$payload" && sha256sum --check SHA256SUMS.txt)
          identity="$payload/standard-red-notes-mobile-identity.json"
          aab="$payload/standard-red-notes-android-${RELEASE_VERSION}.aab"
          fingerprint="$(tr -d '[:space:]' < "$payload/srn-mobile.fingerprint")"
          manifest_sha="$(sha256sum "$payload/SHA256SUMS.txt" | cut -d' ' -f1)"
          aab_sha="$(sha256sum "$aab" | cut -d' ' -f1)"
          aab_size="$(stat -c '%s' "$aab")"
          version_code="$(jq -r '.android.versionCode' "$identity")"
          jq -e --arg version "$RELEASE_VERSION" --arg build "$EXPECTED_BUILD_NUMBER" \
            --arg sha "$aab_sha" --argjson size "$aab_size" \
            '.android.applicationId == "com.standardnotes" and .android.versionName == $version and
             .android.versionCode == ((3004000 + ($build | tonumber)) | tostring) and
             .android.artifacts.aab.sha256 == $sha and .android.artifacts.aab.size == $size' "$identity"
          [[ "$fingerprint" =~ ^[0-9a-f]{64}$ ]]

          marker_name="srn-mobile-google-play-intent-${GITHUB_RUN_ID}"
          marker_dir="$RUNNER_TEMP/google-play-intent"
          marker="$marker_dir/marker.json"
          mkdir -p "$marker_dir"
          artifacts="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=${marker_name}&per_page=100")"
          marker_count="$(jq '[.artifacts[] | select(.expired == false)] | length' <<< "$artifacts")"
          if [ "$marker_count" -gt 1 ]; then
            echo "Multiple same-run Google Play intent artifacts exist." >&2
            exit 1
          elif [ "$marker_count" -eq 1 ]; then
            marker_id="$(jq -r '[.artifacts[] | select(.expired == false)][0].id' <<< "$artifacts")"
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${marker_id}/zip" > "$RUNNER_TEMP/google-play-intent.zip"
            unzip -q "$RUNNER_TEMP/google-play-intent.zip" -d "$marker_dir"
          fi
          marker_present=false
          if [ -s "$marker" ]; then
            marker_present=true
            jq -e --arg run "$GITHUB_RUN_ID" --arg current_attempt "$GITHUB_RUN_ATTEMPT" --arg sha "$GITHUB_SHA" --arg version "$RELEASE_VERSION" \
              --arg build "$EXPECTED_BUILD_NUMBER" --arg code "$version_code" --arg fp "$fingerprint" \
              --arg artifact_sha "$aab_sha" --argjson artifact_size "$aab_size" --arg manifest_sha "$manifest_sha" \
              '.schema == 1 and .provider == "google-play" and .runId == $run and
               (.originatingRunAttempt | test("^[1-9][0-9]*$")) and
               ((.originatingRunAttempt | tonumber) <= ($current_attempt | tonumber)) and .headSha == $sha and
               .applicationId == "com.standardnotes" and .versionName == $version and .buildNumber == $build and
               .versionCode == $code and .fingerprint == $fp and .artifact.sha256 == $artifact_sha and
               .artifact.size == $artifact_size and .checksumManifestSha256 == $manifest_sha and .track == "beta"' "$marker"
          fi

          PROVIDER_EVIDENCE_PATH="$RUNNER_TEMP/google-play-preflight.json" \
          ANDROID_VERSION_CODE="$version_code" ANDROID_AAB_SHA256="$aab_sha" ANDROID_TRACK=beta \
            bundle exec fastlane android inspect_prod
          provider_status="$(jq -r '.status' "$RUNNER_TEMP/google-play-preflight.json")"
          case "$provider_status:$marker_present" in
            absent:false)
              jq -n --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" --arg sha "$GITHUB_SHA" \
                --arg version "$RELEASE_VERSION" --arg build "$EXPECTED_BUILD_NUMBER" --arg code "$version_code" \
                --arg fp "$fingerprint" --arg file "$(basename "$aab")" --arg artifact_sha "$aab_sha" \
                --argjson artifact_size "$aab_size" --arg manifest_sha "$manifest_sha" \
                '{schema: 1, provider: "google-play", runId: $run, originatingRunAttempt: $attempt, headSha: $sha,
                  applicationId: "com.standardnotes", versionName: $version, buildNumber: $build, versionCode: $code,
                  fingerprint: $fp, track: "beta", checksumManifestSha256: $manifest_sha,
                  artifact: {file: $file, sha256: $artifact_sha, size: $artifact_size}}' > "$marker"
              echo 'create_marker=true' >> "$GITHUB_OUTPUT"
              echo 'upload_required=true' >> "$GITHUB_OUTPUT"
              ;;
            absent:true)
              echo 'create_marker=false' >> "$GITHUB_OUTPUT"
              echo 'upload_required=true' >> "$GITHUB_OUTPUT"
              ;;
            valid:true)
              echo 'create_marker=false' >> "$GITHUB_OUTPUT"
              echo 'upload_required=false' >> "$GITHUB_OUTPUT"
              ;;
            valid:false)
              echo 'Google Play already contains this exact binary without a same-run intent marker; refusing adoption.' >&2
              exit 1
              ;;
            *)
              cat "$RUNNER_TEMP/google-play-preflight.json" >&2
              echo 'Google Play returned partial, duplicate, mismatched, or otherwise invalid release evidence.' >&2
              exit 1
              ;;
          esac

      - name: Persist Google Play intent before external mutation
        if: steps.play_preflight.outputs.create_marker == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: srn-mobile-google-play-intent-${{ github.run_id }}
          path: ${{ runner.temp }}/google-play-intent/marker.json
          retention-days: 30
          if-no-files-found: error

      - name: Publish or verify exact Google Play bundle digest and track state
        env:
          GOOGLE_PLAY_JSON_KEY_DATA: ${{ secrets.GOOGLE_PLAY_JSON_KEY_DATA }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          EXPECTED_BUILD_NUMBER: ${{ github.run_number }}
          UPLOAD_REQUIRED: ${{ steps.play_preflight.outputs.upload_required }}
        run: |
          set -euo pipefail
          payload="$GITHUB_WORKSPACE/validated"
          (cd "$payload" && sha256sum --check SHA256SUMS.txt)
          identity="$payload/standard-red-notes-mobile-identity.json"
          aab="$payload/standard-red-notes-android-${RELEASE_VERSION}.aab"
          marker="$RUNNER_TEMP/google-play-intent/marker.json"
          aab_sha="$(sha256sum "$aab" | cut -d' ' -f1)"
          aab_size="$(stat -c '%s' "$aab")"
          version_code="$(jq -r '.android.versionCode' "$identity")"
          fingerprint="$(tr -d '[:space:]' < "$payload/srn-mobile.fingerprint")"
          manifest_sha="$(sha256sum "$payload/SHA256SUMS.txt" | cut -d' ' -f1)"
          jq -e --arg run "$GITHUB_RUN_ID" --arg current_attempt "$GITHUB_RUN_ATTEMPT" --arg sha "$GITHUB_SHA" --arg version "$RELEASE_VERSION" \
            --arg build "$EXPECTED_BUILD_NUMBER" --arg code "$version_code" --arg fp "$fingerprint" \
            --arg artifact_sha "$aab_sha" --argjson artifact_size "$aab_size" --arg manifest_sha "$manifest_sha" \
            '.runId == $run and (.originatingRunAttempt | test("^[1-9][0-9]*$")) and
             ((.originatingRunAttempt | tonumber) <= ($current_attempt | tonumber)) and
             .headSha == $sha and .versionName == $version and .buildNumber == $build and
             .versionCode == $code and .fingerprint == $fp and .artifact.sha256 == $artifact_sha and
             .artifact.size == $artifact_size and .checksumManifestSha256 == $manifest_sha' "$marker"
          if [ "$UPLOAD_REQUIRED" = true ]; then
            (cd "$payload" && sha256sum --check SHA256SUMS.txt)
            ANDROID_AAB_PATH="$aab" bundle exec fastlane android publish_prod
          else
            (cd "$payload" && sha256sum --check SHA256SUMS.txt)
          fi
          PROVIDER_EVIDENCE_PATH="$RUNNER_TEMP/google-play-final.json" PROVIDER_WAIT_SECONDS=300 \
          ANDROID_VERSION_CODE="$version_code" ANDROID_AAB_SHA256="$aab_sha" ANDROID_TRACK=beta \
            bundle exec fastlane android inspect_prod
          jq -e --arg sha "$aab_sha" --arg code "$version_code" \
            '.status == "valid" and .valid == true and .versionCode == $code and .remoteSha256 == $sha and
             .track == "beta" and .trackStatus == "completed" and .matchingBundleCount == 1 and
             .matchingTrackReleaseCount == 1' "$RUNNER_TEMP/google-play-final.json"

  upload_ios:
    name: upload or reconcile the validated iOS IPA
    needs: [version, decide, validated]
    if: needs.decide.outputs.changed == 'true'
    runs-on: macos-15
    environment: mobile-production
    timeout-minutes: 50
    permissions:
      actions: read
      contents: read
    env:
      IOS_USES_NON_EXEMPT_ENCRYPTION: ${{ vars.IOS_USES_NON_EXEMPT_ENCRYPTION }}
      IOS_EXPORT_COMPLIANCE_CODE: ${{ secrets.IOS_EXPORT_COMPLIANCE_CODE }}
    defaults:
      run:
        shell: bash
        working-directory: app/packages/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26"

      - uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600 # v1.319.0
        with:
          ruby-version: "3.4.7"
          bundler-cache: true
          working-directory: app/packages/mobile

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: srn-mobile-validated-release
          path: validated

      - id: ios_preflight
        name: Reserve or reconcile exact App Store build-upload intent
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_APP_ID: ${{ secrets.APP_APPLE_ID }}
          APPSTORE_CONNECT_KEY: ${{ secrets.APPSTORE_CONNECT_KEY }}
          APPSTORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          APPSTORE_CONNECT_KEY_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ISSUER_ID }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          EXPECTED_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$APPSTORE_CONNECT_KEY"
          printf '%s' "$APPSTORE_CONNECT_KEY" > ios/Authkey.p8
          trap 'rm -f -- ios/Authkey.p8' EXIT
          payload="$GITHUB_WORKSPACE/validated"
          (cd "$payload" && shasum -a 256 -c SHA256SUMS.txt)
          identity="$payload/standard-red-notes-mobile-identity.json"
          ipa="$payload/standard-red-notes-ios-arm64-${RELEASE_VERSION}.ipa"
          fingerprint="$(tr -d '[:space:]' < "$payload/srn-mobile.fingerprint")"
          manifest_sha="$(shasum -a 256 "$payload/SHA256SUMS.txt" | awk '{print $1}')"
          ipa_sha="$(shasum -a 256 "$ipa" | awk '{print $1}')"
          ipa_md5="$(md5 -q "$ipa")"
          ipa_size="$(stat -f '%z' "$ipa")"
          app_version="$(jq -r '.ios.appVersion' "$identity")"
          build_number="$(jq -r '.ios.buildNumber' "$identity")"
          jq -e --arg version "$RELEASE_VERSION" --arg build "$EXPECTED_BUILD_NUMBER" --arg sha "$ipa_sha" \
            --arg md5 "$ipa_md5" --argjson size "$ipa_size" --argjson uses_non_exempt "$IOS_USES_NON_EXEMPT_ENCRYPTION" \
            '.ios.bundleId == "com.standardnotes.standardnotes" and
             .ios.extensionBundleId == "com.standardnotes.standardnotes.Share-To-SN" and
             .ios.teamId == "HKF9BXSN95" and .ios.appVersion == $version and .ios.buildNumber == $build and
             .ios.extensionAppVersion == $version and .ios.extensionBuildNumber == $build and
             .ios.appGroup == "group.com.standardnotes.standardnotes" and .ios.usesNonExemptEncryption == $uses_non_exempt and
             .ios.artifact.sha256 == $sha and .ios.artifact.md5 == $md5 and .ios.artifact.size == $size' "$identity"
          [ "$app_version" = "$RELEASE_VERSION" ]
          [ "$build_number" = "$EXPECTED_BUILD_NUMBER" ]
          [[ "$fingerprint" =~ ^[0-9a-f]{64}$ ]]

          marker_name="srn-mobile-app-store-intent-${GITHUB_RUN_ID}"
          marker_dir="$RUNNER_TEMP/app-store-intent"
          marker="$marker_dir/marker.json"
          mkdir -p "$marker_dir"
          artifacts="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=${marker_name}&per_page=100")"
          marker_count="$(jq '[.artifacts[] | select(.expired == false)] | length' <<< "$artifacts")"
          if [ "$marker_count" -gt 1 ]; then
            echo 'Multiple same-run App Store intent artifacts exist.' >&2
            exit 1
          elif [ "$marker_count" -eq 1 ]; then
            marker_id="$(jq -r '[.artifacts[] | select(.expired == false)][0].id' <<< "$artifacts")"
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${marker_id}/zip" > "$RUNNER_TEMP/app-store-intent.zip"
            unzip -q "$RUNNER_TEMP/app-store-intent.zip" -d "$marker_dir"
          fi
          marker_present=false
          if [ -s "$marker" ]; then
            marker_present=true
            jq -e --arg run "$GITHUB_RUN_ID" --arg current_attempt "$GITHUB_RUN_ATTEMPT" --arg sha "$GITHUB_SHA" --arg version "$app_version" \
              --arg build "$build_number" --arg fp "$fingerprint" --arg artifact_sha "$ipa_sha" \
              --arg artifact_md5 "$ipa_md5" --argjson artifact_size "$ipa_size" --arg manifest_sha "$manifest_sha" \
              '.schema == 1 and .provider == "app-store-connect" and .runId == $run and
               (.originatingRunAttempt | test("^[1-9][0-9]*$")) and
               ((.originatingRunAttempt | tonumber) <= ($current_attempt | tonumber)) and .headSha == $sha and
               .bundleId == "com.standardnotes.standardnotes" and .teamId == "HKF9BXSN95" and
               .appVersion == $version and .buildNumber == $build and .fingerprint == $fp and
               .artifact.sha256 == $artifact_sha and .artifact.md5 == $artifact_md5 and
               .artifact.size == $artifact_size and .checksumManifestSha256 == $manifest_sha' "$marker"
          fi

          IOS_IPA_PATH="$ipa" APP_VERSION="$app_version" BUILD_NUMBER="$build_number" \
          PROVIDER_EVIDENCE_PATH="$RUNNER_TEMP/app-store-preflight.json" \
            bundle exec fastlane ios inspect_upload
          provider_status="$(jq -r '.status' "$RUNNER_TEMP/app-store-preflight.json")"
          case "$provider_status:$marker_present" in
            absent:false)
              jq -n --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" --arg sha "$GITHUB_SHA" \
                --arg version "$app_version" --arg build "$build_number" --arg fp "$fingerprint" \
                --arg file "$(basename "$ipa")" --arg artifact_sha "$ipa_sha" --arg artifact_md5 "$ipa_md5" \
                --argjson artifact_size "$ipa_size" --arg manifest_sha "$manifest_sha" \
                '{schema: 1, provider: "app-store-connect", runId: $run, originatingRunAttempt: $attempt, headSha: $sha,
                  bundleId: "com.standardnotes.standardnotes", extensionBundleId: "com.standardnotes.standardnotes.Share-To-SN",
                  teamId: "HKF9BXSN95", appVersion: $version, buildNumber: $build, fingerprint: $fp,
                  checksumManifestSha256: $manifest_sha,
                  artifact: {file: $file, sha256: $artifact_sha, md5: $artifact_md5, size: $artifact_size}}' > "$marker"
              echo 'create_marker=true' >> "$GITHUB_OUTPUT"
              echo 'upload_required=true' >> "$GITHUB_OUTPUT"
              ;;
            absent:true)
              echo 'create_marker=false' >> "$GITHUB_OUTPUT"
              echo 'upload_required=true' >> "$GITHUB_OUTPUT"
              ;;
            pending:true|valid:true)
              echo 'create_marker=false' >> "$GITHUB_OUTPUT"
              echo 'upload_required=false' >> "$GITHUB_OUTPUT"
              ;;
            pending:false|valid:false)
              echo 'App Store Connect already contains this build identity without a same-run intent marker; refusing adoption.' >&2
              exit 1
              ;;
            *)
              cat "$RUNNER_TEMP/app-store-preflight.json" >&2
              echo 'App Store Connect returned duplicate, mismatched, failed, or unverifiable build-upload evidence.' >&2
              exit 1
              ;;
          esac

      - name: Persist App Store intent before external mutation
        if: steps.ios_preflight.outputs.create_marker == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
