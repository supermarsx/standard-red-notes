            unzip -q "$RUNNER_TEMP/testflight-distribution-intent.zip" -d "$stage_dir"
            jq -e --arg run "$GITHUB_RUN_ID" --arg current_attempt "$GITHUB_RUN_ATTEMPT" --arg sha "$GITHUB_SHA" \
