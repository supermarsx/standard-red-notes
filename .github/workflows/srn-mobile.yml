          unzip -q "$RUNNER_TEMP/app-store-intent.zip" -d "$RUNNER_TEMP/app-store-intent"
          marker="$RUNNER_TEMP/app-store-intent/marker.json"
          ipa_sha="$(shasum -a 256 "$ipa" | awk '{print $1}')"
          ipa_md5="$(md5 -q "$ipa")"
          ipa_size="$(stat -f '%z' "$ipa")"
          fingerprint="$(tr -d '[:space:]' < "$payload/srn-mobile.fingerprint")"
          jq -e --arg run "$GITHUB_RUN_ID" --arg current_attempt "$GITHUB_RUN_ATTEMPT" --arg sha "$GITHUB_SHA" --arg version "$app_version" --arg build "$build_number" \
            --arg fp "$fingerprint" --arg artifact_sha "$ipa_sha" --arg artifact_md5 "$ipa_md5" --argjson artifact_size "$ipa_size" \
            '.runId == $run and (.originatingRunAttempt | test("^[1-9][0-9]*$")) and
