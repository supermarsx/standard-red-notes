name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      profile:
        description: Additional disposable-stack validation to run
        required: true
        default: required
        type: choice
        options:
          - required
          - load
          - exhaustive
          - all

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'supermarsx/standard-red-notes') && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' || github.repository != 'supermarsx/standard-red-notes' }}

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: "26"
  COREPACK_VERSION: "0.35.0"
  YARN_ENABLE_GLOBAL_CACHE: "false"
  APP_IMAGE: standard-red-notes/app:local
  SERVER_IMAGE: standard-red-notes/server:local

jobs:
  contracts:
    name: contracts and workflow policy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install Corepack
        run: npm install --global "corepack@${COREPACK_VERSION}" && corepack enable
      - name: Cache root Yarn packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .yarn/cache
          key: ci-root-yarn-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('yarn.lock') }}
          restore-keys: ci-root-yarn-${{ runner.os }}-node${{ env.NODE_VERSION }}-
      - name: Install root dependencies immutably
        run: yarn install --immutable
      - name: Audit every committed production dependency graph
        run: yarn deps:security:production
      - name: Install release policy dependencies
        run: npm ci --prefix scripts --ignore-scripts --no-audit --no-fund
      - name: Validate CI, release, and documentation contracts
        run: yarn ci:contracts
      - name: Test fail-closed release fingerprint comparison
        run: node --test scripts/compare-release-fingerprints.test.mjs scripts/release-packaging-contract.test.mjs
      - name: Generate all-workspace release impact report
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          node scripts/analyze-release-impact.mjs \
            --all-workspaces all \
            --output release-impact.json \
            --report release-impact.md
          cat release-impact.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload all-workspace release impact report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-impact-report
          path: |
            release-impact.json
            release-impact.md
          if-no-files-found: error
      - name: Lint GitHub Actions workflows
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -config-file .github/actionlint.yaml

  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      # Deliberately its own step, run this early, with no dependency on any
      # install/build step below: `yarn check` chains typecheck && lint &&
      # format:check && test with `&&`, so an unrelated earlier failure would
      # silently skip `lint` (and this check with it) and nobody would notice
      # it never ran. The script itself has zero npm dependencies (plain
      # fs/path), so it needs nothing but Node — see
      # .orchestration/logs/t99/t99-e4.md for the incident this guards
      # against (36 call sites of a Tailwind v4 syntax regression that
      # silently dropped CSS declarations, shipped to production undetected).
      - name: Guard against Tailwind v4 bracket CSS-variable regressions
        run: node app/packages/web/scripts/CheckCssVarBrackets.mjs
      - name: Install Corepack
        run: npm install --global "corepack@${COREPACK_VERSION}" && corepack enable
      - name: Cache Yarn packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .yarn/cache
            app/.yarn/cache
            server/.yarn/cache
          key: ci-yarn-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('yarn.lock', 'app/yarn.lock', 'server/yarn.lock') }}
          restore-keys: ci-yarn-${{ runner.os }}-node${{ env.NODE_VERSION }}-
      - name: Install root dependencies immutably
        run: yarn install --immutable
      - name: Install app dependencies immutably
        working-directory: app
        run: yarn install --immutable
      # Same independence rationale as the bracket-CSS-variable guard above,
      # placed here instead of earlier because stylelint (unlike that script)
      # is a real dependency that needs `node_modules` — this is the first
      # point that's ready. Scoped to only the source stylesheets that caused
      # the incident (app/packages/web/src/stylesheets), not the pre-built
      # third-party component bundles under src/components/assets, and to
      # only 3 targeted rules (see app/packages/web/.stylelintrc.json) chosen
      # so the gate reports real defects, not house-style nitpicks — see
      # .orchestration/logs/t99/t99-e4.md for what it does and does not catch.
      - name: Guard against known-bad CSS declarations in our stylesheets
        working-directory: app
        run: yarn workspace @standardnotes/web run lint:scss
      - name: Install server dependencies immutably
        working-directory: server
        run: yarn install --immutable
      - name: Build app workspaces
        working-directory: app
        run: yarn build:all
      - name: Build server workspaces
        working-directory: server
        run: yarn build
      - name: Run coordinated checks
        run: yarn check
      # The collaboration tombstone's other guard asserts the Lua SOURCE TEXT,
      # so a rewrite that re-arms the 24 h tombstone by a different shape reads
      # clean and still regresses. This one asserts the observable PTTL through
      # the real bridge against a real Redis: a DENIED reserve must not extend
      # it (59998 -> 86399997 before the fix, 59998 -> 59994 after).
      #
      # It runs HERE, not in container-smoke: the compose `cache` is
      # deliberately internal-only with no published host port, so it is
      # unreachable from a runner-side vitest, and container-smoke installs only
      # the root workspace. This job already has the server workspace installed,
      # so a throwaway Redis is the whole setup. The suite namespaces every key
      # by a per-run UUID, so it cannot collide with anything.
      - name: Verify the collaboration tombstone against a real Redis
        working-directory: server
        env:
          SRN_COLLAB_REDIS_HOST: 127.0.0.1
          SRN_COLLAB_REDIS_PORT: "6396"
        run: |
          set -euo pipefail
          container="srn-ci-collab-redis-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run --rm -d --name "$container" -p 127.0.0.1:6396:6379 redis:8.8.0-alpine
          for _ in $(seq 1 30); do
            if docker exec "$container" redis-cli ping | grep -q PONG; then break; fi
            sleep 1
          done
          docker exec "$container" redis-cli ping | grep -q PONG
          yarn workspace @standard-red-notes/websocket-gateway vitest run \
            test/collaborationTombstone.redis.test.ts
      - name: Remove the throwaway collaboration Redis
        if: always()
        run: >-
          docker ps --all --quiet
          --filter "name=srn-ci-collab-redis-${{ github.run_id }}-${{ github.run_attempt }}"
          | xargs -r docker rm -f

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install Corepack
        run: npm install --global "corepack@${COREPACK_VERSION}" && corepack enable
      - name: Cache Yarn packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .yarn/cache
            app/.yarn/cache
            server/.yarn/cache
          key: ci-yarn-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('yarn.lock', 'app/yarn.lock', 'server/yarn.lock') }}
          restore-keys: ci-yarn-${{ runner.os }}-node${{ env.NODE_VERSION }}-
      - name: Install root dependencies immutably
        run: yarn install --immutable
      - name: Install app dependencies immutably
        working-directory: app
        run: yarn install --immutable
      - name: Install server dependencies immutably
        working-directory: server
        run: yarn install --immutable
      - name: Build coordinated project
        run: yarn build

  desktop-electron:
    name: desktop Electron under Xvfb
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install Corepack
        run: npm install --global "corepack@${COREPACK_VERSION}" && corepack enable
      - name: Cache app Yarn packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/.yarn/cache
          key: ci-desktop-yarn-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('app/yarn.lock') }}
          restore-keys: ci-desktop-yarn-${{ runner.os }}-node${{ env.NODE_VERSION }}-
      - name: Install headless desktop runtime
        run: sudo apt-get update && sudo apt-get install --yes xvfb libsecret-1-0
      - name: Install app dependencies immutably
        working-directory: app
        run: yarn install --immutable
      - name: Build the desktop test artifact
        working-directory: app
        run: yarn build:desktop
      - name: Configure Electron sandbox
        working-directory: app
        run: |
          electron_package="$(yarn workspace @standardnotes/desktop node -p "require.resolve('electron/package.json')")"
          electron_dir="$(dirname "$electron_package")"
          yarn workspace @standardnotes/desktop node "$electron_dir/install.js"
          sandbox="$electron_dir/dist/chrome-sandbox"
          test -f "$sandbox"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
          test "$(stat -c '%U:%G %a' "$sandbox")" = "root:root 4755"
      - name: Run the real Electron suites
        working-directory: app
        run: >-
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24"
          yarn workspace @standardnotes/desktop ava:electron

  container-smoke:
    name: disposable stack, Redis, restore, and hardening
    runs-on: ubuntu-latest
    timeout-minutes: 70
    outputs:
      publication_artifact_id: ${{ steps.publication_upload.outputs.artifact-id }}
      publication_artifact_name: ${{ steps.publication_identity.outputs.artifact_name }}
      publication_attempt: ${{ steps.publication_identity.outputs.attempt }}
      publication_tag: ${{ steps.publication_identity.outputs.tag }}
      publication_version: ${{ steps.publication_identity.outputs.version }}
    env:
      COMPOSE_PROJECT_NAME: srn-ci-${{ github.run_id }}-${{ github.run_attempt }}-smoke
      SRN_DEPLOY_REVISION: ${{ github.sha }}
      SRN_DEPLOY_VERSION: ci-${{ github.run_id }}.${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Resolve exact clean deployment identity
        run: >-
          node scripts/resolve-deployment-identity.mjs
          --expect-revision "$SRN_DEPLOY_REVISION"
          --version "$SRN_DEPLOY_VERSION"
      - name: Install Corepack
        run: npm install --global "corepack@${COREPACK_VERSION}" && corepack enable
      - name: Cache root Yarn and npm packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .yarn/cache
            ~/.npm
          key: ci-stack-deps-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('yarn.lock', 'e2e/package.json', 'e2e/package-lock.json') }}
          restore-keys: ci-stack-deps-${{ runner.os }}-node${{ env.NODE_VERSION }}-
      - name: Install root dependencies immutably
        run: yarn install --immutable
      - name: Install pinned Playwright test runner
        run: npm --prefix e2e ci --no-audit --no-fund --ignore-scripts
      - name: Install Chromium
        run: npm --prefix e2e exec -- playwright install --with-deps chromium
      - name: Lint tracked Dockerfiles
        run: |
          set -euo pipefail
          while IFS= read -r dockerfile; do
            echo "::group::hadolint ${dockerfile}"
            docker run --rm -i \
              -v "$PWD/.hadolint.yaml:/root/.config/hadolint.yaml:ro" \
              hadolint/hadolint@sha256:7aba693c1442eb31c0b015c129697cb3b6cb7da589d85c7562f9deb435a6657c \
              < "$dockerfile"
            echo "::endgroup::"
          done < <(git ls-files '*Dockerfile*' | grep -v '\.dockerignore$')
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build hardened app image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: app
          file: app/Dockerfile
          load: true
          platforms: linux/amd64
          push: false
          tags: ${{ env.APP_IMAGE }}
          build-args: |
            SRN_DEPLOY_REVISION=${{ github.sha }}
            SRN_DEPLOY_VERSION=ci-${{ github.run_id }}.${{ github.run_attempt }}
          cache-from: type=gha,scope=ci-app
          cache-to: type=gha,mode=max,scope=ci-app
      - name: Build hardened server image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: server
          file: server/Dockerfile
          load: true
          platforms: linux/amd64
          push: false
          tags: ${{ env.SERVER_IMAGE }}
          build-args: |
            SRN_DEPLOY_REVISION=${{ github.sha }}
            SRN_DEPLOY_VERSION=ci-${{ github.run_id }}.${{ github.run_attempt }}
          cache-from: type=gha,scope=ci-server
          cache-to: type=gha,mode=max,scope=ci-server
      - name: Configure isolated stack
        run: |
          set -euo pipefail
          {
            echo 'APP_PORT=3001'
            echo 'APP_URL=http://127.0.0.1:3001'
            echo 'PUBLIC_FILES_SERVER_URL=http://127.0.0.1:3001/files'
            echo 'AUTH_SERVER_U2F_EXPECTED_ORIGIN=http://127.0.0.1:3001,http://localhost:3001,http://localhost'
            echo 'MYSQL_DATABASE=standard_notes_ci'
            echo 'MYSQL_USER=std_notes_ci'
            echo 'LOG_LEVEL=warn'
          } >> "$GITHUB_ENV"
          # SYNCING_SERVER_INTERNAL_GRPC_AUTH_SECRET is what opens the socket
          # SYNC_ITEMS lane. A fresh checkout has no .env, so without it the
          # api-gateway's InternalGrpcServiceAuth stays unconfigured, the lane is
          # never advertised, and container-smoke's oversized-result step exits 1
          # on REQUIRE_SYNC_ITEMS=1 -- which is what it was doing. scripts/setup.sh
          # generates this for real operators; CI has to mint its own. `openssl rand
          # -hex 32` yields 64 characters, well over the 32-byte floor
          # InternalGrpcServiceAuth.ready() enforces. It is INERT in the two jobs
          # that never switch proxies: the gRPC syncing proxy is bound only when
          # SERVICE_PROXY_TYPE=grpc (api-gateway Container.ts:121), so with no
          # durable port bound the adapter reports not-ready whatever the secret
          # says. It stays in all three blocks so copying one cannot reintroduce
          # the gap.
          for name in MYSQL_PASSWORD MYSQL_ROOT_PASSWORD AUTH_JWT_SECRET AUTH_SERVER_ENCRYPTION_SERVER_KEY VALET_TOKEN_SECRET WEBSOCKET_GATEWAY_INTERNAL_SECRET WEB_SOCKET_CONNECTION_TOKEN_SECRET ASSISTANT_SUBSCRIPTION_ENCRYPTION_KEY SYNCING_SERVER_INTERNAL_GRPC_AUTH_SECRET; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::${value}"
            echo "${name}=${value}" >> "$GITHUB_ENV"
          done
      - name: Start disposable stack
        run: docker compose up -d --no-build --wait --wait-timeout 900
      - name: Verify durable encrypted email queue against Compose Redis
        run: yarn test:email-redis:compose
      - name: Verify end-to-end queued SMTP delivery
        run: yarn test:email-delivery:compose
      - name: Verify exact app and server deployment identity
        run: |
          set -euo pipefail
          for image in "$APP_IMAGE" "$SERVER_IMAGE"; do
            test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")" = "$SRN_DEPLOY_REVISION"
            test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$image")" = "$SRN_DEPLOY_VERSION"
          done
          for service in app server; do
            test "$(docker compose exec -T "$service" stat -c '%u:%g %a' /usr/share/srn-deployment/deployment.json)" = "0:0 444"
          done
          docker compose exec -T app cat /usr/share/srn-deployment/deployment.json > artifacts-app-deployment.json
          docker compose exec -T server cat /usr/share/srn-deployment/deployment.json > artifacts-server-deployment.json
          cmp artifacts-app-deployment.json artifacts-server-deployment.json
          node scripts/verify-deployment-identity.mjs \
            --app-url "$APP_URL" \
            --expected-revision "$SRN_DEPLOY_REVISION" \
            --expected-version "$SRN_DEPLOY_VERSION"
          rm -f artifacts-app-deployment.json artifacts-server-deployment.json
      # Reproducing this locally from Git Bash on Windows needs MSYS_NO_PATHCONV=1:
      # MSYS rewrites any argument starting with `/`, so `/healthcheck/readiness`
      # and `/sockets` arrive inside the container as `C:/Program Files/Git/...`.
      # The runner is ubuntu, so the workflow itself is unaffected.
      - name: Verify encrypted two-editor realtime convergence
        run: |
          docker compose exec -T \
            -e REQUIRE_GATEWAY=1 \
            -e GATEWAY_HTTP=http://127.0.0.1:3000 \
            -e GATEWAY_WS=ws://127.0.0.1:3000/sockets \
            -e GATEWAY_HEALTH_PATH=/healthcheck/readiness \
            server yarn node packages/websocket-gateway/e2e/collab-yjs.e2e.mjs
      # The realtime script needs BOTH origins in one process: the public front
      # door, to prove the x-internal-secret mint is REFUSED there (R46), and a
      # loopback peer, the only place that mint is accepted. Only something
      # inside the server container reaches both — the server publishes no
      # ports, and the front door is the app container's nginx on the compose
      # network (app:8080), so `docker compose exec` is the one vantage point.
      - name: Verify realtime mint boundaries and Redis push delivery
        run: |
          docker compose exec -T \
            -e REQUIRE_GATEWAY=1 \
            -e GATEWAY_HTTP=http://app:8080 \
            -e GATEWAY_WS=ws://app:8080/sockets \
            -e GATEWAY_INTERNAL_HTTP=http://127.0.0.1:3000 \
            -e REDIS_HOST=cache \
            server yarn node packages/websocket-gateway/e2e/realtime.e2e.mjs
      # The whole cross-device push chain (save -> syncing-server -> SNS/SQS ->
      # gateway worker -> the other device's socket) from the PUBLIC front door,
      # which is the only origin a browser uses. A broken queue, a filtered
      # subscription or a dead worker fails here and nowhere else in CI.
      - name: Verify the cross-device realtime push round trip
        working-directory: server
        env:
          REQUIRE_GATEWAY: "1"
          BASE: http://127.0.0.1:3001
          WS_BASE: ws://127.0.0.1:3001
        run: >-
          yarn workspace @standard-red-notes/websocket-gateway node
          e2e/push-roundtrip.e2e.mjs
      # COLLABORATION AUTHORIZATION, which nothing in CI measured until now.
      # The two legs above are the relay and the push chain: `collab-yjs` mints
      # its own connection tokens and signs its own room capabilities, so it
      # never enters COLLABORATION_AUTHORIZE at all. That is how collaboration
      # could be denied for every note on every single-container deployment
      # (6e18e3a5) with this job green. This leg registers two real accounts,
      # creates a real shared vault, accepts a real invite and requires a
      # PRESENT `authorized: true` carrying a capability bound to the room, the
      # epoch pair and the lease -- and requires every refusal to be DECIDED
      # rather than a transport failure. Front door, like the push round trip:
      # it is the only origin a browser uses.
      - name: Verify collaboration AUTHORIZATION on two real accounts
        working-directory: server
        env:
          REQUIRE_GATEWAY: "1"
          BASE: http://127.0.0.1:3001
          WS_BASE: ws://127.0.0.1:3001
        run: >-
          yarn workspace @standard-red-notes/websocket-gateway node
          e2e/collab-end-to-end.e2e.mjs
      # The socket capability census and the HTTP fallback matrix, on the same
      # stack and the same account. Its AUTHORIZE_COLLABORATION row now requires
      # a grant for a note the account OWNS plus a refusal for one that does not
      # exist, so it can tell a working authorizer from a denied one -- the old
      # row was byte-identical on the broken and the fixed image.
      - name: Verify the socket capability and HTTP fallback matrix
        working-directory: server
        env:
          REQUIRE_GATEWAY: "1"
          CONTROL: "1"
          EXPECT_SESSION: cookie
          BASE: http://127.0.0.1:3001
          WS_BASE: ws://127.0.0.1:3001
        run: >-
          yarn workspace @standard-red-notes/websocket-gateway node
          e2e/capability-fallback.e2e.mjs
      - name: Run bounded browser and Redis smoke
        working-directory: e2e
        env:
          OPS_LOAD_NOTES: "25"
          OPS_LOAD_CLIENTS: "2"
          OPS_REDIS_WORKERS: "2"
          OPS_REDIS_OPS_PER_WORKER: "50"
          PLAYWRIGHT_JSON_OUTPUT_FILE: artifacts/playwright-smoke.json
        run: npx playwright test tests/app-opens.spec.ts tests/ops-load.spec.ts --project=chromium --reporter=list,json
      - name: Reject skipped or incomplete required browser tests
        run: yarn ci:verify-playwright --report e2e/artifacts/playwright-smoke.json --min-expected 4 --max-skipped 0
      - name: Verify MariaDB backup and restore
        run: yarn ops:backup-restore
      - name: Verify image and live-container hardening
        run: >-
          yarn ci:docker-hardening
          --image "app=${APP_IMAGE}"
          --image "server=${SERVER_IMAGE}"
          --container "app=${COMPOSE_PROJECT_NAME}-app-1"
          --container "server=${COMPOSE_PROJECT_NAME}-server-1"
          --container "db=${COMPOSE_PROJECT_NAME}-db-1"
          --container "cache=${COMPOSE_PROJECT_NAME}-cache-1"
          --container "floci=${COMPOSE_PROJECT_NAME}-floci-1"
      # gRPC phase. The worker sync lane only carries SYNC_ITEMS when the
      # api-gateway speaks gRPC to the syncing-server, so the oversized-result
      # contract (a payload-less STATUS COMMITTED + an idempotent HTTP replay)
      # is unprovable under the default HTTP proxies. Compose passes
      # SERVICE_PROXY_TYPE straight through, so switching it and recreating the
      # server is the whole setup. This runs LAST against the live stack: every
      # step after it inspects images, not containers, so nothing needs the
      # default proxy configuration restored.
      - name: Switch the stack to gRPC service proxies
        run: echo 'SERVICE_PROXY_TYPE=grpc' >> "$GITHUB_ENV"
      - name: Recreate the stack with gRPC service proxies
        run: docker compose up -d --no-build --wait --wait-timeout 900
      - name: Verify the oversized SYNC_ITEMS result over the worker lane
        working-directory: server
        env:
          REQUIRE_GATEWAY: "1"
          REQUIRE_SYNC_ITEMS: "1"
          BASE: http://127.0.0.1:3001
          WS_BASE: ws://127.0.0.1:3001
        run: >-
          yarn workspace @standard-red-notes/websocket-gateway node
          e2e/sync-items-oversized.e2e.mjs
      - name: Verify the realtime push round trip under gRPC proxies
        working-directory: server
        env:
          REQUIRE_GATEWAY: "1"
          BASE: http://127.0.0.1:3001
          WS_BASE: ws://127.0.0.1:3001
        run: >-
          yarn workspace @standard-red-notes/websocket-gateway node
          e2e/push-roundtrip.e2e.mjs
      # THIS IS THE ONLY BROWSER SIGN-IN THAT RUNS ON A GENUINE COOKIE SESSION,
      # and the only one in the gRPC phase. Both halves matter.
      #
      # COOKIE SESSIONS. `forceLegacySessions` is bound to `E2E_TESTING === 'true'`
      # and no compose file sets it, so this stack issues exactly the cookie
      # sessions production does — while the external home-server suite sets the
      # flag and therefore runs in the one configuration where a cookie-session
      # defect cannot occur. That is how it shipped that no socket lane could
      # authenticate a cookie session at all. The spec CONFIRMS the session type
      # per run instead of assuming it, so a stack that quietly reverted to legacy
      # header sessions fails here rather than passing and proving nothing.
      # Verified live in both modes: green without the flag, red with it
      # (`session.access_token must carry the cookie-session version prefix "2:";
      # got "1:"`). Only the `2:` prefix and the bearer-alone refusal discriminate
      # — at api 20240226 the legacy mode still returns a `session` object and
      # still sets both HttpOnly cookies, so neither of those is a session-type
      # check; `e2e/helpers/session.ts` says which is which and why.
      #
      # gRPC PHASE. Do not delete this if SERVICE_PROXY_TYPE goes away. The switch
      # moves `validateSession` off HTTP — it runs on EVERY authenticated request
      # and retries three times on UNAVAILABLE before throwing with NO HTTP
      # fallback — plus `items/sync`. Every browser step above ran under the
      # default HTTP proxies, so before this step nothing in CI ever signed in
      # through the real client while any of that was reachable. The grep is a
      # separate step on purpose: if the switch silently failed to reach the
      # container, the browser drill would pass on HTTP and prove nothing.
      #
      # AND IT NOW RUNS ON THE SOCKET SYNC LANE, which it could not before. The
      # lane was unreachable on this topology for a reason unrelated to
      # SERVICE_PROXY_TYPE: `SyncWebSocketCommandAdapter.ready()` needs
      # `durableCommandAuthenticationReady()`, which needs
      # SYNCING_SERVER_INTERNAL_GRPC_AUTH_SECRET in the api-gateway's OWN .env,
      # and docker-entrypoint.sh projected no
      # API_GATEWAY_SYNCING_SERVER_INTERNAL_GRPC_AUTH_SECRET — so the secret
      # reached the syncing-server, which verifies proofs, and never the gateway,
      # which signs them. SYNC_ITEMS was withheld from negotiation and saves went
      # over HTTP whatever the proxy setting said, while single-container and LXC
      # bind DirectCallSyncCommandPort unconditionally and served the lane — which
      # is why the save-loss defect reached them and not this job. The entrypoint
      # now projects it and the stack config above mints one.
      #
      # That is what makes this step bite. Proven by mutation on the as-landed
      # configuration: reverting eb77e407's three lane call sites (type-valid)
      # fails this step deterministically — a fresh account's SN|ItemsKey never
      # drains — and HEAD passes. Before the projection the same revert PASSED,
      # because the lane it breaks was never negotiated.
      - name: Confirm the api-gateway is really on gRPC service proxies
        run: >-
          test "$(docker compose exec -T server grep -cx 'SERVICE_PROXY_TYPE=grpc'
          /opt/server/packages/api-gateway/.env)" = '1'
      - name: Verify a browser sign-in and note round trip over the socket sync lane
        working-directory: e2e
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: artifacts/playwright-grpc-auth.json
        run: npx playwright test tests/grpc-auth-session.spec.ts --project=chromium --reporter=list,json
      - name: Reject a skipped or incomplete socket sync lane sign-in
        run: yarn ci:verify-playwright --report e2e/artifacts/playwright-grpc-auth.json --min-expected 1 --max-skipped 0
      - name: Resolve retry-stable publication handoff identity
        id: publication_identity
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          github.repository == 'supermarsx/standard-red-notes'
        run: |
          set -euo pipefail
          case "$GITHUB_RUN_ATTEMPT" in ''|*[!0-9]*) exit 1 ;; esac
          {
            echo "attempt=${GITHUB_RUN_ATTEMPT}"
            echo "artifact_name=container-publication-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "tag=sha-${GITHUB_SHA}-run-${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
            echo "version=${SRN_DEPLOY_VERSION}"
          } >> "$GITHUB_OUTPUT"
      - name: Export the exact tested app and server images
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          github.repository == 'supermarsx/standard-red-notes'
        run: |
          set -euo pipefail
          publish_dir=container-publication
          mkdir -p "$publish_dir"
          for image in "$APP_IMAGE" "$SERVER_IMAGE"; do
            test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")" = 'linux/amd64'
          done
          docker save --output "$publish_dir/images.tar" "$APP_IMAGE" "$SERVER_IMAGE"
          docker image inspect --format '{{.Id}}' "$APP_IMAGE" > "$publish_dir/app-image-id.txt"
          docker image inspect --format '{{.Id}}' "$SERVER_IMAGE" > "$publish_dir/server-image-id.txt"
          printf '%s\n' "$SRN_DEPLOY_REVISION" > "$publish_dir/revision.txt"
          printf '%s\n' "$SRN_DEPLOY_VERSION" > "$publish_dir/version.txt"
          printf '%s\n' 'linux/amd64' > "$publish_dir/platform.txt"
          (cd "$publish_dir" && sha256sum images.tar > images.tar.sha256)
      - name: Upload the exact tested container bundle
        id: publication_upload
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          github.repository == 'supermarsx/standard-red-notes'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.publication_identity.outputs.artifact_name }}
          path: container-publication/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Collect stack diagnostics
        if: always()
        run: |
          mkdir -p artifacts/server-logs
          docker compose ps --all > artifacts/compose-ps.txt 2>&1
          docker compose logs --no-color > artifacts/compose.log 2>&1
          if ! docker inspect "${COMPOSE_PROJECT_NAME}-app-1" "${COMPOSE_PROJECT_NAME}-server-1" > artifacts/container-inspect.json 2>&1; then
            echo "container inspection was unavailable" >> artifacts/container-inspect.json
          fi
          if ! docker compose exec -T server supervisorctl status > artifacts/supervisor-status.txt 2>&1; then
            echo "server supervisor status was unavailable" >> artifacts/supervisor-status.txt
          fi
          if ! docker compose cp server:/var/lib/server/logs/. artifacts/server-logs > artifacts/server-log-copy.txt 2>&1; then
            echo "server runtime logs were unavailable" >> artifacts/server-log-copy.txt
          fi
      - name: Upload stack diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: required-stack-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/
            e2e/artifacts/
            e2e/test-results/
          if-no-files-found: error
          retention-days: 7
      - name: Remove disposable stack and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans --timeout 60

  load-drill:
    name: scheduled heavy sync and Redis load
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.profile == 'load' || inputs.profile == 'all'))
    needs: container-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      COMPOSE_PROJECT_NAME: srn-ci-${{ github.run_id }}-${{ github.run_attempt }}-load
      SRN_DEPLOY_REVISION: ${{ github.sha }}
      SRN_DEPLOY_VERSION: ci-${{ github.run_id }}.${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Resolve exact clean deployment identity
        run: >-
          node scripts/resolve-deployment-identity.mjs
          --expect-revision "$SRN_DEPLOY_REVISION"
          --version "$SRN_DEPLOY_VERSION"
      - name: Install Corepack
        run: npm install --global "corepack@${COREPACK_VERSION}" && corepack enable
      - name: Cache root Yarn and npm packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .yarn/cache
            ~/.npm
          key: ci-stack-deps-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('yarn.lock', 'e2e/package.json', 'e2e/package-lock.json') }}
          restore-keys: ci-stack-deps-${{ runner.os }}-node${{ env.NODE_VERSION }}-
      - name: Install root dependencies immutably
        run: yarn install --immutable
      - name: Install pinned Playwright test runner
        run: npm --prefix e2e ci --no-audit --no-fund --ignore-scripts
      - name: Install Chromium
        run: npm --prefix e2e exec -- playwright install --with-deps chromium
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Restore app image from build cache
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: app
          file: app/Dockerfile
          load: true
          push: false
          tags: ${{ env.APP_IMAGE }}
          build-args: |
            SRN_DEPLOY_REVISION=${{ github.sha }}
            SRN_DEPLOY_VERSION=ci-${{ github.run_id }}.${{ github.run_attempt }}
          cache-from: type=gha,scope=ci-app
      - name: Restore server image from build cache
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: server
          file: server/Dockerfile
          load: true
          push: false
          tags: ${{ env.SERVER_IMAGE }}
          build-args: |
            SRN_DEPLOY_REVISION=${{ github.sha }}
            SRN_DEPLOY_VERSION=ci-${{ github.run_id }}.${{ github.run_attempt }}
          cache-from: type=gha,scope=ci-server
      - name: Configure isolated stack
        run: |
          set -euo pipefail
          {
            echo 'APP_PORT=3001'
            echo 'APP_URL=http://127.0.0.1:3001'
            echo 'PUBLIC_FILES_SERVER_URL=http://127.0.0.1:3001/files'
            echo 'AUTH_SERVER_U2F_EXPECTED_ORIGIN=http://127.0.0.1:3001,http://localhost:3001,http://localhost'
            echo 'MYSQL_DATABASE=standard_notes_ci'
            echo 'MYSQL_USER=std_notes_ci'
            echo 'LOG_LEVEL=warn'
          } >> "$GITHUB_ENV"
          # SYNCING_SERVER_INTERNAL_GRPC_AUTH_SECRET is what opens the socket
          # SYNC_ITEMS lane. A fresh checkout has no .env, so without it the
          # api-gateway's InternalGrpcServiceAuth stays unconfigured, the lane is
          # never advertised, and container-smoke's oversized-result step exits 1
          # on REQUIRE_SYNC_ITEMS=1 -- which is what it was doing. scripts/setup.sh
          # generates this for real operators; CI has to mint its own. `openssl rand
          # -hex 32` yields 64 characters, well over the 32-byte floor
          # InternalGrpcServiceAuth.ready() enforces. It is INERT in the two jobs
          # that never switch proxies: the gRPC syncing proxy is bound only when
          # SERVICE_PROXY_TYPE=grpc (api-gateway Container.ts:121), so with no
          # durable port bound the adapter reports not-ready whatever the secret
          # says. It stays in all three blocks so copying one cannot reintroduce
          # the gap.
          for name in MYSQL_PASSWORD MYSQL_ROOT_PASSWORD AUTH_JWT_SECRET AUTH_SERVER_ENCRYPTION_SERVER_KEY VALET_TOKEN_SECRET WEBSOCKET_GATEWAY_INTERNAL_SECRET WEB_SOCKET_CONNECTION_TOKEN_SECRET ASSISTANT_SUBSCRIPTION_ENCRYPTION_KEY SYNCING_SERVER_INTERNAL_GRPC_AUTH_SECRET; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::${value}"
            echo "${name}=${value}" >> "$GITHUB_ENV"
          done
      - name: Start disposable stack
        run: docker compose up -d --no-build --wait --wait-timeout 900
      - name: Run heavy browser and Redis load
        working-directory: e2e
        env:
          OPS_LOAD_NOTES: "250"
          OPS_LOAD_CLIENTS: "4"
          OPS_REDIS_WORKERS: "4"
          OPS_REDIS_OPS_PER_WORKER: "500"
          PLAYWRIGHT_JSON_OUTPUT_FILE: artifacts/playwright-load.json
        run: npx playwright test tests/ops-load.spec.ts --project=chromium --reporter=list,json
      - name: Verify heavy-load report
        run: yarn ci:verify-playwright --report e2e/artifacts/playwright-load.json --min-expected 1 --max-skipped 0
      - name: Collect load diagnostics
        if: always()
        run: |
          mkdir -p artifacts
          docker compose ps --all > artifacts/compose-ps.txt 2>&1
          docker compose logs --no-color > artifacts/compose.log 2>&1
          docker stats --no-stream > artifacts/docker-stats.txt 2>&1
      - name: Upload load diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: heavy-load-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/
            e2e/artifacts/
            e2e/test-results/
          if-no-files-found: error
          retention-days: 14
      - name: Remove disposable stack and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans --timeout 60

  exhaustive-e2e:
    name: scheduled full Playwright matrix
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.profile == 'exhaustive' || inputs.profile == 'all'))
    needs: container-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      COMPOSE_PROJECT_NAME: srn-ci-${{ github.run_id }}-${{ github.run_attempt }}-e2e
