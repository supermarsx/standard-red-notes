  production-gate:
    name: production gate
    if: always()
    needs: [contracts, check, build, desktop-electron, container-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every production lane
        env:
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DESKTOP_ELECTRON_RESULT: ${{ needs.desktop-electron.result }}
          CONTAINER_RESULT: ${{ needs.container-smoke.result }}
        run: |
          set -euo pipefail
          for result in "$CONTRACTS_RESULT" "$CHECK_RESULT" "$BUILD_RESULT" "$DESKTOP_ELECTRON_RESULT" "$CONTAINER_RESULT"; do
            if [ "$result" != success ]; then
              echo "A required production lane finished with: $result" >&2
              exit 1
            fi
          done
          echo 'All required production lanes passed.'

  publish-containers:
    name: publish exact tested containers to GHCR
    needs: [container-smoke, production-gate]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'supermarsx/standard-red-notes' &&
      needs.container-smoke.result == 'success' &&
      needs.production-gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release-production
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      GHCR_APP_IMAGE: ghcr.io/supermarsx/standard-red-notes-app
      GHCR_SERVER_IMAGE: ghcr.io/supermarsx/standard-red-notes-server
      PUBLISH_ARTIFACT_ID: ${{ needs.container-smoke.outputs.publication_artifact_id }}
      PUBLISH_ARTIFACT: ${{ needs.container-smoke.outputs.publication_artifact_name }}
      PUBLISH_ATTEMPT: ${{ needs.container-smoke.outputs.publication_attempt }}
      PUBLISH_REVISION: ${{ github.sha }}
      PUBLISH_TAG: ${{ needs.container-smoke.outputs.publication_tag }}
      PUBLISH_VERSION: ${{ needs.container-smoke.outputs.publication_version }}
    steps:
      - name: Validate retry-stable publication handoff identity
        run: |
          set -euo pipefail
          case "$PUBLISH_ARTIFACT_ID" in ''|*[!0-9]*) exit 1 ;; esac
          case "$PUBLISH_ATTEMPT" in ''|*[!0-9]*) exit 1 ;; esac
          test "$PUBLISH_ARTIFACT" = "container-publication-${GITHUB_RUN_ID}-${PUBLISH_ATTEMPT}"
          test "$PUBLISH_TAG" = "sha-${GITHUB_SHA}-run-${GITHUB_RUN_ID}.${PUBLISH_ATTEMPT}"
          test "$PUBLISH_VERSION" = "ci-${GITHUB_RUN_ID}.${PUBLISH_ATTEMPT}"

      - name: Download the exact tested container bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ env.PUBLISH_ARTIFACT_ID }}
          digest-mismatch: error
          path: container-publication

      - name: Verify and load the exact tested images
        working-directory: container-publication
        run: |
          set -euo pipefail
          test "$(cat revision.txt)" = "$PUBLISH_REVISION"
          test "$(cat version.txt)" = "$PUBLISH_VERSION"
          test "$(cat platform.txt)" = 'linux/amd64'
          sha256sum --check images.tar.sha256
          docker load --input images.tar
          test "$(docker image inspect --format '{{.Id}}' standard-red-notes/app:local)" = "$(cat app-image-id.txt)"
          test "$(docker image inspect --format '{{.Id}}' standard-red-notes/server:local)" = "$(cat server-image-id.txt)"
          for image in standard-red-notes/app:local standard-red-notes/server:local; do
            test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")" = 'linux/amd64'
            test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")" = "$PUBLISH_REVISION"
            test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$image")" = "$PUBLISH_VERSION"
            test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' "$image")" = "https://github.com/$GITHUB_REPOSITORY"
          done

      - name: Log in to GitHub Container Registry
        id: registry_login
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the coordinated retry-stable image pair
        run: |
          set -euo pipefail
          docker tag standard-red-notes/app:local "$GHCR_APP_IMAGE:$PUBLISH_TAG"
          docker tag standard-red-notes/server:local "$GHCR_SERVER_IMAGE:$PUBLISH_TAG"
          docker push "$GHCR_APP_IMAGE:$PUBLISH_TAG"
          docker push "$GHCR_SERVER_IMAGE:$PUBLISH_TAG"

      - name: Verify registry digests and image identity
        id: verify_registry
        working-directory: container-publication
        run: |
          set -euo pipefail
          app_ref="$GHCR_APP_IMAGE:$PUBLISH_TAG"
          server_ref="$GHCR_SERVER_IMAGE:$PUBLISH_TAG"
          docker image rm "$app_ref" "$server_ref"
          docker pull "$app_ref"
          docker pull "$server_ref"
          test "$(docker image inspect --format '{{.Id}}' "$app_ref")" = "$(cat app-image-id.txt)"
          test "$(docker image inspect --format '{{.Id}}' "$server_ref")" = "$(cat server-image-id.txt)"
          for image in "$app_ref" "$server_ref"; do
            test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")" = 'linux/amd64'
            test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")" = "$PUBLISH_REVISION"
            test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$image")" = "$PUBLISH_VERSION"
            test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' "$image")" = "https://github.com/$GITHUB_REPOSITORY"
          done
          app_digest_ref="$(docker image inspect --format '{{ index .RepoDigests 0 }}' "$app_ref")"
          server_digest_ref="$(docker image inspect --format '{{ index .RepoDigests 0 }}' "$server_ref")"
          case "$app_digest_ref" in "$GHCR_APP_IMAGE@sha256:"*) ;; *) exit 1 ;; esac
          case "$server_digest_ref" in "$GHCR_SERVER_IMAGE@sha256:"*) ;; *) exit 1 ;; esac
          {
            echo "app-digest=${app_digest_ref#*@}"
            echo "server-digest=${server_digest_ref#*@}"
          } >> "$GITHUB_OUTPUT"

      - name: Attest app image provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.GHCR_APP_IMAGE }}
          subject-digest: ${{ steps.verify_registry.outputs.app-digest }}
          push-to-registry: true

      - name: Attest server image provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.GHCR_SERVER_IMAGE }}
          subject-digest: ${{ steps.verify_registry.outputs.server-digest }}
          push-to-registry: true

      - name: Verify published image attestations
        env:
          APP_DIGEST: ${{ steps.verify_registry.outputs.app-digest }}
          GH_TOKEN: ${{ github.token }}
          SERVER_DIGEST: ${{ steps.verify_registry.outputs.server-digest }}
        run: |
          set -euo pipefail
          for subject in \
            "oci://${GHCR_APP_IMAGE}@${APP_DIGEST}" \
            "oci://${GHCR_SERVER_IMAGE}@${SERVER_DIGEST}"; do
            gh attestation verify "$subject" \
              --bundle-from-oci \
              --deny-self-hosted-runners \
              --repo "$GITHUB_REPOSITORY" \
              --source-digest "$PUBLISH_REVISION" \
              --source-ref refs/heads/main \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" >/dev/null
          done

      - name: Record digest-pinned deployment references
        env:
          APP_DIGEST: ${{ steps.verify_registry.outputs.app-digest }}
          SERVER_DIGEST: ${{ steps.verify_registry.outputs.server-digest }}
        run: |
          {
            echo '### Published container pair'
            echo
            echo "Coordinated tag: \`${PUBLISH_TAG}\` (linux/amd64)"
            echo
            echo "- \`${GHCR_APP_IMAGE}@${APP_DIGEST}\`"
            echo "- \`${GHCR_SERVER_IMAGE}@${SERVER_DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log out of GitHub Container Registry
        if: always() && steps.registry_login.outcome == 'success'
        run: docker logout ghcr.io
