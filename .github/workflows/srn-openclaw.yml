# Tagged release pipeline for the platform-neutral OpenClaw Node CLI.
#
# OpenClaw has no native addons or embedded runtime. The package job therefore
# creates one dependency-bundled npm tarball instead of six relabelled binaries.
# That exact tarball is installed offline and smoke-tested on native Windows,
# Linux, and macOS runners for x64 and arm64 before a release can be published.
name: srn-openclaw

on:
  push:
    tags:
      - "srn-openclaw-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing srn-openclaw-v<semver> tag to build and release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: srn-openclaw-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "26.5.0"
  YARN_VERSION: "4.17.1"
  COREPACK_VERSION: "0.35.0"

jobs:
  context:
    name: Resolve release tag
    runs-on: ubuntu-24.04
    outputs:
      source_epoch: ${{ steps.release.outputs.source_epoch }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: x64
          package-manager-cache: false

      - name: Resolve and validate release source
        id: release
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="${REQUESTED_TAG}"
          if [[ ! "${tag}" =~ ^srn-openclaw-v[0-9A-Za-z.-]+$ ]]; then
            echo "Invalid OpenClaw release tag: ${tag}" >&2
            exit 1
          fi

          git fetch --force --tags origin
          source_sha="$(git rev-parse --verify "refs/tags/${tag}^{commit}")"
          git checkout --detach "${source_sha}"
          version="$(TAG="${tag}" node --input-type=module -e \
            'import { versionFromReleaseTag } from "./openclaw/scripts/release-config.mjs"; process.stdout.write(versionFromReleaseTag(process.env.TAG));')"
          package_version="$(node -p "require('./openclaw/package.json').version")"
          if [ "${version}" != "${package_version}" ]; then
            echo "Tag version ${version} does not match openclaw/package.json ${package_version}." >&2
            exit 1
          fi

          source_epoch="$(git show -s --format=%ct "${source_sha}")"
          {
            echo "source_epoch=${source_epoch}"
            echo "source_sha=${source_sha}"
            echo "tag=${tag}"
            echo "version=${version}"
          } >> "${GITHUB_OUTPUT}"

  quality:
    name: Typecheck, format, unit, live E2E, build
    needs: context
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.context.outputs.source_sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: x64
          package-manager-cache: false

      - name: Enable Yarn 4.17.1
        run: |
          npm install --global "corepack@${COREPACK_VERSION}"
          corepack enable
          test "$(yarn --version)" = "${YARN_VERSION}"

      - name: Install locked workspace dependencies
        run: yarn install --immutable

      - name: Typecheck OpenClaw
        run: yarn workspace @standard-red-notes/openclaw typecheck

      - name: Check OpenClaw formatting
        run: yarn workspace @standard-red-notes/openclaw format:check

      - name: Run OpenClaw unit tests
        run: yarn workspace @standard-red-notes/openclaw test:unit

      - name: Run real OpenClaw live MCP E2E and build
        run: yarn workspace @standard-red-notes/openclaw test:e2e

      - name: Smoke-test built CLI
        run: |
          test -s openclaw/dist/index.js
          node openclaw/dist/index.js --help

      - name: Upload tested OpenClaw build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: srn-openclaw-dist
          path: openclaw/dist/**
          if-no-files-found: error
          retention-days: 1

  package:
    name: Package dependency-bundled Node tarball
    needs: [context, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.context.outputs.source_sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: x64
          package-manager-cache: false

      - name: Enable Yarn 4.17.1
        run: |
          npm install --global "corepack@${COREPACK_VERSION}"
          corepack enable
          test "$(yarn --version)" = "${YARN_VERSION}"

      - name: Download tested OpenClaw build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: srn-openclaw-dist
          path: openclaw/dist

      - name: Build platform-neutral release package and manifest
        run: |
          node openclaw/scripts/package-release.mjs \
            --tag "${{ needs.context.outputs.tag }}" \
            --source-sha "${{ needs.context.outputs.source_sha }}" \
            --source-date-epoch "${{ needs.context.outputs.source_epoch }}" \
            --source-repository "${{ github.server_url }}/${{ github.repository }}" \
            --out-dir out
          (cd out && sha256sum --check SHA256SUMS.txt)

      - name: Upload release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: srn-openclaw-release-package
          path: out/*
          if-no-files-found: error
          retention-days: 2

  smoke:
    name: Smoke (${{ matrix.target }})
    needs: [context, package]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2025
            architecture: x64
          - target: windows-arm64
            runner: windows-11-arm
            architecture: arm64
          - target: linux-x64
            runner: ubuntu-24.04
            architecture: x64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            architecture: arm64
          - target: macos-x64
            runner: macos-15-intel
            architecture: x64
          - target: macos-arm64
            runner: macos-15
            architecture: arm64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.context.outputs.source_sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: ${{ matrix.architecture }}
          package-manager-cache: false

      - name: Download release package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: srn-openclaw-release-package
          path: out

      - name: Verify offline install, contents, and executable entrypoints
        run: >-
          node openclaw/scripts/verify-release.mjs
          --archive "out/srn-openclaw-${{ needs.context.outputs.version }}-node-any.tgz"
          --checksums "out/SHA256SUMS.txt"
          --manifest "out/srn-openclaw-${{ needs.context.outputs.version }}-node-any.manifest.json"
          --target "${{ matrix.target }}"

  release:
    name: Attest and publish GitHub release
    needs: [context, package, smoke]
    runs-on: ubuntu-24.04
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download verified release package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: srn-openclaw-release-package
          path: out

      - name: Recheck package checksums
        run: (cd out && sha256sum --check SHA256SUMS.txt)

      - name: Generate signed SLSA build provenance
        id: provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            out/srn-openclaw-${{ needs.context.outputs.version }}-node-any.tgz
            out/srn-openclaw-${{ needs.context.outputs.version }}-node-any.manifest.json

      - name: Add provenance bundle and verify final checksums
        run: |
          provenance="srn-openclaw-${{ needs.context.outputs.version }}-node-any.provenance.sigstore.json"
          cp "${{ steps.provenance.outputs.bundle-path }}" "out/${provenance}"
          (cd out && sha256sum "${provenance}" >> SHA256SUMS.txt && sha256sum --check SHA256SUMS.txt)

      - name: Publish immutable tagged GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ needs.context.outputs.source_sha }}
          TAG: ${{ needs.context.outputs.tag }}
          VERSION: ${{ needs.context.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "${TAG}" \
            --verify-tag \
            --target "${SOURCE_SHA}" \
            --title "OpenClaw ${VERSION}" \
            --generate-notes \
            out/*
