# Rolling release pipeline for the platform-neutral OpenClaw Node CLI.
#
# OpenClaw has no native addons or embedded runtime. The package job therefore
# creates one dependency-bundled npm tarball instead of six relabelled binaries.
# That exact tarball is installed offline and smoke-tested on native Windows,
# Linux, and macOS runners for x64 and arm64 before a release can be published.
#
# Trigger: push to `main` touching the OpenClaw workspace or the root dependency
# manifests its bundled runtime graph is resolved from. `mcp/` is deliberately
# NOT a trigger path: the live E2E builds it, but no MCP code ships inside the
# OpenClaw tarball, and srn-mcp releases itself.
#
# Versioning: rolling `YY.N` (e.g. 26.1) — N is one past the highest N already
# released for the current year, so it resets every January. This is the same
# scheme every other srn-* component uses, and the tag is namespaced the same
# way: `srn-openclaw-v26.1`.
#
# The version INSIDE the package is `YY.N.0` (package_version), not `YY.N`.
# openclaw/scripts/release-config.mjs only accepts a strict `srn-openclaw-v<semver>`
# tag and `26.1` is not valid semver, so — exactly like srn-desktop's app version
# — the release identity (tag/title) and the artifact's internal semver are
# computed together but formatted differently on purpose. The package job stamps
# that semver into openclaw/package.json before packaging, so
# package-release.mjs's own "tag version == manifest version" assertion still
# runs, and still fails, on every release.
#
# Escape hatch: an explicit `srn-openclaw-v<semver>` tag (pushed, or passed to
# workflow_dispatch) releases that exact tag instead. On that path the version
# comes FROM the tag, must equal openclaw/package.json's declared version, and
# the tag must already exist (`--verify-tag`).
name: srn-openclaw

on:
  push:
    branches: [main]
    paths:
      - "openclaw/**"
      - "package.json"
      - "yarn.lock"
      - ".yarnrc.yml"
      - ".yarn/releases/**"
      - "scripts/release-packaging-contract.mjs"
      - ".github/workflows/srn-openclaw.yml"
    tags:
      - "srn-openclaw-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing srn-openclaw-v<semver> tag to release; empty cuts a rolling YY.N release
        required: false
        default: ""
        type: string
      force_release:
        description: Publish a rolling release even when the OpenClaw surface is unchanged
        required: false
        default: false
        type: boolean
      force_reason:
        description: Required audit reason when force_release is true
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: srn-openclaw-release
  cancel-in-progress: false

env:
  TOOL: srn-openclaw
  NODE_VERSION: "26.5.0"
  YARN_VERSION: "4.17.1"
  COREPACK_VERSION: "0.35.0"

jobs:
  impact:
    name: Analyze release impact
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.impact.outputs.changed }}
      forced: ${{ steps.impact.outputs.forced }}
      base_ref: ${{ steps.impact.outputs.base_ref }}
      baseline_status: ${{ steps.impact.outputs.baseline_status }}
      publication_gate: ${{ steps.impact.outputs.publication_gate }}
      reason_codes: ${{ steps.impact.outputs.reason_codes }}
      result_json: ${{ steps.impact.outputs.result_json }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: x64
          package-manager-cache: false

      - name: Validate release packaging contract
        run: node scripts/validate-release-contract.mjs

      - id: impact
        name: Compare OpenClaw publishable surface with its latest release
        env:
          FORCE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_release || false }}
          FORCE_REASON: ${{ github.event_name == 'workflow_dispatch' && inputs.force_reason || '' }}
          EXCLUDED_RELEASE_REF: ${{ startsWith(github.ref, 'refs/tags/srn-openclaw-v') && github.ref_name || (github.event_name == 'workflow_dispatch' && inputs.tag) || '' }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          node scripts/analyze-release-impact.mjs \
            --target srn-openclaw \
            --head HEAD \
            --exclude-release-ref "${EXCLUDED_RELEASE_REF}" \
            --force "${FORCE_RELEASE}" \
            --force-reason "${FORCE_REASON}" \
            --output release-impact.json \
            --github-output "$GITHUB_OUTPUT"
          {
            echo '### OpenClaw release impact'
            echo '```json'
            cat release-impact.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  context:
    name: Resolve release version
    needs: impact
    if: needs.impact.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    outputs:
      package_tag: ${{ steps.release.outputs.package_tag }}
      package_version: ${{ steps.release.outputs.package_version }}
      source_epoch: ${{ steps.release.outputs.source_epoch }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      tag: ${{ steps.release.outputs.tag }}
      verify_tag: ${{ steps.release.outputs.verify_tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: x64
          package-manager-cache: false

      - name: Resolve and validate release source
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name || '') }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          tag="${REQUESTED_TAG}"
          if [ -n "${tag}" ]; then
            # Explicit tag release: the version comes from the tag, the tag must
            # already exist, and openclaw/package.json must already declare it.
            if [[ ! "${tag}" =~ ^srn-openclaw-v[0-9A-Za-z.-]+$ ]]; then
              echo "Invalid OpenClaw release tag: ${tag}" >&2
              exit 1
            fi

            source_sha="$(git rev-parse --verify "refs/tags/${tag}^{commit}")"
            git checkout --detach "${source_sha}"
            version="$(TAG="${tag}" node --input-type=module -e \
              'import { versionFromReleaseTag } from "./openclaw/scripts/release-config.mjs"; process.stdout.write(versionFromReleaseTag(process.env.TAG));')"
            declared_version="$(node -p "require('./openclaw/package.json').version")"
            if [ "${version}" != "${declared_version}" ]; then
              echo "Tag version ${version} does not match openclaw/package.json ${declared_version}." >&2
              exit 1
            fi
            package_version="${version}"
            verify_tag=true
          else
            # Rolling release: N is one past the highest N already released this
            # year, discovered from every `srn-openclaw-v<YY>.` tag,
            # exactly as every other srn-* workflow does.
            YY="$(date -u +%y)"
            prefix="${TOOL}-v${YY}."
            max=0
            while read -r released; do
              [ -z "$released" ] && continue
              n="${released#"$prefix"}"
              if [[ "$n" =~ ^[0-9]+$ ]] && [ "$n" -gt "$max" ]; then max="$n"; fi
            done < <(git tag --list "${prefix}*")
            next=$((max + 1))
            # A stable explicit tag YY.N.0 owns the same package version that a
            # rolling YY.N release would stamp. Skip that reserved identity.
            while git show-ref --verify --quiet "refs/tags/${TOOL}-v${YY}.${next}.0"; do
              next=$((next + 1))
            done
            version="${YY}.${next}"
            # release-config.mjs demands a strict semver tag and `26.1` is not
            # semver, so the packaged artifact carries `26.1.0`.
            package_version=${version}.0
            tag="${TOOL}-v${version}"
            source_sha="${GITHUB_SHA}"
            verify_tag=false
          fi

          source_epoch="$(git show -s --format=%ct "${source_sha}")"
          {
            echo "package_tag=${TOOL}-v${package_version}"
            echo "package_version=${package_version}"
            echo "source_epoch=${source_epoch}"
            echo "source_sha=${source_sha}"
            echo "tag=${tag}"
            echo "verify_tag=${verify_tag}"
            echo "version=${version}"
          } >> "${GITHUB_OUTPUT}"
          echo "OpenClaw release ${TOOL} ${version} (tag ${tag}, package semver ${package_version})"

  quality:
    name: Typecheck, format, unit, live E2E, build
    needs: context
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.context.outputs.source_sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: x64
          package-manager-cache: false

      - name: Enable Yarn 4.17.1
        run: |
          npm install --global "corepack@${COREPACK_VERSION}"
          corepack enable
          test "$(yarn --version)" = "${YARN_VERSION}"

      - name: Install locked workspace dependencies
        run: yarn install --immutable

      - name: Typecheck OpenClaw
        run: yarn workspace @standard-red-notes/openclaw typecheck

      - name: Check OpenClaw formatting
        run: yarn workspace @standard-red-notes/openclaw format:check

      - name: Run OpenClaw unit tests
        run: yarn workspace @standard-red-notes/openclaw test:unit

      - name: Run real OpenClaw live MCP E2E and build
        run: yarn workspace @standard-red-notes/openclaw test:e2e

      - name: Smoke-test built CLI
        run: |
          test -s openclaw/dist/index.js
          node openclaw/dist/index.js --help

      - name: Upload tested OpenClaw build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: srn-openclaw-dist
          path: openclaw/dist/**
          if-no-files-found: error
          retention-days: 1

  package:
    name: Package dependency-bundled Node tarball
    needs: [context, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      fingerprint: ${{ steps.fingerprint.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.context.outputs.source_sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: x64
          package-manager-cache: false

      - name: Enable Yarn 4.17.1
        run: |
          npm install --global "corepack@${COREPACK_VERSION}"
          corepack enable
          test "$(yarn --version)" = "${YARN_VERSION}"

      - name: Download tested OpenClaw build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: srn-openclaw-dist
          path: openclaw/dist

      # The rolling release identity (`26.1`) is not semver, so the packaged
      # manifest carries `26.1.0`. Stamping it here keeps package-release.mjs's
      # "release tag version == openclaw/package.json version" assertion live:
      # the packaging tag below is built from this same value, so a mismatch
      # between the resolved version and what is packaged still fails the build.
      # Only the workspace version changes, which yarn.lock records as
      # `0.0.0-use.local`, so the immutable production install is unaffected.
      - name: Stamp the release version into the OpenClaw manifest
        env:
          PACKAGE_VERSION: ${{ needs.context.outputs.package_version }}
        run: |
          set -euo pipefail
          node -e 'const fs = require("node:fs");
            const file = "openclaw/package.json";
            const manifest = JSON.parse(fs.readFileSync(file, "utf8"));
            manifest.version = process.env.PACKAGE_VERSION;
            fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + "\n");'
          test "$(node -p "require('./openclaw/package.json').version")" = "${PACKAGE_VERSION}"

      - name: Build platform-neutral release package and manifest
        run: |
          node openclaw/scripts/package-release.mjs \
            --tag "${{ needs.context.outputs.package_tag }}" \
            --source-sha "${{ needs.context.outputs.source_sha }}" \
            --source-date-epoch "${{ needs.context.outputs.source_epoch }}" \
            --source-repository "${{ github.server_url }}/${{ github.repository }}" \
            --out-dir out
          (cd out && sha256sum --check SHA256SUMS.txt)

      # Hash the exact npm payload after extraction. Only release identity fields
      # (tag/version/source commit/date) are normalized; every semantic field in
      # release-package.json remains covered. The canonical contract also binds
      # the package implementation and pinned toolchain/action inputs.
      - id: fingerprint
        name: Fingerprint normalized package payload
        run: |
          set -euo pipefail
          archive="out/srn-openclaw-${{ needs.context.outputs.package_version }}-node-any.tgz"
          extract="$RUNNER_TEMP/srn-openclaw-fingerprint"
          rm -rf "$extract"
          mkdir -p "$extract"
          tar -xzf "$archive" -C "$extract"
          mkdir -p "$extract/.srn-release-contract"
          cp openclaw/scripts/package-release.mjs "$extract/.srn-release-contract/package-release.mjs"
          cp openclaw/scripts/release-config.mjs "$extract/.srn-release-contract/release-config.mjs"
          node scripts/release-packaging-contract.mjs \
            --contract openclaw \
            --root "$extract" \
            --path package \
            --path .srn-release-contract \
            --normalize-package-version package/package.json \
            --normalize-json-field package/release-package.json=/release/sourceCommit \
            --normalize-json-field package/release-package.json=/release/sourceDate \
            --normalize-json-field package/release-package.json=/release/tag \
            --normalize-json-field package/release-package.json=/release/version \
            --output "out/${TOOL}.fingerprint" \
            --github-output "$GITHUB_OUTPUT"
          grep -Eq '^[0-9a-f]{64}$' "out/${TOOL}.fingerprint"

      - name: Upload release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: srn-openclaw-release-package
          path: out/*
          if-no-files-found: error
          retention-days: 2

  decide:
    name: Compare normalized package fingerprint
    needs: [impact, context, package]
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      decision: ${{ steps.compare.outputs.decision }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - id: compare
        env:
          BASE_REF: ${{ needs.impact.outputs.base_ref }}
          BASELINE_STATUS: ${{ needs.impact.outputs.baseline_status }}
          FORCED: ${{ needs.impact.outputs.forced }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_FP: ${{ needs.package.outputs.fingerprint }}
        run: |
          set -euo pipefail
          if ! node scripts/compare-release-fingerprints.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --base-ref "$BASE_REF" \
            --baseline-status "$BASELINE_STATUS" \
            --forced "$FORCED" \
            --fingerprint "${TOOL}.fingerprint=${NEW_FP}" \
            --output release-fingerprint-comparison.json \
            --github-output "$GITHUB_OUTPUT"; then
            cat release-fingerprint-comparison.json >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cat release-fingerprint-comparison.json >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: Smoke (${{ matrix.target }})
    needs: [context, package, decide]
    if: needs.decide.outputs.changed == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2025
            architecture: x64
          - target: windows-arm64
            runner: windows-11-arm
            architecture: arm64
          - target: linux-x64
            runner: ubuntu-24.04
            architecture: x64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            architecture: arm64
          - target: macos-x64
            runner: macos-15-intel
            architecture: x64
          - target: macos-arm64
            runner: macos-15
            architecture: arm64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.context.outputs.source_sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: ${{ matrix.architecture }}
          package-manager-cache: false

      - name: Download release package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: srn-openclaw-release-package
          path: out

      - name: Verify offline install, contents, and executable entrypoints
        run: >-
          node openclaw/scripts/verify-release.mjs
          --archive "out/srn-openclaw-${{ needs.context.outputs.package_version }}-node-any.tgz"
          --checksums "out/SHA256SUMS.txt"
          --manifest "out/srn-openclaw-${{ needs.context.outputs.package_version }}-node-any.manifest.json"
          --target "${{ matrix.target }}"

  # Attestation and publication are separate JOBS because permissions are
  # per-job. The attester needs the Sigstore/attestation trio and only read
  # access to the repository; the publisher needs `contents: write` and nothing
  # else. Held together in one job, `gh release create` returned
  #   HTTP 403: Resource not accessible by integration (.../releases)
  # even though the runner reported `Contents: write` on the token, while every
  # other srn-* publisher -- whose token carries `contents: write` and nothing
  # more -- creates releases in this repository without trouble.
  attest:
    name: Attest release package provenance
    needs: [context, package, decide, smoke]
    if: needs.decide.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download verified release package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: srn-openclaw-release-package
          path: out

      - name: Recheck package checksums
        run: (cd out && sha256sum --check SHA256SUMS.txt)

      - name: Generate signed SLSA build provenance
        id: provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            out/srn-openclaw-${{ needs.context.outputs.package_version }}-node-any.tgz
            out/srn-openclaw-${{ needs.context.outputs.package_version }}-node-any.manifest.json
            out/srn-openclaw.fingerprint

      - name: Add provenance bundle and verify final checksums
        run: |
          provenance="srn-openclaw-${{ needs.context.outputs.package_version }}-node-any.provenance.sigstore.json"
          cp "${{ steps.provenance.outputs.bundle-path }}" "out/${provenance}"
          (
            cd out
            sha256sum "${TOOL}.fingerprint" >> SHA256SUMS.txt
            sha256sum "${provenance}" >> SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )

      - name: Upload attested release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: srn-openclaw-attested-package
          path: out/*
          if-no-files-found: error
          retention-days: 2

  release:
    name: Publish GitHub release
    needs: [context, decide, attest]
    if: needs.decide.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    # `contents: write` and nothing else -- the exact token every other srn-*
    # publisher holds. Publishing needs no attestation scope, and the attested
    # payload is re-verified below before anything is uploaded.
    permissions:
      contents: write
    steps:
      - name: Download attested release package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: srn-openclaw-attested-package
          path: out

      - name: Recheck attested package checksums
        run: (cd out && sha256sum --check SHA256SUMS.txt)

      - name: Publish immutable tagged GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ needs.context.outputs.source_sha }}
          TAG: ${{ needs.context.outputs.tag }}
          VERIFY_TAG: ${{ needs.context.outputs.verify_tag }}
          VERSION: ${{ needs.context.outputs.version }}
        run: |
          set -euo pipefail
          # A tag supplied by a human must already exist and must never be
          # created here, so a typo cannot silently publish a new tag. A rolling
          # release derives its own tag, so there is nothing to verify against
          # and gh creates it at the resolved source commit.
          verify=()
          if [ "${VERIFY_TAG}" = "true" ]; then
            verify=(--verify-tag)
          fi
          # Do not claim the repo-global Latest pointer: electron-updater
          # resolves the desktop channel file through /releases/latest, so only
          # srn-desktop may hold it.
          # This job never checks the repository out, so gh has no git remote to
          # infer the repository from.
          gh release create "${TAG}" \
            "${verify[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${SOURCE_SHA}" \
            --title "${TOOL} ${VERSION}" \
            --latest=false \
            --generate-notes \
            out/*
