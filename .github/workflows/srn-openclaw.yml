# Rolling release pipeline for the platform-neutral OpenClaw Node CLI.
#
# OpenClaw has no native addons or embedded runtime. The package job therefore
# creates one dependency-bundled npm tarball instead of six relabelled binaries.
# That exact tarball is installed offline and smoke-tested on native Windows,
# Linux, and macOS runners for x64 and arm64 before a release can be published.
#
# Trigger: push to `main` touching the OpenClaw workspace or the root dependency
# manifests its bundled runtime graph is resolved from. `mcp/` is deliberately
# NOT a trigger path: the live E2E builds it, but no MCP code ships inside the
# OpenClaw tarball, and srn-mcp releases itself.
#
# Versioning: rolling `YY.N` (e.g. 26.1) — N is one past the highest N already
# released for the current year, so it resets every January. This is the same
# scheme every other srn-* component uses, and the tag is namespaced the same
# way: `srn-openclaw-v26.1`.
#
# The version INSIDE the package is `YY.N.0` (package_version), not `YY.N`.
# openclaw/scripts/release-config.mjs only accepts a strict `srn-openclaw-v<semver>`
# tag and `26.1` is not valid semver, so — exactly like srn-desktop's app version
# — the release identity (tag/title) and the artifact's internal semver are
# computed together but formatted differently on purpose. The package job stamps
# that semver into openclaw/package.json before packaging, so
# package-release.mjs's own "tag version == manifest version" assertion still
# runs, and still fails, on every release.
#
# Escape hatch: an explicit `srn-openclaw-v<semver>` tag (pushed, or passed to
# workflow_dispatch) releases that exact tag instead. On that path the version
# comes FROM the tag, must equal openclaw/package.json's declared version, and
# the tag must already exist (`--verify-tag`).
name: srn-openclaw

on:
  push:
    branches: [main]
    paths:
      - "openclaw/**"
      - "package.json"
      - "yarn.lock"
      - ".yarnrc.yml"
      - ".yarn/releases/**"
      - "scripts/package.json"
      - "scripts/package-lock.json"
      - "scripts/release-packaging-contract.mjs"
      - ".github/workflows/srn-openclaw.yml"
    tags:
      - "srn-openclaw-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing srn-openclaw-v<semver> tag to release; empty cuts a rolling YY.N release
        required: false
        default: ""
        type: string
      force_release:
        description: Publish a rolling release even when the OpenClaw surface is unchanged
        required: false
        default: false
        type: boolean
      force_reason:
        description: Required audit reason when force_release is true
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: srn-openclaw-release
  cancel-in-progress: false

env:
  TOOL: srn-openclaw
  NODE_VERSION: "26.5.0"
  YARN_VERSION: "4.17.1"
  COREPACK_VERSION: "0.35.0"

jobs:
  impact:
    name: Analyze release impact
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.impact.outputs.changed }}
      forced: ${{ steps.impact.outputs.forced }}
      base_ref: ${{ steps.impact.outputs.base_ref }}
      baseline_status: ${{ steps.impact.outputs.baseline_status }}
      publication_gate: ${{ steps.impact.outputs.publication_gate }}
      reason_codes: ${{ steps.impact.outputs.reason_codes }}
      result_json: ${{ steps.impact.outputs.result_json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Authorize exact protected main or release-tag source
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          git fetch --no-tags --force origin refs/heads/main:refs/remotes/origin/main
          protected_sha="$(git rev-parse "refs/remotes/origin/main^{commit}")"
          authorize_tag() {
            tag="$1"
            [[ "$tag" =~ ^srn-openclaw-v[0-9A-Za-z.+-]+$ ]]
            tagged_sha="$(git rev-parse --verify "refs/tags/${tag}^{commit}")"
            test "$tagged_sha" = "$GITHUB_SHA"
            git merge-base --is-ancestor "$tagged_sha" "$protected_sha"
          }
          case "$GITHUB_EVENT_NAME:$GITHUB_REF_TYPE" in
            push:branch)
              test "$GITHUB_REF" = refs/heads/main
              test "$GITHUB_SHA" = "$protected_sha"
              test -z "$REQUESTED_TAG"
              ;;
            push:tag)
              test -z "$REQUESTED_TAG"
              authorize_tag "$GITHUB_REF_NAME"
              ;;
            workflow_dispatch:branch)
              test -z "$REQUESTED_TAG"
              test "$GITHUB_REF" = refs/heads/main
              test "$GITHUB_SHA" = "$protected_sha"
              ;;
            workflow_dispatch:tag)
              test -n "$REQUESTED_TAG"
              test "$REQUESTED_TAG" = "$GITHUB_REF_NAME"
              authorize_tag "$REQUESTED_TAG"
              ;;
            *)
              echo "Unsupported OpenClaw release source: $GITHUB_EVENT_NAME $GITHUB_REF" >&2
              exit 1
              ;;
          esac
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: x64
          package-manager-cache: false

      - name: Install release policy dependencies
        run: npm ci --prefix scripts --ignore-scripts --no-audit --no-fund

      - name: Validate release packaging contract
        run: node scripts/validate-release-contract.mjs

      - id: impact
        name: Compare OpenClaw publishable surface with its latest release
        env:
          FORCE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_release || false }}
          FORCE_REASON: ${{ github.event_name == 'workflow_dispatch' && inputs.force_reason || '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXCLUDED_RELEASE_REF: ${{ startsWith(github.ref, 'refs/tags/srn-openclaw-v') && github.ref_name || (github.event_name == 'workflow_dispatch' && inputs.tag) || '' }}
        run: |
          set -euo pipefail
          excluded_release_ref="$EXCLUDED_RELEASE_REF"
          if [ -z "$excluded_release_ref" ]; then
            if [ "$FORCE_RELEASE" = "true" ]; then
              [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
              retry_intent="forced-${GITHUB_RUN_ID}"
            else
              retry_intent="automatic"
            fi
            retry_marker_prefix="<!-- srn-release-reservation tool=${TOOL} commit=${GITHUB_SHA} "
            retry_intent_fragment=" intent=${retry_intent} -->"
            mapfile -t retry_tags < <(
              gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate --slurp |
                jq -r --arg sha "$GITHUB_SHA" --arg marker_prefix "$retry_marker_prefix" --arg intent_fragment "$retry_intent_fragment" '
                  flatten[]
                  | select(.target_commitish == $sha)
                  | select((.body // "") | contains($marker_prefix))
                  | select((.body // "") | contains($intent_fragment))
                  | .tag_name
                '
            )
            if [ "${#retry_tags[@]}" -gt 1 ]; then
              echo "Multiple OpenClaw releases match this commit and retry intent." >&2
              exit 1
            fi
            if [ "${#retry_tags[@]}" -eq 1 ]; then
              excluded_release_ref="${retry_tags[0]}"
            fi
          fi
          node scripts/analyze-release-impact.mjs \
            --target srn-openclaw \
            --head HEAD \
            --exclude-release-ref "${excluded_release_ref}" \
            --force "${FORCE_RELEASE}" \
            --force-reason "${FORCE_REASON}" \
            --output release-impact.json \
            --github-output "$GITHUB_OUTPUT"
          {
            echo '### OpenClaw release impact'
            echo '```json'
            cat release-impact.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  context:
    name: Resolve or recover release version
    needs: impact
    if: needs.impact.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    outputs:
      intent: ${{ steps.release.outputs.intent }}
      package_tag: ${{ steps.release.outputs.package_tag }}
      package_version: ${{ steps.release.outputs.package_version }}
      published: ${{ steps.release.outputs.published }}
      release_id: ${{ steps.release.outputs.release_id }}
      reused: ${{ steps.release.outputs.reused }}
      source_epoch: ${{ steps.release.outputs.source_epoch }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      tag: ${{ steps.release.outputs.tag }}
      verify_tag: ${{ steps.release.outputs.verify_tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: x64
          package-manager-cache: false

      - name: Resolve and validate release source
        id: release
        env:
          FORCED: ${{ needs.impact.outputs.forced }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMPACT_RESULT: ${{ needs.impact.outputs.result_json }}
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name || '') }}
        run: |
          set -euo pipefail
          parse_explicit_version() {
            TAG="$1" node --input-type=module -e \
              'import { versionFromReleaseTag } from "./openclaw/scripts/release-config.mjs"; process.stdout.write(versionFromReleaseTag(process.env.TAG));'
          }
          tag="${REQUESTED_TAG}"
          [[ "$FORCED" == "true" || "$FORCED" == "false" ]]
          if [ -n "${tag}" ]; then
            if [ "$FORCED" = "true" ]; then
              echo "force_release cannot be combined with an explicit OpenClaw tag." >&2
              exit 1
            fi
            # Explicit tag release: the version comes from the tag, the tag must
            # already exist, and openclaw/package.json must already declare it.
            if [[ ! "${tag}" =~ ^srn-openclaw-v[0-9A-Za-z.+-]+$ ]]; then
              echo "Invalid OpenClaw release tag: ${tag}" >&2
              exit 1
            fi

            source_sha="$(git rev-parse --verify "refs/tags/${tag}^{commit}")"
            git checkout --detach "${source_sha}"
            version="$(parse_explicit_version "${tag}")"
            declared_version="$(node -p "require('./openclaw/package.json').version")"
            if [ "${version}" != "${declared_version}" ]; then
              echo "Tag version ${version} does not match openclaw/package.json ${declared_version}." >&2
              exit 1
            fi
            package_version="${version}"
            verify_tag=true
            intent="explicit-${tag}"
          else
            source_sha="${GITHUB_SHA}"
            verify_tag=false
            if [ "$FORCED" = "true" ]; then
              [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
              intent="forced-${GITHUB_RUN_ID}"
            else
              intent="automatic"
            fi
          fi

          jq -e --arg sha "$source_sha" --argjson forced "$FORCED" '
            .headSha == $sha
            and .forced == $forced
            and (
              ($forced and (.forceReason | type == "string") and ((.forceReason | gsub("^\\s+|\\s+$"; "")) | length > 0))
              or (($forced | not) and .forceReason == null)
            )
          ' <<< "$IMPACT_RESULT" >/dev/null

          releases_file="$(mktemp)"
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate --slurp |
            jq 'flatten' > "$releases_file"
          marker_prefix="<!-- srn-release-reservation tool=${TOOL} commit=${source_sha} "
          intent_fragment=" intent=${intent} -->"
          tool_marker_prefix="<!-- srn-release-reservation tool=${TOOL} "

          mapfile -t reservations < <(
            jq -r --arg marker_prefix "$marker_prefix" --arg intent_fragment "$intent_fragment" --arg sha "$source_sha" '
              .[]
              | select(.target_commitish == $sha)
              | select((.body // "") | contains($marker_prefix))
              | select((.body // "") | contains($intent_fragment))
              | .id
            ' "$releases_file"
          )
          if [ "${#reservations[@]}" -gt 1 ]; then
            echo "Multiple OpenClaw reservations match this commit and intent." >&2
            printf 'release id %s\n' "${reservations[@]}" >&2
            exit 1
          fi

          mapfile -t stale_reservations < <(
            jq -r --arg marker_prefix "$marker_prefix" --arg intent_fragment "$intent_fragment" --arg tool_marker_prefix "$tool_marker_prefix" --arg sha "$source_sha" '
              .[]
              | select(.draft == true)
              | select((.body // "") | contains($tool_marker_prefix))
              | select((
                  (.target_commitish == $sha)
                  and ((.body // "") | contains($marker_prefix))
                  and ((.body // "") | contains($intent_fragment))
                ) | not)
              | "\(.id)\t\(.tag_name)\t\(.target_commitish)"
            ' "$releases_file"
          )
          if [ "${#stale_reservations[@]}" -gt 0 ]; then
            echo "Refusing to allocate past stale OpenClaw draft reservations:" >&2
            printf '%s\n' "${stale_reservations[@]}" >&2
            echo "Reconcile or delete the stale drafts explicitly, then rerun." >&2
            exit 1
          fi

          release_id=""
          published=false
          reused=false
          if [ "${#reservations[@]}" -eq 1 ]; then
            release_id="${reservations[0]}"
            release="$(jq -c --argjson id "$release_id" '.[] | select(.id == $id)' "$releases_file")"
            test -n "$release"
            tag="$(jq -r '.tag_name' <<< "$release")"
            version="${tag#"${TOOL}-v"}"
            if [[ "$version" =~ ^[0-9]{2}\.[0-9]+$ ]]; then
              package_version="${version}.0"
              verify_tag=false
            elif package_version="$(parse_explicit_version "${tag}")"; then
              version="$package_version"
              verify_tag=true
            else
              echo "Recovered OpenClaw reservation has an invalid tag: ${tag}" >&2
              exit 1
            fi
            if [ -n "$REQUESTED_TAG" ]; then test "$tag" = "$REQUESTED_TAG"; fi
            expected_name="${TOOL} ${version}"
            jq -e --arg tag "$tag" --arg name "$expected_name" --arg sha "$source_sha" --arg marker_prefix "$marker_prefix" --arg intent_fragment "$intent_fragment" '
              .tag_name == $tag
              and .name == $name
              and .target_commitish == $sha
              and (.draft == true or .draft == false)
              and .prerelease == false
              and ((.body // "") | contains($marker_prefix))
              and ((.body // "") | contains($intent_fragment))
            ' <<< "$release" >/dev/null
            published="$(jq -r '.draft | not' <<< "$release")"
            reused=true
            if [ "$published" = "true" ]; then
              test "$(git rev-list -n 1 "$tag")" = "$source_sha"
            fi
          elif [ -z "$tag" ]; then
            # Allocate from every tag and release record. Draft releases do not
            # necessarily create a Git tag, so both inventories are required.
            YY="$(date -u +%y)"
            prefix="${TOOL}-v${YY}."
            max=0
            while read -r released; do
              [ -z "$released" ] && continue
              n="${released#"$prefix"}"
              if [[ "$n" =~ ^[0-9]+$ ]] && [ "$n" -gt "$max" ]; then max="$n"; fi
            done < <(
              {
                git tag --list "${prefix}*"
                jq -r --arg prefix "$prefix" '.[] | .tag_name | select(startswith($prefix))' "$releases_file"
              } | LC_ALL=C sort -u
            )
            next=$((max + 1))
            while git show-ref --verify --quiet "refs/tags/${TOOL}-v${YY}.${next}.0"; do
              next=$((next + 1))
            done
            version="${YY}.${next}"
            package_version="${version}.0"
            tag="${TOOL}-v${version}"
          else
            # An explicit tag may not reuse an unmarked or foreign release.
            collision="$(jq -r --arg tag "$tag" '[.[] | select(.tag_name == $tag)] | length' "$releases_file")"
            test "$collision" = "0"
          fi

          source_epoch="$(git show -s --format=%ct "${source_sha}")"
          {
            echo "intent=${intent}"
            echo "package_tag=${TOOL}-v${package_version}"
            echo "package_version=${package_version}"
            echo "published=${published}"
            echo "release_id=${release_id}"
            echo "reused=${reused}"
            echo "source_epoch=${source_epoch}"
            echo "source_sha=${source_sha}"
            echo "tag=${tag}"
            echo "verify_tag=${verify_tag}"
            echo "version=${version}"
          } >> "${GITHUB_OUTPUT}"
          echo "OpenClaw release ${TOOL} ${version} (tag ${tag}, package semver ${package_version})"

  quality:
    name: Typecheck, format, unit, live E2E, build
    needs: context
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.context.outputs.source_sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: x64
          package-manager-cache: false

      - name: Enable Yarn 4.17.1
        run: |
          npm install --global "corepack@${COREPACK_VERSION}"
          corepack enable
          test "$(yarn --version)" = "${YARN_VERSION}"

      - name: Install locked workspace dependencies
        run: yarn install --immutable

      - name: Typecheck OpenClaw
        run: yarn workspace @standard-red-notes/openclaw typecheck

      - name: Check OpenClaw formatting
        run: yarn workspace @standard-red-notes/openclaw format:check

      - name: Run OpenClaw unit tests
        run: yarn workspace @standard-red-notes/openclaw test:unit

      - name: Run real OpenClaw live MCP E2E and build
        run: yarn workspace @standard-red-notes/openclaw test:e2e

      - name: Smoke-test built CLI
        run: |
          test -s openclaw/dist/index.js
          node openclaw/dist/index.js --help

      - name: Upload tested OpenClaw build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: srn-openclaw-dist
          path: openclaw/dist/**
          if-no-files-found: error
          retention-days: 30

  package:
    name: Package dependency-bundled Node tarball
    needs: [context, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      fingerprint: ${{ steps.fingerprint.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.context.outputs.source_sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: x64
          package-manager-cache: false

      - name: Enable Yarn 4.17.1
        run: |
          npm install --global "corepack@${COREPACK_VERSION}"
          corepack enable
          test "$(yarn --version)" = "${YARN_VERSION}"

      - name: Download tested OpenClaw build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: srn-openclaw-dist
          path: openclaw/dist

      # The rolling release identity (`26.1`) is not semver, so the packaged
      # manifest carries `26.1.0`. Stamping it here keeps package-release.mjs's
      # "release tag version == openclaw/package.json version" assertion live:
      # the packaging tag below is built from this same value, so a mismatch
      # between the resolved version and what is packaged still fails the build.
      # Only the workspace version changes, which yarn.lock records as
      # `0.0.0-use.local`, so the immutable production install is unaffected.
      - name: Stamp the release version into the OpenClaw manifest
        env:
          PACKAGE_VERSION: ${{ needs.context.outputs.package_version }}
        run: |
          set -euo pipefail
          node -e 'const fs = require("node:fs");
            const file = "openclaw/package.json";
            const manifest = JSON.parse(fs.readFileSync(file, "utf8"));
            manifest.version = process.env.PACKAGE_VERSION;
            fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + "\n");'
          test "$(node -p "require('./openclaw/package.json').version")" = "${PACKAGE_VERSION}"

      - name: Build platform-neutral release package and manifest
        run: |
          node openclaw/scripts/package-release.mjs \
            --tag "${{ needs.context.outputs.package_tag }}" \
            --source-sha "${{ needs.context.outputs.source_sha }}" \
            --source-date-epoch "${{ needs.context.outputs.source_epoch }}" \
            --source-repository "${{ github.server_url }}/${{ github.repository }}" \
            --out-dir out
          (cd out && sha256sum --check SHA256SUMS.txt)

      # Hash the exact npm payload after extraction. Only release identity fields
      # (tag/version/source commit/date) are normalized; every semantic field in
      # release-package.json remains covered. The canonical contract also binds
      # the package implementation and pinned toolchain/action inputs.
      - name: Fingerprint normalized package payload
        id: fingerprint
        run: |
          set -euo pipefail
          archive="out/srn-openclaw-${{ needs.context.outputs.package_version }}-node-any.tgz"
          extract="$RUNNER_TEMP/srn-openclaw-fingerprint"
          rm -rf "$extract"
          mkdir -p "$extract"
          tar -xzf "$archive" -C "$extract"
          mkdir -p "$extract/.srn-release-contract"
          cp openclaw/scripts/package-release.mjs "$extract/.srn-release-contract/package-release.mjs"
          cp openclaw/scripts/release-config.mjs "$extract/.srn-release-contract/release-config.mjs"
          node scripts/release-packaging-contract.mjs \
            --contract openclaw \
            --root "$extract" \
            --path package \
            --path .srn-release-contract \
            --normalize-package-version package/package.json \
            --normalize-json-field package/release-package.json=/release/sourceCommit \
            --normalize-json-field package/release-package.json=/release/sourceDate \
            --normalize-json-field package/release-package.json=/release/tag \
            --normalize-json-field package/release-package.json=/release/version \
            --output "out/${TOOL}.fingerprint" \
            --github-output "$GITHUB_OUTPUT"
          grep -Eq '^[0-9a-f]{64}$' "out/${TOOL}.fingerprint"

      - name: Upload release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: srn-openclaw-release-package
          path: out/*
          if-no-files-found: error
          retention-days: 30

  decide:
    name: Compare normalized package fingerprint
    needs: [impact, context, package]
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      decision: ${{ steps.compare.outputs.decision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: compare
        env:
          BASE_REF: ${{ needs.impact.outputs.base_ref }}
          BASELINE_STATUS: ${{ needs.impact.outputs.baseline_status }}
          FORCED: ${{ needs.impact.outputs.forced }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_FP: ${{ needs.package.outputs.fingerprint }}
        run: |
          set -euo pipefail
          if ! node scripts/compare-release-fingerprints.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --base-ref "$BASE_REF" \
            --baseline-status "$BASELINE_STATUS" \
            --forced "$FORCED" \
            --fingerprint "${TOOL}.fingerprint=${NEW_FP}" \
            --output release-fingerprint-comparison.json \
            --github-output "$GITHUB_OUTPUT"; then
            cat release-fingerprint-comparison.json >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cat release-fingerprint-comparison.json >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: Smoke (${{ matrix.target }})
    needs: [context, package, decide]
    if: needs.decide.outputs.changed == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2025
            architecture: x64
          - target: windows-arm64
            runner: windows-11-arm
            architecture: arm64
          - target: linux-x64
            runner: ubuntu-24.04
            architecture: x64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            architecture: arm64
          - target: macos-x64
            runner: macos-15-intel
            architecture: x64
          - target: macos-arm64
            runner: macos-15
            architecture: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.context.outputs.source_sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: ${{ matrix.architecture }}
          package-manager-cache: false

      - name: Download release package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: srn-openclaw-release-package
          path: out

      - name: Verify offline install, contents, and executable entrypoints
        run: >-
          node openclaw/scripts/verify-release.mjs
          --archive "out/srn-openclaw-${{ needs.context.outputs.package_version }}-node-any.tgz"
          --checksums "out/SHA256SUMS.txt"
          --manifest "out/srn-openclaw-${{ needs.context.outputs.package_version }}-node-any.manifest.json"
          --target "${{ matrix.target }}"

  # Reserve a fingerprint-bound draft after every native smoke leg succeeds.
  # The context job recovers the same commit/intent reservation on reruns, so
  # an ambiguous API response cannot consume a second rolling version.
  identity:
    name: Reserve or recover exact GitHub release
    needs: [context, package, decide, smoke]
    if: needs.decide.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    environment: release-production
    permissions:
      contents: write
    outputs:
      published: ${{ steps.identity.outputs.published }}
      release_id: ${{ steps.identity.outputs.release_id }}
      reused: ${{ steps.identity.outputs.reused }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: identity
        name: Validate, reserve, or recover the exact draft
        env:
          EXPECTED_FINGERPRINT: ${{ needs.package.outputs.fingerprint }}
          EXISTING_RELEASE_ID: ${{ needs.context.outputs.release_id }}
          INTENT: ${{ needs.context.outputs.intent }}
          SOURCE_SHA: ${{ needs.context.outputs.source_sha }}
          TAG: ${{ needs.context.outputs.tag }}
          VERSION: ${{ needs.context.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_FINGERPRINT" =~ ^[0-9a-f]{64}$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$INTENT" =~ ^(automatic|forced-[0-9]+|explicit-srn-openclaw-v[0-9A-Za-z.+-]+)$ ]]
          test "$TAG" = "${TOOL}-v${VERSION}"

          marker="<!-- srn-release-reservation tool=${TOOL} commit=${SOURCE_SHA} fingerprint=${EXPECTED_FINGERPRINT} intent=${INTENT} -->"
          releases_file="$(mktemp)"
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate --slurp |
            jq 'flatten' > "$releases_file"

          mapfile -t stale_reservations < <(
            jq -r --arg marker "$marker" --arg tool_prefix "<!-- srn-release-reservation tool=${TOOL} " '
              .[]
              | select(.draft == true)
              | select((.body // "") | contains($tool_prefix))
              | select(((.body // "") | contains($marker)) | not)
              | "\(.id)\t\(.tag_name)\t\(.target_commitish)"
            ' "$releases_file"
          )
          if [ "${#stale_reservations[@]}" -gt 0 ]; then
            echo "Refusing to publish past stale or fingerprint-mismatched OpenClaw drafts:" >&2
            printf '%s\n' "${stale_reservations[@]}" >&2
            echo "Reconcile or delete the stale drafts explicitly, then rerun." >&2
            exit 1
          fi

          mapfile -t exact_reservations < <(
            jq -r --arg marker "$marker" --arg tag "$TAG" --arg name "${TOOL} ${VERSION}" --arg sha "$SOURCE_SHA" '
              .[]
              | select(.tag_name == $tag)
              | select(.name == $name)
              | select(.target_commitish == $sha)
              | select(.prerelease == false)
              | select((.body // "") | contains($marker))
              | .id
            ' "$releases_file"
          )
          if [ "${#exact_reservations[@]}" -gt 1 ]; then
            echo "Multiple exact OpenClaw reservations match this release identity." >&2
            printf 'release id %s\n' "${exact_reservations[@]}" >&2
            exit 1
          fi

          release_id="$EXISTING_RELEASE_ID"
          reused=false
          if [ -n "$release_id" ]; then
            [[ "$release_id" =~ ^[0-9]+$ ]]
            test "${#exact_reservations[@]}" -eq 1
            test "$release_id" = "${exact_reservations[0]}"
            release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}")"
            reused=true
          elif [ "${#exact_reservations[@]}" -eq 1 ]; then
            # Failed-job reruns keep successful upstream outputs. If the POST
            # created a draft but its response was lost, context may still have
            # emitted an empty ID; adopt the exact marker from live state.
            release_id="${exact_reservations[0]}"
            release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}")"
            reused=true
          else
            collision="$(jq -r --arg tag "$TAG" '[.[] | select(.tag_name == $tag)] | length' "$releases_file")"
            test "$collision" = "0"
            if git show-ref --verify --quiet "refs/tags/${TAG}"; then
              test "$(git rev-list -n 1 "$TAG")" = "$SOURCE_SHA"
              [[ "$INTENT" == explicit-* ]]
            else
              [[ "$INTENT" != explicit-* ]]
            fi
            response="$(mktemp)"
            if ! gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="$TAG" \
              -f target_commitish="$SOURCE_SHA" \
              -f name="${TOOL} ${VERSION}" \
              -f body="$marker" \
              -F draft=true \
              -F prerelease=false \
              -F generate_release_notes=true > "$response"; then
              echo "Draft reservation response was ambiguous. Rerun failed jobs; identity will adopt the exact live marker." >&2
              exit 1
            fi
            release="$(cat "$response")"
            release_id="$(jq -r '.id' <<< "$release")"
          fi

          jq -e --arg tag "$TAG" --arg name "${TOOL} ${VERSION}" --arg sha "$SOURCE_SHA" --arg marker "$marker" '
            .tag_name == $tag
            and .name == $name
            and .target_commitish == $sha
            and (.draft == true or .draft == false)
            and .prerelease == false
            and ((.body // "") | contains($marker))
          ' <<< "$release" >/dev/null
          published="$(jq -r '.draft | not' <<< "$release")"
          if [ "$published" = "true" ]; then
            test "$(git rev-list -n 1 "$TAG")" = "$SOURCE_SHA"
          fi
          {
            echo "published=${published}"
            echo "release_id=${release_id}"
            echo "reused=${reused}"
          } >> "$GITHUB_OUTPUT"

  # Attestation and publication are separate JOBS because permissions are
  # per-job. The attester needs the Sigstore/attestation trio and only read
  # access to the repository; the publisher needs `contents: write` and nothing
  # else. Held together in one job, `gh release create` returned
  #   HTTP 403: Resource not accessible by integration (.../releases)
  # even though the runner reported `Contents: write` on the token, while every
  # other srn-* publisher -- whose token carries `contents: write` and nothing
  # more -- creates releases in this repository without trouble.
  attest:
    name: Attest release package provenance
    needs: [context, package, decide, identity]
    if: needs.decide.outputs.changed == 'true' && needs.identity.outputs.published != 'true'
    runs-on: ubuntu-24.04
    environment: release-production
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download verified release package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: srn-openclaw-release-package
          path: out

      - name: Recheck package checksums
        run: (cd out && sha256sum --check SHA256SUMS.txt)

      - name: Generate signed SLSA build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/srn-openclaw-${{ needs.context.outputs.package_version }}-node-any.tgz
            out/srn-openclaw-${{ needs.context.outputs.package_version }}-node-any.manifest.json
            out/srn-openclaw.fingerprint

      - name: Add provenance bundle and verify final checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          provenance="srn-openclaw-${{ needs.context.outputs.package_version }}-node-any.provenance.sigstore.json"
          cp "${{ steps.provenance.outputs.bundle-path }}" "out/${provenance}"
          (
            cd out
            sha256sum "${TOOL}.fingerprint" >> SHA256SUMS.txt
            sha256sum "${provenance}" >> SHA256SUMS.txt
            LC_ALL=C sort -o SHA256SUMS.txt SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )
          for subject in \
            "${TOOL}-${{ needs.context.outputs.package_version }}-node-any.tgz" \
            "${TOOL}-${{ needs.context.outputs.package_version }}-node-any.manifest.json" \
            "${TOOL}.fingerprint"; do
            gh attestation verify "out/${subject}" \
              --bundle "out/${provenance}" \
              --repo "$GITHUB_REPOSITORY" \
              --source-digest "${{ needs.context.outputs.source_sha }}" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/srn-openclaw.yml" >/dev/null
          done
          (cd out && sha256sum --check SHA256SUMS.txt)

      - name: Upload attested release package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: srn-openclaw-attested-package
          path: out/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Verify and publish exact GitHub release
    needs: [context, package, decide, identity, attest]
    if: always() && needs.decide.outputs.changed == 'true' && needs.identity.result == 'success' && (needs.attest.result == 'success' || (needs.identity.outputs.published == 'true' && needs.attest.result == 'skipped'))
    runs-on: ubuntu-24.04
    environment: release-production
    # `contents: write` is the only publication scope. The Sigstore bundle is
    # downloaded with the artifact and verified locally, so this job never
    # fetches attestations through the API. Signing stays isolated above.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download attested release package
        if: needs.identity.outputs.published != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: srn-openclaw-attested-package
          path: out

      - name: Reconcile, verify, and publish exact assets
        env:
          EXPECTED_FINGERPRINT: ${{ needs.package.outputs.fingerprint }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IDENTITY_PUBLISHED: ${{ needs.identity.outputs.published }}
          INTENT: ${{ needs.context.outputs.intent }}
          PACKAGE_VERSION: ${{ needs.context.outputs.package_version }}
          RELEASE_ID: ${{ needs.identity.outputs.release_id }}
          SOURCE_SHA: ${{ needs.context.outputs.source_sha }}
          TAG: ${{ needs.context.outputs.tag }}
          VERSION: ${{ needs.context.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_FINGERPRINT" =~ ^[0-9a-f]{64}$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$TAG" = "${TOOL}-v${VERSION}"
          marker="<!-- srn-release-reservation tool=${TOOL} commit=${SOURCE_SHA} fingerprint=${EXPECTED_FINGERPRINT} intent=${INTENT} -->"
          expected_name="${TOOL} ${VERSION}"

          expected_assets="$(mktemp)"
          {
            echo SHA256SUMS.txt
            echo "${TOOL}.fingerprint"
            echo "${TOOL}-${PACKAGE_VERSION}-node-any.manifest.json"
            echo "${TOOL}-${PACKAGE_VERSION}-node-any.provenance.sigstore.json"
            echo "${TOOL}-${PACKAGE_VERSION}-node-any.tgz"
          } | LC_ALL=C sort > "$expected_assets"
          expected_checksummed="$(mktemp)"
          grep -v '^SHA256SUMS.txt$' "$expected_assets" > "$expected_checksummed"

          verify_directory() {
            directory="$1"
            actual_assets="$(mktemp)"
            find "$directory" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > "$actual_assets"
            diff -u "$expected_assets" "$actual_assets"
            LC_ALL=C sort -c "$directory/SHA256SUMS.txt"
            actual_checksummed="$(mktemp)"
            awk 'NF == 2 && $1 ~ /^[0-9a-f]{64}$/ { sub(/^\*/, "", $2); print $2 }' "$directory/SHA256SUMS.txt" |
              LC_ALL=C sort > "$actual_checksummed"
            diff -u "$expected_checksummed" "$actual_checksummed"
            (cd "$directory" && sha256sum --check SHA256SUMS.txt)
            test "$(tr -d '\r\n' < "$directory/${TOOL}.fingerprint")" = "$EXPECTED_FINGERPRINT"
            provenance="${TOOL}-${PACKAGE_VERSION}-node-any.provenance.sigstore.json"
            for subject in \
              "${TOOL}-${PACKAGE_VERSION}-node-any.tgz" \
              "${TOOL}-${PACKAGE_VERSION}-node-any.manifest.json" \
              "${TOOL}.fingerprint"; do
              gh attestation verify "${directory}/${subject}" \
                --bundle "${directory}/${provenance}" \
                --repo "$GITHUB_REPOSITORY" \
                --source-digest "$SOURCE_SHA" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/srn-openclaw.yml" >/dev/null
            done
          }

          verify_remote() {
            directory="$1"
            release_json="$2"
            remote_assets="$(mktemp)"
            jq -r '.assets[].name' <<< "$release_json" | LC_ALL=C sort > "$remote_assets"
            diff -u "$expected_assets" "$remote_assets"
            while read -r asset; do
              digest="$(jq -r --arg name "$asset" '.assets[] | select(.name == $name) | .digest' <<< "$release_json")"
              [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
              actual="$(sha256sum "$directory/$asset" | awk '{print $1}')"
              test "$digest" = "sha256:${actual}"
            done < "$expected_assets"
          }

          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
          jq -e --arg tag "$TAG" --arg name "$expected_name" --arg sha "$SOURCE_SHA" --arg marker "$marker" '
            .tag_name == $tag
            and .name == $name
            and .target_commitish == $sha
            and (.draft == true or .draft == false)
            and .prerelease == false
            and ((.body // "") | contains($marker))
          ' <<< "$release" >/dev/null
          draft="$(jq -r '.draft' <<< "$release")"
          if [ "$IDENTITY_PUBLISHED" = "true" ]; then test "$draft" = "false"; fi

          if [ "$draft" = "false" ]; then
            test "$(git rev-list -n 1 "$TAG")" = "$SOURCE_SHA"
            recovered="$(mktemp -d)"
            gh release download "$TAG" --dir "$recovered" --repo "$GITHUB_REPOSITORY"
            verify_directory "$recovered"
            verify_remote "$recovered" "$release"
            asset_plan_sha="$(sha256sum "$recovered/SHA256SUMS.txt" | awk '{print $1}')"
            assets_marker="<!-- srn-release-assets sha256=${asset_plan_sha} -->"
            jq -e --arg assets_marker "$assets_marker" '(.body // "") | contains($assets_marker)' <<< "$release" >/dev/null
            echo "${TAG} was already published by this workflow intent; verified exact attested assets."
            exit 0
          fi

          verify_directory out
          # Remove assets outside the exact contract before retry-safe clobbering.
          while IFS=$'\t' read -r asset_id asset_name; do
            if ! grep -Fxq "$asset_name" "$expected_assets"; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            fi
          done < <(jq -r '.assets[] | [.id, .name] | @tsv' <<< "$release")

          shopt -s nullglob
          files=(out/*)
          test "${#files[@]}" -eq "$(wc -l < "$expected_assets")"
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
          test "$(jq -r '.draft' <<< "$release")" = "true"
          verify_remote out "$release"
          asset_plan_sha="$(sha256sum out/SHA256SUMS.txt | awk '{print $1}')"
          assets_marker="<!-- srn-release-assets sha256=${asset_plan_sha} -->"
          body="$(jq -r '.body' <<< "$release")"
          if grep -Fq '<!-- srn-release-assets ' <<< "$body"; then
            echo "Draft already contains an unexpected finalized asset marker." >&2
            exit 1
          fi
          final_body="${body}"$'\n'"${assets_marker}"

          # Publication is deliberately the final fallible command. If GitHub
          # publishes but its response is lost, the next run recovers this same
          # marker-bound release and verifies every remote digest.
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -f body="$final_body" \
            -F draft=false \
            -f make_latest=false >/dev/null
