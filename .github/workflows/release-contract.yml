name: Release Contract

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-contract.yml'
      - '.github/workflows/srn-client.yml'
      - '.github/workflows/srn-server.yml'
      - '.github/workflows/srn-mcp.yml'
      - '.github/workflows/srn-home-server.yml'
      - '.github/workflows/srn-admin.yml'
      - '.github/workflows/srn-openclaw.yml'
      - '.github/workflows/srn-desktop.yml'
      - '.github/workflows/srn-mobile.yml'
      - 'app/.github/workflows/desktop.release.reuse.yml'
      - 'app/.github/workflows/mobile.release.prod.yml'
      - 'app/packages/mobile/android/gradle.properties'
      - 'package.json'
      - 'docs/releases-and-upgrades.md'
      - 'scripts/analyze-release-impact.mjs'
      - 'scripts/analyze-release-impact.test.mjs'
      - 'scripts/compare-release-fingerprints.mjs'
      - 'scripts/compare-release-fingerprints.test.mjs'
      - 'scripts/fingerprint-release-tree.mjs'
      - 'scripts/fingerprint-release-tree.test.mjs'
      - 'scripts/validate-release-contract.mjs'
      - 'scripts/validate-release-contract.test.mjs'
  pull_request:
    paths:
      - '.github/workflows/release-contract.yml'
      - '.github/workflows/srn-client.yml'
      - '.github/workflows/srn-server.yml'
      - '.github/workflows/srn-mcp.yml'
      - '.github/workflows/srn-home-server.yml'
      - '.github/workflows/srn-admin.yml'
      - '.github/workflows/srn-openclaw.yml'
      - '.github/workflows/srn-desktop.yml'
      - '.github/workflows/srn-mobile.yml'
      - 'app/.github/workflows/desktop.release.reuse.yml'
      - 'app/.github/workflows/mobile.release.prod.yml'
      - 'app/packages/mobile/android/gradle.properties'
      - 'package.json'
      - 'docs/releases-and-upgrades.md'
      - 'scripts/analyze-release-impact.mjs'
      - 'scripts/analyze-release-impact.test.mjs'
      - 'scripts/compare-release-fingerprints.mjs'
      - 'scripts/compare-release-fingerprints.test.mjs'
      - 'scripts/fingerprint-release-tree.mjs'
      - 'scripts/fingerprint-release-tree.test.mjs'
      - 'scripts/validate-release-contract.mjs'
      - 'scripts/validate-release-contract.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate release contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Test validator failure cases
        run: node --test scripts/validate-release-contract.test.mjs
      - name: Test release impact and fingerprint behavior
        run: node --test scripts/analyze-release-impact.test.mjs scripts/fingerprint-release-tree.test.mjs scripts/compare-release-fingerprints.test.mjs
      - name: Validate release targets and artifacts
        run: node scripts/validate-release-contract.mjs
      - name: Generate repository release inventory and impact report
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          node scripts/analyze-release-impact.mjs \
            --all-workspaces all \
            --output release-impact.json \
            --report release-impact.md
          cat release-impact.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload machine and readable release reports
        uses: actions/upload-artifact@v7
        with:
          name: release-impact-report
          path: |
            release-impact.json
            release-impact.md
          if-no-files-found: error
