# Rolling release pipeline for the self-hosted SERVER as a standalone binary.
#
# Packages @standardnotes/home-server — the all-in-one backend that runs auth +
# syncing-server + files + revisions + api-gateway in ONE process — into native
# single-file executables (no Node/yarn install needed to run).
#
# How: esbuild bundles the tsc-built entry through Yarn PnP into one CJS file
# (the bundle is dependency-free for MySQL deployments — the native SQLite driver
# is excluded and CBOR falls back to pure JS), then @yao-pkg/pkg wraps it into
# node24 executables for the 6 OS/arch targets, exactly like the CLI tools.
#
# Stages (gated): build -> decide -> package -> release. A new rolling release is
# cut only when the bundle's content fingerprint changes.
#
# SCOPE: this binary targets MySQL (DB_TYPE=mysql); the native SQLite driver
# (better-sqlite3) is NOT supported by the binary.
#   - DB schema migrations ARE supported: the build merges every service's
#     compiled migrations into a `migrations/` folder shipped alongside the
#     binary (srn-home-server-migrations.zip). The binary auto-points its TypeORM
#     loaders there via SRN_MIGRATIONS_DIR (the pkg snapshot can't reliably glob
#     bundled assets). Extract the zip next to the executable before first run.
name: srn-home-server

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/srn-home-server.yml'
  workflow_dispatch:
    inputs:
      force_release:
        description: Publish even when source and bundle fingerprints are unchanged
        required: false
        default: false
        type: boolean
      force_reason:
        description: Required audit reason when force_release is true
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: srn-home-server-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  TOOL: srn-home-server
  SERVER_DIR: server
  HS_DIR: server/packages/home-server
  PKG_NODE: node24
  PKG_VERSION: '6.21.0'

jobs:
  impact:
    name: analyze release impact
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.impact.outputs.changed }}
      forced: ${{ steps.impact.outputs.forced }}
      base_ref: ${{ steps.impact.outputs.base_ref }}
      baseline_status: ${{ steps.impact.outputs.baseline_status }}
      publication_gate: ${{ steps.impact.outputs.publication_gate }}
      reason_codes: ${{ steps.impact.outputs.reason_codes }}
      result_json: ${{ steps.impact.outputs.result_json }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false

      - id: impact
        name: Compare home-server publishable surface with its latest release
        env:
          FORCE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_release || false }}
          FORCE_REASON: ${{ github.event_name == 'workflow_dispatch' && inputs.force_reason || '' }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          node scripts/analyze-release-impact.mjs \
            --target srn-home-server \
            --head HEAD \
            --force "${FORCE_RELEASE}" \
            --force-reason "${FORCE_REASON}" \
            --output release-impact.json \
            --github-output "$GITHUB_OUTPUT"
          {
            echo '### home-server release impact'
            echo '```json'
            cat release-impact.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # 1) BUILD — install the PnP workspace, tsc-build every server package, then
  # esbuild-bundle home-server into a single CJS + a normalized fingerprint of
  # the executable and the complete migration payload.
  build:
    name: build
    needs: impact
    if: needs.impact.outputs.changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      fingerprint: ${{ steps.fp.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          # The repo root declares packageManager: yarn@4. setup-node's default
          # cache probing runs before Corepack is enabled and sees global Yarn 1.x.
          package-manager-cache: false

      - name: Install Corepack (Yarn 4.17.1)
        run: npm install --global corepack@0.35.0 && corepack enable

      # better-sqlite3 is still a dependency (SQLite support in source) and is
      # built/unplugged during install even though the binary doesn't use it.
      - name: Install native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y python3 make g++

      - name: Install workspace (PnP)
        working-directory: ${{ env.SERVER_DIR }}
        run: yarn install --immutable

      - name: Build all server packages (tsc)
        working-directory: ${{ env.SERVER_DIR }}
        run: yarn build

      - name: Bundle home-server (esbuild)
        working-directory: ${{ env.SERVER_DIR }}
        run: yarn workspace @standardnotes/home-server build:bundle

      - name: Compute release-surface fingerprint
        id: fp
        working-directory: ${{ env.HS_DIR }}
        run: |
          set -euo pipefail
          node ../../../scripts/fingerprint-release-tree.mjs \
            --root dist/bundle \
            --path home-server.cjs \
            --path migrations \
            --output "dist/bundle/${TOOL}.fingerprint" \
            --github-output "$GITHUB_OUTPUT"
          grep -Eq '^[0-9a-f]{64}$' "dist/bundle/${TOOL}.fingerprint"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: srn-home-server-bundle
          path: |
            ${{ env.HS_DIR }}/dist/bundle/home-server.cjs
            ${{ env.HS_DIR }}/dist/bundle/srn-home-server.fingerprint
            ${{ env.HS_DIR }}/dist/bundle/migrations/**
          retention-days: 1
          if-no-files-found: error

  # 2) DECIDE — release only if the bundle changed since the last release.
  decide:
    name: decide
    needs: [impact, build]
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.cmp.outputs.changed }}
      decision: ${{ steps.cmp.outputs.decision }}
    steps:
      - uses: actions/checkout@v7

      - name: Compare against last released fingerprint
        id: cmp
        env:
          BASE_REF: ${{ needs.impact.outputs.base_ref }}
          BASELINE_STATUS: ${{ needs.impact.outputs.baseline_status }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_FP: ${{ needs.build.outputs.fingerprint }}
          FORCED: ${{ needs.impact.outputs.forced }}
        run: |
          set -euo pipefail
          if ! node scripts/compare-release-fingerprints.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --base-ref "$BASE_REF" \
            --baseline-status "$BASELINE_STATUS" \
            --forced "$FORCED" \
            --fingerprint "${TOOL}.fingerprint=${NEW_FP}" \
            --output release-fingerprint-comparison.json \
            --github-output "$GITHUB_OUTPUT"; then
            cat release-fingerprint-comparison.json >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cat release-fingerprint-comparison.json >> "$GITHUB_STEP_SUMMARY"

  # 3) PACKAGE — cross-compile the 6 native executables from the single bundle.
  package:
    name: package
    needs: [build, decide]
    if: needs.decide.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          # This job only runs npx against a downloaded artifact; avoid setup-node
          # auto-detecting the repo's Yarn 4 packageManager field.
          package-manager-cache: false

      - name: Download bundle artifact
        uses: actions/download-artifact@v8
        with:
          name: srn-home-server-bundle
          path: bundle

      - name: Package native executables
        run: |
          set -euo pipefail
          mkdir -p out
          declare -A TARGETS=(
            ["${TOOL}-windows-x64.exe"]="${PKG_NODE}-win-x64"
            ["${TOOL}-windows-arm64.exe"]="${PKG_NODE}-win-arm64"
            ["${TOOL}-macos-x64"]="${PKG_NODE}-macos-x64"
            ["${TOOL}-macos-arm64"]="${PKG_NODE}-macos-arm64"
            ["${TOOL}-linux-x64"]="${PKG_NODE}-linux-x64"
            ["${TOOL}-linux-arm64"]="${PKG_NODE}-linux-arm64"
          )
          for out_name in "${!TARGETS[@]}"; do
            echo "::group::pkg ${TARGETS[$out_name]} -> $out_name"
            npx --yes "@yao-pkg/pkg@${PKG_VERSION}" \
              --no-signature \
              --targets "${TARGETS[$out_name]}" \
              --output "out/${out_name}" \
              bundle/home-server.cjs
            echo "::endgroup::"
          done
          cp "bundle/${TOOL}.fingerprint" "out/${TOOL}.fingerprint"
          # Ship the merged migrations next to the binaries. Operators extract this
          # beside the executable (or set SRN_MIGRATIONS_DIR) so the binary can run
          # TypeORM migrations on first boot.
          ( cd bundle && zip -qr "../out/${TOOL}-migrations.zip" migrations )
          ls -la out

      - name: Generate checksums
        working-directory: out
        run: sha256sum "${TOOL}"-* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Upload packaged binaries
        uses: actions/upload-artifact@v7
        with:
          name: srn-home-server-binaries
          path: out/*
          retention-days: 1
          if-no-files-found: error

  # 4) RELEASE — rolling YY.N version, namespaced tag, GitHub Release with the 6
  # binaries + checksums + fingerprint.
  release:
    name: release
    needs: [decide, package]
    if: needs.decide.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download packaged binaries
        uses: actions/download-artifact@v8
        with:
          name: srn-home-server-binaries
          path: out

      - name: Compute rolling version + publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          YY="$(date -u +%y)"
          prefix="${TOOL}-v${YY}."
          max=0
          while read -r tag; do
            [ -z "$tag" ] && continue
            n="${tag#"$prefix"}"
            if [[ "$n" =~ ^[0-9]+$ ]] && [ "$n" -gt "$max" ]; then max="$n"; fi
          done < <(git tag --list "${prefix}*")
          version="${YY}.$((max + 1))"
          tag="${TOOL}-v${version}"
          echo "Releasing ${tag}"
          shopt -s nullglob
          files=(out/*)
          # Do not claim the repo-global Latest pointer: electron-updater
          # resolves the desktop channel file through /releases/latest, so only
          # srn-desktop may hold it.
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${TOOL} ${version}" \
            --target "${GITHUB_SHA}" \
            --latest=false \
            --generate-notes \
            "${files[@]}"
