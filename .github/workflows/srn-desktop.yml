# Rolling release pipeline for the Standard Red Notes DESKTOP app (electron-builder).
#
# Electron apps are built on native runners (no cross-compile). Stages:
#   version -> build (matrix) -> release
#
# Trigger: push to `main` touching any packaged app workspace or dependency
# manifest, or manual dispatch. The desktop embeds the web UI and its shared
# workspace graph, so those inputs must release together with shell changes.
#
# Versioning: rolling `YY.N` (e.g. 26.1) — N is one past the highest N already
# released for the current year, so it resets every January. This is the same
# scheme every other srn-* component uses, and the tag is namespaced the same
# way: `srn-desktop-v26.1`. The previous scheme was `YY.M.<run>`, whose third
# field was GITHUB_RUN_NUMBER rather than a day, so `26.7.15` read as a date
# that was four days wrong; its tag was also a bare `v26.7.15`, which handed
# desktop the repo-global `v*` tag namespace and the "Latest" release badge.
#
# The version BAKED INTO THE APP is `YY.N.0` (app_version), not `YY.N`.
# electron-updater rejects a non-semver app version outright
# (AppUpdater: ERR_UPDATER_INVALID_VERSION) and `26.1` is not valid semver, so
# the release identity (tag/title) and the app's internal semver are computed
# together but formatted differently on purpose.
#
# Builds are UNSIGNED: macOS notarization (scripts/notarizeMac.js) and Windows
# signing (scripts/windowsSign.js) both no-op when their credentials are absent.
# Auto-update via electron-updater still works for unsigned Windows; unsigned
# macOS falls back to the in-app "newer version available" notification.
name: srn-desktop

on:
  push:
    branches: [main]
    paths:
      - 'app/packages/**'
      - 'app/package.json'
      - 'app/yarn.lock'
      - 'app/.nvmrc'
      - 'app/.yarnrc.yml'
      - 'app/.yarn/releases/**'
      - '.github/workflows/srn-desktop.yml'
  workflow_dispatch:
    inputs:
      force_release:
        description: Publish even when the desktop surface is unchanged
        required: false
        default: false
        type: boolean
      force_reason:
        description: Required audit reason when force_release is true
        required: false
        default: ""
        type: string

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  TOOL: srn-desktop

jobs:
  impact:
    name: analyze release impact
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.impact.outputs.changed }}
      forced: ${{ steps.impact.outputs.forced }}
      base_ref: ${{ steps.impact.outputs.base_ref }}
      reason_codes: ${{ steps.impact.outputs.reason_codes }}
      result_json: ${{ steps.impact.outputs.result_json }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          package-manager-cache: false

      - id: impact
        name: Compare desktop publishable surface with its latest release
        env:
          FORCE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_release || false }}
          FORCE_REASON: ${{ github.event_name == 'workflow_dispatch' && inputs.force_reason || '' }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          node scripts/analyze-release-impact.mjs \
            --target srn-desktop \
            --head HEAD \
            --force "${FORCE_RELEASE}" \
            --force-reason "${FORCE_REASON}" \
            --output release-impact.json \
            --github-output "$GITHUB_OUTPUT"
          {
            echo '### Desktop release impact'
            echo '```json'
            cat release-impact.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # 1) VERSION — compute the rolling YY.N version once so every leg bakes the
  # same version and the release tags it identically. N is discovered by
  # scanning the existing `srn-desktop-v<YY>.` releases, exactly as every other
  # srn-* workflow does; the versioning state lives in GitHub Releases.
  version:
    name: version
    needs: impact
    if: needs.impact.outputs.changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      app_version: ${{ steps.v.outputs.app_version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          YY="$(date -u +%y)"
          prefix="${TOOL}-v${YY}."
          max=0
          while read -r tag; do
            [ -z "$tag" ] && continue
            n="${tag#"$prefix"}"
            if [[ "$n" =~ ^[0-9]+$ ]] && [ "$n" -gt "$max" ]; then max="$n"; fi
          done < <(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' | grep -F "${prefix}" || true)
          version="${YY}.$((max + 1))"
          {
            echo "version=${version}"
            echo "app_version=${version}.0"
            echo "tag=${TOOL}-v${version}"
          } >> "$GITHUB_OUTPUT"
          echo "Desktop release ${TOOL} ${version} (tag ${TOOL}-v${version}, app semver ${version}.0)"

  # 2) BUILD — electron-builder per OS. Each OS builds BOTH arches in one run so
  # the per-platform update metadata (latest*.yml) is produced once, not twice.
  build:
    name: build (${{ matrix.label }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: macos, os: macos-latest, builder: '--mac dmg zip --x64 --arm64' }
          - { label: windows, os: windows-latest, builder: '--win nsis --x64 --arm64' }
          - { label: linux-x64, os: ubuntu-latest, builder: '--linux AppImage deb --x64' }
          - { label: linux-arm64, os: ubuntu-24.04-arm, builder: '--linux AppImage deb --arm64' }
    env:
      # Never attempt to auto-discover a macOS signing identity.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.nvmrc
          package-manager-cache: false

      - name: Install Corepack (Yarn 4.17.1)
        run: npm install --global --force corepack@0.35.0 && corepack enable

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev fakeroot libfuse2 || \
          sudo apt-get install -y libsecret-1-dev fakeroot libfuse2t64

      - name: Set up Python (macOS native build)
        if: runner.os == 'macOS'
        uses: actions/setup-python@v6
        with:
          python-version: '3.14.6'

      - name: Install workspace dependencies
        working-directory: app
        run: yarn install --immutable

      - name: Build web UI
        working-directory: app
        # Topological build of web + every first-party workspace it imports;
        # their entrypoints are compiled dist/ output, so webpack cannot
        # resolve them until they are built. Also pre-builds snjs/utils/web
        # for the desktop bundle step below.
        run: yarn build:web

      - name: Build desktop bundle (webpack)
        working-directory: app/packages/desktop
        run: yarn build

      - name: electron-builder
        working-directory: app/packages/desktop
        # app_version, not version: electron-updater refuses to run against a
        # non-semver app version, and the release identity `YY.N` is not semver.
        run: yarn electron-builder ${{ matrix.builder }} --publish never -c.extraMetadata.version=${{ needs.version.outputs.app_version }}

      # Fingerprint the ACTUAL packaged application payload, not the installer:
      # installers carry timestamps/signature containers and are not byte
      # reproducible. app.asar + app.asar.unpacked is the runtime payload users
      # execute. Normalizing only package.json's rolling version lets a root lock
      # change build safely, then stop here when every shipped byte is unchanged.
      - name: Fingerprint packaged runtime payloads
        working-directory: app/packages/desktop
        env:
          MATRIX_LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          mkdir -p staged
          work="$RUNNER_TEMP/srn-desktop-fingerprint"
          rm -rf "$work"
          mkdir -p "$work"
          count=0
          while IFS= read -r -d '' asar; do
            case "$MATRIX_LABEL:$asar" in
              macos:*arm64*) target=macos-arm64 ;;
              macos:*) target=macos-x64 ;;
              windows:*arm64*) target=windows-arm64 ;;
              windows:*) target=windows-x64 ;;
              linux-x64:*) target=linux-x64 ;;
              linux-arm64:*) target=linux-arm64 ;;
              *) echo "Cannot classify packaged runtime: $asar" >&2; exit 1 ;;
            esac
            output="staged/${TOOL}-${target}.fingerprint"
            test ! -e "$output" || {
              echo "Duplicate packaged runtime for $target" >&2
              exit 1
            }
            extract="$work/$target"
            mkdir -p "$extract"
            yarn exec asar extract "$asar" "$extract"
            if [ -d "${asar}.unpacked" ]; then
              cp -a "${asar}.unpacked" "$extract/app.asar.unpacked"
            fi
            node ../../../scripts/fingerprint-release-tree.mjs \
              --root "$extract" \
              --path . \
              --normalize-package-version package.json \
              --output "$output"
            grep -Eq '^[0-9a-f]{64}$' "$output"
            count=$((count + 1))
          done < <(find dist -type f -name app.asar -print0 | sort -z)

          case "$MATRIX_LABEL" in
            macos|windows) expected=2 ;;
            linux-x64|linux-arm64) expected=1 ;;
            *) echo "Unknown desktop matrix label: $MATRIX_LABEL" >&2; exit 1 ;;
          esac
          test "$count" -eq "$expected" || {
            echo "Expected $expected packaged runtimes for $MATRIX_LABEL, found $count" >&2
            exit 1
          }

      - name: Collect installers
        working-directory: app/packages/desktop
        run: |
          set -euo pipefail
          mkdir -p staged
          # Distributables + electron-updater metadata (latest*.yml, blockmaps).
          find dist -maxdepth 1 -type f \
            \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \
               -o -name '*.AppImage' -o -name '*.deb' \
               -o -name '*.yml' -o -name '*.blockmap' \) \
            -exec cp -v {} staged/ \; || true
          echo "Staged:" && ls -la staged

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: srn-desktop-${{ matrix.label }}
          path: app/packages/desktop/staged/*
          retention-days: 2
          if-no-files-found: error

  # 3) DECIDE — all native builds ran because source impact was detected. Stop
  # before tagging/publishing when all six normalized runtime payloads are
  # byte-identical to the analyzer-selected prior release.
  decide:
    name: decide
    needs: [impact, version, build]
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - name: Download packaged desktop payloads
        uses: actions/download-artifact@v8
        with:
          pattern: srn-desktop-*
          path: artifacts
          merge-multiple: true

      - id: compare
        name: Compare normalized runtime fingerprints
        env:
          BASE_REF: ${{ needs.impact.outputs.base_ref }}
          FORCED: ${{ needs.impact.outputs.forced }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          targets=(
            macos-x64 macos-arm64
            windows-x64 windows-arm64
            linux-x64 linux-arm64
          )
          for target in "${targets[@]}"; do
            file="artifacts/${TOOL}-${target}.fingerprint"
            test -s "$file"
            grep -Eq '^[0-9a-f]{64}$' "$file"
          done
          actual="$(find artifacts -maxdepth 1 -type f -name "${TOOL}-*.fingerprint" | wc -l | tr -d '[:space:]')"
          test "$actual" -eq "${#targets[@]}"

          if [ "$FORCED" = "true" ]; then
            echo "Audited force request bypasses the runtime fingerprint comparison."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BASE_REF" ]; then
            echo "No prior desktop release -> changed."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p old
          if ! gh release download "$BASE_REF" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "${TOOL}-*.fingerprint" \
            --dir old 2>/dev/null; then
            echo "${BASE_REF} has no complete runtime fingerprint set -> changed."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for target in "${targets[@]}"; do
            old_file="old/${TOOL}-${target}.fingerprint"
            new_file="artifacts/${TOOL}-${target}.fingerprint"
            if [ ! -s "$old_file" ] || ! cmp --silent "$old_file" "$new_file"; then
              echo "$target changed since ${BASE_REF} -> release."
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "All six desktop runtime payloads are unchanged since ${BASE_REF} -> skip."
          echo "changed=false" >> "$GITHUB_OUTPUT"

  # 4) RELEASE — gather every leg's installers + update metadata and publish ONE
  # rolling GitHub Release (non-draft, so electron-updater can read it).
  #
  # The Snap target was removed, not descoped: electron-builder's legacy core22
  # path hardcodes the `snapcraft snap` subcommand that snapcraft 8 renamed to
  # `pack`, and migrating to snapcraft.core24 was declined. Linux ships as
  # AppImage + deb from the build matrix.
  release:
    name: release
    needs: [version, build, decide]
    if: needs.decide.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v8
        with:
          pattern: srn-desktop-*
          path: artifacts
          merge-multiple: true

      - name: Checksums
        working-directory: artifacts
        run: |
          set -euo pipefail
          ls -la
          mapfile -d '' files < <(find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z)
          test "${#files[@]}" -gt 0
          sha256sum "${files[@]}" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: srn-desktop ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            artifacts/*
