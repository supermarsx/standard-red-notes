# Rolling release pipeline for the Standard Red Notes DESKTOP app (electron-builder).
#
# Electron apps are built on native runners (no cross-compile). Stages:
#   impact -> identity -> build -> decide -> fan-in -> release
#
# Trigger: push to `main` touching any packaged app workspace or dependency
# manifest, or manual dispatch. The desktop embeds the web UI and its shared
# workspace graph, so those inputs must release together with shell changes.
#
# Versioning: rolling `YY.N` (e.g. 26.1) — N is one past the highest N already
# released for the current year, so it resets every January. This is the same
# scheme every other srn-* component uses, and the tag is namespaced the same
# way: `srn-desktop-v26.1`. The previous scheme was `YY.M.<run>`, whose third
# field was GITHUB_RUN_NUMBER rather than a day, so `26.7.15` read as a date
# that was four days wrong; its tag was also a bare `v26.7.15`, which handed
# desktop the repo-global `v*` tag namespace and the "Latest" release badge.
#
# The version BAKED INTO THE APP is `YY.N.0` (app_version), not `YY.N`.
# electron-updater rejects a non-semver app version outright
# (AppUpdater: ERR_UPDATER_INVALID_VERSION) and `26.1` is not valid semver, so
# the release identity (tag/title) and the app's internal semver are computed
# together but formatted differently on purpose.
#
# Production artifacts fail closed: macOS must be Developer ID signed,
# notarized, and stapled; Windows installers must carry a valid timestamped
# Authenticode signature from the configured certificate. The hooks still
# allow unsigned local/non-publishing builds unless
# REQUIRE_DESKTOP_AUTHENTICITY=true is set explicitly.
name: srn-desktop

on:
  push:
    branches: [main]
    paths:
      - "app/packages/**"
      - "app/package.json"
      - "app/yarn.lock"
      - "app/.nvmrc"
      - "app/.yarnrc.yml"
      - "app/.yarn/patches/**"
      - "app/.yarn/releases/**"
      - "app/.github/workflows/desktop.release.reuse.yml"
      - "app/babel.config.js"
      - "app/tsconfig.base.json"
      - "app/scripts/verify-desktop-updater-metadata.rb"
      - "scripts/package.json"
      - "scripts/package-lock.json"
      - "scripts/release-packaging-contract.mjs"
      - ".github/workflows/srn-desktop.yml"
  workflow_dispatch:
    inputs:
      force_release:
        description: Publish even when the desktop surface is unchanged
        required: false
        default: false
        type: boolean
      force_reason:
        description: Required audit reason when force_release is true
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: srn-desktop-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  TOOL: srn-desktop

jobs:
  impact:
    name: analyze release impact
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.impact.outputs.changed }}
      forced: ${{ steps.impact.outputs.forced }}
      base_ref: ${{ steps.impact.outputs.base_ref }}
      baseline_status: ${{ steps.impact.outputs.baseline_status }}
      publication_gate: ${{ steps.impact.outputs.publication_gate }}
      reason_codes: ${{ steps.impact.outputs.reason_codes }}
      result_json: ${{ steps.impact.outputs.result_json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Authorize exact protected release source
        run: |
          set -euo pipefail
          git fetch --no-tags --force origin refs/heads/main:refs/remotes/origin/main
          protected_sha="$(git rev-parse "refs/remotes/origin/main^{commit}")"
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$protected_sha"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          package-manager-cache: false

      - name: Install release policy dependencies
        run: npm ci --prefix scripts --ignore-scripts --no-audit --no-fund

      - name: Validate release packaging contract
        run: node scripts/validate-release-contract.mjs

      - id: impact
        name: Compare desktop publishable surface with its latest release
        env:
          FORCE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_release || false }}
          FORCE_REASON: ${{ github.event_name == 'workflow_dispatch' && inputs.force_reason || '' }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          node scripts/analyze-release-impact.mjs \
            --target srn-desktop \
            --head HEAD \
            --force "${FORCE_RELEASE}" \
            --force-reason "${FORCE_REASON}" \
            --output release-impact.json \
            --github-output "$GITHUB_OUTPUT"
          {
            echo '### Desktop release impact'
            echo '```json'
            cat release-impact.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Reserve a commit-and-intent-bound draft before native packaging. The same
  # workflow run reuses it on retry; a new forced invocation gets a new YY.N.
  identity:
    name: reserve release identity
    needs: impact
    if: needs.impact.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment: release-production
    permissions:
      contents: write
    outputs:
      version: ${{ steps.identity.outputs.version }}
      app_version: ${{ steps.identity.outputs.app_version }}
      tag: ${{ steps.identity.outputs.tag }}
      release_id: ${{ steps.identity.outputs.release_id }}
      reused: ${{ steps.identity.outputs.reused }}
      published: ${{ steps.identity.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: identity
        name: Reserve or reuse exact desktop draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCED: ${{ needs.impact.outputs.forced }}
          IMPACT_RESULT: ${{ needs.impact.outputs.result_json }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$FORCED" == "true" || "$FORCED" == "false" ]]
          jq -e --arg sha "$GITHUB_SHA" --argjson forced "$FORCED" '
            .headSha == $sha
            and .forced == $forced
            and (
              ($forced and (.forceReason | type == "string") and ((.forceReason | gsub("^\\s+|\\s+$"; "")) | length > 0))
              or (($forced | not) and .forceReason == null)
            )
          ' <<< "$IMPACT_RESULT" >/dev/null
          if [ "$FORCED" = true ]; then
            [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
            intent="forced-${GITHUB_RUN_ID}"
          else
            intent=automatic
          fi
          git fetch --force --tags origin

          yy="$(date -u +%y)"
          prefix="${TOOL}-v${yy}."
          marker="<!-- srn-release-reservation tool=${TOOL} commit=${GITHUB_SHA} intent=${intent} -->"
          marker_prefix="<!-- srn-release-reservation tool=${TOOL} "
          releases_file="$(mktemp)"
          load_releases() {
            gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate --slurp |
              jq 'flatten' > "$releases_file"
          }
          load_releases

          mapfile -t stale_reservations < <(
            jq -c --arg marker "$marker" --arg marker_prefix "$marker_prefix" --arg sha "$GITHUB_SHA" --arg tool_prefix "${TOOL}-v" '
              .[]
              | select(.draft == true)
              | select((.body // "") | contains($marker_prefix))
              | select(((.target_commitish == $sha) and (.tag_name | startswith($tool_prefix)) and ((.body // "") | contains($marker))) | not)
            ' "$releases_file"
          )
          if [ "${#stale_reservations[@]}" -gt 1 ]; then
            echo "Refusing to reconcile multiple stale ${TOOL} draft reservations:" >&2
            for stale in "${stale_reservations[@]}"; do
              jq -r '"  \(.id)\t\(.tag_name)\t\(.target_commitish)"' <<< "$stale" >&2
            done
            exit 1
          elif [ "${#stale_reservations[@]}" -eq 1 ]; then
            stale="${stale_reservations[0]}"
            release_id="$(jq -r '.id' <<< "$stale")"
            stale_tag="$(jq -r '.tag_name' <<< "$stale")"
            stale_sha="$(jq -r '.target_commitish' <<< "$stale")"
            stale_marker="<!-- srn-release-reservation tool=srn-desktop commit=${stale_sha} intent=automatic -->"

            # A previous failed automatic run may leave its early reservation
            # behind. Preserve it for exact same-SHA retries, but allow a later
            # source/intent to supersede it only when the complete inventory
            # proves there is one recognized, bot-authored, unpublished,
            # mutable, asset-free draft.
            if ! jq -e --arg expected_marker "$stale_marker" '
              . as $release
              | (($release.id | type) == "number")
                and (($release.tag_name | type) == "string")
                and ($release.tag_name | test("^srn-desktop-v[0-9]{2}\\.[1-9][0-9]*$"))
                and ($release.name == ("srn-desktop " + ($release.tag_name | sub("^srn-desktop-v"; ""))))
                and (($release.target_commitish | type) == "string")
                and ($release.target_commitish | test("^[0-9a-f]{40}$"))
                and ($release.draft == true)
                and ($release.prerelease == false)
                and (($release.author | type) == "object")
                and ($release.author.login == "github-actions[bot]")
                and ($release.author.type == "Bot")
                and ($release.author.id == 41898282)
                and ($release | has("published_at"))
                and ($release.published_at == null)
                and ($release.immutable == false)
                and (($release.assets | type) == "array")
                and (($release.assets | length) == 0)
                and (($release.body // "") | startswith($expected_marker))
                and (([($release.body // "") | scan("<!-- srn-release-reservation tool=srn-desktop ")] | length) == 1)
            ' <<< "$stale" >/dev/null; then
              echo "Refusing to delete an unrecognized or non-empty stale ${TOOL} reservation: ${release_id}" >&2
              exit 1
            fi
            test "$(jq --arg tag "$stale_tag" '[.[] | select(.tag_name == $tag)] | length' "$releases_file")" -eq 1 || {
              echo "Refusing to delete an ambiguous ${TOOL} reservation tag: ${stale_tag}" >&2
              exit 1
            }

            snapshot_filter='{id,tag_name,name,target_commitish,draft,prerelease,published_at_present:has("published_at"),published_at,immutable,author:{login:.author.login,type:.author.type,id:.author.id},body:(.body // ""),asset_ids:([.assets[]?.id] | sort)}'
            expected_snapshot="$(jq -c "$snapshot_filter" <<< "$stale")"
            live="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}")"
            live_snapshot="$(jq -c "$snapshot_filter" <<< "$live")"
            test "$live_snapshot" = "$expected_snapshot" || {
              echo "Refusing to delete ${stale_tag}: immutable-ID refetch changed" >&2
              exit 1
            }

            # Refresh the complete inventory after the immutable-ID read. This
            # makes a concurrent duplicate or mutation fail before any delete.
            load_releases
            test "$(jq --arg tag "$stale_tag" '[.[] | select(.tag_name == $tag)] | length' "$releases_file")" -eq 1 || {
              echo "Refusing to delete ${stale_tag}: release inventory changed" >&2
              exit 1
            }
            refreshed="$(jq -c --argjson id "$release_id" '.[] | select(.id == $id)' "$releases_file")"
            test -n "$refreshed"
            refreshed_snapshot="$(jq -c "$snapshot_filter" <<< "$refreshed")"
            test "$refreshed_snapshot" = "$expected_snapshot" || {
              echo "Refusing to delete ${stale_tag}: release mutated during prevalidation" >&2
              exit 1
            }

            git fetch --force --tags origin
            if git show-ref --verify --quiet "refs/tags/${stale_tag}"; then
              echo "Refusing to delete a stale draft whose tag exists: ${stale_tag}" >&2
              exit 1
            fi

            # Close the mutation window between the refreshed inventory/tag
            # checks and deletion by proving the same immutable release ID one
            # final time immediately before the destructive request.
            final_live="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}")"
            final_snapshot="$(jq -c "$snapshot_filter" <<< "$final_live")"
            test "$final_snapshot" = "$expected_snapshot" || {
              echo "Refusing to delete ${stale_tag}: release mutated after tag verification" >&2
              exit 1
            }
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}"

            load_releases
            test "$(jq --argjson id "$release_id" '[.[] | select(.id == $id)] | length' "$releases_file")" -eq 0
            echo "Removed superseded empty automatic draft ${stale_tag}; the exact current source may now reserve that version." >> "$GITHUB_STEP_SUMMARY"
          fi

          mapfile -t stale_after_reconciliation < <(
            jq -r --arg marker "$marker" --arg marker_prefix "$marker_prefix" --arg sha "$GITHUB_SHA" --arg tool_prefix "${TOOL}-v" '
              .[]
              | select(.draft == true)
              | select((.body // "") | contains($marker_prefix))
              | select(((.target_commitish == $sha) and (.tag_name | startswith($tool_prefix)) and ((.body // "") | contains($marker))) | not)
              | .id
            ' "$releases_file"
          )
          test "${#stale_after_reconciliation[@]}" -eq 0

          mapfile -t reservations < <(
            jq -r --arg marker "$marker" --arg sha "$GITHUB_SHA" --arg tool_prefix "${TOOL}-v" '
              .[]
              | select(.target_commitish == $sha)
              | select((.body // "") | contains($marker))
              | select(.tag_name | startswith($tool_prefix))
              | .id
            ' "$releases_file"
          )
          if [ "${#reservations[@]}" -gt 1 ]; then
            echo "Multiple desktop reservations match ${GITHUB_SHA} and ${intent}" >&2
            exit 1
          fi

          reused=false
          if [ "${#reservations[@]}" -eq 1 ]; then
            release_id="${reservations[0]}"
            release="$(jq -c --argjson id "$release_id" '.[] | select(.id == $id)' "$releases_file")"
            tag="$(jq -r '.tag_name' <<< "$release")"
            version="${tag#"${TOOL}-v"}"
            name="${TOOL} ${version}"
            [[ "$version" =~ ^[0-9]{2}\.[1-9][0-9]*$ ]]
            jq -e --arg tag "$tag" --arg name "$name" --arg sha "$GITHUB_SHA" --arg marker "$marker" '
              .tag_name == $tag
              and .name == $name
              and .target_commitish == $sha
              and (.draft == true or .draft == false)
              and .prerelease == false
              and ((.body // "") | contains($marker))
            ' <<< "$release" >/dev/null
            test "$(jq --arg tag "$tag" '[.[] | select(.tag_name == $tag)] | length' "$releases_file")" -eq 1
            published="$(jq -r '.draft | not' <<< "$release")"
            if [ "$published" = true ]; then
              git show-ref --verify --quiet "refs/tags/${tag}"
              test "$(git rev-list -n 1 "$tag")" = "$GITHUB_SHA"
            elif git show-ref --verify --quiet "refs/tags/${tag}"; then
              echo "Draft reservation ${tag} collides with an existing Git tag" >&2
              exit 1
            fi
            reused=true
          else
            max=0
            while read -r candidate; do
              [ -z "$candidate" ] && continue
              n="${candidate#"$prefix"}"
              if [[ "$n" =~ ^[1-9][0-9]*$ ]] && [ "$n" -gt "$max" ]; then max="$n"; fi
            done < <(
              {
                git tag --list "${prefix}*"
                jq -r --arg prefix "$prefix" '.[] | select(.tag_name | startswith($prefix)) | .tag_name' "$releases_file"
              } | LC_ALL=C sort -u
            )
            version="${yy}.$((max + 1))"
            tag="${TOOL}-v${version}"
            name="${TOOL} ${version}"
            if git show-ref --verify --quiet "refs/tags/${tag}"; then
              echo "Refusing to reserve existing tag ${tag}" >&2
              exit 1
            fi
            test "$(jq --arg tag "$tag" '[.[] | select(.tag_name == $tag)] | length' "$releases_file")" -eq 0
            created="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="$tag" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="$name" \
              -f body="$marker" \
              -F draft=true \
              -F prerelease=false \
              -F generate_release_notes=true)"
            release_id="$(jq -r '.id' <<< "$created")"
            published=false
            jq -e --arg tag "$tag" --arg name "$name" --arg sha "$GITHUB_SHA" --arg marker "$marker" '
              (.id | type == "number")
              and .tag_name == $tag
              and .name == $name
              and .target_commitish == $sha
              and .draft == true
              and .prerelease == false
              and ((.body // "") | contains($marker))
            ' <<< "$created" >/dev/null
          fi

          {
            echo "version=${version}"
            echo "app_version=${version}.0"
            echo "tag=${tag}"
            echo "release_id=${release_id}"
            echo "reused=${reused}"
            echo "published=${published}"
          } >> "$GITHUB_OUTPUT"
          echo "Reserved ${tag} for ${GITHUB_SHA} with intent ${intent} (id ${release_id}; reused=${reused}; published=${published})." >> "$GITHUB_STEP_SUMMARY"

  # 2) BUILD — electron-builder on native runners. macOS and Windows build both
  # arches in one run; Linux uses one runner per architecture.
  build:
    name: build (${{ matrix.label }})
    needs: identity
    if: needs.identity.outputs.published != 'true'
    runs-on: ${{ matrix.os }}
    environment: release-production
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              label: macos,
              os: macos-latest,
              builder: "--mac dmg zip --x64 --arm64",
            }
          - {
              label: windows,
              os: windows-latest,
              builder: "--win nsis --x64 --arm64",
            }
          - {
              label: linux-x64,
              os: ubuntu-latest,
              builder: "--linux AppImage deb --x64",
              target_arch: x64,
            }
          - {
              label: linux-arm64,
              os: ubuntu-24.04-arm,
              builder: "--linux AppImage deb --arm64",
              target_arch: arm64,
            }
    env:
      # Never attempt to auto-discover a macOS signing identity.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: app/.nvmrc
          package-manager-cache: false

      - name: Require macOS signing and notarization credentials
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.MAC_CI_KEYS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CI_KEYS_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARIZE_APPLE_ID: ${{ secrets.NOTARIZE_APPLE_ID }}
          NOTARIZE_APPLE_ID_PASSWORD: ${{ secrets.NOTARIZE_APPLE_ID_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_TEAM_ID NOTARIZE_APPLE_ID NOTARIZE_APPLE_ID_PASSWORD; do
            test -n "$(printenv "$name" 2>/dev/null || true)" || missing+=("$name")
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf 'Production macOS authenticity credentials are missing: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Require and validate Windows signing credentials
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SM_HOST: ${{ secrets.SM_HOST }}
          SM_TLS_SKIP_VERIFY: "false"
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_CLIENT_CERT_FILE_B64: ${{ secrets.SM_CLIENT_CERT_FILE_B64 }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
          SM_KEYPAIR_ALIAS: ${{ secrets.SM_KEYPAIR_ALIAS }}
          SM_CODE_SIGNING_CERT_SHA1_HASH: ${{ secrets.SM_CODE_SIGNING_CERT_SHA1_HASH }}
          SM_CLIENT_TOOLS_MSI_SHA256: ${{ secrets.SM_CLIENT_TOOLS_MSI_SHA256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            'SM_HOST',
            'SM_API_KEY',
            'SM_CLIENT_CERT_FILE_B64',
            'SM_CLIENT_CERT_PASSWORD',
            'SM_KEYPAIR_ALIAS',
            'SM_CODE_SIGNING_CERT_SHA1_HASH',
            'SM_CLIENT_TOOLS_MSI_SHA256'
          )
          $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })
          if ($missing.Count -ne 0) {
            throw "Production Windows authenticity credentials are missing: $($missing -join ', ')"
          }
          if ($env:SM_CODE_SIGNING_CERT_SHA1_HASH -notmatch '^[0-9A-Fa-f]{40}$') {
            throw 'SM_CODE_SIGNING_CERT_SHA1_HASH must be exactly 40 hexadecimal characters'
          }
          $expectedMsiHash = $env:SM_CLIENT_TOOLS_MSI_SHA256.Trim().ToUpperInvariant()
          if ($expectedMsiHash -notmatch '^[0-9A-F]{64}$') {
            throw 'SM_CLIENT_TOOLS_MSI_SHA256 must be exactly 64 hexadecimal characters'
          }
          $allowedHosts = @(
            'https://clientauth.one.digicert.com',
            'https://clientauth.one.nl.digicert.com'
          )
          if ($allowedHosts -notcontains $env:SM_HOST.TrimEnd('/')) {
            throw 'SM_HOST must use an approved DigiCert ONE production authority'
          }

          # DigiCert's Windows clients installer guidance requires downloading
          # Keylockertools-windows-x64.msi, running it, then configuring SMCTL.
          $toolsUri = [Uri]'https://one.digicert.com/signingmanager/api-ui/v1/releases/Keylockertools-windows-x64.msi/download'
          if ($toolsUri.Scheme -ne 'https' -or $toolsUri.Host -ne 'one.digicert.com') {
            throw 'DigiCert client tools must come from the approved HTTPS authority'
          }
          $msiPath = Join-Path $env:RUNNER_TEMP 'digicert-keylocker-tools.msi'
          Invoke-WebRequest -Uri $toolsUri -Headers @{ 'x-api-key' = $env:SM_API_KEY } -OutFile $msiPath
          $actualMsiHash = (Get-FileHash -LiteralPath $msiPath -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($actualMsiHash -ne $expectedMsiHash) {
            throw 'DigiCert client tools MSI SHA-256 does not match SM_CLIENT_TOOLS_MSI_SHA256'
          }
          $msiSignature = Get-AuthenticodeSignature -LiteralPath $msiPath
          if ($msiSignature.Status -ne [System.Management.Automation.SignatureStatus]::Valid -or
              $null -eq $msiSignature.SignerCertificate) {
            throw "DigiCert client tools MSI has an invalid Authenticode signature: $($msiSignature.Status)"
          }
          $installer = Start-Process -FilePath msiexec.exe -ArgumentList @('/i', "`"$msiPath`"", '/qn', '/norestart') -Wait -PassThru -WindowStyle Hidden
          if (@(0, 1641, 3010) -notcontains $installer.ExitCode) {
            throw "DigiCert client tools installation failed with exit code $($installer.ExitCode)"
          }
          $toolsDirectory = 'C:\Program Files\DigiCert\DigiCert Keylocker Tools'
          if (-not (Test-Path -LiteralPath $toolsDirectory -PathType Container)) {
            throw "DigiCert client tools installation directory is missing: $toolsDirectory"
          }
          $env:PATH = "$toolsDirectory;$env:PATH"
          $toolsDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $smctl = Get-Command smctl -CommandType Application -ErrorAction Stop

          $certificatePath = Join-Path $env:RUNNER_TEMP 'digicert-client-auth.p12'
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:SM_CLIENT_CERT_FILE_B64)
          )
          if ((Get-Item -LiteralPath $certificatePath).Length -eq 0) {
            throw 'Decoded DigiCert client authentication certificate is empty'
          }
          $env:SM_CLIENT_CERT_FILE = $certificatePath
          "SM_CLIENT_CERT_FILE=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $smctl.Source healthcheck
          if ($LASTEXITCODE -ne 0) {
            throw "smctl healthcheck failed with exit code $LASTEXITCODE"
          }

      - name: Install Corepack (Yarn 4.17.1)
        run: npm install --global --force corepack@0.35.0 && corepack enable

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev fakeroot libfuse2 || \
          sudo apt-get install -y libsecret-1-dev fakeroot libfuse2t64

      - name: Set up Python (macOS native build)
        if: runner.os == 'macOS'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.6"

      - name: Install workspace dependencies
        working-directory: app
        run: yarn install --immutable

      - name: Build web UI
        working-directory: app
        # Topological build of web + every first-party workspace it imports;
        # their entrypoints are compiled dist/ output, so webpack cannot
        # resolve them until they are built. Also pre-builds snjs/utils/web
        # for the desktop bundle step below.
        run: yarn build:web

      - name: Build desktop bundle (webpack)
        working-directory: app/packages/desktop
        run: yarn build

      - name: Prune foreign Linux native prebuilds
        if: runner.os == 'Linux'
        working-directory: app/packages/desktop
        env:
          TARGET_ARCH: ${{ matrix.target_arch }}
        run: node scripts/pruneLinuxNativePrebuilds.js --arch "$TARGET_ARCH" --node-modules node_modules --node-modules app/dist/node_modules

      - name: electron-builder
        working-directory: app/packages/desktop
        # app_version, not version: electron-updater refuses to run against a
        # non-semver app version, and the release identity `YY.N` is not semver.
        env:
          REQUIRE_DESKTOP_AUTHENTICITY: "true"
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CI_KEYS || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CI_KEYS_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
          NOTARIZE_APPLE_ID: ${{ runner.os == 'macOS' && secrets.NOTARIZE_APPLE_ID || '' }}
          NOTARIZE_APPLE_ID_PASSWORD: ${{ runner.os == 'macOS' && secrets.NOTARIZE_APPLE_ID_PASSWORD || '' }}
          SM_HOST: ${{ runner.os == 'Windows' && secrets.SM_HOST || '' }}
          SM_TLS_SKIP_VERIFY: "false"
          SM_API_KEY: ${{ runner.os == 'Windows' && secrets.SM_API_KEY || '' }}
          SM_CLIENT_CERT_PASSWORD: ${{ runner.os == 'Windows' && secrets.SM_CLIENT_CERT_PASSWORD || '' }}
          SM_KEYPAIR_ALIAS: ${{ runner.os == 'Windows' && secrets.SM_KEYPAIR_ALIAS || '' }}
        run: yarn electron-builder ${{ matrix.builder }} --publish never -c.extraMetadata.version=${{ needs.identity.outputs.app_version }}

      - name: Verify macOS signatures and stapled notarization tickets
        if: runner.os == 'macOS'
        working-directory: app/packages/desktop
        env:
          EXPECTED_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_APPLE_TEAM_ID"
          count=0
          while IFS= read -r -d '' app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            actual_team="$(codesign -dv --verbose=4 "$app" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
            test "$actual_team" = "$EXPECTED_APPLE_TEAM_ID"
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=4 "$app"
            count=$((count + 1))
          done < <(find dist -mindepth 2 -maxdepth 2 -type d -name '*.app' -print0 | sort -z)
          test "$count" -eq 2 || {
            echo "Expected two signed and notarized macOS application bundles, found $count" >&2
            exit 1
          }

      - name: Verify Windows published and runtime signatures and timestamps
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: app/packages/desktop
        env:
          APP_VERSION: ${{ needs.identity.outputs.app_version }}
          EXPECTED_WINDOWS_SIGNER_SHA1: ${{ secrets.SM_CODE_SIGNING_CERT_SHA1_HASH }}
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = $env:EXPECTED_WINDOWS_SIGNER_SHA1.ToUpperInvariant()
          if ($expected -notmatch '^[0-9A-F]{40}$') {
            throw 'Expected Windows signer fingerprint must be exactly 40 hexadecimal characters'
          }
          $expectedPublished = @(
            "dist/standard-red-notes-$($env:APP_VERSION)-win-x64.exe",
            "dist/standard-red-notes-$($env:APP_VERSION)-win-arm64.exe"
          )
          $publishedExecutables = @(
            Get-ChildItem -LiteralPath dist -File -Filter '*.exe' |
              ForEach-Object { $_.FullName }
          )
          if ($publishedExecutables.Count -ne 2) {
            throw "Expected exactly two published Windows executable packages, found $($publishedExecutables.Count)"
          }
          $expectedPublishedFull = @($expectedPublished | ForEach-Object { [IO.Path]::GetFullPath($_) })
          if (@(Compare-Object $expectedPublishedFull $publishedExecutables).Count -ne 0) {
            throw 'Published Windows executable inventory does not match the two canonical NSIS installers'
          }

          $expectedRuntime = @(
            'dist/win-unpacked/standard-red-notes.exe',
            'dist/win-arm64-unpacked/standard-red-notes.exe'
          )
          $runtimeExecutables = @(
            Get-ChildItem -LiteralPath dist -Recurse -File -Filter 'standard-red-notes.exe' |
              Where-Object { $_.Directory.Name -in @('win-unpacked', 'win-arm64-unpacked') } |
              ForEach-Object { $_.FullName }
          )
          if ($runtimeExecutables.Count -ne 2) {
            throw "Expected exactly two unpacked Windows application executables, found $($runtimeExecutables.Count)"
          }
          $expectedRuntimeFull = @($expectedRuntime | ForEach-Object { [IO.Path]::GetFullPath($_) })
          if (@(Compare-Object $expectedRuntimeFull $runtimeExecutables).Count -ne 0) {
            throw 'Unpacked Windows application executable inventory does not match both release architectures'
          }

          foreach ($artifact in @($expectedPublished + $expectedRuntime)) {
            if (-not (Test-Path -LiteralPath $artifact -PathType Leaf)) {
              throw "Missing expected Windows executable: $artifact"
            }
            $signature = Get-AuthenticodeSignature -LiteralPath $artifact
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
              throw "Invalid Authenticode signature on $artifact`: $($signature.Status)"
            }
            if ($null -eq $signature.SignerCertificate -or $signature.SignerCertificate.Thumbprint -ne $expected) {
              throw "Unexpected Authenticode signer on $artifact"
            }
            if ($null -eq $signature.TimeStamperCertificate) {
              throw "Missing Authenticode timestamp on $artifact"
            }
          }

      - name: Remove Windows signing bootstrap material
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $temporaryFiles = @(
            (Join-Path $env:RUNNER_TEMP 'digicert-keylocker-tools.msi'),
            (Join-Path $env:RUNNER_TEMP 'digicert-client-auth.p12')
          )
          foreach ($temporaryFile in $temporaryFiles) {
            if (Test-Path -LiteralPath $temporaryFile -PathType Leaf) {
              Remove-Item -LiteralPath $temporaryFile -Force
            }
          }

      # Fingerprint the ACTUAL packaged application payload, not the installer:
      # installers carry timestamps/signature containers and are not byte
      # reproducible. app.asar + app.asar.unpacked is the runtime payload users
      # execute. Normalizing only package.json's rolling version lets a root lock
      # change build safely, then stop here when every shipped byte is unchanged.
      - name: Fingerprint packaged runtime payloads
        working-directory: app/packages/desktop
        env:
          MATRIX_LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          mkdir -p staged
          work="$RUNNER_TEMP/srn-desktop-fingerprint"
          rm -rf "$work"
          mkdir -p "$work"
          count=0
          while IFS= read -r -d '' asar; do
            case "$MATRIX_LABEL:$asar" in
              macos:*arm64*) target=macos-arm64 ;;
              macos:*) target=macos-x64 ;;
              windows:*arm64*) target=windows-arm64 ;;
              windows:*) target=windows-x64 ;;
              linux-x64:*) target=linux-x64 ;;
              linux-arm64:*) target=linux-arm64 ;;
              *) echo "Cannot classify packaged runtime: $asar" >&2; exit 1 ;;
            esac
            output="staged/${TOOL}-${target}.fingerprint"
            test ! -e "$output" || {
              echo "Duplicate packaged runtime for $target" >&2
              exit 1
            }
            extract="$work/$target"
            mkdir -p "$extract"
            yarn exec asar extract "$asar" "$extract"
            if [ -d "${asar}.unpacked" ]; then
              cp -a "${asar}.unpacked" "$extract/app.asar.unpacked"
            fi
            contract="$extract/.srn-release-contract"
            mkdir -p "$contract"
            cp ../../package.json "$contract/app-package.json"
            cp ../../yarn.lock "$contract/app-yarn.lock"
            cp ../../.nvmrc "$contract/app-nvmrc"
            cp ../../.yarnrc.yml "$contract/app-yarnrc.yml"
            cp ../../babel.config.js "$contract/app-babel.config.js"
            cp ../../tsconfig.base.json "$contract/app-tsconfig.base.json"
            cp package.json "$contract/desktop-package.json"
            cp app/package.json "$contract/desktop-runtime-package.json"
            cp build/entitlements.mac.inherit.plist "$contract/desktop-mac-entitlements.plist"
            cp scripts/notarizeMac.js "$contract/desktop-notarize-mac.js"
            cp scripts/windowsSign.js "$contract/desktop-windows-sign.js"
            cp -a ../../.yarn/patches "$contract/yarn-patches"
            cp -a ../../.yarn/releases "$contract/yarn-releases"
            electron_version="$(yarn node -p "require('electron/package.json').version")"
            builder_version="$(yarn node -p "require('electron-builder/package.json').version")"
            node ../../../scripts/release-packaging-contract.mjs \
              --contract desktop \
              --root "$extract" \
              --path . \
              --normalize-package-version package.json \
              --metadata "builderArguments=${{ matrix.builder }}" \
              --metadata "electronBuilderVersion=${builder_version}" \
              --metadata "electronVersion=${electron_version}" \
              --metadata "nodeVersion=$(node --version)" \
              --output "$output"
            grep -Eq '^[0-9a-f]{64}$' "$output"
            count=$((count + 1))
          done < <(find dist -type f -name app.asar -print0 | sort -z)

          case "$MATRIX_LABEL" in
            macos|windows) expected=2 ;;
            linux-x64|linux-arm64) expected=1 ;;
            *) echo "Unknown desktop matrix label: $MATRIX_LABEL" >&2; exit 1 ;;
          esac
          test "$count" -eq "$expected" || {
            echo "Expected $expected packaged runtimes for $MATRIX_LABEL, found $count" >&2
            exit 1
          }

      - name: Collect exact installers and canonical updater metadata
        working-directory: app/packages/desktop
        env:
          MATRIX_LABEL: ${{ matrix.label }}
          APP_VERSION: ${{ needs.identity.outputs.app_version }}
        run: |
          set -euo pipefail
          case "$MATRIX_LABEL" in
            macos)
              metadata=latest-mac.yml
              required=(
                "standard-red-notes-${APP_VERSION}-mac-x64.dmg"
                "standard-red-notes-${APP_VERSION}-mac-arm64.dmg"
                "standard-red-notes-${APP_VERSION}-mac-x64.zip"
                "standard-red-notes-${APP_VERSION}-mac-arm64.zip"
              )
              fingerprints=(srn-desktop-macos-x64.fingerprint srn-desktop-macos-arm64.fingerprint)
              ;;
            windows)
              metadata=latest.yml
              required=(
                "standard-red-notes-${APP_VERSION}-win-x64.exe"
                "standard-red-notes-${APP_VERSION}-win-arm64.exe"
              )
              fingerprints=(srn-desktop-windows-x64.fingerprint srn-desktop-windows-arm64.fingerprint)
              ;;
            linux-x64)
              metadata=latest-linux.yml
              required=(
                "standard-red-notes-${APP_VERSION}-linux-x86_64.AppImage"
                "standard-red-notes-${APP_VERSION}-linux-amd64.deb"
              )
              fingerprints=(srn-desktop-linux-x64.fingerprint)
              ;;
            linux-arm64)
              metadata=latest-linux-arm64.yml
              required=(
                "standard-red-notes-${APP_VERSION}-linux-arm64.AppImage"
                "standard-red-notes-${APP_VERSION}-linux-arm64.deb"
              )
              fingerprints=(srn-desktop-linux-arm64.fingerprint)
              ;;
            *) echo "Unknown desktop matrix label: $MATRIX_LABEL" >&2; exit 1 ;;
          esac

          metadata_files=()
          for metadata_path in dist/latest*.yml; do
            [ -f "$metadata_path" ] || continue
            metadata_files+=("${metadata_path##*/}")
          done
          test "${#metadata_files[@]}" -eq 1
          test "${metadata_files[0]}" = "$metadata"
          test -s "dist/${metadata}"
          cp -- "dist/${metadata}" staged/
          for name in "${required[@]}"; do
            test -s "dist/${name}"
            cp -- "dist/${name}" staged/
            if [ -f "dist/${name}.blockmap" ]; then cp -- "dist/${name}.blockmap" staged/; fi
          done
          for blockmap in dist/*.blockmap; do
            [ -f "$blockmap" ] || continue
            base="$(basename "${blockmap%.blockmap}")"
            allowed=false
            for name in "${required[@]}"; do if [ "$base" = "$name" ]; then allowed=true; fi; done
            test "$allowed" = true
          done
          for fingerprint in "${fingerprints[@]}"; do test -s "staged/${fingerprint}"; done
          echo "Staged exact ${MATRIX_LABEL} release inventory:" && ls -la staged
          leg_manifest="$RUNNER_TEMP/${TOOL}-${MATRIX_LABEL}-SHA256SUMS"
          if command -v sha256sum >/dev/null 2>&1; then
            checksum=(sha256sum)
            checksum_check=(sha256sum --check)
          else
            checksum=(shasum -a 256)
            checksum_check=(shasum -a 256 --check)
          fi
          (
            cd staged
            for path in *; do
              [ -f "$path" ] && printf '%s\n' "$path"
            done | LC_ALL=C sort |
              while IFS= read -r name; do "${checksum[@]}" -- "$name"; done > "$leg_manifest"
            "${checksum_check[@]}" "$leg_manifest"
          )

      - name: Upload installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: srn-desktop-${{ matrix.label }}
          path: app/packages/desktop/staged/*
          retention-days: 30
          if-no-files-found: error

  # 3) DECIDE — all native builds ran because source impact was detected. Stop
  # before tagging/publishing when all six normalized runtime payloads are
  # byte-identical to the analyzer-selected prior release.
  decide:
    name: decide
    needs: [impact, identity, build]
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      decision: ${{ steps.compare.outputs.decision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download macOS payload into an isolated namespace
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: srn-desktop-macos
          path: artifacts/macos

      - name: Download Windows payload into an isolated namespace
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: srn-desktop-windows
          path: artifacts/windows

      - name: Download Linux X64 payload into an isolated namespace
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: srn-desktop-linux-x64
          path: artifacts/linux-x64

      - name: Download Linux ARM64 payload into an isolated namespace
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: srn-desktop-linux-arm64
          path: artifacts/linux-arm64

      - id: compare
        name: Compare normalized runtime fingerprints
        env:
          BASE_REF: ${{ needs.impact.outputs.base_ref }}
          BASELINE_STATUS: ${{ needs.impact.outputs.baseline_status }}
          FORCED: ${{ needs.impact.outputs.forced }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          targets=(
            macos-x64 macos-arm64
            windows-x64 windows-arm64
            linux-x64 linux-arm64
          )
          fingerprints=()
          for target in "${targets[@]}"; do
            case "$target" in
              macos-*) source_dir=macos ;;
              windows-*) source_dir=windows ;;
              linux-x64) source_dir=linux-x64 ;;
              linux-arm64) source_dir=linux-arm64 ;;
              *) echo "Unknown fingerprint target ${target}" >&2; exit 1 ;;
            esac
            file="artifacts/${source_dir}/${TOOL}-${target}.fingerprint"
            test -s "$file"
            fingerprint="$(tr -d '[:space:]' < "$file")"
            fingerprints+=(--fingerprint "${TOOL}-${target}.fingerprint=${fingerprint}")
          done
          actual="$(find artifacts -mindepth 2 -maxdepth 2 -type f -name "${TOOL}-*.fingerprint" | wc -l | tr -d '[:space:]')"
          test "$actual" -eq "${#targets[@]}"
          if ! node scripts/compare-release-fingerprints.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --base-ref "$BASE_REF" \
            --baseline-status "$BASELINE_STATUS" \
            --forced "$FORCED" \
            "${fingerprints[@]}" \
            --output release-fingerprint-comparison.json \
            --github-output "$GITHUB_OUTPUT"; then
            cat release-fingerprint-comparison.json >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cat release-fingerprint-comparison.json >> "$GITHUB_STEP_SUMMARY"

  # A runtime-identical build does not deserve a release. Remove only the exact,
  # still-empty marker-bound draft allocated by this invocation.
  discard_unchanged:
    name: discard unchanged reservation
    needs: [impact, identity, decide]
    if: always() && needs.identity.result == 'success' && needs.identity.outputs.published != 'true' && needs.decide.result == 'success' && needs.decide.outputs.changed == 'false'
    runs-on: ubuntu-latest
    environment: release-production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Delete exact empty draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.identity.outputs.release_id }}
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
          RELEASE_VERSION: ${{ needs.identity.outputs.version }}
          FORCED: ${{ needs.impact.outputs.forced }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
          if [ "$FORCED" = true ]; then intent="forced-${GITHUB_RUN_ID}"; else intent=automatic; fi
          marker="<!-- srn-release-reservation tool=${TOOL} commit=${GITHUB_SHA} intent=${intent} -->"
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
          jq -e --arg tag "$RELEASE_TAG" --arg name "${TOOL} ${RELEASE_VERSION}" --arg sha "$GITHUB_SHA" --arg marker "$marker" '
            .tag_name == $tag
            and .name == $name
            and .target_commitish == $sha
            and .draft == true
            and .prerelease == false
            and ((.body // "") | contains($marker))
            and (.assets | length == 0)
          ' <<< "$release" >/dev/null
          git fetch --force --tags origin
          if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            echo "Refusing to delete a draft whose tag exists: ${RELEASE_TAG}" >&2
            exit 1
          fi
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}"
          echo "Removed unchanged empty draft ${RELEASE_TAG}; no release was published." >> "$GITHUB_STEP_SUMMARY"

  # Validate every source namespace before flattening. Each updater metadata
  # basename has exactly one canonical producer and all collisions are hashed.
  fan_in:
    name: fan-in
    needs: [identity, build, decide]
    if: needs.identity.outputs.published != 'true' && needs.decide.outputs.changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      manifest_sha: ${{ steps.inventory.outputs.manifest_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install updater inspection tools
        run: sudo apt-get update && sudo apt-get install -y file p7zip-full unzip

      - name: Download macOS artifacts into an isolated namespace
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: srn-desktop-macos
          path: staged/macos
      - name: Download Windows artifacts into an isolated namespace
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: srn-desktop-windows
          path: staged/windows
      - name: Download Linux X64 artifacts into an isolated namespace
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: srn-desktop-linux-x64
          path: staged/linux-x64
      - name: Download Linux ARM64 artifacts into an isolated namespace
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: srn-desktop-linux-arm64
          path: staged/linux-arm64

      - name: Validate authorities, reject collisions, and checksum payload
        id: inventory
        env:
          APP_VERSION: ${{ needs.identity.outputs.app_version }}
          RELEASE_VERSION: ${{ needs.identity.outputs.version }}
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
        run: |
          set -euo pipefail
          validate_source() {
            source_dir="$1"
            metadata="$2"
            shift 2
            required=("$@")
            test -s "${source_dir}/${metadata}"
            metadata_version="$(awk '$1 == "version:" {print $2; exit}' "${source_dir}/${metadata}" | tr -d "\"'")"
            test "$metadata_version" = "$APP_VERSION"
            mapfile -t update_urls < <(awk '$1 == "-" && $2 == "url:" {print $3} $1 == "url:" {print $2}' "${source_dir}/${metadata}" | tr -d "\"'" | LC_ALL=C sort -u)
            test "${#update_urls[@]}" -gt 0
            for url in "${update_urls[@]}"; do
              test "$url" = "$(basename "$url")"
              case "$url" in *.dmg|*.zip|*.exe|*.AppImage|*.deb) ;; *) exit 1 ;; esac
              test -s "${source_dir}/${url}"
              declared=false
              for name in "${required[@]}"; do if [ "$url" = "$name" ]; then declared=true; fi; done
              test "$declared" = true
            done
            for name in "${required[@]}"; do test -s "${source_dir}/${name}"; done
            while IFS= read -r -d '' source; do
              base="$(basename "$source")"
              allowed=false
              if [ "$base" = "$metadata" ]; then allowed=true; fi
              for name in "${required[@]}"; do
                if [ "$base" = "$name" ] || [ "$base" = "${name}.blockmap" ]; then allowed=true; fi
              done
              if [ "$allowed" != true ]; then
                echo "Unexpected desktop release artifact in ${source_dir}: ${base}" >&2
                exit 1
              fi
            done < <(find "$source_dir" -maxdepth 1 -type f -print0)
          }

          validate_source staged/macos latest-mac.yml \
            "standard-red-notes-${APP_VERSION}-mac-x64.dmg" \
            "standard-red-notes-${APP_VERSION}-mac-arm64.dmg" \
            "standard-red-notes-${APP_VERSION}-mac-x64.zip" \
            "standard-red-notes-${APP_VERSION}-mac-arm64.zip" \
            srn-desktop-macos-x64.fingerprint srn-desktop-macos-arm64.fingerprint
          validate_source staged/windows latest.yml \
            "standard-red-notes-${APP_VERSION}-win-x64.exe" \
            "standard-red-notes-${APP_VERSION}-win-arm64.exe" \
            srn-desktop-windows-x64.fingerprint srn-desktop-windows-arm64.fingerprint
          validate_source staged/linux-x64 latest-linux.yml \
            "standard-red-notes-${APP_VERSION}-linux-x86_64.AppImage" \
            "standard-red-notes-${APP_VERSION}-linux-amd64.deb" \
            srn-desktop-linux-x64.fingerprint
          validate_source staged/linux-arm64 latest-linux-arm64.yml \
            "standard-red-notes-${APP_VERSION}-linux-arm64.AppImage" \
            "standard-red-notes-${APP_VERSION}-linux-arm64.deb" \
            srn-desktop-linux-arm64.fingerprint

          ruby app/scripts/verify-desktop-updater-metadata.rb \
            --metadata staged/macos/latest-mac.yml \
            --source-dir staged/macos \
            --expected-version "$APP_VERSION" \
            --allow "standard-red-notes-${APP_VERSION}-mac-x64.dmg" \
            --allow "standard-red-notes-${APP_VERSION}-mac-arm64.dmg" \
            --allow "standard-red-notes-${APP_VERSION}-mac-x64.zip" \
            --allow "standard-red-notes-${APP_VERSION}-mac-arm64.zip" \
            --allow srn-desktop-macos-x64.fingerprint \
            --allow srn-desktop-macos-arm64.fingerprint \
            --architecture "standard-red-notes-${APP_VERSION}-mac-x64.dmg=dmg-x64" \
            --architecture "standard-red-notes-${APP_VERSION}-mac-arm64.dmg=dmg-arm64" \
            --architecture "standard-red-notes-${APP_VERSION}-mac-x64.zip=zip-x64" \
            --architecture "standard-red-notes-${APP_VERSION}-mac-arm64.zip=zip-arm64"
          ruby app/scripts/verify-desktop-updater-metadata.rb \
            --metadata staged/windows/latest.yml \
            --source-dir staged/windows \
            --expected-version "$APP_VERSION" \
            --allow "standard-red-notes-${APP_VERSION}-win-x64.exe" \
            --allow "standard-red-notes-${APP_VERSION}-win-arm64.exe" \
            --allow srn-desktop-windows-x64.fingerprint \
            --allow srn-desktop-windows-arm64.fingerprint \
            --architecture "standard-red-notes-${APP_VERSION}-win-x64.exe=windows-x64" \
            --architecture "standard-red-notes-${APP_VERSION}-win-arm64.exe=windows-arm64"
          ruby app/scripts/verify-desktop-updater-metadata.rb \
            --metadata staged/linux-x64/latest-linux.yml \
            --source-dir staged/linux-x64 \
            --expected-version "$APP_VERSION" \
            --allow "standard-red-notes-${APP_VERSION}-linux-x86_64.AppImage" \
            --allow "standard-red-notes-${APP_VERSION}-linux-amd64.deb" \
            --allow srn-desktop-linux-x64.fingerprint \
            --architecture "standard-red-notes-${APP_VERSION}-linux-x86_64.AppImage=appimage-x64" \
            --architecture "standard-red-notes-${APP_VERSION}-linux-amd64.deb=deb-x64"
          ruby app/scripts/verify-desktop-updater-metadata.rb \
            --metadata staged/linux-arm64/latest-linux-arm64.yml \
            --source-dir staged/linux-arm64 \
            --expected-version "$APP_VERSION" \
            --allow "standard-red-notes-${APP_VERSION}-linux-arm64.AppImage" \
            --allow "standard-red-notes-${APP_VERSION}-linux-arm64.deb" \
            --allow srn-desktop-linux-arm64.fingerprint \
            --architecture "standard-red-notes-${APP_VERSION}-linux-arm64.AppImage=appimage-arm64" \
            --architecture "standard-red-notes-${APP_VERSION}-linux-arm64.deb=deb-arm64"

          declare -A authority=(
            [latest-mac.yml]=macos
            [latest.yml]=windows
            [latest-linux.yml]=linux-x64
            [latest-linux-arm64.yml]=linux-arm64
          )
          for metadata in "${!authority[@]}"; do
            mapfile -t producers < <(find staged -mindepth 2 -maxdepth 2 -type f -name "$metadata" -printf '%h\n')
            test "${#producers[@]}" -eq 1
            test "$(basename "${producers[0]}")" = "${authority[$metadata]}"
          done
          test "$(find staged -mindepth 2 -maxdepth 2 -type f \( -name '*.yml' -o -name '*.yaml' \) | wc -l | tr -d ' ')" -eq 4

          mkdir -p payload
          collisions="$(mktemp)"
          while IFS= read -r -d '' source; do
            base="$(basename "$source")"
            destination="payload/${base}"
            if [ -e "$destination" ]; then
              source_sha="$(sha256sum -- "$source" | cut -d ' ' -f 1)"
              destination_sha="$(sha256sum -- "$destination" | cut -d ' ' -f 1)"
              printf '%s\t%s\t%s\n' "$base" "$destination_sha" "$source_sha" >> "$collisions"
              if [ "$source_sha" != "$destination_sha" ]; then
                echo "Conflicting desktop artifacts share basename ${base}" >&2
                cat "$collisions" >&2
                exit 1
              fi
            else
              cp -- "$source" "$destination"
            fi
          done < <(find staged -mindepth 2 -maxdepth 2 -type f -print0)

          asset_names="$(find payload -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort | jq -R . | jq -s .)"
          jq -n \
            --arg appVersion "$APP_VERSION" \
            --arg commit "$GITHUB_SHA" \
            --arg tag "$RELEASE_TAG" \
            --arg version "$RELEASE_VERSION" \
            --argjson assets "$asset_names" \
            '{schemaVersion:1,commit:$commit,tag:$tag,version:$version,appVersion:$appVersion,
              updaterAuthorities:{"latest-mac.yml":"macos","latest.yml":"windows","latest-linux.yml":"linux-x64","latest-linux-arm64.yml":"linux-arm64"},
              assets:$assets}' > payload/DESKTOP-ARTIFACTS.json
          find payload -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' |
            LC_ALL=C sort |
            while IFS= read -r name; do sha256sum -- "payload/${name}"; done |
            sed 's#  payload/#  #' > payload/SHA256SUMS.txt
          test -s payload/SHA256SUMS.txt
          (cd payload && sha256sum --check SHA256SUMS.txt)
          manifest_sha="$(sha256sum payload/SHA256SUMS.txt | cut -d ' ' -f 1)"
          echo "manifest_sha=${manifest_sha}" >> "$GITHUB_OUTPUT"
          echo "Canonical desktop payload manifest: ${manifest_sha}" >> "$GITHUB_STEP_SUMMARY"
          (cd payload && sha256sum --check SHA256SUMS.txt)

      - name: Upload exact desktop release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: srn-desktop-release-payload
          path: payload/*
          retention-days: 30
          if-no-files-found: error

  # Publish only the reserved release. Ambiguous success is reconciled from the
  # marker-bound published release and its exact remote SHA-256 asset digests.
  release:
    name: release
    needs: [impact, identity, build, decide, fan_in]
    if: always() && needs.identity.result == 'success' && ((needs.identity.outputs.published == 'true' && needs.build.result == 'skipped' && needs.decide.result == 'skipped' && needs.fan_in.result == 'skipped') || (needs.identity.outputs.published != 'true' && needs.build.result == 'success' && needs.decide.result == 'success' && needs.decide.outputs.changed == 'true' && needs.fan_in.result == 'success'))
    runs-on: ubuntu-latest
    environment: release-production
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_ID: ${{ needs.identity.outputs.release_id }}
      RELEASE_TAG: ${{ needs.identity.outputs.tag }}
      RELEASE_VERSION: ${{ needs.identity.outputs.version }}
      APP_VERSION: ${{ needs.identity.outputs.app_version }}
      IDENTITY_PUBLISHED: ${{ needs.identity.outputs.published }}
      EXPECTED_MANIFEST_SHA: ${{ needs.fan_in.outputs.manifest_sha }}
      FORCED: ${{ needs.impact.outputs.forced }}
      IMPACT_RESULT: ${{ needs.impact.outputs.result_json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download exact fan-in payload
        if: needs.identity.outputs.published != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: srn-desktop-release-payload
          path: payload

      - name: Validate, upload, and publish exact desktop release
        run: |
          set -euo pipefail
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
          test "$RELEASE_TAG" = "${TOOL}-v${RELEASE_VERSION}"
          test "$APP_VERSION" = "${RELEASE_VERSION}.0"
          [[ "$FORCED" == true || "$FORCED" == false ]]
          jq -e --arg sha "$GITHUB_SHA" --argjson forced "$FORCED" '
            .headSha == $sha
            and .forced == $forced
            and (($forced and (.forceReason | type == "string") and ((.forceReason | gsub("^\\s+|\\s+$"; "")) | length > 0)) or (($forced | not) and .forceReason == null))
          ' <<< "$IMPACT_RESULT" >/dev/null
          if [ "$FORCED" = true ]; then intent="forced-${GITHUB_RUN_ID}"; else intent=automatic; fi
          reservation_marker="<!-- srn-release-reservation tool=${TOOL} commit=${GITHUB_SHA} intent=${intent} -->"
          expected_name="${TOOL} ${RELEASE_VERSION}"

          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
          jq -e --arg tag "$RELEASE_TAG" --arg name "$expected_name" --arg sha "$GITHUB_SHA" --arg marker "$reservation_marker" '
            .tag_name == $tag
            and .name == $name
            and .target_commitish == $sha
            and (.draft == true or .draft == false)
            and .prerelease == false
            and ((.body // "") | contains($marker))
          ' <<< "$release" >/dev/null
          draft="$(jq -r '.draft' <<< "$release")"
          if [ "$IDENTITY_PUBLISHED" = true ]; then test "$draft" = false; fi

          verify_payload() {
            directory="$1"
            manifest_sha="$(sha256sum "${directory}/SHA256SUMS.txt" | cut -d ' ' -f 1)"
            [[ "$manifest_sha" =~ ^[0-9a-f]{64}$ ]]
            (cd "$directory" && sha256sum --check SHA256SUMS.txt) >/dev/null
            jq -e --arg appVersion "$APP_VERSION" --arg commit "$GITHUB_SHA" --arg tag "$RELEASE_TAG" --arg version "$RELEASE_VERSION" '
              .schemaVersion == 1 and .appVersion == $appVersion and .commit == $commit and .tag == $tag and .version == $version
              and .updaterAuthorities == {"latest-mac.yml":"macos","latest.yml":"windows","latest-linux.yml":"linux-x64","latest-linux-arm64.yml":"linux-arm64"}
            ' "${directory}/DESKTOP-ARTIFACTS.json" >/dev/null
            expected_assets="$(mktemp)"
            { awk '{print $2}' "${directory}/SHA256SUMS.txt"; echo SHA256SUMS.txt; } | LC_ALL=C sort > "$expected_assets"
            local_assets="$(mktemp)"
            find "$directory" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > "$local_assets"
            diff -u "$expected_assets" "$local_assets"
            printf '%s' "$manifest_sha"
          }

          verify_remote_assets() {
            directory="$1"
            expected_assets="$2"
            remote_json="$(mktemp)"
            gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" --paginate --slurp |
              jq 'flatten' > "$remote_json"
            jq -e 'all(.[]; .state == "uploaded" and .size > 0 and (.digest | type == "string") and (.digest | test("^sha256:[0-9a-f]{64}$")))' "$remote_json" >/dev/null
            remote_names="$(mktemp)"
            jq -r '.[].name' "$remote_json" | LC_ALL=C sort > "$remote_names"
            diff -u "$expected_assets" "$remote_names"
            while IFS=$'\t' read -r name digest; do
              test "$digest" = "sha256:$(sha256sum -- "${directory}/${name}" | cut -d ' ' -f 1)"
            done < <(jq -r '.[] | [.name, .digest] | @tsv' "$remote_json")
          }

          git fetch --force --tags origin
          if [ "$draft" = false ]; then
            git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"
            downloaded="$(mktemp -d)"
            gh release download "$RELEASE_TAG" --dir "$downloaded" --repo "$GITHUB_REPOSITORY"
            manifest_sha="$(verify_payload "$downloaded")"
            asset_marker="<!-- srn-desktop-release-assets manifest=${manifest_sha} -->"
            jq -e --arg marker "$asset_marker" '(.body // "") | contains($marker)' <<< "$release" >/dev/null
            expected_assets="$(mktemp)"
            find "$downloaded" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > "$expected_assets"
            verify_remote_assets "$downloaded" "$expected_assets"
            echo "${RELEASE_TAG} was already published; exact identity, inventory, checksums, and API digests verified." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            echo "Refusing to publish over existing tag ${RELEASE_TAG}" >&2
            exit 1
          fi
          test -d payload
          manifest_sha="$(verify_payload payload)"
          test "$manifest_sha" = "$EXPECTED_MANIFEST_SHA"
          asset_marker="<!-- srn-desktop-release-assets manifest=${manifest_sha} -->"
          body="$(jq -r '.body // ""' <<< "$release")"
          mapfile -t prior_asset_markers < <(grep -o '<!-- srn-desktop-release-assets manifest=[^ ]* -->' <<< "$body" || true)
          if [ "${#prior_asset_markers[@]}" -gt 1 ]; then
            echo "Multiple asset manifests are bound to draft ${RELEASE_TAG}" >&2
            exit 1
          fi
          if [ "${#prior_asset_markers[@]}" -eq 1 ] && [ "${prior_asset_markers[0]}" != "$asset_marker" ]; then
            echo "Draft ${RELEASE_TAG} is already bound to a different payload manifest" >&2
            exit 1
          fi
          if [ "${#prior_asset_markers[@]}" -eq 0 ]; then
            body="${body}"$'\n'"${asset_marker}"
            release="$(gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -f tag_name="$RELEASE_TAG" -f body="$body")"
          fi
          jq -e --arg reservation "$reservation_marker" --arg assets "$asset_marker" '
            .draft == true and ((.body // "") | contains($reservation)) and ((.body // "") | contains($assets))
          ' <<< "$release" >/dev/null

          expected_assets="$(mktemp)"
          find payload -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > "$expected_assets"
          remote_json="$(mktemp)"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" --paginate --slurp |
            jq 'flatten' > "$remote_json"
          while IFS=$'\t' read -r id name; do
            if ! grep -Fqx -- "$name" "$expected_assets"; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${id}"
            fi
          done < <(jq -r '.[] | [.id, .name] | @tsv' "$remote_json")
          shopt -s nullglob
          files=(payload/*)
          test "${#files[@]}" -eq "$(wc -l < "$expected_assets")"
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          verify_remote_assets payload "$expected_assets"

          # Publishing is the final fallible command. A lost response is
          # recovered by the published-release verification branch above.
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false \
            -F prerelease=false \
            -f make_latest=true >/dev/null
